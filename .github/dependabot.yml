version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:20'
      timezone: Europe/London
    open-pull-requests-limit: 6
    versioning-strategy: increase-if-necessary
    groups:
      production-patches:
        dependency-type: production
        update-types: [patch, minor]
        # Native-heavy or pre-1.0 packages need a standalone review, but must not
        # disappear from Dependabot entirely.
        exclude-patterns: [pdfkit, sharp]
      browser-testing:
        dependency-type: development
        update-types: [patch, minor]
        patterns:
          - '@playwright/test'
          - playwright
      development-tooling:
        dependency-type: development
        update-types: [patch, minor]
        # Formatter, accessibility tooling and the in-memory database can alter broad
        # formatting, snapshots, binaries or test semantics. Excluding them from
        # this group makes Dependabot open individual PRs instead of suppressing
        # the updates.
        exclude-patterns:
          - prettier
          - '@axe-core/playwright'
          - mongodb-memory-server
    ignore:
      # Major upgrades require planned migration PRs rather than automatic bumps.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:40'
      timezone: Europe/London
    open-pull-requests-limit: 4
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
