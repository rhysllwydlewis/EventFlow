name: Changed-code Coverage

on:
  pull_request:
    branches: [main]
    paths:
      - '*.js'
      - 'routes/**/*.js'
      - 'services/**/*.js'
      - 'middleware/**/*.js'
      - 'config/**/*.js'
      - 'models/**/*.js'
      - 'utils/**/*.js'
      - 'tests/**/*.js'
      - 'package*.json'
      - '.github/workflows/coverage-gate.yml'

permissions:
  contents: write

concurrency:
  group: pr1416-full-regression-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  NODE_ENV: test
  JWT_SECRET: changed-coverage-secret-for-ci-minimum-32-characters

jobs:
  repair:
    name: Repair PR 1416 full regression
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/partner-anti-abuse-pr2-reward-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr2-reward-integrity
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Apply reward repair and revalidation fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          runtime_path = Path('services/partnerRewardIntegrityRuntime.js')
          runtime = runtime_path.read_text()

          old = """const partnerService = require('./partnerService');
const integrity = require('./partnerRewardIntegrityService');
"""
          new = """const partnerService = require('./partnerService');
const partnerAntiAbuse = require('./partnerAntiAbuseService');
const integrity = require('./partnerRewardIntegrityService');
"""
          assert old in runtime, 'runtime anti-abuse import point not found'
          runtime = runtime.replace(old, new, 1)

          old = """function ensureIndexesBestEffort() {
"""
          new = """const TECHNICAL_REVERSAL_REASONS = new Set([
  'QUALIFICATION_EVIDENCE_PERSIST_FAILED',
  'MATURITY_EXTENSION_PERSIST_FAILED',
]);
const METHOD_BY_REWARD_TYPE = Object.freeze(
  Object.fromEntries(
    Object.entries(METHOD_CONFIG).map(([methodName, config]) => [config.type, methodName])
  )
);

function ensureIndexesBestEffort() {
"""
          assert old in runtime, 'runtime constants insertion point not found'
          runtime = runtime.replace(old, new, 1)

          old = """function install() {
"""
          new = """function isTechnicalQuarantinedReward(transaction) {
  return Boolean(
    transaction?.id &&
      transaction.reversedAt &&
      transaction.reversalMode === 'void_pending' &&
      TECHNICAL_REVERSAL_REASONS.has(transaction.reversalReason)
  );
}

async function currentTechnicalRepairEvidence(transaction, partner, methodName) {
  const commonDecision = await partnerAntiAbuse.supplierRewardEligibility(
    transaction.supplierUserId,
    'awardReferralSignupBonus'
  );
  if (!commonDecision.eligible) return { decision: commonDecision };

  const baseEvidence = await candidateSelection.selectRewardEvidence({
    supplierUserId: transaction.supplierUserId,
    partnerUserId: partner.userId,
    methodName,
  });
  if (!baseEvidence.eligible) return { decision: baseEvidence };

  const supplierDecision = await supplierEvidence.methodRewardEvidence({
    supplierUserId: transaction.supplierUserId,
    methodName,
  });
  if (!supplierDecision.eligible) return { decision: supplierDecision };

  const advancedDecision = await advancedIntegrity.methodRewardEvidence({
    supplierUserId: transaction.supplierUserId,
    partnerId: partner.id,
    partnerUserId: partner.userId,
    methodName,
    baseEvidence,
  });
  if (!advancedDecision.eligible && !SOFT_SIGNAL_REASONS.has(advancedDecision.reason)) {
    return { decision: advancedDecision };
  }

  const stripeDecision = await evaluateStripeEvidence(
    methodName,
    transaction.supplierUserId,
    baseEvidence
  );
  if (!stripeDecision.eligible) return { decision: stripeDecision };

  return { eligible: true, baseEvidence, supplierDecision, stripeDecision };
}

async function repairTechnicalReward(transaction) {
  if (!isTechnicalQuarantinedReward(transaction)) return null;
  const methodName = METHOD_BY_REWARD_TYPE[transaction.type];
  if (!methodName) return null;
  const rewardAmount = Math.abs(Number(transaction.amount));
  if (!Number.isFinite(rewardAmount) || rewardAmount <= 0) return null;

  ensureIndexesBestEffort();
  const { referral, partner } = await resolvePartnerContext(transaction.supplierUserId);
  if (!referral || !partner || partner.id !== transaction.partnerId) return null;

  try {
    return await awardLock.withPartnerAwardLock(partner.id, async () => {
      const current =
        (await dbUnified.findOne('partner_credit_transactions', { id: transaction.id })) ||
        transaction;
      if (!isTechnicalQuarantinedReward(current)) return null;

      const evidence = await currentTechnicalRepairEvidence(current, partner, methodName);
      if (!evidence.eligible) return null;

      const capDecision = await integrity.canAwardCredit({
        partnerId: partner.id,
        supplierUserId: current.supplierUserId,
        type: current.type,
        amount: 0,
      });
      if (!capDecision.eligible) return null;

      const exposureDecision = await advancedIntegrity.exposureDecision({
        partnerId: partner.id,
        supplierUserId: current.supplierUserId,
        type: current.type,
        amount: 0,
      });
      if (!exposureDecision.eligible) return null;

      const pendingDecision = await exposureSafety.pendingExposureDecision({
        partnerId: partner.id,
        amount: rewardAmount,
      });
      if (!pendingDecision.eligible) return null;

      const snapshot = qualificationEvidence.buildSnapshot({
        methodName,
        supplierDecision: evidence.supplierDecision,
        baseEvidence: evidence.baseEvidence,
        stripeDecision: evidence.stripeDecision,
      });
      const snapshotted = await qualificationEvidence.persistSnapshot(current, snapshot);
      const matured = await applyRiskMaturity(snapshotted, partner.id, current.supplierUserId);
      const technicalRepairAt = new Date().toISOString();
      const updated = await dbUnified.updateOne(
        'partner_credit_transactions',
        { id: current.id },
        {
          $set: {
            reversedAt: null,
            reversalTxnId: null,
            reversalReason: null,
            reversalMode: null,
            technicalRepairAt,
          },
        }
      );
      if (!updated) throw new Error('Technical partner reward repair did not persist');

      await recordDecision({
        supplierUserId: current.supplierUserId,
        partnerId: partner.id,
        rewardType: current.type,
        decision: {
          reason: 'TECHNICAL_REWARD_REPAIRED',
          evidence: { originalReversalReason: transaction.reversalReason },
        },
        eventType: 'reward_technical_repair',
      });

      return {
        ...matured,
        ...updated,
        reversedAt: null,
        reversalTxnId: null,
        reversalReason: null,
        reversalMode: null,
        technicalRepairAt,
      };
    });
  } catch (error) {
    if (error.code === 'PARTNER_REWARD_AWARD_LOCK_TIMEOUT') {
      logger.warn('[PARTNER-REWARD-INTEGRITY] Technical reward repair deferred by award lock', {
        partnerId: partner.id,
        rewardTxnId: transaction.id,
      });
      return null;
    }
    throw error;
  }
}

function install() {
"""
          assert old in runtime, 'runtime repair insertion point not found'
          runtime = runtime.replace(old, new, 1)

          old = """module.exports = {
  install,
  revalidatePartnerRewards,
  METHOD_CONFIG,
  SOFT_SIGNAL_REASONS,
"""
          new = """module.exports = {
  install,
  revalidatePartnerRewards,
  repairTechnicalReward,
  isTechnicalQuarantinedReward,
  METHOD_CONFIG,
  METHOD_BY_REWARD_TYPE,
  SOFT_SIGNAL_REASONS,
  TECHNICAL_REVERSAL_REASONS,
"""
          assert old in runtime, 'runtime export insertion point not found'
          runtime = runtime.replace(old, new, 1)
          runtime_path.write_text(runtime)

          clawback_path = Path('services/partnerRewardIntegrityClawbackService.js')
          clawback = clawback_path.read_text()
          old = """  const commonDecision = await partnerAntiAbuse.supplierRewardEligibility(
    transaction.supplierUserId,
    'awardReferralSignupBonus'
  );
  if (!commonDecision.eligible) return commonDecision;

  const supplierDecision = await supplierEvidence.methodRewardEvidence({
    supplierUserId: transaction.supplierUserId,
    methodName,
  });
  if (!supplierDecision.eligible) return supplierDecision;
  if (!snapshotDecision.eligible) return snapshotDecision;

  return advancedIntegrity.methodRewardEvidence({
    supplierUserId: transaction.supplierUserId,
    partnerId: transaction.partnerId,
    partnerUserId: partner.userId,
    methodName,
    baseEvidence: baseEvidenceFromSnapshot(transaction),
  });
"""
          new = """  const duplicateBusiness = await baseIntegrity.duplicateSupplierBusinessEvidence(
    transaction.supplierUserId
  );
  if (duplicateBusiness.duplicate) {
    return {
      eligible: false,
      reason: 'DUPLICATE_SUPPLIER_BUSINESS_IDENTITY',
      evidence: duplicateBusiness,
    };
  }

  const commonDecision = await partnerAntiAbuse.supplierRewardEligibility(
    transaction.supplierUserId,
    'awardReferralSignupBonus'
  );
  if (!commonDecision.eligible) return commonDecision;

  const supplierDecision = await supplierEvidence.methodRewardEvidence({
    supplierUserId: transaction.supplierUserId,
    methodName,
  });
  if (!supplierDecision.eligible) return supplierDecision;

  const advancedDecision = await advancedIntegrity.methodRewardEvidence({
    supplierUserId: transaction.supplierUserId,
    partnerId: transaction.partnerId,
    partnerUserId: partner.userId,
    methodName,
    baseEvidence: baseEvidenceFromSnapshot(transaction),
  });
  if (!advancedDecision.eligible && !NON_CLAWBACK_REASONS.has(advancedDecision.reason)) {
    return advancedDecision;
  }
  if (!snapshotDecision.eligible) return snapshotDecision;
  return advancedDecision;
"""
          assert old in clawback, 'snapshot revalidation block not found'
          clawback = clawback.replace(old, new, 1)
          clawback_path.write_text(clawback)
          PY

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Format repaired files
        run: |
          npx prettier --write \
            services/partnerRewardIntegrityRuntime.js \
            services/partnerRewardIntegrityClawbackService.js

      - name: Run focused repair tests
        run: |
          npx jest --runInBand --coverage=false \
            tests/unit/partner-reward-technical-repair.test.js \
            tests/unit/partner-reward-snapshot-revalidation.test.js \
            tests/unit/partner-reward-integrity-runtime.test.js

      - name: Run complete regression
        run: npm run test:full -- --runInBand

      - name: Restore workflow and publish repair
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/coverage-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(partner): restore technical reward repair and durable revalidation"
          git push origin HEAD:agent/partner-anti-abuse-pr2-reward-integrity
