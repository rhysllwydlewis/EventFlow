name: Fix Final Stale Dashboard Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/supplier-review-request-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update stale component expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/supplier-dashboard-fixes.test.js')
          text = path.read_text()
          old = "    expect(photoUploaderJs).toContain('font-size: 0.6rem;');"
          new = "    expect(photoUploaderJs).toContain('font-size: 0.6875rem;');"
          if text.count(old) != 1:
              raise SystemExit('Expected stale assertion was not found exactly once')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit corrected test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/supplier-dashboard-fixes.test.js
          git commit -m "Align final supplier dashboard assertion"
          git push origin HEAD:${{ github.head_ref }}
