name: Supplier Production Visual Audit

on:
  pull_request:
    paths:
      - '.github/workflows/supplier-production-visual-audit.yml'
      - 'scripts/supplier-production-visual-audit.mjs'

permissions:
  contents: read

jobs:
  supplier-production-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit production supplier profiles
        run: node scripts/supplier-production-visual-audit.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supplier-production-visual-audit
          path: artifacts/supplier-production-visual-audit
          if-no-files-found: error
          retention-days: 7
