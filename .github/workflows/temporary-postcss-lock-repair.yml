name: Temporary PostCSS Lock Repair

on:
  push:
    branches: [agent/clean-install-ci-baseline]
    paths:
      - '.github/workflows/temporary-postcss-lock-repair.yml'
      - 'scripts/trigger-postcss-lock-repair.txt'

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/clean-install-ci-baseline
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Regenerate direct PostCSS lock metadata
        run: npm install --package-lock-only --ignore-scripts --save-dev postcss@^8.5.19

      - name: Commit package metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "PostCSS package metadata already consistent."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Restore direct PostCSS dependency and lock metadata"
          git push origin HEAD:agent/clean-install-ci-baseline
