name: Fix and format ranking branch

on:
  push:
    branches:
      - feat/supplier-ranking-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supplier-ranking-v1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0
      - name: Update source-contract tests
        run: |
          python - <<'PY'
          from pathlib import Path

          integration = Path('tests/integration/search-v2-api.test.js')
          content = integration.read_text()
          content = content.replace(
              "require('../services/searchService')",
              "require('../services/rankedSupplierSearch.service')",
          )
          integration.write_text(content)

          adapter_test = Path('tests/unit/rankedSupplierSearch.service.test.js')
          content = adapter_test.read_text()
          content = content.replace(
              "expect(result.results[0].rankingReason).toContain('Strong match');",
              "expect(result.results[0].rankingReason).toContain('Packages available');",
          )
          adapter_test.write_text(content)
          PY
      - name: Format ranking changes
        run: >-
          npx prettier --write
          services/rankedSupplierSearch.service.js
          services/supplierRanking.service.js
          routes/search-v2.js
          tests/integration/search-v2-api.test.js
          tests/unit/rankedSupplierSearch.service.test.js
          tests/unit/supplierRanking.branches.test.js
          tests/unit/supplierRanking.service.test.js
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/rankedSupplierSearch.service.js services/supplierRanking.service.js routes/search-v2.js tests/integration/search-v2-api.test.js tests/unit/rankedSupplierSearch.service.test.js tests/unit/supplierRanking.branches.test.js tests/unit/supplierRanking.service.test.js
          git commit -m "test: align ranking contracts and formatting"
          git push origin HEAD:feat/supplier-ranking-v1
