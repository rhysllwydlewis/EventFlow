name: Temporary Package Prettier

on:
  push:
    branches:
      - feature/supplier-bot-package-provenance

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci --prefer-offline --no-audit
      - name: Format target
        run: npx prettier --write services/supplierBotMarketplaceParity.service.js
      - name: Upload exact formatted file
        uses: actions/upload-artifact@v7
        with:
          name: exact-prettier-package-service
          path: services/supplierBotMarketplaceParity.service.js
          retention-days: 1
