name: PR 1416 DeepSource AST repair

on:
  push:
    branches:
      - agent/partner-anti-abuse-pr2-reward-integrity

permissions:
  contents: write

concurrency:
  group: pr1416-deepsource-ast-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr2-reward-integrity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0

      - name: Convert top-level declarations using the JavaScript AST
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const espree = require('espree');

          const output = execFileSync(
            'git',
            ['diff', '--name-only', 'origin/main...HEAD', '--', 'services/*.js'],
            { encoding: 'utf8' }
          ).trim();
          const files = output ? output.split('\n').filter(Boolean) : [];
          if (!files.length) throw new Error('No changed service files were found');

          let converted = 0;
          for (const file of files) {
            let source = fs.readFileSync(file, 'utf8');
            const ast = espree.parse(source, {
              ecmaVersion: 'latest',
              sourceType: 'script',
              range: true,
              loc: true,
            });
            const declarations = ast.body.filter(node => node.type === 'FunctionDeclaration');
            const edits = [];

            for (const node of declarations) {
              if (!node.id?.name) throw new Error(`Anonymous top-level declaration in ${file}`);
              const parameters = source.slice(node.id.range[1], node.body.range[0]).trimEnd();
              edits.push({
                start: node.range[0],
                end: node.body.range[0],
                text: `const ${node.id.name} = ${node.async ? 'async ' : ''}${parameters} => `,
              });
              edits.push({
                start: node.body.range[1] - 1,
                end: node.body.range[1],
                text: '};',
              });
              converted += 1;
            }

            edits.sort((left, right) => right.start - left.start);
            for (const edit of edits) {
              source = source.slice(0, edit.start) + edit.text + source.slice(edit.end);
            }

            if (file.endsWith('partnerRewardIntegrityAdvancedService.js')) {
              source = source
                .replace('const a = tokenSet(left);', 'const leftTokens = tokenSet(left);')
                .replace('const b = tokenSet(right);', 'const rightTokens = tokenSet(right);')
                .replace('if (!a.size || !b.size) return 0;', 'if (!leftTokens.size || !rightTokens.size) return 0;')
                .replace('for (const token of a) if (b.has(token)) intersection += 1;', 'for (const token of leftTokens) if (rightTokens.has(token)) intersection += 1;')
                .replace('return intersection / (a.size + b.size - intersection);', 'return intersection / (leftTokens.size + rightTokens.size - intersection);');
            }

            fs.writeFileSync(file, source);
            console.log(`${file}: converted ${declarations.length} declaration(s)`);
          }

          if (!converted) throw new Error('No top-level function declarations were converted');
          console.log(`Converted ${converted} top-level function declarations in total`);
          NODE

          mapfile -t files < <(git diff --name-only origin/main...HEAD -- 'services/*.js')
          if grep -nHE '^(async[[:space:]]+)?function[[:space:]]+' "${files[@]}"; then
            echo 'A top-level function declaration remains.' >&2
            exit 1
          fi

          npx prettier --write "${files[@]}"
          npx prettier --check "${files[@]}"
          npx eslint "${files[@]}"
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Run partner reward regression suites
        run: |
          npx jest \
            tests/unit/partner-anti-abuse-runtime.test.js \
            tests/unit/partner-cashout-active-reward-risk.test.js \
            tests/unit/partner-reward-award-lock.test.js \
            tests/unit/partner-reward-candidate-selection.test.js \
            tests/unit/partner-reward-exposure-safety.test.js \
            tests/unit/partner-reward-integrity-advanced.test.js \
            tests/unit/partner-reward-integrity-clawback.test.js \
            tests/unit/partner-reward-integrity-indexes.test.js \
            tests/unit/partner-reward-integrity-runtime.test.js \
            tests/unit/partner-reward-integrity.test.js \
            tests/unit/partner-reward-qualification-evidence.test.js \
            tests/unit/partner-reward-snapshot-revalidation.test.js \
            tests/unit/partner-reward-stripe-evidence.test.js \
            tests/unit/partner-reward-supplier-evidence.test.js \
            tests/unit/partner-reward-technical-repair.test.js \
            --runInBand

      - name: Commit verified service repair
        shell: bash
        run: |
          rm -f \
            .github/workflows/pr1416-deepsource-residual.yml \
            .github/workflows/pr1416-tree-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services \
            .github/workflows/pr1416-deepsource-residual.yml \
            .github/workflows/pr1416-tree-snapshot.yml
          git commit -m "refactor(partner): resolve DeepSource service findings"
          git push origin HEAD:agent/partner-anti-abuse-pr2-reward-integrity
