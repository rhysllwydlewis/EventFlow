name: PR 1418 DeepSource Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download DeepSource review
        run: |
          curl --fail --location --compressed \
            --user-agent 'Mozilla/5.0' \
            'https://app.deepsource.com/gh/rhysllwydlewis/EventFlow/run/e9a0259d-74f2-4bbe-bd04-0990a0a663b1/javascript/' \
            --output deepsource-review.html
          grep -Eo 'https?[^" ]+|JS-[A-Z0-9-]+|issue[^" ]*' deepsource-review.html > deepsource-signals.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr1418-deepsource-review
          path: |
            deepsource-review.html
            deepsource-signals.txt
          if-no-files-found: error
