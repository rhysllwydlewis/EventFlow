name: Temporary PR 1350 main sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-background-job-telemetry
          fetch-depth: 0

      - name: Merge current main without changing the audited tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/temp-pr1350-sync-main.yml
          git commit -m "Remove temporary main sync workflow"
          git push origin HEAD:agent/complete-background-job-telemetry
