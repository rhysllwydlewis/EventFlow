name: Finalize JadeAssist launcher integration

on:
  push:
    branches:
      - feature/jadeassist-launcher-assets
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/jadeassist-launcher-assets
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Finalize native launcher integration
        run: node scripts/finalize-jadeassist-launcher-assets.mjs

      - name: Sync verified JadeAssist bundle
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/rhysllwydlewis/JadeAssist/main/packages/widget/dist/jade-widget.js \
            --output public/assets/js/vendor/jade-widget.js
          grep -q "jade-launcher-dismiss" public/assets/js/vendor/jade-widget.js
          grep -q "jadeassist:widget-dismissed" public/assets/js/vendor/jade-widget.js
          grep -q "notificationBadgeUrl" public/assets/js/vendor/jade-widget.js

      - name: Check JavaScript syntax
        run: |
          node --check public/assets/js/jadeassist-init.v2.js
          node --check public/assets/js/vendor/jade-widget.js
          node --check tests/integration/jadeassist-launcher-behaviour.test.js

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: '0'

      - name: Run focused JadeAssist integration tests
        run: |
          npx jest --runInBand --coverage=false \
            tests/integration/jadeassist-widget.test.js \
            tests/integration/jadeassist-launcher-behaviour.test.js
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long

      - name: Commit verified integration
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/assets/js/jadeassist-init.v2.js \
            public/assets/js/vendor/jade-widget.js \
            tests/integration/jadeassist-widget.test.js \
            tests/integration/jadeassist-launcher-behaviour.test.js \
            docs/jadeassist-widget.md
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize verified JadeAssist launcher integration"
            git push
          fi
