name: PR 1418 source repair

on:
  push:
    branches:
      - agent/supplier-profile-trust-consistency

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-trust-consistency
          fetch-depth: 0

      - name: Apply the source-level regression fix
        shell: python
        run: |
          from pathlib import Path

          test_path = Path('tests/unit/supplier-approval.test.js')
          source = test_path.read_text()
          old = '\n'.join([
              "    expect(patchSection.slice(0, 2000)).toContain('.trim()');",
              "    expect(patchSection.slice(0, 2000)).toContain('.substring(0, maxLen)');",
          ])
          new = '\n'.join([
              '    const boundedStringLoop = patchSection.match(',
              r'      /for \(const \[k, maxLen\][\s\S]*?supplierPatch\[k\] = b\[k\]\.trim\(\)\.substring\(0, maxLen\);/',
              '    );',
              '    expect(boundedStringLoop).toBeTruthy();',
          ])
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one brittle PATCH assertion block')
          test_path.write_text(source.replace(old, new))

          health_path = Path('tests/unit/supplier-profile-health-aliases.test.js')
          health = health_path.read_text()
          if 'exportPr1418TargetedFiles' in health or 'coverage/pr1418-export' in health:
              raise SystemExit('Generated-copy workaround was not removed')

          Path('.github/workflows/pr1418-source-repair.yml').unlink()

      - name: Commit the repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/supplier-approval.test.js tests/unit/supplier-profile-health-aliases.test.js .github/workflows/pr1418-source-repair.yml
          git commit -m "test(suppliers): fix PR 1418 regression checks"
          git push origin HEAD:agent/supplier-profile-trust-consistency
