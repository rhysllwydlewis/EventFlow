name: PR 1321 hardening correction

on:
  push:
    branches:
      - feat/dashboard-foundation-and-homepage-manager-hardening

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/dashboard-foundation-and-homepage-manager-hardening
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply hardening corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          hardening = 'public/assets/js/pages/admin-homepage-hardening.js'
          replace_once(
              hardening,
              "'[data-select-version], [data-edit-version], #backToDashboard, #refreshBtn, a[href]'",
              "'[data-select-version], [data-edit-version], [data-hero-use], [data-hero-primary], [data-hero-move], [data-hero-remove-target], [data-hero-delete], #backToDashboard, #refreshBtn, a[href]'",
          )
          replace_once(
              hardening,
              "guardedControl.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));",
              'guardedControl.click();',
          )
          replace_once(
              hardening,
              "button.addEventListener('click', async () => {\n      const name = input.value.trim().replace(/\\s+/g, ' ');",
              "button.addEventListener('click', async () => {\n      if (dirty) {\n        showMessage(\n          'Save or reset the current hero changes before renaming this homepage.',\n          'warning'\n        );\n        saveButton?.focus();\n        return;\n      }\n\n      const name = input.value.trim().replace(/\\s+/g, ' ');",
          )

          media_path = Path('public/assets/js/pages/admin-media-upload-library.js')
          media = media_path.read_text()
          anchor = "\n\n    setBusy(true);\n    try {\n      const data = await api(`/api/v1/admin/homepage/manager/version/${version}`"
          if anchor not in media:
              raise SystemExit('Assignment request anchor not found')
          media = media.replace(
              anchor,
              "\n    const assignedFilename = state.selected.filename;\n\n    setBusy(true);\n    try {\n      const data = await api(`/api/v1/admin/homepage/manager/version/${version}`",
              1,
          )
          media = media.replace(
              "`${state.selected?.filename || 'Uploaded media'} assigned to ${versionName(version)}.`",
              "`${assignedFilename} assigned to ${versionName(version)}.`",
              1,
          )
          delete_pattern = re.compile(
              r"  async function deleteFile\(item\) \{\n"
              r"    const assignments = assignmentBadges\(item\);\n"
              r"    const message = assignments\.length\n"
              r"      \? `This file is assigned to \$\{assignments\.join\(', '\)\}\. Delete the physical file anyway\?`\n"
              r"      : 'Delete this uploaded media file\?';"
          )
          replacement = """  async function deleteFile(item) {
            const assignments = assignmentBadges(item);
            if (assignments.length) {
              setStatus(
                `Remove this file from ${assignments.join(', ')} before deleting the physical upload.`,
                'error'
              );
              return;
            }
            const message = 'Delete this uploaded media file?';"""
          media, count = delete_pattern.subn(replacement, media, count=1)
          if count != 1:
              raise SystemExit('Assigned-upload delete block not found')
          media_path.write_text(media)

          v3_path = Path('public/assets/js/pages/home-v3.js')
          v3 = v3_path.read_text()
          bridge_start = v3.index('  function installHomepageUploadBridge()')
          bridge_end = v3.index('\n  installHomepageUploadBridge();', bridge_start)
          bridge = v3[bridge_start:bridge_end]
          bridge = bridge.replace(
              "\n\n      try {",
              "\n\n      window.fetch = nativeFetch;\n      try {",
              1,
          )
          bridge = bridge.replace(
              "const selectedUploads = Array.isArray(widget?.mediaLibrary?.selectedUploads)\n          ? widget.mediaLibrary.selectedUploads\n          : [];",
              "const selectedUploads = Array.isArray(widget?.selectedMedia)\n          ? widget.selectedMedia\n          : Array.isArray(widget?.mediaLibrary?.selectedUploads)\n            ? widget.mediaLibrary.selectedUploads\n            : [];",
              1,
          )
          bridge = bridge.replace(
              "        return new Response(JSON.stringify(data), {\n          status: response.status,\n          statusText: response.statusText,\n          headers: response.headers,\n        });",
              "        const headers = new Headers(response.headers);\n        headers.delete('content-length');\n        headers.delete('content-encoding');\n        return new Response(JSON.stringify(data), {\n          status: response.status,\n          statusText: response.statusText,\n          headers,\n        });",
              1,
          )
          if bridge == v3[bridge_start:bridge_end]:
              raise SystemExit('V3 bridge was not changed')
          v3_path.write_text(v3[:bridge_start] + bridge + v3[bridge_end:])
          PY

      - name: Format corrected files
        run: >-
          npx prettier --write
          public/assets/js/pages/admin-homepage-hardening.js
          public/assets/js/pages/admin-media-upload-library.js

      - name: Run focused regression tests
        run: >-
          npx jest --runInBand --coverage=false
          tests/unit/admin-homepage-hardening.test.js
          tests/unit/admin-media-upload-library.test.js
          tests/unit/home-v3-selected-upload-bridge.test.js

      - name: Commit corrections and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-1321-hardening-fix.yml
          git add public/assets/js/pages
          git commit -m "Tighten dashboard hardening edge cases"
          git push origin HEAD:feat/dashboard-foundation-and-homepage-manager-hardening
