name: Trigger supplier profile balance patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  trigger-branch-patch:
    if: >-
      !contains(github.event.pull_request.head.sha, '0000000') &&
      !contains(github.event.pull_request.title, '[agent-triggered]') &&
      !contains(github.event.pull_request.title, '[agent-balance-applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-header-layout-balance
          fetch-depth: 0
      - name: Trigger branch patch once
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Eq '\[agent-triggered\]|\[agent-balance-applied\]'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Trigger supplier profile balance patch [agent-triggered]"
          git push origin HEAD:agent/supplier-profile-header-layout-balance
