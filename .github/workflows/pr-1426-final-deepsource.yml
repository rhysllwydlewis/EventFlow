name: Apply remaining PR 1426 DeepSource fixes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-1426-final-deepsource.yml'

permissions:
  contents: write

concurrency:
  group: pr-1426-final-deepsource
  cancel-in-progress: false

jobs:
  apply-fixes:
    if: github.event.pull_request.number == 1426
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout fixed PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/signup-attribution-session-replay
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: '0'

      - name: Apply remaining analyzer fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(source.replace(old, new, 1))

          google_client = Path('public/assets/js/pages/auth-google-init.js')
          replace_once(
              google_client,
              """  function getInputValue(id, maxLength) {
            const el = document.getElementById(id);
            return cleanValue(el && el.value, maxLength);
          }

          function getSelectedSignupRole() {
            const roleInput = document.getElementById('reg-role');
            if (roleInput && (roleInput.value === 'supplier' || roleInput.value === 'customer')) {
              return roleInput.value;
            }

            const selectedRole = document.querySelector(
              '.auth-role-picker [aria-checked=\"true\"][data-role], .role-toggle [aria-checked=\"true\"][data-role]'
            );
            return selectedRole && selectedRole.dataset.role === 'supplier' ? 'supplier' : 'customer';
          }
          """,
              """  function getInputValue(id, maxLength) {
            const el = document.getElementById(id);
            return cleanValue(el?.value, maxLength);
          }

          function getSelectedSignupRole() {
            const roleInput = document.getElementById('reg-role');
            const selectedRoleValue = roleInput?.value;
            if (selectedRoleValue === 'supplier' || selectedRoleValue === 'customer') {
              return selectedRoleValue;
            }

            const selectedRole = document.querySelector(
              '.auth-role-picker [aria-checked=\"true\"][data-role], .role-toggle [aria-checked=\"true\"][data-role]'
            );
            return selectedRole?.dataset.role === 'supplier' ? 'supplier' : 'customer';
          }
          """,
              'Google signup field guards',
          )
          replace_once(
              google_client,
              """  function getConsentedAttributionState() {
            try {
              if (
                !window.EventFlowAttribution ||
                typeof window.EventFlowAttribution.properties !== 'function'
              ) {
                return null;
              }
              const attribution = window.EventFlowAttribution.properties();
              return attribution && attribution.attribution_available === true ? attribution : null;
            } catch (_) {
              return null;
            }
          }

          function getAnalyticsSessionId() {
            try {
              return cleanValue(window.sessionStorage.getItem('ef_analytics_session_id'), 120);
            } catch (_) {
              return '';
            }
          }
          """,
              """  function getConsentedAttributionState() {
            try {
              if (typeof window.EventFlowAttribution?.properties !== 'function') {
                return null;
              }
              const attribution = window.EventFlowAttribution.properties();
              return attribution?.attribution_available === true ? attribution : null;
            } catch {
              return null;
            }
          }

          function getAnalyticsSessionId() {
            try {
              return cleanValue(window.sessionStorage.getItem('ef_analytics_session_id'), 120);
            } catch {
              return '';
            }
          }
          """,
              'Google attribution and storage guards',
          )

          admin_init = Path('public/assets/js/pages/admin-init.js')
          replace_once(
              admin_init,
              'const recentUsers = Number(summary && summary.newLast7) || 0;',
              'const recentUsers = Number(summary?.newLast7) || 0;',
              'current signup summary guard',
          )
          replace_once(
              admin_init,
              'const previousUsers = Number(summary && summary.newPrevious7) || 0;',
              'const previousUsers = Number(summary?.newPrevious7) || 0;',
              'previous signup summary guard',
          )

          source_contract = Path('tests/unit/analytics-attribution-session-replay.test.js')
          replace_once(
              source_contract,
              "expect(adminDashboardSource).toContain('summary.newPrevious7');",
              "expect(adminDashboardSource).toContain('summary?.newPrevious7');",
              'admin optional-chain source contract',
          )
          PY

      - name: Format and validate focused files
        run: |
          npx prettier --write \
            public/assets/js/pages/auth-google-init.js \
            public/assets/js/pages/admin-init.js \
            tests/unit/analytics-attribution-session-replay.test.js
          npx prettier --check \
            public/assets/js/pages/auth-google-init.js \
            public/assets/js/pages/admin-init.js \
            tests/unit/analytics-attribution-session-replay.test.js
          node --check public/assets/js/pages/auth-google-init.js
          node --check public/assets/js/pages/admin-init.js
          npx eslint --rulesdir eslint-rules \
            public/assets/js/pages/auth-google-init.js \
            public/assets/js/pages/admin-init.js
          npx jest \
            tests/unit/analytics-attribution-session-replay.test.js \
            tests/unit/google-auth-init-context.test.js \
            tests/integration/google-auth-route.test.js \
            tests/integration/google-signup-attribution-route.test.js \
            tests/unit/admin-user-systems.test.js \
            --runInBand --coverage=false
        env:
          HUSKY: '0'
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-testing-only-min-32-chars

      - name: Remove helper workflow and commit
        run: |
          rm .github/workflows/pr-1426-final-deepsource.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/assets/js/pages/auth-google-init.js \
            public/assets/js/pages/admin-init.js \
            tests/unit/analytics-attribution-session-replay.test.js \
            .github/workflows/pr-1426-final-deepsource.yml
          git commit -m 'refactor: clear remaining DeepSource findings'
          git push origin HEAD:feat/signup-attribution-session-replay
