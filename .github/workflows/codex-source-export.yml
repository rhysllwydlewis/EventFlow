name: Codex Source Export

on:
  push:
    branches: [codex/uk-city-hub-and-spoke]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'codex/uk-city-hub-and-spoke' || github.ref == 'refs/heads/codex/uk-city-hub-and-spoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules -czf ../eventflow-source.tgz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: eventflow-source
          path: ../eventflow-source.tgz
          if-no-files-found: error
          retention-days: 1
