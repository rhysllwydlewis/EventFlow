name: Apply PR 1426 DeepSource cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-1426-deepsource-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: pr-1426-deepsource-cleanup
  cancel-in-progress: false

jobs:
  apply-cleanup:
    if: github.event.pull_request.number == 1426
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/signup-attribution-session-replay
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: '0'

      - name: Remove remaining analytics anti-patterns
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/assets/js/analytics-consent-upgrade.js')
          source = path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              """  function closeConsentUi(target) {
              const banner = target && target.closest ? target.closest('#cookie-consent-banner') : null;
              if (banner && banner.parentNode) {
                banner.parentNode.removeChild(banner);
              }

              const dialog = target && target.closest ? target.closest('#cookie-prefs-dialog') : null;
              if (dialog && dialog.parentNode) {
                dialog.parentNode.removeChild(dialog);
              }
              if (dialog && document.body) {
                document.body.classList.remove('cookie-prefs-open');
              }
            }
          """,
              """  function closeConsentUi(target) {
              const banner = target?.closest?.('#cookie-consent-banner');
              banner?.remove();

              const dialog = target?.closest?.('#cookie-prefs-dialog');
              dialog?.remove();
              if (dialog) {
                document.body?.classList.remove('cookie-prefs-open');
              }
            }
          """,
              'consent UI guards',
          )

          replace_once(
              """    if (!window.CookieConsent || typeof window.CookieConsent.getConsent !== 'function') {
          """,
              """    if (typeof window.CookieConsent?.getConsent !== 'function') {
          """,
              'consent API guard',
          )
          replace_once(
              """      return Boolean(consent && consent.analytics === true);
          """,
              """      return consent?.analytics === true;
          """,
              'consent value guard',
          )

          replace_once(
              """  function runBeforeSendHooks(hooks, event) {
              const handlers = Array.isArray(hooks) ? hooks : typeof hooks === 'function' ? [hooks] : [];
              let result = event;
          """,
              """  function runBeforeSendHooks(hooks, event) {
              let handlers = [];
              if (Array.isArray(hooks)) {
                handlers = hooks;
              } else if (typeof hooks === 'function') {
                handlers = [hooks];
              }
              let result = event;
          """,
              'before-send nested conditional',
          )

          replace_once(
              """    if (
              !isProviderBlockedPage() ||
              !window.CookieConsent ||
              typeof window.CookieConsent.getConsent !== 'function' ||
              window.CookieConsent.getConsent.__efSensitiveGuard
            ) {
          """,
              """    if (
              !isProviderBlockedPage() ||
              typeof window.CookieConsent?.getConsent !== 'function' ||
              window.CookieConsent.getConsent.__efSensitiveGuard
            ) {
          """,
              'sensitive-page consent guard',
          )

          replacements = [
              ("if (window.posthog && window.posthog.__SV) {", "if (window.posthog?.__SV) {", 'PostHog stub guard'),
              (
                  """  function postHogIsInitialised() {
              if (!window.posthog || typeof window.posthog.capture !== 'function') {
          """,
                  """  function postHogIsInitialised() {
              if (typeof window.posthog?.capture !== 'function') {
          """,
                  'PostHog initialisation guard',
              ),
              ("if (event && event.detail && event.detail.analytics === true) {", "if (event?.detail?.analytics === true) {", 'consent change event guard'),
              ("if (!event || event.persisted !== true) {", "if (event?.persisted !== true) {", 'pageshow event guard'),
              ("const scope = root && typeof root.querySelectorAll === 'function' ? root : document;", "const scope = typeof root?.querySelectorAll === 'function' ? root : document;", 'query scope guard'),
              ("if (paragraph.textContent && paragraph.textContent.includes('functional cookies')) {", "if (paragraph.textContent?.includes('functional cookies')) {", 'consent paragraph guard'),
              ("if (description.textContent && description.textContent.includes('Currently unused')) {", "if (description.textContent?.includes('Currently unused')) {", 'consent description guard'),
              ("} else if (input && input.url) {", "} else if (input?.url) {", 'request input guard'),
              ("if (options && options.method) {", "if (options?.method) {", 'request options guard'),
              (
                  """    if (
              !response ||
              !response.ok ||
              !window.posthog ||
              typeof window.posthog.identify !== 'function'
            ) {
          """,
                  """    if (!response?.ok || typeof window.posthog?.identify !== 'function') {
          """,
                  'registration response guard',
              ),
              ("if (!user || !user.id || user.role === 'admin') {", "if (!user?.id || user.role === 'admin') {", 'registered user guard'),
              ("if (conversion && window.EFAnalytics && typeof window.EFAnalytics.track === 'function') {", "if (conversion && typeof window.EFAnalytics?.track === 'function') {", 'first-party conversion guard'),
              (
                  """        if (
                  conversion &&
                  conversion.event === 'registration_completed' &&
                  window.posthog &&
                  typeof window.posthog.capture === 'function'
                ) {
          """,
                  """        if (
                  conversion?.event === 'registration_completed' &&
                  typeof window.posthog?.capture === 'function'
                ) {
          """,
                  'PostHog conversion guard',
              ),
              ("const provider = config && config.posthog;", "const provider = config?.posthog;", 'provider guard'),
              (
                  """      const target =
                    event.target && event.target.closest
                      ? event.target.closest('#cookie-consent-accept, #cookie-prefs-accept-all')
                      : null;
          """,
                  """      const target = event.target?.closest?.(
                    '#cookie-consent-accept, #cookie-prefs-accept-all'
                  );
          """,
                  'click target guard',
              ),
              ("if (node && node.nodeType === 1) {", "if (node?.nodeType === 1) {", 'mutation node guard'),
          ]

          for old, new, label in replacements:
              replace_once(old, new, label)

          path.write_text(source)
          PY

      - name: Format, lint and test analytics bridge
        run: |
          npx prettier --write public/assets/js/analytics-consent-upgrade.js
          npx prettier --check public/assets/js/analytics-consent-upgrade.js
          node --check public/assets/js/analytics-consent-upgrade.js
          npx eslint --rulesdir eslint-rules public/assets/js/analytics-consent-upgrade.js
          npx jest tests/unit/analytics-independent-hardening.test.js --runInBand --coverage=false

      - name: Remove helper workflow and commit
        run: |
          rm .github/workflows/pr-1426-deepsource-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/assets/js/analytics-consent-upgrade.js \
            .github/workflows/pr-1426-deepsource-cleanup.yml
          git commit -m 'refactor: clear remaining analytics quality findings'
          git push origin HEAD:feat/signup-attribution-session-replay
