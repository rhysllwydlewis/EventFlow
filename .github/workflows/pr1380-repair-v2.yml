name: PR 1380 Repair Pass v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  NODE_ENV: test
  JWT_SECRET: pr-1380-repair-secret-for-tests-minimum-32-characters

jobs:
  repair:
    if: github.head_ref == 'feature/next-five-priorities'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Reuse the audited repair script
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr1380-repair.yml').read_text(encoding='utf-8')
          start_marker = "      - name: Apply audit fixes\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Format changed source and tests"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          repair_script = textwrap.dedent(workflow[start:end])
          exec(compile(repair_script, 'pr1380-repair.py', 'exec'), {'__name__': '__main__'})

      - name: Format changed source and tests
        run: |
          npx prettier --write \
            routes/index.js \
            routes/supplier-export-safe.js \
            public/plan.html \
            scripts/production-synthetic-check.mjs \
            .github/workflows/production-synthetics.yml \
            tests/integration/ai-plan-route.test.js \
            tests/integration/supplier-enquiries-export-safe.test.js \
            tests/unit/production-synthetic-supplier-profile.test.js

      - name: Run focused regression tests
        run: |
          npx jest --runInBand --coverage=false \
            tests/integration/ai-plan-route.test.js \
            tests/integration/supplier-enquiries-export-safe.test.js \
            tests/unit/production-synthetic-supplier-profile.test.js

      - name: Remove one-time repair workflows
        run: rm .github/workflows/pr1380-repair.yml .github/workflows/pr1380-repair-v2.yml

      - name: Commit audited fixes
        run: |
          git config user.name 'eventflow-pr-audit[bot]'
          git config user.email 'eventflow-pr-audit[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete PR 1380 integration and review findings'
          git push origin HEAD:${{ github.head_ref }}
