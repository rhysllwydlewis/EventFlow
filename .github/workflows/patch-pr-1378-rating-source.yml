name: Patch PR 1378 rating provenance once

on:
  push:
    branches:
      - feature/server-rendered-supplier-seo
    paths:
      - .github/workflows/patch-pr-1378-rating-source.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/server-rendered-supplier-seo
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Restrict aggregate rating to approved-review summary fields
        run: |
          python <<'PY'
          from pathlib import Path

          service = Path('services/publicSupplierSeo.service.js')
          text = service.read_text()
          old = """  const ratingValue = numericValue(
            supplier.averageRating,
            supplier.reviewSummary && supplier.reviewSummary.averageRating,
            supplier.rating
          );
          const reviewCount = numericValue(
            supplier.reviewCount,
            supplier.reviewsCount,
            supplier.reviewSummary && supplier.reviewSummary.reviewCount
          );
          """
          new = """  // reviews.js writes these two fields from approved reviews only. Do not
          // fall back to supplier-entered or legacy rating fields in search markup.
          const ratingValue = numericValue(supplier.averageRating);
          const reviewCount = numericValue(supplier.reviewCount);
          """
          if old not in text:
            raise SystemExit('Expected rating source block not found')
          service.write_text(text.replace(old, new, 1))

          test = Path('tests/unit/public-supplier-seo.test.js')
          text = test.read_text()
          old = """  test('uses approved review analytics before the legacy rating field', () => {
            const withRating = buildSupplierSeoModel(supplier);
            const withoutCount = buildSupplierSeoModel({ ...supplier, reviewCount: 0 });

            expect(withRating.structuredData.aggregateRating).toEqual(
              expect.objectContaining({ ratingValue: 4.8, reviewCount: 12 })
            );
            expect(withoutCount.structuredData.aggregateRating).toBeUndefined();
          });
          """
          new = """  test('uses only approved-review summary fields for aggregate rating schema', () => {
            const withRating = buildSupplierSeoModel(supplier);
            const withoutCount = buildSupplierSeoModel({ ...supplier, reviewCount: 0 });
            const legacyOnly = buildSupplierSeoModel({
              ...supplier,
              averageRating: undefined,
              reviewCount: undefined,
              rating: 5,
              reviewsCount: 100,
              reviewSummary: { averageRating: 5, reviewCount: 100 },
            });

            expect(withRating.structuredData.aggregateRating).toEqual(
              expect.objectContaining({ ratingValue: 4.8, reviewCount: 12 })
            );
            expect(withoutCount.structuredData.aggregateRating).toBeUndefined();
            expect(legacyOnly.structuredData.aggregateRating).toBeUndefined();
          });
          """
          if old not in text:
            raise SystemExit('Expected rating test block not found')
          test.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write services/publicSupplierSeo.service.js tests/unit/public-supplier-seo.test.js
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/publicSupplierSeo.service.js tests/unit/public-supplier-seo.test.js
          git commit -m "Restrict supplier rating schema to approved review summaries"
          git push origin HEAD:feature/server-rendered-supplier-seo
