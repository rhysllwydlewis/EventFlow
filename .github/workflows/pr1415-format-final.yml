name: PR1415 Final Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Apply exact formatter output
        run: |
          npx prettier --write \
            public/assets/js/pages/partner-init.js \
            tests/unit/partner-abuse-admin-routes.test.js \
            tests/unit/partner-abuse-appeals-route.test.js \
            tests/unit/partner-registration-captcha.test.js \
            tests/unit/partner-registration-risk-advanced.test.js \
            tests/unit/partner-registration-route-order.test.js \
            utils/database.js
          npx prettier --check "**/*.{js,json,md}"

      - name: Commit formatting and remove workflow
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "EventFlow CI Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            public/assets/js/pages/partner-init.js \
            tests/unit/partner-abuse-admin-routes.test.js \
            tests/unit/partner-abuse-appeals-route.test.js \
            tests/unit/partner-registration-captcha.test.js \
            tests/unit/partner-registration-risk-advanced.test.js \
            tests/unit/partner-registration-route-order.test.js \
            utils/database.js
          git rm .github/workflows/pr1415-format-final.yml
          git diff --cached --check
          git commit -m "style(partner): apply final Prettier output"
          git push origin "HEAD:${TARGET_BRANCH}"
