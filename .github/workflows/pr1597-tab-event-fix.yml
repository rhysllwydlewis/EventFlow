name: PR1597 Auth Tab Event Fix

on:
  push:
    branches:
      - fix/google-facebook-auth-button-rendering

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-tab-event-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/google-facebook-auth-button-rendering
          fetch-depth: 0

      - name: Fix auth tab event listener target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/assets/js/pages/auth-google-init.js')
          source = path.read_text()
          old = "    document.addEventListener('eventflow:auth-tab-change', scheduleGoogleLayoutSync);"
          new = "    window.addEventListener('eventflow:auth-tab-change', scheduleGoogleLayoutSync);"
          if old not in source:
              raise SystemExit('Expected document auth-tab listener not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Strengthen regression assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/auth-signup-layout.test.js')
          source = path.read_text()
          old = "    expect(googleInit).toContain(\"'eventflow:auth-tab-change'\");"
          new = "    expect(googleInit).toContain(\"window.addEventListener('eventflow:auth-tab-change'\");\n    expect(googleInit).not.toContain(\"document.addEventListener('eventflow:auth-tab-change'\");"
          if old not in source:
              raise SystemExit('Expected unit assertion not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format and verify targeted files
        run: |
          npx prettier --write public/assets/js/pages/auth-google-init.js tests/unit/auth-signup-layout.test.js
          npx prettier --check public/assets/js/pages/auth-google-init.js tests/unit/auth-signup-layout.test.js
          npx eslint --rulesdir eslint-rules public/assets/js/pages/auth-google-init.js
          npx jest --runInBand --coverage=false tests/unit/auth-signup-layout.test.js

      - name: Remove helper and push fix
        shell: bash
        run: |
          git rm .github/workflows/pr1597-tab-event-fix.yml
          git config user.name "eventflow-ci-helper"
          git config user.email "eventflow-ci-helper@users.noreply.github.com"
          git add public/assets/js/pages/auth-google-init.js tests/unit/auth-signup-layout.test.js
          git commit -m "Fix signup social button rerender on auth tab change [skip-tab-event-fix]"
          git push origin HEAD:fix/google-facebook-auth-button-rendering
