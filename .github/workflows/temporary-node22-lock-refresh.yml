name: Temporary Node 22 Lock Refresh

on:
  push:
    branches: [agent/clean-install-ci-baseline]
    paths:
      - '.github/workflows/temporary-node22-lock-refresh.yml'
      - 'scripts/trigger-node22-lock-refresh.txt'

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/clean-install-ci-baseline
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Regenerate package-lock root metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Verify refreshed metadata
        run: npm run check:lockfile

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for Node 22 runtime metadata"
          git push origin HEAD:agent/clean-install-ci-baseline
