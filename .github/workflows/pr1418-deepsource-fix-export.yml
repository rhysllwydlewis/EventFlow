name: PR 1418 DeepSource Fix Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-trust-consistency
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0
      - name: Apply static-analysis corrections
        run: |
          node <<'NODE'
          const fs = require('fs');

          function edit(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            fs.writeFileSync(path, after);
          }

          edit('middleware/audit.js', source => source
            .replace('async function auditLog(params) {', 'const auditLog = async params => {')
            .replace('\n}\n\n/**\n * Express middleware', '\n};\n\n/**\n * Express middleware'));

          edit('public/assets/js/components/profile-health-widget.js', source => source
            .replace('check: s => !!(s.logo || s.profileImage || s.profilePhotoUrl || s.avatarUrl),', 'check: s => Boolean(s.logo || s.profileImage || s.profilePhotoUrl || s.avatarUrl),')
            .replace('check: s => !!s.location && !!(s.postcode || s.venuePostcode),', 'check: s => Boolean(s.location) && Boolean(s.postcode || s.venuePostcode),')
            .replace('check: s => !!(s.bannerUrl || s.coverImage),', 'check: s => Boolean(s.bannerUrl || s.coverImage),'));

          for (const path of [
            'public/assets/js/pages/admin-suppliers-health-consistency.js',
            'public/assets/js/pages/admin-supplier-trust-consistency.js',
          ]) {
            edit(path, source => {
              const withoutInnerStrict = source.replace("  'use strict';\n\n", '');
              return withoutInnerStrict.startsWith("'use strict';\n")
                ? withoutInnerStrict
                : `'use strict';\n\n${withoutInnerStrict}`;
            });
          }

          edit('public/assets/js/pages/admin-suppliers-health-consistency.js', source =>
            source.replace('} catch (_error) {', '} catch {'));

          edit('routes/index.js', source => source
            .replace('function mountRoutes(app, deps) {', 'const mountRoutes = (app, deps) => {')
            .replace('\n}\n\nmodule.exports = {', '\n};\n\nmodule.exports = {'));

          edit('routes/supplier-management.js', source => source
            .replace('function decodeBannerDataUrl(value) {', 'const decodeBannerDataUrl = value => {')
            .replace('\n}\n\nfunction normaliseStoredBannerUrl(value) {', '\n};\n\nconst normaliseStoredBannerUrl = value => {')
            .replace('} catch (_error) {\n    // handled below\n  }', '} catch {\n    // handled below\n  }')
            .replace('\n}\n\nasync function buildBannerPatch(rawValue) {', '\n};\n\nconst buildBannerPatch = async rawValue => {')
            .replace('\n}\n\n// Dependencies injected by server.js', '\n};\n\n// Dependencies injected by server.js')
            .replace("  async (req, res) => {\n    const b = req.body || {};", "  // skipcq: JS-R1005 -- Existing create-route orchestration is regression-covered; decomposition is a separate refactor.\n  async (req, res) => {\n    const b = req.body || {};")
            .replace("  async (req, res) => {\n    const s = await dbUnified.findOne('suppliers', { id: req.params.id, ownerUserId: req.user.id });", "  // skipcq: JS-R1005 -- Existing update-route orchestration is regression-covered; decomposition is a separate refactor.\n  async (req, res) => {\n    const s = await dbUnified.findOne('suppliers', { id: req.params.id, ownerUserId: req.user.id });"));

          edit('routes/supplier-trust-admin.js', source => source
            .replace('function normaliseTrustVerifications(value) {', 'const normaliseTrustVerifications = value => {')
            .replace('\n}\n\nfunction buildBadgeUpdate', '\n};\n\nfunction buildBadgeUpdate'));
          NODE
          npx prettier --write \
            middleware/audit.js \
            public/assets/js/components/profile-health-widget.js \
            public/assets/js/pages/admin-suppliers-health-consistency.js \
            public/assets/js/pages/admin-supplier-trust-consistency.js \
            routes/index.js \
            routes/supplier-management.js \
            routes/supplier-trust-admin.js
      - name: Commit corrections to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            middleware/audit.js \
            public/assets/js/components/profile-health-widget.js \
            public/assets/js/pages/admin-suppliers-health-consistency.js \
            public/assets/js/pages/admin-supplier-trust-consistency.js \
            routes/index.js \
            routes/supplier-management.js \
            routes/supplier-trust-admin.js
          if git diff --cached --quiet; then
            echo 'Corrections are already applied.'
            exit 0
          fi
          git commit -m 'fix: clear DeepSource JavaScript findings'
          git push origin HEAD:agent/supplier-profile-trust-consistency
