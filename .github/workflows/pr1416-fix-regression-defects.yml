name: PR 1416 apply regression fixes

on:
  push:
    branches:
      - agent/partner-anti-abuse-pr2-reward-integrity
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr1416-regression-repair
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event_name == 'push' || github.head_ref == 'agent/partner-anti-abuse-pr2-reward-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr2-reward-integrity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply regression fixes
        run: |
          python <<'PY'
          from pathlib import Path

          runtime_path = Path('services/partnerRewardIntegrityRuntime.js')
          runtime = runtime_path.read_text()

          if "const partnerAntiAbuse = require('./partnerAntiAbuseService');" not in runtime:
              anchor = "const partnerService = require('./partnerService');\n"
              assert anchor in runtime, 'runtime require anchor missing'
              runtime = runtime.replace(
                  anchor,
                  anchor + "const partnerAntiAbuse = require('./partnerAntiAbuseService');\n",
                  1,
              )

          if 'const METHOD_NAME_BY_TYPE' not in runtime:
              anchor = "});\n\nfunction ensureIndexesBestEffort() {"
              replacement = """});

const METHOD_NAME_BY_TYPE = Object.freeze(
  Object.fromEntries(
    Object.entries(METHOD_CONFIG).map(([methodName, config]) => [config.type, methodName])
  )
);

const TECHNICAL_QUARANTINE_REASONS = new Set([
  'QUALIFICATION_EVIDENCE_PERSIST_FAILED',
  'MATURITY_EXTENSION_PERSIST_FAILED',
]);

function ensureIndexesBestEffort() {"""
              assert anchor in runtime, 'runtime config anchor missing'
              runtime = runtime.replace(anchor, replacement, 1)

          if 'async function repairTechnicalReward' not in runtime:
              anchor = 'function installRewardMethodGuards() {'
              repair = r"""function isTechnicalQuarantinedReward(transaction) {
  return Boolean(
    transaction?.id &&
      transaction.partnerId &&
      transaction.supplierUserId &&
      transaction.reversedAt &&
      transaction.reversalMode === 'void_pending' &&
      TECHNICAL_QUARANTINE_REASONS.has(transaction.reversalReason)
  );
}

function isHardInvalidDecision(decision) {
  return !decision?.eligible && !SOFT_SIGNAL_REASONS.has(decision?.reason);
}

async function repairTechnicalReward(transaction) {
  if (!isTechnicalQuarantinedReward(transaction)) return null;
  const methodName = METHOD_NAME_BY_TYPE[transaction.type];
  const amount = Math.abs(Number(transaction.amount));
  if (!methodName || !Number.isFinite(amount) || amount <= 0) return null;

  const { referral, partner } = await resolvePartnerContext(transaction.supplierUserId);
  if (!referral || !partner || referral.partnerId !== transaction.partnerId) return null;

  try {
    return await awardLock.withPartnerAwardLock(partner.id, async () => {
      const storedReward =
        (await dbUnified.findOne('partner_credit_transactions', { id: transaction.id })) ||
        transaction;
      if (!isTechnicalQuarantinedReward(storedReward)) return null;

      const commonDecision = await partnerAntiAbuse.supplierRewardEligibility(
        transaction.supplierUserId,
        'awardReferralSignupBonus'
      );
      if (!commonDecision?.eligible) return null;

      const evidence = await candidateSelection.selectRewardEvidence({
        supplierUserId: transaction.supplierUserId,
        partnerUserId: partner.userId,
        methodName,
      });
      if (!evidence?.eligible) return null;

      const supplierDecision = await supplierEvidence.methodRewardEvidence({
        supplierUserId: transaction.supplierUserId,
        methodName,
      });
      if (!supplierDecision?.eligible) return null;

      const advancedDecision = await advancedIntegrity.methodRewardEvidence({
        supplierUserId: transaction.supplierUserId,
        partnerId: partner.id,
        partnerUserId: partner.userId,
        methodName,
        baseEvidence: evidence,
      });
      if (isHardInvalidDecision(advancedDecision)) return null;

      const stripeDecision = await evaluateStripeEvidence(
        methodName,
        transaction.supplierUserId,
        evidence
      );
      if (!stripeDecision?.eligible) return null;

      const capDecision = await integrity.canAwardCredit({
        partnerId: partner.id,
        supplierUserId: transaction.supplierUserId,
        type: transaction.type,
        amount: 0,
      });
      if (!capDecision?.eligible) return null;

      const exposureDecision = await advancedIntegrity.exposureDecision({
        partnerId: partner.id,
        supplierUserId: transaction.supplierUserId,
        type: transaction.type,
        amount: 0,
      });
      if (!exposureDecision?.eligible) return null;

      const pendingDecision = await exposureSafety.pendingExposureDecision({
        partnerId: partner.id,
        amount,
      });
      if (!pendingDecision?.eligible) return null;

      const snapshot = qualificationEvidence.buildSnapshot({
        methodName,
        supplierDecision,
        baseEvidence: evidence,
        stripeDecision,
      });
      const technicalRepairAt = new Date().toISOString();
      const repairCandidate = {
        ...storedReward,
        reversedAt: null,
        reversalTxnId: null,
        reversalReason: null,
        reversalMode: null,
        technicalRepairAt,
      };
      const snapshotReward = await qualificationEvidence.persistSnapshot(repairCandidate, snapshot);
      const updated = await dbUnified.updateOne(
        'partner_credit_transactions',
        { id: storedReward.id },
        {
          $set: {
            qualificationEvidence: snapshotReward.qualificationEvidence || snapshot,
            reversedAt: null,
            reversalTxnId: null,
            reversalReason: null,
            reversalMode: null,
            technicalRepairAt,
          },
        }
      );
      if (!updated) throw new Error('Technical partner reward repair did not persist');

      const repaired = await applyRiskMaturity(
        { ...snapshotReward, ...updated },
        partner.id,
        transaction.supplierUserId
      );
      await integrity.recordIntegrityEvent({
        partnerId: partner.id,
        supplierUserId: transaction.supplierUserId,
        rewardType: transaction.type,
        reason: 'TECHNICAL_REWARD_REPAIRED',
        eventType: 'reward_technical_repair',
        evidence: {
          rewardTxnId: storedReward.id,
          previousReversalReason: transaction.reversalReason,
        },
      });
      return repaired;
    });
  } catch (error) {
    if (error.code === 'PARTNER_REWARD_AWARD_LOCK_TIMEOUT') {
      logger.warn('[PARTNER-REWARD-INTEGRITY] Technical reward repair deferred because lock is busy', {
        partnerId: partner.id,
        rewardTxnId: transaction.id,
      });
      return null;
    }
    throw error;
  }
}

function installRewardMethodGuards() {"""
              assert anchor in runtime, 'runtime guard anchor missing'
              runtime = runtime.replace(anchor, repair, 1)

          if 'repairTechnicalReward,' not in runtime:
              anchor = """module.exports = {
  install,
  revalidatePartnerRewards,
  METHOD_CONFIG,
  SOFT_SIGNAL_REASONS,"""
              replacement = """module.exports = {
  install,
  revalidatePartnerRewards,
  repairTechnicalReward,
  isTechnicalQuarantinedReward,
  METHOD_CONFIG,
  METHOD_NAME_BY_TYPE,
  SOFT_SIGNAL_REASONS,
  TECHNICAL_QUARANTINE_REASONS,"""
              assert anchor in runtime, 'runtime export anchor missing'
              runtime = runtime.replace(anchor, replacement, 1)

          runtime_path.write_text(runtime)

          clawback_path = Path('services/partnerRewardIntegrityClawbackService.js')
          clawback = clawback_path.read_text()
          if 'const duplicateBusiness = await baseIntegrity.duplicateSupplierBusinessEvidence' not in clawback:
              start = clawback.index('async function revalidateSnapshotReward(')
              end = clawback.index('\n\nasync function revalidateLegacyReward', start)
              replacement = r"""async function revalidateSnapshotReward(transaction, partner, methodName) {
  const snapshotDecision = await qualificationEvidence.revalidateSnapshot(
    transaction,
    partner.userId
  );
  if (snapshotDecision === null) return null;

  // Re-run current identity and fraud controls without selecting a different
  // package/review/invoice than the one that actually earned this reward.
  const commonDecision = await partnerAntiAbuse.supplierRewardEligibility(
    transaction.supplierUserId,
    'awardReferralSignupBonus'
  );
  if (!commonDecision.eligible) return commonDecision;

  const supplierDecision = await supplierEvidence.methodRewardEvidence({
    supplierUserId: transaction.supplierUserId,
    methodName,
  });
  if (!supplierDecision.eligible) return supplierDecision;

  const duplicateBusiness = await baseIntegrity.duplicateSupplierBusinessEvidence(
    transaction.supplierUserId
  );
  if (duplicateBusiness.duplicate) {
    return {
      eligible: false,
      reason: 'DUPLICATE_SUPPLIER_BUSINESS_IDENTITY',
      evidence: duplicateBusiness,
    };
  }

  const advancedDecision = await advancedIntegrity.methodRewardEvidence({
    supplierUserId: transaction.supplierUserId,
    partnerId: transaction.partnerId,
    partnerUserId: partner.userId,
    methodName,
    baseEvidence: baseEvidenceFromSnapshot(transaction),
  });

  const invalidDecisions = [snapshotDecision, advancedDecision].filter(
    decision => !decision.eligible
  );
  return (
    invalidDecisions.find(decision => !NON_CLAWBACK_REASONS.has(decision.reason)) ||
    invalidDecisions[0] ||
    { eligible: true }
  );
}"""
              clawback = clawback[:start] + replacement + clawback[end:]
              clawback_path.write_text(clawback)
          PY

      - name: Run targeted regression suites
        run: >-
          npx jest tests/unit/partner-reward-technical-repair.test.js
          tests/unit/partner-reward-snapshot-revalidation.test.js --runInBand

      - name: Commit verified source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/partnerRewardIntegrityRuntime.js services/partnerRewardIntegrityClawbackService.js
          if git diff --cached --quiet; then
            echo "Source fixes already applied."
            exit 0
          fi
          git commit -m "fix(partner): repair quarantined rewards and prioritise durable fraud evidence"
          git push origin HEAD:agent/partner-anti-abuse-pr2-reward-integrity
