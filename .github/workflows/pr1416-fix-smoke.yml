name: PR1416 Fix Smoke

on:
  push:
    branches:
      - agent/partner-anti-abuse-pr2-reward-integrity

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr2-reward-integrity

      - name: Apply smoke corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_test = Path('tests/unit/partner-reward-integrity-runtime.test.js')
          text = runtime_test.read_text()
          old = """const mockIntegrity = {
            methodRewardEvidence: jest.fn(async () => ({
          """
          new = """const mockIntegrity = {
            duplicateSupplierBusinessEvidence: jest.fn(async () => ({ duplicate: false })),
            methodRewardEvidence: jest.fn(async () => ({
          """
          assert old in text
          text = text.replace(old, new, 1)
          old = """  mockIntegrity.methodRewardEvidence.mockResolvedValue({
            eligible: true,
          """
          new = """  mockIntegrity.duplicateSupplierBusinessEvidence.mockResolvedValue({ duplicate: false });
            mockIntegrity.methodRewardEvidence.mockResolvedValue({
            eligible: true,
          """
          assert old in text
          runtime_test.write_text(text.replace(old, new, 1))

          advanced_service = Path('services/partnerRewardIntegrityAdvancedService.js')
          text = advanced_service.read_text()
          old = """    if (similarity >= threshold && (sameTitle || samePrice)) {
          """
          new = """    const strongMetadataCopy = sameTitle && samePrice && similarity >= 0.8;
            if (strongMetadataCopy || (similarity >= threshold && (sameTitle || samePrice))) {
          """
          assert old in text
          advanced_service.write_text(text.replace(old, new, 1))

          advanced_test = Path('tests/unit/partner-reward-integrity-advanced.test.js')
          text = advanced_test.read_text()
          old = """  for (let index = 1; index <= 3; index += 1) {
              collections.reviews.push({
          """
          new = """  const distinctComments = [
              'The supplier communicated clearly, arrived early and delivered the finished gallery promptly.',
              'Our guests enjoyed the relaxed service and the team handled every venue change professionally.',
              'Booking was straightforward, pricing was transparent and the final photographs exceeded expectations.',
            ];
            for (let index = 1; index <= 3; index += 1) {
              collections.reviews.push({
          """
          assert old in text
          text = text.replace(old, new, 1)
          old = """      comment: `Distinct genuine-looking review content number ${index} that is deliberately different from the others.`,
          """
          new = """      comment: distinctComments[index - 1],
          """
          assert old in text
          advanced_test.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Verify focused PR2 suites
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long
        run: |
          npm ci --prefer-offline --no-audit
          npx prettier --write \
            services/partnerRewardIntegrityAdvancedService.js \
            tests/unit/partner-reward-integrity-runtime.test.js \
            tests/unit/partner-reward-integrity-advanced.test.js
          npx jest --runInBand --coverage=false \
            tests/unit/partner-reward-integrity-runtime.test.js \
            tests/unit/partner-reward-integrity-advanced.test.js

      - name: Commit verified correction and remove workflow
        run: |
          git config user.name "EventFlow CI Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            services/partnerRewardIntegrityAdvancedService.js \
            tests/unit/partner-reward-integrity-runtime.test.js \
            tests/unit/partner-reward-integrity-advanced.test.js
          git rm .github/workflows/pr1416-fix-smoke.yml
          git diff --cached --check
          git commit -m "fix(partner): correct reward integrity smoke regressions"
          git push origin HEAD:agent/partner-anti-abuse-pr2-reward-integrity
