name: PR1416 Fix Smoke

on:
  push:
    branches:
      - agent/partner-anti-abuse-pr2-reward-integrity

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr2-reward-integrity

      - name: Apply smoke corrections
        run: |
          git config user.name "EventFlow CI Maintainer"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          runtime_test = Path('tests/unit/partner-reward-integrity-runtime.test.js')
          text = runtime_test.read_text()
          assert 'const mockIntegrity = {\n  methodRewardEvidence:' in text
          text = text.replace(
              'const mockIntegrity = {\n  methodRewardEvidence:',
              'const mockIntegrity = {\n  duplicateSupplierBusinessEvidence: jest.fn(async () => ({ duplicate: false })),\n  methodRewardEvidence:',
              1,
          )
          assert '  mockIntegrity.methodRewardEvidence.mockResolvedValue({' in text
          text = text.replace(
              '  mockIntegrity.methodRewardEvidence.mockResolvedValue({',
              '  mockIntegrity.duplicateSupplierBusinessEvidence.mockResolvedValue({ duplicate: false });\n  mockIntegrity.methodRewardEvidence.mockResolvedValue({',
              1,
          )
          runtime_test.write_text(text)

          service = Path('services/partnerRewardIntegrityAdvancedService.js')
          text = service.read_text()
          assert '    if (similarity >= threshold && (sameTitle || samePrice)) {' in text
          text = text.replace(
              '    if (similarity >= threshold && (sameTitle || samePrice)) {',
              '    const strongMetadataCopy = sameTitle && samePrice && similarity >= 0.8;\n    if (strongMetadataCopy || (similarity >= threshold && (sameTitle || samePrice))) {',
              1,
          )
          service.write_text(text)

          advanced_test = Path('tests/unit/partner-reward-integrity-advanced.test.js')
          text = advanced_test.read_text()
          assert '  for (let index = 1; index <= 3; index += 1) {' in text
          text = text.replace(
              '  for (let index = 1; index <= 3; index += 1) {',
              "  const distinctComments = [\n    'The supplier communicated clearly, arrived early and delivered the finished gallery promptly.',\n    'Our guests enjoyed the relaxed service and the team handled every venue change professionally.',\n    'Booking was straightforward, pricing was transparent and the final photographs exceeded expectations.',\n  ];\n  for (let index = 1; index <= 3; index += 1) {",
              1,
          )
          assert '      comment: `Distinct genuine-looking review content number ${index} that is deliberately different from the others.`,' in text
          text = text.replace(
              '      comment: `Distinct genuine-looking review content number ${index} that is deliberately different from the others.`,',
              '      comment: distinctComments[index - 1],',
              1,
          )
          advanced_test.write_text(text)
          PY
          git add \
            services/partnerRewardIntegrityAdvancedService.js \
            tests/unit/partner-reward-integrity-runtime.test.js \
            tests/unit/partner-reward-integrity-advanced.test.js
          git rm .github/workflows/pr1416-fix-smoke.yml
          git diff --cached --check
          git commit -m "fix(partner): correct reward integrity smoke regressions"
          git push origin HEAD:agent/partner-anti-abuse-pr2-reward-integrity
