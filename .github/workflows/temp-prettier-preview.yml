name: Temporary Prettier Preview

on:
  push:
    branches: [agent/comprehensive-test-autonomy-hardening]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Generate exact formatting patch
        run: |
          npx prettier --write \
            docs/github-autonomy-hardening.md \
            playwright.config.js \
            tests/unit/external-service-failure-contracts.test.js \
            tests/unit/property-fuzz.test.js
          git diff --binary > prettier-fixes.patch
          cat prettier-fixes.patch
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-fixes
          path: prettier-fixes.patch
          if-no-files-found: error
          retention-days: 1
