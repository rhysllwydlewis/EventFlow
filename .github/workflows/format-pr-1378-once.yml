name: Format PR 1378 once

on:
  push:
    branches:
      - feature/server-rendered-supplier-seo
    paths:
      - .github/workflows/format-pr-1378-once.yml
      - routes/public-supplier-seo.js
      - services/publicSupplierSeo.service.js
      - tests/unit/public-supplier-seo.test.js
      - tests/unit/sitemap-guides.test.js

permissions:
  contents: write

concurrency:
  group: format-pr-1378-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/server-rendered-supplier-seo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Format only PR 1378 JavaScript files
        run: >-
          npx prettier --write
          routes/public-supplier-seo.js
          services/publicSupplierSeo.service.js
          tests/unit/public-supplier-seo.test.js
          tests/unit/sitemap-guides.test.js
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "Files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            routes/public-supplier-seo.js \
            services/publicSupplierSeo.service.js \
            tests/unit/public-supplier-seo.test.js \
            tests/unit/sitemap-guides.test.js
          git commit -m "Format supplier SEO hardening changes"
          git push origin HEAD:feature/server-rendered-supplier-seo
