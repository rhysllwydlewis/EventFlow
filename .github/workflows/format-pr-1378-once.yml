name: Format PR 1378 audit fixes once

on:
  push:
    branches:
      - feature/server-rendered-supplier-seo
    paths:
      - .github/workflows/format-pr-1378-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/server-rendered-supplier-seo
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Format audited files
        run: >-
          npx prettier --write
          routes/public-supplier-seo.js
          services/publicSupplierSeo.service.js
          tests/integration/public-supplier-seo-route.test.js
          tests/unit/public-supplier-seo.test.js
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/format-pr-1378-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/public-supplier-seo.js services/publicSupplierSeo.service.js tests/integration/public-supplier-seo-route.test.js tests/unit/public-supplier-seo.test.js
          git commit -m "Format supplier SEO audit fixes"
          git push origin HEAD:feature/server-rendered-supplier-seo