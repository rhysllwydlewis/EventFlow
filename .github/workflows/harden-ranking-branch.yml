name: Harden ranking branch

on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supplier-ranking-v1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0
      - name: Apply identity and subscription fixes
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          service = Path('services/supplierRanking.service.js')
          content = service.read_text()
          content, subscription_count = re.subn(
              r"(function effectiveSubscriptionTier\(supplier\) \{\n\s+const tier = String\(supplier\.subscriptionTier \|\| supplier\.subscription\?\.tier \|\| ''\)\.toLowerCase\(\);\n)(\s+if \(\['pro_plus', 'pro-plus', 'proplus'\]\.includes\(tier\)\) \{)",
              r"\1  if (supplier.isPro === false) {\n    return 'free';\n  }\n\2",
              content,
              count=1,
          )
          content, owner_count = re.subn(
              r"\s+return !\(\n\s+supplier\.ownerUserId &&\n\s+validOwnerIds instanceof Set &&\n\s+!validOwnerIds\.has\(supplier\.ownerUserId\)\n\s+\);",
              "\n  if (validOwnerIds instanceof Set) {\n    return Boolean(\n      supplier.ownerUserId && validOwnerIds.has(String(supplier.ownerUserId))\n    );\n  }\n  return true;",
              content,
              count=1,
          )
          if subscription_count != 1 or owner_count != 1:
              raise SystemExit(
                  f'expected one replacement each, got subscription={subscription_count}, owner={owner_count}'
              )
          service.write_text(content)

          tests = Path('tests/unit/supplierRanking.branches.test.js')
          content = tests.read_text()
          starter = "expect(effectiveSubscriptionTier({ subscriptionTier: 'starter' })).toBe('free');"
          inactive = "expect(effectiveSubscriptionTier({ subscriptionTier: 'pro', isPro: false })).toBe('free');"
          if inactive not in content:
              content = content.replace(starter, starter + '\n    ' + inactive)

          owner_without_id = "expect(isPubliclyEligibleSupplier({ approved: true }, owners)).toBe(true);"
          owner_replacement = """expect(isPubliclyEligibleSupplier({ approved: true }, owners)).toBe(false);
              expect(
                isPubliclyEligibleSupplier(
                  { approved: true, ownerUserId: { toString: () => 'owner_1' } },
                  owners
                )
              ).toBe(true);"""
          content = content.replace(owner_without_id, owner_replacement)
          tests.write_text(content)
          PY
      - name: Format changes
        run: >-
          npx prettier --write
          services/supplierRanking.service.js
          tests/unit/supplierRanking.branches.test.js
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/supplierRanking.service.js tests/unit/supplierRanking.branches.test.js
          git commit -m "fix: enforce active plans and valid supplier owners"
          git push origin HEAD:feat/supplier-ranking-v1
