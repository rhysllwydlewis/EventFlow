name: Harden ranking branch

on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supplier-ranking-v1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0
      - name: Apply identity and subscription fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('services/supplierRanking.service.js')
          content = service.read_text()
          old = """function effectiveSubscriptionTier(supplier) {
            const tier = String(supplier.subscriptionTier || supplier.subscription?.tier || '').toLowerCase();
            if (['pro_plus', 'pro-plus', 'proplus'].includes(tier)) {
              return 'pro_plus';
            }
            return tier === 'pro' || supplier.isPro === true ? 'pro' : 'free';
          }
          """
          new = """function effectiveSubscriptionTier(supplier) {
            const tier = String(supplier.subscriptionTier || supplier.subscription?.tier || '').toLowerCase();
            if (supplier.isPro === false) {
              return 'free';
            }
            if (['pro_plus', 'pro-plus', 'proplus'].includes(tier)) {
              return 'pro_plus';
            }
            return tier === 'pro' || supplier.isPro === true ? 'pro' : 'free';
          }
          """
          if old not in content:
            raise SystemExit('subscription tier block not found')
          content = content.replace(old, new)

          old = """  return !(
            supplier.ownerUserId &&
            validOwnerIds instanceof Set &&
            !validOwnerIds.has(supplier.ownerUserId)
          );
          """
          new = """  if (validOwnerIds instanceof Set) {
            return Boolean(
              supplier.ownerUserId && validOwnerIds.has(String(supplier.ownerUserId))
            );
          }
          return true;
          """
          if old not in content:
            raise SystemExit('owner eligibility block not found')
          service.write_text(content.replace(old, new))

          tests = Path('tests/unit/supplierRanking.branches.test.js')
          content = tests.read_text()
          content = content.replace(
              "expect(effectiveSubscriptionTier({ subscriptionTier: 'starter' })).toBe('free');",
              "expect(effectiveSubscriptionTier({ subscriptionTier: 'starter' })).toBe('free');\n    expect(effectiveSubscriptionTier({ subscriptionTier: 'pro', isPro: false })).toBe('free');",
          )
          content = content.replace(
              "expect(isPubliclyEligibleSupplier({ approved: true }, owners)).toBe(true);",
              "expect(isPubliclyEligibleSupplier({ approved: true }, owners)).toBe(false);\n    expect(\n      isPubliclyEligibleSupplier(\n        { approved: true, ownerUserId: { toString: () => 'owner_1' } },\n        owners\n      )\n    ).toBe(true);",
          )
          tests.write_text(content)
          PY
      - name: Format changes
        run: >-
          npx prettier --write
          services/supplierRanking.service.js
          tests/unit/supplierRanking.branches.test.js
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/supplierRanking.service.js tests/unit/supplierRanking.branches.test.js
          git commit -m "fix: enforce active plans and valid supplier owners"
          git push origin HEAD:feat/supplier-ranking-v1
