name: Fix supplier profile balance regressions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix-regressions:
    if: github.event.pull_request.head.ref == 'agent/supplier-profile-header-layout-balance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-header-layout-balance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align cache assertions and type scale
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          for path in [
              Path('tests/unit/supplier-profile-polish.test.js'),
              Path('tests/unit/supplier-profile-visual-overhaul.test.js'),
          ]:
              text = path.read_text()
              text = text.replace(
                  '/assets/css/supplier-profile-theme.css?v=20.0.0',
                  '/assets/css/supplier-profile-theme.css?v=20.1.0',
              )
              path.write_text(text)

          css_path = Path('public/assets/css/supplier-profile-theme.css')
          css = css_path.read_text().replace('font-size: 0.9375rem !important;', 'font-size: 1rem !important;')
          css_path.write_text(css)
          PY

      - name: Format corrected files
        run: |
          npm ci --ignore-scripts
          npx prettier --write \
            public/assets/css/supplier-profile-theme.css \
            tests/unit/supplier-profile-polish.test.js \
            tests/unit/supplier-profile-visual-overhaul.test.js

      - name: Commit regression fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/assets/css/supplier-profile-theme.css \
            tests/unit/supplier-profile-polish.test.js \
            tests/unit/supplier-profile-visual-overhaul.test.js
          git commit -m "Fix supplier profile layout regression checks"
          git push origin HEAD:agent/supplier-profile-header-layout-balance
