name: Temporary analytics bridge cache bump

on:
  push:
    branches:
      - feat/signup-attribution-session-replay

permissions:
  contents: write

jobs:
  bump-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/signup-attribution-session-replay
          fetch-depth: 0

      - name: Bump bridge version and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('utils/template-renderer.js')
          content = path.read_text()
          old = 'analytics-consent-upgrade.js?v=2'
          new = 'analytics-consent-upgrade.js?v=3'
          if old not in content:
              raise SystemExit(f'Expected asset reference not found: {old}')
          path.write_text(content.replace(old, new, 1))
          Path('.github/workflows/tmp-bump-analytics-bridge.yml').unlink()
          PY

      - name: Commit generated correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utils/template-renderer.js .github/workflows/tmp-bump-analytics-bridge.yml
          git commit -m 'fix: refresh cached analytics bridge asset'
          git push origin HEAD:feat/signup-attribution-session-replay
