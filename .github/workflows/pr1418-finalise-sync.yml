name: PR 1418 finalise sync

on:
  push:
    branches:
      - agent/supplier-profile-trust-consistency
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr1418-finalise-sync
  cancel-in-progress: true

jobs:
  finalise:
    if: github.event_name == 'push' || github.head_ref == 'agent/supplier-profile-trust-consistency'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-trust-consistency
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Restore supplier trust integration after main sync
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          routes_path = Path('routes/index.js')
          routes = routes_path.read_text()
          require_anchor = "const supplierAdminRoutes = require('./supplier-admin');"
          require_line = "const supplierTrustAdminRoutes = require('./supplier-trust-admin');"
          if require_line not in routes:
              assert require_anchor in routes, 'supplier admin import anchor missing'
              routes = routes.replace(require_anchor, require_anchor + "\n" + require_line, 1)

          mount_anchor = "  app.use('/api/v1/admin', supplierAdminRoutes);\n  app.use('/api/admin', supplierAdminRoutes);"
          mount_block = mount_anchor + "\n  // Dedicated trust-credential mutations use the audited structured trust path.\n  app.use('/api/v1/admin', supplierTrustAdminRoutes);\n  app.use('/api/admin', supplierTrustAdminRoutes);"
          if "app.use('/api/v1/admin', supplierTrustAdminRoutes);" not in routes:
              assert mount_anchor in routes, 'supplier admin mount anchor missing'
              routes = routes.replace(mount_anchor, mount_block, 1)
          routes_path.write_text(routes)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          supplier_tests = [
              'tests/unit/audit-log-persistence.test.js',
              'tests/unit/supplier-public-profile-trust.test.js',
              'tests/unit/supplier-auto-approval-audit.test.js',
              'tests/unit/supplier-trust-admin.test.js',
              'tests/unit/supplier-trust-badge-mutation-guard.test.js',
              'tests/unit/supplier-banner-persistence.test.js',
              'tests/unit/supplier-profile-trust-assets.test.js',
              'tests/unit/supplier-profile-health-aliases.test.js',
          ]
          smoke = package['scripts']['test:smoke']
          for test in supplier_tests:
              if test not in smoke:
                  smoke += ' ' + test
          package['scripts']['test:smoke'] = smoke
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0

      - name: Format supplier trust files
        run: |
          npx prettier --write \
            package.json \
            routes/index.js \
            public/assets/js/pages/admin-supplier-trust-consistency.js \
            public/assets/js/pages/admin-suppliers-health-consistency.js \
            public/assets/js/pages/supplier-profile-public-polish.js \
            routes/supplier-management.js \
            routes/supplier-trust-admin.js \
            tests/unit/audit-log-persistence.test.js \
            tests/unit/supplier-auto-approval-audit.test.js \
            tests/unit/supplier-banner-persistence.test.js \
            tests/unit/supplier-profile-trust-assets.test.js \
            tests/unit/supplier-profile-health-aliases.test.js \
            tests/unit/supplier-public-profile-trust.test.js \
            utils/supplierPublicProfile.js

      - name: Capture lint diagnostics
        run: |
          set +e
          npm run lint > lint.log 2>&1
          status=$?
          cat lint.log
          echo "$status" > lint.exit
          exit 0

      - name: Capture smoke diagnostics
        run: |
          set +e
          npm run test:smoke > smoke.log 2>&1
          status=$?
          cat smoke.log
          echo "$status" > smoke.exit
          exit 0

      - name: Upload verifier diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1418-finalise-diagnostics
          path: |
            lint.log
            lint.exit
            smoke.log
            smoke.exit
          retention-days: 7

      - name: Enforce lint and smoke results
        run: |
          lint_status="$(cat lint.exit)"
          smoke_status="$(cat smoke.exit)"
          echo "lint exit: $lint_status"
          echo "smoke exit: $smoke_status"
          test "$lint_status" = "0"
          test "$smoke_status" = "0"

      - name: Commit verified integration and remove helper
        run: |
          rm .github/workflows/pr1418-finalise-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json routes/index.js \
            public/assets/js/pages/admin-supplier-trust-consistency.js \
            public/assets/js/pages/admin-suppliers-health-consistency.js \
            public/assets/js/pages/supplier-profile-public-polish.js \
            routes/supplier-management.js routes/supplier-trust-admin.js \
            tests/unit/audit-log-persistence.test.js \
            tests/unit/supplier-auto-approval-audit.test.js \
            tests/unit/supplier-banner-persistence.test.js \
            tests/unit/supplier-profile-trust-assets.test.js \
            tests/unit/supplier-profile-health-aliases.test.js \
            tests/unit/supplier-public-profile-trust.test.js \
            utils/supplierPublicProfile.js \
            .github/workflows/pr1418-finalise-sync.yml
          git commit -m "fix(suppliers): preserve trust integration and format synced files"
          git push origin HEAD:agent/supplier-profile-trust-consistency
