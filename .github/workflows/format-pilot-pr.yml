name: Format Pilot PR

on:
  push:
    branches:
      - supplier-bot/one-profile-pilot-visibility

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supplier-bot/one-profile-pilot-visibility
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format pilot changes
        run: >-
          npx prettier --write
          routes/public-supplier-seo.js
          routes/supplier-profile-safe.js
          services/supplierBotPilotVisibility.util.js
          tests/integration/supplier-bot-pilot-profile-route.test.js
          tests/integration/supplier-bot-pilot-ingestion-route.test.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routes/public-supplier-seo.js routes/supplier-profile-safe.js services/supplierBotPilotVisibility.util.js tests/integration/supplier-bot-pilot-profile-route.test.js tests/integration/supplier-bot-pilot-ingestion-route.test.js
          git commit -m 'Format Supplier Bot pilot changes'
          git push origin HEAD:supplier-bot/one-profile-pilot-visibility
