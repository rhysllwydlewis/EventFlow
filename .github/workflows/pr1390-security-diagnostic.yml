name: PR 1390 Security Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr1390-security-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-audit:
    name: Regenerate and audit production lockfile
    if: >-
      github.event.pull_request.number == 1390 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Verify production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > production-audit-report.json
          status=$?
          echo "audit_exit_code=${status}" > production-audit-status.txt
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: regenerate audited dependency lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload lockfile and audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1390-production-audit
          path: |
            package-lock.json
            production-audit-report.json
            production-audit-status.txt
          if-no-files-found: error
          retention-days: 2
