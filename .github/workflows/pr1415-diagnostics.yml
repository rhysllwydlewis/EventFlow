name: PR1415 Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Prepare root-cause fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/unit/supplier-profile-provisioning-hardening.test.js')
          text = test_path.read_text()
          marker = "describe('supplier registration provisioning integration', () => {"
          before, section = text.split(marker, 1)

          setup_old = """
            beforeEach(() => {
              jest.resetModules();
              mockLogger();
            });
          """
          setup_new = """
            const originalPartnerAbuseHashSecret = process.env.PARTNER_ABUSE_HASH_SECRET;

            beforeEach(() => {
              jest.resetModules();
              mockLogger();
              process.env.PARTNER_ABUSE_HASH_SECRET = 'supplier-provisioning-risk-test-secret';
            });

            afterEach(() => {
              if (originalPartnerAbuseHashSecret === undefined) {
                delete process.env.PARTNER_ABUSE_HASH_SECRET;
              } else {
                process.env.PARTNER_ABUSE_HASH_SECRET = originalPartnerAbuseHashSecret;
              }
            });
          """
          assert setup_old in section, 'supplier integration setup block not found'
          section = section.replace(setup_old, setup_new, 1)

          fixture_old = """      suppliers: [],
              settings: { features: { registration: true, supplierApplications: true } },
          """
          if fixture_old not in section:
              fixture_old = """      suppliers: [],
              settings: { features: { registration: true, supplierApplications: true } },
          """.replace('      settings', '      settings')
          fixture_new = """      suppliers: [],
              partner_abuse_events: [],
              partner_abuse_overrides: [],
              partner_abuse_appeals: [],
              settings: { features: { registration: true, supplierApplications: true } },
          """
          # Use line-oriented insertion so indentation differences do not matter.
          lines = section.splitlines(keepends=True)
          inserted = False
          for index, line in enumerate(lines):
              if not inserted and line.strip() == 'suppliers: [],':
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index + 1:index + 1] = [
                      f'{indent}partner_abuse_events: [],\n',
                      f'{indent}partner_abuse_overrides: [],\n',
                      f'{indent}partner_abuse_appeals: [],\n',
                  ]
                  inserted = True
                  break
          assert inserted, 'supplier integration data fixture not found'
          section = ''.join(lines)

          read_line = 'read: jest.fn(async collection => data[collection] || {}),'
          read_index = section.find(read_line)
          assert read_index >= 0, 'db fixture insertion point not found'
          line_start = section.rfind('\n', 0, read_index) + 1
          indent = section[line_start:read_index]
          insertion_at = section.find('\n', read_index) + 1
          find_with_options = f"""{indent}findWithOptions: jest.fn(async (collection, query = {{}}, options = {{}}) => {{
          {indent}  const rows = Array.isArray(data[collection]) ? data[collection] : [];
          {indent}  const matches = row =>
          {indent}    Object.entries(query).every(([key, expected]) => {{
          {indent}      if (expected && typeof expected === 'object' && !Array.isArray(expected)) {{
          {indent}        if (Array.isArray(expected.$in)) return expected.$in.includes(row[key]);
          {indent}        if (expected.$gte !== undefined) return row[key] >= expected.$gte;
          {indent}        if (expected.$gt !== undefined) return row[key] > expected.$gt;
          {indent}        if (expected.$exists !== undefined) {{
          {indent}          return expected.$exists
          {indent}            ? Object.prototype.hasOwnProperty.call(row, key)
          {indent}            : !Object.prototype.hasOwnProperty.call(row, key);
          {indent}        }}
          {indent}      }}
          {indent}      return row[key] === expected;
          {indent}    }});
          {indent}  const results = rows.filter(matches);
          {indent}  const sortEntries = Object.entries(options.sort || {{}});
          {indent}  if (sortEntries.length) {{
          {indent}    const [field, direction] = sortEntries[0];
          {indent}    results.sort((left, right) =>
          {indent}      direction * String(left[field] || '').localeCompare(String(right[field] || ''))
          {indent}    );
          {indent}  }}
          {indent}  return results.slice(0, options.limit || results.length);
          {indent}}}),
          """
          section = section[:insertion_at] + find_with_options + section[insertion_at:]
          test_path.write_text(before + marker + section)

          e2e_path = Path('e2e/auth.spec.js')
          text = e2e_path.read_text()
          old = "const toggleButton = page.locator('.password-toggle').first();"
          new = "const toggleButton = passwordInput.locator('xpath=..').locator('.password-toggle');"
          assert old in text, 'password toggle locator not found'
          e2e_path.write_text(text.replace(old, new, 1))

          css_path = Path('public/assets/css/auth.css')
          text = css_path.read_text()
          old = """/* On the auth page anchor the toggle to the input height (44 px) so that
             form-validation error messages that appear below the input cannot push
             the toggle outside the input bounds by growing .auth-input-wrap. */
          body.auth-page .auth-pw-wrap .password-toggle {
            top: calc(44px / 2) !important; /* = auth-input height ÷ 2 */
          }
          """
          new = """/* On the auth page anchor the toggle to the actual 42 px input height so that
             validation messages or other layout changes cannot move it away from its input. */
          body.auth-page .auth-pw-wrap {
            min-height: 42px;
          }

          body.auth-page .auth-pw-wrap > .password-toggle {
            top: 21px !important;
            bottom: auto !important;
            margin: 0 !important;
          }
          """
          assert old in text, 'password toggle CSS block not found'
          css_path.write_text(text.replace(old, new, 1))
          PY

      - name: Produce exact Prettier outputs
        run: |
          npx prettier --write \
            docs/PARTNER_ANTI_ABUSE_PR1_VALIDATION.md \
            routes/admin-partner-abuse.js \
            routes/partner-abuse-appeals.js \
            routes/partner-registration-secure.js \
            services/partnerAntiAbuseService.js \
            services/partnerRegistrationRiskService.js \
            tests/unit/partner-abuse-admin-routes.test.js \
            tests/unit/partner-registration-final-review.test.js \
            tests/unit/partner-registration-secure.test.js \
            tests/unit/supplier-profile-provisioning-hardening.test.js \
            e2e/auth.spec.js

      - name: Run focused supplier registration regression
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long
        run: npx jest --runInBand --coverage=false tests/unit/supplier-profile-provisioning-hardening.test.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused mobile password-toggle regression
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long
        run: >-
          npx playwright test e2e/auth.spec.js
          --grep "password toggle stays vertically centered on mobile before and after click"
          --reporter=line

      - name: Commit verified corrections and remove diagnostics
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "EventFlow CI Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/PARTNER_ANTI_ABUSE_PR1_VALIDATION.md \
            routes/admin-partner-abuse.js \
            routes/partner-abuse-appeals.js \
            routes/partner-registration-secure.js \
            services/partnerAntiAbuseService.js \
            services/partnerRegistrationRiskService.js \
            tests/unit/partner-abuse-admin-routes.test.js \
            tests/unit/partner-registration-final-review.test.js \
            tests/unit/partner-registration-secure.test.js \
            tests/unit/supplier-profile-provisioning-hardening.test.js \
            e2e/auth.spec.js \
            public/assets/css/auth.css
          git rm .github/workflows/pr1415-diagnostics.yml
          git diff --cached --check
          git commit -m "fix(partner): complete PR1415 regression corrections"
          git push origin "HEAD:${TARGET_BRANCH}"
