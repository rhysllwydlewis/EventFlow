name: PR 1417 remaining DeepSource diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: read

jobs:
  extract-findings:
    if: github.event.pull_request.head.ref == 'agent/partner-anti-abuse-pr3-cashout-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for DeepSource JavaScript report
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPOSITORY}/commits/${HEAD_SHA}/status" > status.json
            node <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('status.json', 'utf8'));
          const item = (status.statuses || []).find(entry => entry.context === 'DeepSource: JavaScript');
          if (item?.target_url) fs.writeFileSync('target-url.txt', item.target_url);
          if (item?.state) fs.writeFileSync('deepsource-state.txt', item.state);
          NODE
            state="$(cat deepsource-state.txt 2>/dev/null || true)"
            if [ "$state" = "success" ] || [ "$state" = "failure" ]; then break; fi
            sleep 10
          done
          test -s target-url.txt
          test "$(cat deepsource-state.txt)" != "pending"

      - name: Parse findings
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$(cat target-url.txt)" > report.html
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('report.html', 'utf8');
          const match = html.match(/<script>window\.__NUXT__=([\s\S]*?)<\/script>/);
          if (!match) throw new Error('DeepSource report payload was not found');
          const context = { window: {} };
          vm.createContext(context);
          vm.runInContext(`window.__NUXT__=${match[1]}`, context, { timeout: 10000 });
          const issues = [];
          const seen = new Set();
          const visited = new Set();
          function visit(value) {
            if (!value || typeof value !== 'object' || visited.has(value)) return;
            visited.add(value);
            if (value.__typename === 'StaticAnalysisIssue' && value.id && value.path && value.shortcode && !seen.has(value.id)) {
              seen.add(value.id);
              issues.push({
                id: value.id,
                path: value.path,
                text: value.text,
                shortcode: value.shortcode,
                category: value.category,
                severity: value.severity,
                beginLine: value.beginLine,
                beginColumn: value.beginColumn,
                endLine: value.endLine,
                endColumn: value.endColumn,
              });
            }
            for (const child of Object.values(value)) visit(child);
          }
          visit(context.window.__NUXT__);
          issues.sort((a, b) => a.path.localeCompare(b.path) || Number(a.beginLine || 0) - Number(b.beginLine || 0));
          fs.writeFileSync('issues.json', JSON.stringify(issues, null, 2));
          const summary = { total: issues.length, by_code: {}, by_file: {} };
          for (const issue of issues) {
            summary.by_code[issue.shortcode] = (summary.by_code[issue.shortcode] || 0) + 1;
            summary.by_file[issue.path] ||= {};
            summary.by_file[issue.path][issue.shortcode] = (summary.by_file[issue.path][issue.shortcode] || 0) + 1;
          }
          fs.writeFileSync('summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: pr1417-deepsource-remaining
          path: |
            issues.json
            summary.json
            target-url.txt
          retention-days: 2
