name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTINUE_ON_ERROR_UNTIL: '2026-08-31'
  HUSKY: '0'

jobs:
  setup:
    name: Verify Dependencies & Browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium

  e2e-auth:
    name: E2E Auth Focus
    # The test step gets 30 minutes, with extra job time reserved for artifact upload.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Restore Playwright browsers cache
        id: restore-pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser on cache miss
        if: steps.restore-pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run focused auth E2E tests
        id: e2e-auth-run
        timeout-minutes: 30
        continue-on-error: true
        run: npx playwright test e2e/auth.spec.js --project=chromium
        env:
          CI: true

      - name: Upload auth Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-auth
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload auth test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-auth
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Report auth E2E failures
        if: steps.e2e-auth-run.outcome == 'failure'
        run: |
          echo "::warning::Auth E2E failed, but the temporary soft-fail policy is active until ${CONTINUE_ON_ERROR_UNTIL}. Artifacts were uploaded for review."

      - name: Enforce expired auth E2E soft-fail policy
        if: steps.e2e-auth-run.outcome == 'failure'
        run: |
          today="$(date -u +%F)"
          if [[ "$today" > "$CONTINUE_ON_ERROR_UNTIL" ]]; then
            echo "::error::Auth E2E soft-fail policy expired on ${CONTINUE_ON_ERROR_UNTIL}."
            exit 1
          fi
          echo "Auth E2E soft-fail policy active until ${CONTINUE_ON_ERROR_UNTIL}."

  e2e:
    name: E2E Tests Part ${{ matrix.shard }} of 2
    # The test step gets 30 minutes, with extra job time reserved for artifact upload.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Restore Playwright browsers cache
        id: restore-pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser on cache miss
        if: steps.restore-pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E tests part ${{ matrix.shard }} of 2
        id: e2e-run
        timeout-minutes: 30
        continue-on-error: true
        run: npm run test:e2e:static -- --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Upload Playwright report part ${{ matrix.shard }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-part-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test artifacts part ${{ matrix.shard }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-part-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Report E2E failures
        if: steps.e2e-run.outcome == 'failure'
        run: |
          echo "::warning::E2E shard ${{ matrix.shard }} failed, but the temporary soft-fail policy is active until ${CONTINUE_ON_ERROR_UNTIL}. Artifacts were uploaded for review."

      - name: Enforce expired E2E soft-fail policy
        if: steps.e2e-run.outcome == 'failure'
        run: |
          today="$(date -u +%F)"
          if [[ "$today" > "$CONTINUE_ON_ERROR_UNTIL" ]]; then
            echo "::error::E2E soft-fail policy expired on ${CONTINUE_ON_ERROR_UNTIL}."
            exit 1
          fi
          echo "E2E soft-fail policy active until ${CONTINUE_ON_ERROR_UNTIL}."

  visual-regression:
    name: Visual Regression Tests
    # The test step gets 30 minutes, with extra job time reserved for artifact upload.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    needs: [setup, e2e]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Restore Playwright browsers cache
        id: restore-pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser on cache miss
        if: steps.restore-pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run visual regression tests
        id: visual-run
        timeout-minutes: 30
        continue-on-error: true
        run: npx playwright test --grep @visual
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-e2e-testing-only-min-32-chars

      - name: Upload visual diffs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Report visual regression failures
        if: steps.visual-run.outcome == 'failure'
        run: |
          echo "::warning::Visual regression snapshots failed, but the temporary soft-fail policy is active until ${CONTINUE_ON_ERROR_UNTIL}. Review the uploaded visual diffs before accepting any baseline update."

      - name: Enforce expired visual soft-fail policy
        if: steps.visual-run.outcome == 'failure'
        run: |
          today="$(date -u +%F)"
          if [[ "$today" > "$CONTINUE_ON_ERROR_UNTIL" ]]; then
            echo "::error::Visual regression soft-fail policy expired on ${CONTINUE_ON_ERROR_UNTIL}."
            exit 1
          fi
          echo "Visual regression soft-fail policy active until ${CONTINUE_ON_ERROR_UNTIL}."
