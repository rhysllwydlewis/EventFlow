name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  setup:
    name: Verify Dependencies & Browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium

  e2e-auth:
    name: E2E Auth Focus
    # The test step gets 30 minutes, with extra job time reserved for artifact upload.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Restore Playwright browsers cache
        id: restore-pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser on cache miss
        if: steps.restore-pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run focused auth E2E tests
        id: e2e-auth-run
        timeout-minutes: 30
        run: npx playwright test e2e/auth.spec.js --project=chromium
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/auth-results.json
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/auth-junit.xml

      - name: Create concise auth failure summary
        if: always()
        run: node scripts/summarize-playwright-results.mjs test-results/auth-results.json test-results/auth-summary.txt

      - name: Upload concise auth results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-machine-results-auth
          path: |
            test-results/auth-results.json
            test-results/auth-junit.xml
            test-results/auth-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload auth Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-auth
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload auth test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-auth
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  e2e:
    name: E2E Tests Part ${{ matrix.shard }} of 2
    # The test step gets 30 minutes, with extra job time reserved for artifact upload.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Restore Playwright browsers cache
        id: restore-pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser on cache miss
        if: steps.restore-pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E tests part ${{ matrix.shard }} of 2
        id: e2e-run
        timeout-minutes: 30
        run: npm run test:e2e:static -- --shard=${{ matrix.shard }}/2
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/part-${{ matrix.shard }}-results.json
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/part-${{ matrix.shard }}-junit.xml

      - name: Create concise E2E failure summary part ${{ matrix.shard }}
        if: always()
        run: >-
          node scripts/summarize-playwright-results.mjs
          test-results/part-${{ matrix.shard }}-results.json
          test-results/part-${{ matrix.shard }}-summary.txt

      - name: Upload concise E2E results part ${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-machine-results-part-${{ matrix.shard }}
          path: |
            test-results/part-${{ matrix.shard }}-results.json
            test-results/part-${{ matrix.shard }}-junit.xml
            test-results/part-${{ matrix.shard }}-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report part ${{ matrix.shard }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-part-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test artifacts part ${{ matrix.shard }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-part-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  visual-regression:
    name: Visual Regression Tests
    # The test step gets 30 minutes, with extra job time reserved for artifact upload.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    needs: [setup, e2e]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Restore Playwright browsers cache
        id: restore-pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser on cache miss
        if: steps.restore-pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run visual regression tests
        id: visual-run
        timeout-minutes: 30
        run: npx playwright test --grep @visual
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-e2e-testing-only-min-32-chars

      - name: Upload visual diffs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  browser-verification:
    name: Browser Verification
    runs-on: ubuntu-latest
    needs: [setup, e2e-auth, e2e, visual-regression]
    if: ${{ always() && github.event_name == 'pull_request' }}
    timeout-minutes: 5

    steps:
      - name: Enforce required browser prerequisites
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          AUTH_RESULT: ${{ needs.e2e-auth.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          VISUAL_RESULT: ${{ needs.visual-regression.result }}
        run: |
          failed=()
          for result in \
            "Setup=${SETUP_RESULT}" \
            "E2EAuthFocus=${AUTH_RESULT}" \
            "E2EShards=${E2E_RESULT}" \
            "E2EVisualRegression=${VISUAL_RESULT}"
          do
            if [[ "$result" != *=success ]]; then
              failed+=("$result")
            fi
          done

          if ((${#failed[@]} > 0)); then
            printf '::error::Required browser prerequisites did not succeed: %s\n' "${failed[*]}"
            exit 1
          fi
