name: Temporary Supplier Bot Formatter

on:
  push:
    branches:
      - fix/supplier-bot-repeatable-public-profiles-20260827

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: '0'
      - run: npx prettier --write services/supplierBotIngestion.service.js
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-supplier-bot-ingestion
          path: services/supplierBotIngestion.service.js
          retention-days: 1
