name: Trigger supplier profile commercial polish

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-polish:
    if: github.event.pull_request.head.ref == 'fix/supplier-profile-commercial-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-profile-commercial-polish
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run the branch patch specification
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-supplier-commercial-polish.yml').read_text()
          marker = "          python <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index('\n          PY\n', start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'supplier-commercial-polish', 'exec'))
          PY

      - name: Format changed files
        run: |
          npm ci --ignore-scripts
          npx prettier --write \
            public/supplier.html \
            public/assets/css/supplier-profile-commercial-polish.css \
            tests/unit/supplier-profile-commercial-polish.test.js \
            e2e/supplier-profile-visual-overhaul.spec.js

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add \
            public/supplier.html \
            public/assets/css/supplier-profile-commercial-polish.css \
            tests/unit/supplier-profile-commercial-polish.test.js \
            e2e/supplier-profile-visual-overhaul.spec.js
          git commit -m "Polish supplier profile desktop composition and consent UI"
          git push origin HEAD:fix/supplier-profile-commercial-polish
