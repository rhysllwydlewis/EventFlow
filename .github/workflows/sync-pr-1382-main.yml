name: Sync PR 1382 with main

on:
  push:
    branches:
      - test/repair-all-backend-playwright-quarantine
    paths:
      - '.github/workflows/sync-pr-1382-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: test/repair-all-backend-playwright-quarantine
          fetch-depth: 0

      - name: Merge current main into PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit --no-ff origin/main
          git push origin HEAD:test/repair-all-backend-playwright-quarantine
