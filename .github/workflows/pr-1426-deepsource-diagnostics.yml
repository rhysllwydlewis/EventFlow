name: Diagnose remaining PR 1426 DeepSource gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-1426-deepsource-diagnostics.yml'

permissions:
  contents: write

concurrency:
  group: pr-1426-deepsource-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.pull_request.number == 1426
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/signup-attribution-session-replay
          fetch-depth: 0

      - name: Query DeepSource run
        shell: bash
        run: |
          set +e
          RUN_UID='f260949b-427a-4560-a5c6-e48ad3c8e4ce'
          RUN_URL="https://app.deepsource.com/gh/rhysllwydlewis/EventFlow/run/${RUN_UID}/javascript/"

          echo '=== Dashboard HTTP response ==='
          curl -sS -L -D deepsource-headers.txt -o deepsource-page.html "$RUN_URL"
          CURL_STATUS=$?
          echo "curl status: ${CURL_STATUS}"
          cat deepsource-headers.txt || true
          echo "page bytes: $(wc -c < deepsource-page.html 2>/dev/null || echo 0)"
          grep -Eio 'Documentation Coverage|External Dependencies|threshold|occurrencesIntroduced|issuesCount|metric[^<]{0,100}' deepsource-page.html | head -100 || true
          head -c 2000 deepsource-page.html || true
          echo

          cat > query.json <<'JSON'
          {
            "query": "query RunDiagnostics($runUid: UUID!) { run(runUid: $runUid) { runUid commitOid status summary { occurrencesIntroduced occurrencesResolved occurrencesSuppressed occurrenceDistributionByAnalyzer { analyzerShortcode introduced } } checks(first: 20) { totalCount edges { node { status analyzer { shortcode name } summary { occurrencesIntroduced occurrencesResolved occurrencesSuppressed } issues(first: 100) { totalCount edges { node { path beginLine endLine title shortcode severity category isSuppressed } } } metrics { name shortcode isThresholdEnforced items { key threshold thresholdStatus latestValue latestValueDisplay values(first: 10) { totalCount edges { node { value valueDisplay threshold thresholdStatus commitOid } } } } } } } } } }",
            "variables": {"runUid": "f260949b-427a-4560-a5c6-e48ad3c8e4ce"}
          }
          JSON

          echo '=== GraphQL response without token ==='
          curl -sS -X POST 'https://api.deepsource.com/graphql/' \
            -H 'Content-Type: application/json' \
            --data-binary @query.json \
            -o deepsource-graphql.json
          GRAPHQL_STATUS=$?
          echo "curl status: ${GRAPHQL_STATUS}"
          python -m json.tool deepsource-graphql.json 2>/dev/null || cat deepsource-graphql.json || true

      - name: Remove diagnostic workflow
        if: always()
        run: |
          rm .github/workflows/pr-1426-deepsource-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr-1426-deepsource-diagnostics.yml
          git commit -m 'ci: remove DeepSource diagnostic workflow'
          git push origin HEAD:feat/signup-attribution-session-replay
