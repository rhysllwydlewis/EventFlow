name: SEO synthetic patch helper

on:
  push:
    branches:
      - feature/invisible-technical-seo-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invisible-technical-seo-hardening
          fetch-depth: 0

      - name: Extend the existing scheduled technical SEO audit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/production-synthetic-check.mjs')
          text = path.read_text(encoding='utf-8')

          old = "import path from 'node:path';\n"
          new = "import path from 'node:path';\nimport seoAudit from '../utils/seoAudit.js';\n\nconst { selectAuditEntries, validateIndexableHtml, validateSitemapXml } = seoAudit;\n"
          if old not in text:
              raise SystemExit('Import anchor missing')
          text = text.replace(old, new, 1)

          old = "const commitShaPattern = /^[0-9a-f]{40}$/i;\n"
          new = "const commitShaPattern = /^[0-9a-f]{40}$/i;\nconst technicalSeoAuditLimit = Math.max(1, Number(process.env.SYNTHETIC_SEO_URL_LIMIT || 60));\n"
          if old not in text:
              raise SystemExit('Configuration anchor missing')
          text = text.replace(old, new, 1)

          anchor = "\nconst results = [];\n"
          if anchor not in text:
              raise SystemExit('Results anchor missing')

          functions = r'''

function requiresListingStructuredData(url) {
  try {
    return /^\/(?:supplier|package|events)\//.test(new URL(url).pathname);
  } catch (_error) {
    return false;
  }
}

async function runTechnicalSeoAudit() {
  const sitemapCheck = {
    name: 'sitemap technical SEO contract',
    url: `${canonicalBaseUrl}/sitemap.xml`,
  };
  const sitemapStarted = performance.now();

  try {
    const sitemapResponse = await fetchWithTimeout(sitemapCheck.url, {
      headers: { Accept: 'application/xml,text/xml,text/plain' },
    });
    if (sitemapResponse.status !== 200) {
      return [result(sitemapCheck, sitemapStarted, 'sitemap_http_error')];
    }

    const sitemapXml = await sitemapResponse.text();
    const sitemapContract = validateSitemapXml(sitemapXml, canonicalBaseUrl);
    const sitemapResult = result(
      sitemapCheck,
      sitemapStarted,
      sitemapContract.valid ? 'pass' : 'sitemap_contract_invalid'
    );
    if (!sitemapContract.valid) {
      sitemapResult.details = sitemapContract.issues.slice(0, 20);
      return [sitemapResult];
    }

    const crawlCheck = {
      name: 'sitemap URL indexability crawl',
      url: `${canonicalBaseUrl}/sitemap.xml`,
    };
    const crawlStarted = performance.now();
    const failures = [];
    const entries = selectAuditEntries(sitemapContract.entries, technicalSeoAuditLimit);

    for (const entry of entries) {
      try {
        const response = await fetchWithTimeout(entry.url, {
          redirect: 'follow',
          headers: { Accept: 'text/html,application/xhtml+xml' },
        });
        if (response.status !== 200) {
          failures.push(`${entry.url}: HTTP ${response.status}`);
          continue;
        }
        if (response.url !== entry.url) {
          failures.push(`${entry.url}: redirected to ${response.url}`);
          continue;
        }

        const html = await response.text();
        const contract = validateIndexableHtml({
          html,
          expectedUrl: entry.url,
          headers: response.headers,
          requireStructuredData: requiresListingStructuredData(entry.url),
        });
        if (!contract.valid) {
          failures.push(`${entry.url}: ${contract.issues.join(', ')}`);
        }
      } catch (error) {
        failures.push(
          `${entry.url}: ${error.name === 'AbortError' ? 'timeout' : 'network error'}`
        );
      }
    }

    const crawlResult = result(
      crawlCheck,
      crawlStarted,
      failures.length === 0 ? 'pass' : 'indexability_contract_invalid'
    );
    crawlResult.details = failures.slice(0, 20);
    crawlResult.auditedUrls = entries.length;
    return [sitemapResult, crawlResult];
  } catch (error) {
    return [
      result(
        sitemapCheck,
        sitemapStarted,
        error.name === 'AbortError' ? 'timeout' : 'network_error'
      ),
    ];
  }
}
'''
          text = text.replace(anchor, functions + anchor, 1)

          old = "results.push(...(await runSupplierProfileChecks()));\n"
          new = "results.push(...(await runSupplierProfileChecks()));\nresults.push(...(await runTechnicalSeoAudit()));\n"
          if old not in text:
              raise SystemExit('Execution anchor missing')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/seo-synthetic-patch.yml').unlink()
          PY

      - name: Format and test focused files
        run: |
          npx prettier --write scripts/production-synthetic-check.mjs utils/seoAudit.js tests/unit/seo-audit.test.js tests/unit/sitemap-listings.test.js
          npm test -- --runInBand tests/unit/seo-audit.test.js tests/unit/sitemap-listings.test.js tests/unit/public-listing-seo.test.js tests/integration/public-listing-seo-route.test.js tests/unit/sitemap.test.js tests/unit/sitemap-guides.test.js

      - name: Commit the scheduled audit extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extend scheduled production technical SEO audit [seo-synthetic]"
          git push origin HEAD:feature/invisible-technical-seo-hardening
