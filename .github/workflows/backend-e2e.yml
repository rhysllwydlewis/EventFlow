name: Backend E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'routes/**'
      - 'services/**'
      - 'middleware/**'
      - 'config/**'
      - 'models/**'
      - 'e2e/**'
      # The pages and scripts the journeys drive: a change to them must run the journeys too.
      - 'public/dashboard-*.html'
      - 'public/admin-*.html'
      - 'public/assets/js/**'
      - 'public/assets/css/supplier-dashboard-*.css'
      - 'public/messenger/**'
      - 'server.js'
      - 'store.js'
      - 'db*.js'
      - 'package*.json'
      - 'playwright.config.js'
      - 'scripts/run-backend-e2e.mjs'
      - '.github/workflows/backend-e2e.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  CI: 'true'
  E2E_MODE: full
  NODE_ENV: test
  JWT_SECRET: backend-e2e-secret-for-github-actions-minimum-32-chars
  MONGODB_URI: mongodb://127.0.0.1:27017/eventflow_e2e?replicaSet=rs0
  PLAYWRIGHT_VIDEO: 'off'
  PLAYWRIGHT_TRACE: 'off'

jobs:
  backend-e2e:
    name: Mongo-backed browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Start MongoDB replica set
        # supercharge/mongodb-github-action v1.12.0
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run classified backend journeys
        id: backend-tests
        timeout-minutes: 35
        run: npm run test:e2e:backend -- --project=chromium
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/backend-results.json
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/backend-junit.xml

      - name: Create concise failure summary
        if: always()
        run: node scripts/summarize-playwright-results.mjs test-results/backend-results.json test-results/backend-summary.txt

      - name: Upload backend machine results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-e2e-machine-results
          path: |
            test-results/backend-summary.txt
            test-results/backend-results.json
            test-results/backend-junit.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload bounded backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-e2e-diagnostics
          path: |
            playwright-report
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

  # The supplier dashboard in the other two engines customers use (Safari's, and Firefox). The main
  # job runs every journey in Chromium; this one runs the dashboard, layout/accessibility and
  # messaging journeys in Firefox and WebKit as well.
  dashboard-other-browsers:
    name: Dashboard journeys (Firefox and WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PLAYWRIGHT_ALL_BROWSERS: 'true'
      # Keep a trace of a failing test (page state, console, network): the other engines fail in
      # ways a screenshot alone does not explain.
      PLAYWRIGHT_TRACE: 'retain-on-failure'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Start MongoDB replica set
        # supercharge/mongodb-github-action v1.12.0
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Firefox and WebKit
        # WebKit's system packages are a large download; a slow package mirror once held this step
        # for 45 minutes. Give each attempt a limit and try again (what was fetched is kept).
        timeout-minutes: 35
        run: |
          for attempt in 1 2; do
            if timeout 15m npx playwright install --with-deps firefox webkit; then
              exit 0
            fi
            echo "Browser install attempt $attempt did not finish; trying again."
          done
          exit 1

      - name: Run the dashboard journeys in Firefox and WebKit
        timeout-minutes: 35
        run: >-
          npx playwright test
          e2e/account-menu.spec.js
          e2e/supplier-dashboard-actions.spec.js
          e2e/supplier-dashboard-audit.spec.js
          e2e/supplier-dashboard-conditions.spec.js
          e2e/customer-supplier-live-messages.spec.js
          e2e/admin-packages-page.spec.js
          --project=firefox --project=webkit
          --grep @backend
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/other-browsers-results.json
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/other-browsers-junit.xml

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-other-browsers-diagnostics
          path: |
            playwright-report
            test-results/**/*.png
            test-results/**/trace.zip
          if-no-files-found: warn
          retention-days: 14
