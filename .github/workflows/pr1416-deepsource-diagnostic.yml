name: PR 1416 DeepSource diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/partner-anti-abuse-pr2-reward-integrity

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Wait for DeepSource status
        shell: bash
        run: |
          mkdir -p diagnostic
          for attempt in $(seq 1 90); do
            gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status" > diagnostic/combined-status.json
            state=$(jq -r '.statuses[] | select(.context == "DeepSource: JavaScript") | .state' diagnostic/combined-status.json | head -1)
            target=$(jq -r '.statuses[] | select(.context == "DeepSource: JavaScript") | .target_url' diagnostic/combined-status.json | head -1)
            description=$(jq -r '.statuses[] | select(.context == "DeepSource: JavaScript") | .description' diagnostic/combined-status.json | head -1)
            printf 'attempt=%s state=%s description=%s target=%s\n' "$attempt" "$state" "$description" "$target"
            if [[ -n "$target" && "$target" != "null" && "$state" != "pending" && -n "$state" ]]; then
              break
            fi
            sleep 10
          done
          jq '.statuses[] | select(.context == "DeepSource: JavaScript")' diagnostic/combined-status.json > diagnostic/deepsource-status.json
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs" > diagnostic/check-runs.json

      - name: Capture DeepSource report response
        shell: bash
        run: |
          target=$(jq -r '.target_url' diagnostic/deepsource-status.json)
          printf '%s\n' "$target" > diagnostic/target-url.txt
          curl --fail-with-body --silent --show-error --location --dump-header diagnostic/headers.txt "$target" --output diagnostic/report.html || true
          grep -Eio 'JS-[A-Z0-9-]+|bug-risk|reliability|issue[s]? raised|blocking|metric[s]?|services/[A-Za-z0-9._/-]+\.js' diagnostic/report.html | sort -u > diagnostic/extracted.txt || true
          wc -c diagnostic/report.html diagnostic/headers.txt diagnostic/extracted.txt
          cat diagnostic/deepsource-status.json
          cat diagnostic/extracted.txt

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pr1416-deepsource-diagnostic
          path: diagnostic
          if-no-files-found: error
          retention-days: 1
