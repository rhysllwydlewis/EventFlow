name: Agent Format PR 1410

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/agent-format-pr1410.yml

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --prefer-offline --no-audit

      - name: Apply Prettier 3.9.6 formatting
        run: |
          npx prettier --write \
            docs/features/PEXELS_ADVANCED_FEATURES.md \
            docs/guides/SW_API_CACHING_SECURITY.md \
            docs/security.md \
            public/assets/js/vendor/altcha-widget.js \
            public/assets/vendor/chart.umd.js \
            routes/wedding-websites.js

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-pr1410
          path: |
            docs/features/PEXELS_ADVANCED_FEATURES.md
            docs/guides/SW_API_CACHING_SECURITY.md
            docs/security.md
            public/assets/js/vendor/altcha-widget.js
            public/assets/vendor/chart.umd.js
            routes/wedding-websites.js
          if-no-files-found: error
          retention-days: 2
