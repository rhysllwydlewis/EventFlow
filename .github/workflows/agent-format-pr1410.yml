name: Agent Format PR 1410

on:
  push:
    branches:
      - agent/pr1410-prettier-finalize

permissions:
  contents: write

jobs:
  format-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary finalisation branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr1410-prettier-finalize
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --prefer-offline --no-audit

      - name: Format maintained files and exclude vendor bundles
        run: |
          grep -qxF 'public/assets/js/vendor/altcha-widget.js' .prettierignore || echo 'public/assets/js/vendor/altcha-widget.js' >> .prettierignore
          grep -qxF 'public/assets/vendor/chart.umd.js' .prettierignore || echo 'public/assets/vendor/chart.umd.js' >> .prettierignore
          npx prettier --write \
            docs/features/PEXELS_ADVANCED_FEATURES.md \
            docs/guides/SW_API_CACHING_SECURITY.md \
            docs/security.md \
            routes/wedding-websites.js
          git rm .github/workflows/agent-format-pr1410.yml

      - name: Commit final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .prettierignore \
            docs/features/PEXELS_ADVANCED_FEATURES.md \
            docs/guides/SW_API_CACHING_SECURITY.md \
            docs/security.md \
            routes/wedding-websites.js
          git commit -m "style: align repository with Prettier 3.9.6"
          git push origin HEAD:agent/pr1410-prettier-finalize
