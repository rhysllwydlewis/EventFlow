name: Apply supplier profile commercial polish

on:
  push:
    branches: [fix/supplier-profile-commercial-polish]

permissions:
  contents: write

jobs:
  apply-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-profile-commercial-polish
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply commercial supplier profile polish
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          html_path = Path('public/supplier.html')
          html = html_path.read_text()
          components_link = "  <link rel='stylesheet' href='/assets/css/components.css?v=18.3.0'>\n"
          if components_link not in html:
              html = html.replace(
                  "  <link rel='stylesheet' href='/assets/css/styles.css?v=18.3.0'>\n",
                  "  <link rel='stylesheet' href='/assets/css/styles.css?v=18.3.0'>\n" + components_link,
                  1,
              )
          commercial_link = '  <link rel="stylesheet" href="/assets/css/supplier-profile-commercial-polish.css?v=20.2.0">\n'
          if commercial_link not in html:
              html = html.replace(
                  '  <link rel="stylesheet" href="/assets/css/supplier-profile-v2.css?v=19.2.0">\n',
                  '  <link rel="stylesheet" href="/assets/css/supplier-profile-v2.css?v=19.2.0">\n' + commercial_link,
                  1,
              )
          html_path.write_text(html)

          css = r'''/*
           * Supplier profile commercial polish v20.2.
           * Refines large-screen composition and coordinates global consent/install overlays
           * without changing supplier data, theming or marketplace behaviour.
           */

          body.sp-profile-page .sp-page,
          body.sp-profile-page .hero-content,
          body.sp-profile-page .hero-avatar-wrap {
            width: min(calc(100% - 3rem), 1420px) !important;
            max-width: 1420px !important;
          }

          html[data-sp-hero-mode='preset'],
          html[data-sp-hero-mode='category'],
          html[data-sp-hero-mode='theme'] {
            --sp-hero-height: 146px;
            --sp-hero-height-mobile: 132px;
          }

          body.sp-profile-page .supplier-tagline {
            max-width: 62ch;
            font-size: 1rem !important;
            line-height: 1.55 !important;
          }

          body.sp-profile-page .sp-card,
          body.sp-profile-page .sp-trust-card,
          body.sp-profile-page .sp-details-card,
          body.sp-profile-page .supplier-package-card-v2 {
            border-color: #dfe6eb !important;
          }

          body.sp-profile-page .sp-card {
            box-shadow:
              0 1px 2px rgba(15, 23, 42, 0.04),
              0 8px 22px rgba(15, 23, 42, 0.035) !important;
          }

          body.sp-profile-page #sp-section-about > .sp-card {
            border-color: #e5eaee !important;
            box-shadow: none !important;
          }

          body.sp-profile-page .sp-highlights {
            padding: 1.15rem 1.35rem !important;
            background: #ffffff !important;
            border: 0 !important;
            border-left: 4px solid var(--sp-profile-accent) !important;
            box-shadow: none !important;
          }

          body.sp-profile-page .sp-highlights__grid {
            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
            gap: 0.85rem 1.25rem !important;
          }

          body.sp-profile-page .sp-highlight-item {
            align-items: flex-start !important;
            color: #344054 !important;
            line-height: 1.45 !important;
          }

          body.sp-profile-page .sp-highlight-check {
            flex: 0 0 auto;
            margin-top: 0.05rem;
          }

          body.sp-profile-page .sp-reviews-widget--empty .reviews-empty {
            min-height: 0 !important;
            padding: 1.5rem 1.75rem !important;
            display: grid !important;
            grid-template-columns: auto minmax(0, 1fr) auto;
            grid-template-areas:
              'icon title action'
              'icon message action';
            column-gap: 1rem;
            row-gap: 0.25rem;
            align-items: center;
            text-align: left !important;
          }

          body.sp-profile-page .sp-reviews-widget--empty .empty-icon {
            grid-area: icon;
            margin: 0 !important;
            font-size: 1.5rem !important;
          }

          body.sp-profile-page .sp-reviews-widget--empty .empty-title {
            grid-area: title;
            margin: 0 !important;
            font-size: 1rem !important;
          }

          body.sp-profile-page .sp-reviews-widget--empty .empty-message {
            grid-area: message;
            margin: 0 !important;
            color: #667085 !important;
          }

          body.sp-profile-page .sp-reviews-widget--empty .btn-write-review,
          body.sp-profile-page .sp-reviews-widget--empty .reviews-empty__signin-cta {
            grid-area: action;
            margin: 0 !important;
            white-space: nowrap;
          }

          body.sp-profile-page .footer {
            margin-top: 2rem !important;
          }

          body.sp-profile-page .supplier-footer-content {
            padding-top: 2rem !important;
            padding-bottom: 2rem !important;
          }

          /* Cookie consent is a contained, readable bottom sheet on the supplier page. */
          body.sp-profile-page .cookie-consent-banner {
            position: fixed;
            z-index: 10050;
            left: 50%;
            right: auto;
            bottom: 1rem;
            width: min(1180px, calc(100vw - 2rem));
            max-width: none;
            margin: 0;
            color: #0b1220;
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #d9e2e7;
            border-radius: 16px;
            box-shadow: 0 22px 60px rgba(15, 23, 42, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, 1rem);
            transition:
              opacity 0.2s ease,
              transform 0.2s ease,
              visibility 0.2s ease;
          }

          body.sp-profile-page .cookie-consent-banner.cookie-consent-visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
          }

          body.sp-profile-page .cookie-consent-banner.cookie-consent-hiding {
            opacity: 0;
            transform: translate(-50%, 1rem);
          }

          body.sp-profile-page .cookie-consent-content {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 1rem 1.5rem;
            align-items: end;
            padding: 1rem 1.25rem;
          }

          body.sp-profile-page .cookie-consent-message p {
            margin: 0;
            font-size: 0.875rem;
            line-height: 1.5;
          }

          body.sp-profile-page .cookie-consent-message p + p {
            margin-top: 0.35rem;
          }

          body.sp-profile-page .cookie-consent-links a {
            color: #08776c;
            font-weight: 600;
          }

          body.sp-profile-page .cookie-consent-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.55rem;
          }

          body.sp-profile-page .cookie-consent-btn {
            min-height: 42px;
            padding: 0.6rem 1rem;
            border: 1px solid #cbd5dc;
            border-radius: 10px;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
          }

          body.sp-profile-page .cookie-consent-accept {
            color: #ffffff;
            background: #0b8073;
            border-color: #0b8073;
          }

          body.sp-profile-page .cookie-consent-reject,
          body.sp-profile-page .cookie-consent-manage {
            color: #344054;
            background: #ffffff;
          }

          body.sp-profile-page:has(#cookie-consent-banner) #ef-pwa-install-banner {
            display: none !important;
          }

          body.sp-profile-page:has(#cookie-consent-banner).ef-pwa-banner-visible {
            padding-bottom: 0 !important;
          }

          body.sp-profile-page:has(#cookie-consent-banner).ef-pwa-banner-visible .sp-page {
            padding-bottom: 4rem !important;
          }

          @media (min-width: 1180px) {
            body.sp-profile-page .sp-page-grid {
              grid-template-columns: minmax(0, 1fr) 320px !important;
              gap: 2rem !important;
            }

            body.sp-profile-page .hero-content {
              grid-template-columns: minmax(0, 780px) auto !important;
              justify-content: start !important;
              column-gap: clamp(2rem, 5vw, 6rem) !important;
            }

            body.sp-profile-page .hero-actions {
              justify-self: start;
            }
          }

          @media (max-width: 900px) {
            body.sp-profile-page .sp-highlights__grid {
              grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            }
          }

          @media (max-width: 680px) {
            body.sp-profile-page .sp-page,
            body.sp-profile-page .hero-content,
            body.sp-profile-page .hero-avatar-wrap {
              width: 100% !important;
            }

            body.sp-profile-page .sp-highlights__grid {
              grid-template-columns: 1fr !important;
            }

            body.sp-profile-page .sp-reviews-widget--empty .reviews-empty {
              grid-template-columns: auto minmax(0, 1fr);
              grid-template-areas:
                'icon title'
                'icon message'
                'action action';
              padding: 1.25rem !important;
            }

            body.sp-profile-page .sp-reviews-widget--empty .btn-write-review,
            body.sp-profile-page .sp-reviews-widget--empty .reviews-empty__signin-cta {
              width: 100%;
              margin-top: 0.75rem !important;
            }

            body.sp-profile-page .cookie-consent-banner {
              bottom: 0.5rem;
              width: calc(100vw - 1rem);
              border-radius: 14px;
            }

            body.sp-profile-page .cookie-consent-content {
              grid-template-columns: 1fr;
              align-items: stretch;
              padding: 1rem;
            }

            body.sp-profile-page .cookie-consent-actions {
              display: grid;
              grid-template-columns: 1fr 1fr;
              justify-content: stretch;
            }

            body.sp-profile-page .cookie-consent-manage {
              grid-column: 1 / -1;
            }
          }

          @media (prefers-reduced-motion: reduce) {
            body.sp-profile-page .cookie-consent-banner {
              transition: none;
            }
          }
          '''
          Path('public/assets/css/supplier-profile-commercial-polish.css').write_text(css)

          unit = r'''\'use strict\';

          const fs = require('fs');
          const path = require('path');

          const read = relative => fs.readFileSync(path.join(__dirname, '../..', relative), 'utf8');

          const supplierHtml = read('public/supplier.html');
          const css = read('public/assets/css/supplier-profile-commercial-polish.css');

          describe('supplier profile commercial polish contracts', () => {
            test('loads the shared component styles and final supplier polish layer', () => {
              expect(supplierHtml).toContain('/assets/css/components.css?v=18.3.0');
              expect(supplierHtml).toContain('/assets/css/supplier-profile-commercial-polish.css?v=20.2.0');
            });

            test('widens desktop composition and reduces decorative fallback heroes', () => {
              expect(css).toContain('1420px');
              expect(css).toContain('--sp-hero-height: 146px');
              expect(css).toContain('grid-template-columns: repeat(3, minmax(0, 1fr))');
            });

            test('coordinates cookie consent and the PWA install prompt', () => {
              expect(css).toContain('.cookie-consent-banner.cookie-consent-visible');
              expect(css).toContain(':has(#cookie-consent-banner) #ef-pwa-install-banner');
            });

            test('compacts the empty review experience', () => {
              expect(css).toContain("grid-template-areas:\n    'icon title action'");
              expect(css).toContain('.sp-reviews-widget--empty .reviews-empty');
            });
          });
          '''
          Path('tests/unit/supplier-profile-commercial-polish.test.js').write_text(unit)

          e2e_path = Path('e2e/supplier-profile-visual-overhaul.spec.js')
          e2e = e2e_path.read_text()
          marker = '\n});\n'
          test_block = r'''

            test('uses a wider commercial desktop composition with balanced highlights and reviews', async ({
              page,
            }) => {
              await page.setViewportSize({ width: 1720, height: 1100 });
              await openProfile(
                page,
                makeSupplier({
                  heroPreset: 'midnight',
                  highlights: [
                    '500+ five-star reviews',
                    'Hundreds of corporate events hosted',
                    'Audiences of up to 1,400',
                    'Live, virtual and hybrid experience',
                    'Trusted by global organisations',
                  ],
                })
              );

              await expect(page.locator('#reviews-widget')).toHaveClass(/sp-reviews-widget--empty/);

              const result = await page.evaluate(() => {
                const shell = document.querySelector('.sp-page').getBoundingClientRect();
                const hero = document.querySelector('.hero-media').getBoundingClientRect();
                const highlights = getComputedStyle(document.querySelector('.sp-highlights__grid'));
                const emptyReviews = document.querySelector('.reviews-empty').getBoundingClientRect();
                return {
                  pageWidth: shell.width,
                  heroHeight: hero.height,
                  highlightColumns: highlights.gridTemplateColumns.split(' ').filter(Boolean).length,
                  emptyReviewHeight: emptyReviews.height,
                };
              });

              expect(result.pageWidth).toBeGreaterThanOrEqual(1380);
              expect(result.heroHeight).toBeLessThanOrEqual(160);
              expect(result.highlightColumns).toBe(3);
              expect(result.emptyReviewHeight).toBeLessThanOrEqual(260);
            });
          '''
          if 'uses a wider commercial desktop composition' not in e2e:
              pos = e2e.rfind(marker)
              if pos == -1:
                  raise SystemExit('Could not find Playwright describe terminator')
              e2e = e2e[:pos] + test_block + e2e[pos:]
              e2e_path.write_text(e2e)
          PY

      - name: Format changed files
        run: |
          npm ci --ignore-scripts
          npx prettier --write \
            public/supplier.html \
            public/assets/css/supplier-profile-commercial-polish.css \
            tests/unit/supplier-profile-commercial-polish.test.js \
            e2e/supplier-profile-visual-overhaul.spec.js

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add \
            public/supplier.html \
            public/assets/css/supplier-profile-commercial-polish.css \
            tests/unit/supplier-profile-commercial-polish.test.js \
            e2e/supplier-profile-visual-overhaul.spec.js
          git commit -m "Polish supplier profile desktop composition and consent UI"
          git push origin HEAD:fix/supplier-profile-commercial-polish
