name: PR 1417 visible final repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr1417-final-reliability-repair
  cancel-in-progress: true

jobs:
  apply-test-and-commit:
    if: github.event.pull_request.head.ref == 'agent/partner-anti-abuse-pr3-cashout-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr3-cashout-ops
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0

      - name: Apply final fixes
        run: python .github/scripts/pr1417_final_fix.py

      - name: Format repaired files
        run: |
          npx prettier --write \
            services/partnerCashoutOperationsRuntime.js \
            services/partnerCashoutOperationsService.js \
            middleware/partnerReferralCampaignCapture.js \
            services/partnerCashoutOperationLockService.js \
            tests/unit/partner-cashout-operations-runtime.test.js \
            tests/unit/partner-anti-abuse-startup.test.js \
            tests/unit/partner-cashout-operation-lock.test.js

      - name: Run targeted regression suites
        run: |
          npx jest --runInBand --coverage=false \
            tests/unit/partner-cashout-operations-runtime.test.js \
            tests/unit/partner-anti-abuse-startup.test.js \
            tests/unit/partner-cashout-operation-lock.test.js

      - name: Run static checks
        run: |
          npx eslint \
            services/partnerCashoutOperationsRuntime.js \
            services/partnerCashoutOperationsService.js \
            middleware/partnerReferralCampaignCapture.js \
            services/partnerCashoutOperationLockService.js \
            tests/unit/partner-cashout-operations-runtime.test.js \
            tests/unit/partner-anti-abuse-startup.test.js \
            tests/unit/partner-cashout-operation-lock.test.js
          npx prettier --check \
            services/partnerCashoutOperationsRuntime.js \
            services/partnerCashoutOperationsService.js \
            middleware/partnerReferralCampaignCapture.js \
            services/partnerCashoutOperationLockService.js \
            tests/unit/partner-cashout-operations-runtime.test.js \
            tests/unit/partner-anti-abuse-startup.test.js \
            tests/unit/partner-cashout-operation-lock.test.js

      - name: Commit verified fixes
        run: |
          rm -f .github/scripts/pr1417_final_fix.py
          rm -f .github/workflows/pr1417-apply-final-fixes.yml
          rm -f .github/workflows/pr1417-deepsource-final-diagnostic.yml
          rm -f .github/workflows/pr1417-visible-final-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(partner): close cashout replay and lock reliability gaps"
          git push origin HEAD:agent/partner-anti-abuse-pr3-cashout-ops
