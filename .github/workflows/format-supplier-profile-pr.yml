name: Format supplier profile PR

on:
  push:
    branches:
      - feat/supplier-profile-polish

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/supplier-profile-polish
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Format changed JavaScript
        run: >-
          npx prettier --write
          public/assets/js/supplier-profile-polish.js
          tests/unit/supplier-profile-polish.test.js

      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/format-supplier-profile-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/supplier-profile-polish.js tests/unit/supplier-profile-polish.test.js
          git commit -m "style: format supplier profile polish"
          git push origin HEAD:feat/supplier-profile-polish
