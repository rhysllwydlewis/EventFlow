name: PR 1416 format repaired services

on:
  push:
    branches:
      - agent/partner-anti-abuse-pr2-reward-integrity

permissions:
  contents: write

concurrency:
  group: pr1416-format-repair
  cancel-in-progress: false

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr2-reward-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0
      - name: Format repaired services
        run: |
          npx prettier --write \
            services/partnerRewardIntegrityClawbackService.js \
            services/partnerRewardIntegrityRuntime.js
          npx prettier --check \
            services/partnerRewardIntegrityClawbackService.js \
            services/partnerRewardIntegrityRuntime.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/partnerRewardIntegrityClawbackService.js services/partnerRewardIntegrityRuntime.js
          if git diff --cached --quiet; then
            echo "Files already formatted."
            exit 0
          fi
          git commit -m "style(partner): format reward integrity repairs"
          git push origin HEAD:agent/partner-anti-abuse-pr2-reward-integrity
