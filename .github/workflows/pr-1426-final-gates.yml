name: Apply PR 1426 final gate fixes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-1426-final-gates.yml'

permissions:
  contents: write

concurrency:
  group: pr-1426-final-gates
  cancel-in-progress: false

jobs:
  apply-fixes:
    if: github.event.pull_request.number == 1426
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/signup-attribution-session-replay
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Update patched dependency and source contract
        run: |
          node <<'NODE'
          const fs = require('fs');

          const packagePath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          if (packageJson.overrides?.['fast-uri'] !== '^3.1.4') {
            throw new Error(`Unexpected fast-uri override: ${packageJson.overrides?.['fast-uri']}`);
          }
          packageJson.overrides['fast-uri'] = '^3.1.5';
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);

          const testPath = 'tests/unit/behaviour-analytics-integration.test.js';
          let testSource = fs.readFileSync(testPath, 'utf8');
          const previousAssertion = "expect(bridgeSource).toContain('event.persisted !== true');";
          const updatedAssertion = "expect(bridgeSource).toContain('event?.persisted !== true');";
          if (!testSource.includes(previousAssertion)) {
            throw new Error('Expected page-show assertion was not found');
          }
          testSource = testSource.replace(previousAssertion, updatedAssertion);
          fs.writeFileSync(testPath, testSource);
          NODE

      - name: Regenerate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit
        env:
          HUSKY: '0'

      - name: Install corrected tree
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: '0'

      - name: Verify final gate fixes
        run: |
          npm run check:lockfile
          npx prettier --write package.json package-lock.json tests/unit/behaviour-analytics-integration.test.js
          npx prettier --check package.json package-lock.json tests/unit/behaviour-analytics-integration.test.js
          npx jest tests/unit/behaviour-analytics-integration.test.js \
            --testNamePattern='analytics consent and privacy wiring' \
            --runInBand --coverage=false
          npm run audit
        env:
          HUSKY: '0'
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-testing-only-min-32-chars

      - name: Remove helper workflow and commit
        run: |
          rm .github/workflows/pr-1426-final-gates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            package.json \
            package-lock.json \
            tests/unit/behaviour-analytics-integration.test.js \
            .github/workflows/pr-1426-final-gates.yml
          git commit -m 'fix: clear final analytics and dependency gates'
          git push origin HEAD:feat/signup-attribution-session-replay
