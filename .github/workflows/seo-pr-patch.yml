name: SEO PR patch helper

on:
  push:
    branches:
      - feature/invisible-technical-seo-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invisible-technical-seo-hardening
          fetch-depth: 0

      - name: Apply focused SEO patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = Path(path).read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block missing in {path}: {old[:80]!r}')
              Path(path).write_text(text.replace(old, new, 1), encoding='utf-8')

          service = 'services/publicListingSeo.service.js'
          replace_once(
              service,
              "function buildPublicPackageSlug(pkg) {\n  const storedSlug = slugify(pkg?.slug);\n  if (storedSlug) return storedSlug;\n  const id = String(pkg?.id || pkg?.packageId || '').trim();\n  if (!id) return '';\n  const title = slugify(packageTitle(pkg));\n  return title ? `${title}-${stableToken(id)}` : id;\n}",
              "function buildPublicPackageSlug(pkg) {\n  const storedSlug = slugify(pkg?.slug);\n  if (storedSlug) return storedSlug;\n  const id = String(pkg?.id || pkg?.packageId || '').trim();\n  return slugify(id);\n}",
          )
          replace_once(
              service,
              "function buildCampaignQuery(input = {}) {",
              "function safeDecodeURIComponent(value) {\n  try {\n    return decodeURIComponent(String(value || ''));\n  } catch (_error) {\n    return '';\n  }\n}\n\nfunction buildCampaignQuery(input = {}) {",
          )
          text = Path(service).read_text(encoding='utf-8')
          expected = "const raw = decodeURIComponent(String(value || '')).trim();"
          if text.count(expected) != 2:
              raise SystemExit(f'Expected two decode blocks, found {text.count(expected)}')
          text = text.replace(expected, "const raw = safeDecodeURIComponent(value).trim();")
          text = text.replace(
              "`  <meta property=\"og:type\" content=\"${kind === 'event' ? 'website' : 'product'}\">`,",
              "'  <meta property=\"og:type\" content=\"website\">',",
          )
          Path(service).write_text(text, encoding='utf-8')

          router = 'routes/public-listing-seo.js'
          replace_once(
              router,
              "      if (!pkg) {\n        noindex(res);\n        return next();\n      }",
              "      if (!pkg) {\n        noindex(res);\n        return res.status(404).send('Package not found');\n      }",
          )
          replace_once(
              router,
              "      if (!supplier) {\n        noindex(res);\n        return next();\n      }",
              "      if (!supplier) {\n        noindex(res);\n        return res.status(404).send('Package not found');\n      }",
          )
          replace_once(
              router,
              "      if (!event) {\n        noindex(res);\n        return next();\n      }",
              "      if (!event) {\n        noindex(res);\n        return res.status(404).send('Event not found');\n      }",
          )

          event_js = 'public/assets/js/pages/event-detail-init.js'
          replace_once(
              event_js,
              "    document.getElementById('event-title').textContent = event.title;\n    setMeta('description',",
              "    document.getElementById('event-title').textContent = event.title;\n    if (document.querySelector('meta[name=\"ef-server-seo\"][content=\"event\"]')) {\n      return;\n    }\n    setMeta('description',",
          )
          replace_once(
              event_js,
              '${image ? `<img class="event-image" src="${esc(image)}" alt="">` :',
              '${image ? `<img class="event-image" src="${esc(image)}" alt="${esc(event.title + \' event image\')}" loading="eager" decoding="async">` :',
          )

          test = 'tests/unit/public-listing-seo.test.js'
          replace_once(
              test,
              "expect(buildPublicPackageSlug(legacyPackage)).toMatch(/^evening-package-[a-f0-9]{8}$/);",
              "expect(buildPublicPackageSlug(legacyPackage)).toBe('pkg-1');",
          )

          Path('.github/workflows/seo-pr-patch.yml').unlink()
          PY

      - name: Format changed files
        run: npx prettier --write services/publicListingSeo.service.js routes/public-listing-seo.js public/assets/js/pages/event-detail-init.js tests/unit/public-listing-seo.test.js

      - name: Commit focused patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden canonical listing routes and image metadata [seo-patch]"
          git push origin HEAD:feature/invisible-technical-seo-hardening
