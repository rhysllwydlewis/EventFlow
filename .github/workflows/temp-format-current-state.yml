name: Temporary Format Current-State Changes

on:
  push:
    branches: [agent/current-state-security-monitoring-hardening]

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/current-state-security-monitoring-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci --prefer-offline --no-audit

      - name: Apply repository formatting
        run: |
          npx prettier --write \
            docs/security/SECURITY_ALERT_TRIAGE.md \
            e2e/start-wizard-journey.spec.js \
            tests/unit/homepage-stabilisation.test.js

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting is already current."
            exit 0
          fi
          git config user.name "eventflow-hardening-bot"
          git config user.email "eventflow-hardening-bot@users.noreply.github.com"
          git add docs/security/SECURITY_ALERT_TRIAGE.md e2e/start-wizard-journey.spec.js tests/unit/homepage-stabilisation.test.js
          git commit -m "Format current-state hardening changes"
          git pull --rebase origin agent/current-state-security-monitoring-hardening
          git push origin HEAD:agent/current-state-security-monitoring-hardening
