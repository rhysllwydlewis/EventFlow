name: Partner Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  format-partner-hardening:
    name: Format partner hardening files
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Apply canonical Prettier formatting
        run: |
          npx prettier --write \
            db-init.js \
            routes/admin-cashout-requests.js \
            services/partnerAntiAbuseService.js \
            services/paymentService.js \
            tests/integration/admin-cashout-corrupt-state.test.js \
            tests/integration/admin-cashout-requests-runtime.test.js \
            tests/unit/partner-anti-abuse-edge-cases.test.js \
            tests/unit/partner-anti-abuse.test.js \
            tests/unit/partner-payout-validation.test.js \
            tests/unit/partner-reward-clawback-edge-cases.test.js \
            tests/unit/partner-reward-clawback.test.js \
            tests/unit/payment-partner-clawback.test.js
          git diff --check

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            db-init.js \
            routes/admin-cashout-requests.js \
            services/partnerAntiAbuseService.js \
            services/paymentService.js \
            tests/integration/admin-cashout-corrupt-state.test.js \
            tests/integration/admin-cashout-requests-runtime.test.js \
            tests/unit/partner-anti-abuse-edge-cases.test.js \
            tests/unit/partner-anti-abuse.test.js \
            tests/unit/partner-payout-validation.test.js \
            tests/unit/partner-reward-clawback-edge-cases.test.js \
            tests/unit/partner-reward-clawback.test.js \
            tests/unit/payment-partner-clawback.test.js
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style: format partner hardening changes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
