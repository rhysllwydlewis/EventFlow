name: Temporary Homepage Bundle Refresh

on:
  push:
    branches: [agent/clean-install-ci-baseline]
    paths:
      - '.github/workflows/temporary-homepage-bundle-refresh.yml'
      - 'scripts/trigger-homepage-bundle-refresh.txt'

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/clean-install-ci-baseline
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Rebuild and format homepage bundles
        run: npm run build:homepages

      - name: Verify homepage TypeScript
        run: npm run typecheck:homepages

      - name: Commit generated bundles
        run: |
          if git diff --quiet -- public/assets/js/pages/home-v2.js public/assets/js/pages/home-v3.js public/assets/js/pages/home-v3-video.js; then
            echo "Homepage bundles are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/pages/home-v2.js public/assets/js/pages/home-v3.js public/assets/js/pages/home-v3-video.js
          git commit -m "Regenerate formatted homepage bundles"
          git push origin HEAD:agent/clean-install-ci-baseline
