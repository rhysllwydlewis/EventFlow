name: PR 1417 verified repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr1417-verified-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/partner-anti-abuse-pr3-cashout-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr3-cashout-ops
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0

      - name: Repair native-dialog regression
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('public/assets/js/pages/admin-cashout-requests-init.js')
          source = path.read_text()
          old = """    if (status === 'rejected' && !window.confirm('Mark this partner cashout identity review as rejected?')) {
      return;
    }
"""
          if old in source:
              path.write_text(source.replace(old, '', 1))
          PY

      - name: Format files reported by CI
        run: |
          npx prettier --write \
            docs/PARTNER_ANTI_ABUSE_PR3.md \
            middleware/partnerReferralCampaignCapture.js \
            public/assets/js/pages/admin-cashout-requests-init.js \
            services/partnerCashoutAdminEnrichmentRuntime.js \
            services/partnerCashoutLockRuntime.js \
            services/partnerCashoutOperationLockService.js \
            services/partnerCashoutOperationsIndexService.js \
            services/partnerCashoutOperationsRuntime.js \
            services/partnerCashoutOperationsService.js \
            services/partnerCashoutStrictStore.js \
            tests/unit/partner-anti-abuse-startup.test.js \
            tests/unit/partner-cashout-admin-ui.test.js \
            tests/unit/partner-cashout-operation-lock.test.js \
            tests/unit/partner-cashout-operations-runtime.test.js \
            tests/unit/partner-cashout-operations.test.js \
            tests/unit/partner-cashout-runtime-order.test.js \
            tests/unit/partner-cashout-strict-store.test.js

      - name: Verify repair
        run: |
          npx jest \
            tests/unit/admin-allowlist.test.js \
            tests/unit/partner-cashout-admin-ui.test.js \
            --runInBand --coverage=false
          npx prettier --check \
            docs/PARTNER_ANTI_ABUSE_PR3.md \
            middleware/partnerReferralCampaignCapture.js \
            public/assets/js/pages/admin-cashout-requests-init.js \
            services/partnerCashoutAdminEnrichmentRuntime.js \
            services/partnerCashoutLockRuntime.js \
            services/partnerCashoutOperationLockService.js \
            services/partnerCashoutOperationsIndexService.js \
            services/partnerCashoutOperationsRuntime.js \
            services/partnerCashoutOperationsService.js \
            services/partnerCashoutStrictStore.js \
            tests/unit/partner-anti-abuse-startup.test.js \
            tests/unit/partner-cashout-admin-ui.test.js \
            tests/unit/partner-cashout-operation-lock.test.js \
            tests/unit/partner-cashout-operations-runtime.test.js \
            tests/unit/partner-cashout-operations.test.js \
            tests/unit/partner-cashout-runtime-order.test.js \
            tests/unit/partner-cashout-strict-store.test.js

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/PARTNER_ANTI_ABUSE_PR3.md \
            middleware/partnerReferralCampaignCapture.js \
            public/assets/js/pages/admin-cashout-requests-init.js \
            services/partnerCashoutAdminEnrichmentRuntime.js \
            services/partnerCashoutLockRuntime.js \
            services/partnerCashoutOperationLockService.js \
            services/partnerCashoutOperationsIndexService.js \
            services/partnerCashoutOperationsRuntime.js \
            services/partnerCashoutOperationsService.js \
            services/partnerCashoutStrictStore.js \
            tests/unit/partner-anti-abuse-startup.test.js \
            tests/unit/partner-cashout-admin-ui.test.js \
            tests/unit/partner-cashout-operation-lock.test.js \
            tests/unit/partner-cashout-operations-runtime.test.js \
            tests/unit/partner-cashout-operations.test.js \
            tests/unit/partner-cashout-runtime-order.test.js \
            tests/unit/partner-cashout-strict-store.test.js
          if git diff --cached --quiet; then
            echo "No repair changes remain."
            exit 0
          fi
          git commit -m "fix(partner): repair PR 1417 regression and formatting failures"
          git push origin HEAD:agent/partner-anti-abuse-pr3-cashout-ops
