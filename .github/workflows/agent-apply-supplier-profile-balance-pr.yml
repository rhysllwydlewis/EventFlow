name: Apply supplier profile balance patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-product-patch:
    if: github.event.pull_request.head.ref == 'agent/supplier-profile-header-layout-balance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-header-layout-balance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Execute the reviewed patch payload
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/agent-supplier-profile-balance.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format changed files with repository tooling"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          payload = textwrap.dedent(workflow[start:end])
          exec(compile(payload, 'supplier-profile-balance-patch', 'exec'), {'__name__': '__main__'})
          PY

      - name: Format changed files with repository tooling
        run: |
          npm ci --ignore-scripts
          npx prettier --write \
            public/assets/css/supplier-profile-theme.css \
            public/assets/js/supplier-profile-polish.js \
            tests/unit/supplier-profile-layout-balance.test.js \
            e2e/supplier-profile-visual-overhaul.spec.js

      - name: Commit the product changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/assets/css/supplier-profile-theme.css \
            public/assets/js/supplier-profile-polish.js \
            tests/unit/supplier-profile-layout-balance.test.js \
            e2e/supplier-profile-visual-overhaul.spec.js
          git commit -m "Refine supplier profile header and contact hierarchy [agent-balance-applied]"
          git push origin HEAD:agent/supplier-profile-header-layout-balance
