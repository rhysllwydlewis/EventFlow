name: Format Admin Debug mobile fixes

on:
  push:
    branches:
      - agent/admin-debug-mobile-mop-up

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-debug-mobile-mop-up
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatting
        run: |
          npx prettier --write \
            public/assets/css/admin-debug-mobile-improvements.css \
            public/assets/js/pages/admin-debug-mobile-improvements.js \
            tests/unit/admin-debug-mobile-improvements.test.js
          rm .github/workflows/temp-format-admin-debug-mobile.yml
          git diff --check

      - name: Commit formatted fixes and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/assets/css/admin-debug-mobile-improvements.css \
            public/assets/js/pages/admin-debug-mobile-improvements.js \
            tests/unit/admin-debug-mobile-improvements.test.js \
            .github/workflows/temp-format-admin-debug-mobile.yml
          git commit -m 'Format Admin Debug mobile resilience fixes'
          git push origin HEAD:agent/admin-debug-mobile-mop-up
