name: PR 1417 remaining DeepSource fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr1417-remaining-deepsource-fix
  cancel-in-progress: true

jobs:
  apply-test-and-commit:
    if: github.event.pull_request.head.ref == 'agent/partner-anti-abuse-pr3-cashout-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr3-cashout-ops
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0

      - name: Apply remaining DeepSource fixes
        run: python .github/scripts/pr1417_deepsource_second_fix.py

      - name: Format changed files
        run: |
          npx prettier --write \
            services/partnerCashoutStrictStore.js \
            services/partnerCashoutOperationsService.js

      - name: Run focused cashout regression suites
        run: |
          npx jest --runInBand --coverage=false \
            tests/unit/partner-cashout-operations.test.js \
            tests/unit/partner-cashout-operations-edge-coverage.test.js \
            tests/unit/partner-cashout-strict-store.test.js \
            tests/unit/partner-cashout-strict-store-edge-coverage.test.js \
            tests/unit/partner-cashout-operations-runtime.test.js

      - name: Run static checks
        run: |
          npx eslint \
            services/partnerCashoutStrictStore.js \
            services/partnerCashoutOperationsService.js
          npx prettier --check \
            services/partnerCashoutStrictStore.js \
            services/partnerCashoutOperationsService.js

      - name: Commit verified fixes
        run: |
          rm -f .github/scripts/pr1417_deepsource_second_fix.py
          rm -f .github/workflows/pr1417-deepsource-rerun-diagnostic.yml
          rm -f .github/workflows/pr1417-remaining-deepsource-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(partner): simplify cashout reconciliation analysis"
          git push origin HEAD:agent/partner-anti-abuse-pr3-cashout-ops
