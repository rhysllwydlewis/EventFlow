name: Format ranking sources

on:
  pull_request:
    paths:
      - services/rankedSupplierSearch.service.js
      - services/supplierRanking.service.js
      - tests/unit/supplierRanking.service.test.js
      - .github/workflows/format-ranking-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supplier-ranking-v1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0
      - run: >-
          npx prettier --write
          services/rankedSupplierSearch.service.js
          services/supplierRanking.service.js
          tests/unit/supplierRanking.service.test.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/rankedSupplierSearch.service.js services/supplierRanking.service.js tests/unit/supplierRanking.service.test.js
          git commit -m "style: format supplier ranking sources"
          git push origin HEAD:feat/supplier-ranking-v1
