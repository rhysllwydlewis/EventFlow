name: Prepare Review Request Operations PR

on:
  push:
    branches: [agent/review-request-operations]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Apply review request operations changes
        env:
          PATCH_SCRIPT_GZIP_BASE64: 
        run: |
          printf '%s' "$PATCH_SCRIPT_GZIP_BASE64" | base64 -d | gzip -d > /tmp/apply-review-request-operations.py
          python /tmp/apply-review-request-operations.py

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Format changed JavaScript
        run: |
          npx prettier --write \
            utils/reviewRequestOperations.js \
            routes/review-requests.js \
            routes/admin-email-centre.js \
            public/assets/js/dashboard-supplier-overhaul.js \
            public/assets/js/pages/admin-emails-init.js \
            tests/integration/supplier-review-request-delivery.test.js \
            tests/unit/review-request-operations.test.js \
            tests/unit/admin-review-request-operations-route.test.js \
            tests/unit/supplier-review-request-client.test.js \
            tests/unit/admin-review-request-client.test.js

      - name: Run focused tests
        run: |
          npm test -- --runInBand --coverage=false \
            tests/integration/supplier-review-request-delivery.test.js \
            tests/unit/review-request-operations.test.js \
            tests/unit/admin-review-request-operations-route.test.js \
            tests/unit/supplier-review-request-client.test.js \
            tests/unit/admin-review-request-client.test.js
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-review-request-operations-min-32-chars

      - name: Lint changed JavaScript
        run: |
          npx eslint \
            utils/reviewRequestOperations.js \
            routes/review-requests.js \
            routes/admin-email-centre.js \
            public/assets/js/dashboard-supplier-overhaul.js \
            public/assets/js/pages/admin-emails-init.js \
            tests/integration/supplier-review-request-delivery.test.js \
            tests/unit/review-request-operations.test.js \
            tests/unit/admin-review-request-operations-route.test.js \
            tests/unit/supplier-review-request-client.test.js \
            tests/unit/admin-review-request-client.test.js \
            --rulesdir eslint-rules

      - name: Capture patch and validation
        if: always()
        run: |
          git diff --check
          git diff --stat > review-request-operations-validation.txt
          git diff -- . > review-request-operations.patch

      - name: Upload reviewed changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-request-operations-changes
          path: |
            utils/reviewRequestOperations.js
            routes/review-requests.js
            routes/admin-email-centre.js
            public/assets/js/dashboard-supplier-overhaul.js
            public/assets/css/dashboard-overhaul.css
            public/dashboard-supplier.html
            public/admin-emails.html
            public/assets/js/pages/admin-emails-init.js
            public/assets/css/admin-emails.css
            tests/integration/supplier-review-request-delivery.test.js
            tests/unit/review-request-operations.test.js
            tests/unit/admin-review-request-operations-route.test.js
            tests/unit/supplier-review-request-client.test.js
            tests/unit/admin-review-request-client.test.js
            review-request-operations.patch
            review-request-operations-validation.txt
          if-no-files-found: error
          retention-days: 1
