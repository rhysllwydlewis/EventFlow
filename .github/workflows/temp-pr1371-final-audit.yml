name: Temporary PR 1371 Final Audit

on:
  push:
    branches: [agent/current-state-security-monitoring-hardening]

permissions:
  contents: write

env:
  HUSKY: '0'
  NODE_ENV: test
  JWT_SECRET: temporary-pr1371-final-audit-secret-minimum-32-characters

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/current-state-security-monitoring-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm run check:lockfile
      - run: npm ci --prefer-offline --no-audit

      - name: Apply final audit fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, description):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Unable to locate {description} in {path}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/security-alert-inventory.yml')
          text = workflow.read_text(encoding='utf-8')
          if 'SECURITY_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}' not in text:
              text = text.replace(
                  "    timeout-minutes: 15\n\n    steps:\n",
                  "    timeout-minutes: 15\n    env:\n      SECURITY_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}\n\n    steps:\n",
                  1,
              )
          text = text.replace(
              "            fs.mkdirSync(outputDir, { recursive: true });\n\n            async function list(source, route) {\n              try {\n                const alerts = await github.paginate(`GET ${route}`, {\n                  owner,\n                  repo,\n                  state: 'open',\n                  per_page: 100,\n                });\n                return { source, alerts, error: null };\n              } catch (error) {\n                return {\n                  source,\n                  alerts: [],\n                  error: {\n                    status: Number(error.status || 0) || null,\n                    message: 'GitHub did not permit this alert source to be read by the workflow token.',\n                  },\n                };\n              }\n            }\n",
              "            fs.mkdirSync(outputDir, { recursive: true });\n            const alertToken = String(process.env.SECURITY_ALERTS_TOKEN || '').trim();\n            if (alertToken) core.setSecret(alertToken);\n\n            async function list(source, route) {\n              if (!alertToken) {\n                return {\n                  source,\n                  alerts: [],\n                  error: {\n                    status: null,\n                    code: 'token_missing',\n                    message: 'SECURITY_ALERTS_TOKEN is not configured.',\n                  },\n                };\n              }\n\n              try {\n                const alerts = await github.paginate(`GET ${route}`, {\n                  owner,\n                  repo,\n                  state: 'open',\n                  per_page: 100,\n                  headers: {\n                    accept: 'application/vnd.github+json',\n                    authorization: `Bearer ${alertToken}`,\n                    'X-GitHub-Api-Version': '2022-11-28',\n                  },\n                });\n                return { source, alerts, error: null };\n              } catch (error) {\n                const status = Number(error.status || 0) || null;\n                return {\n                  source,\n                  alerts: [],\n                  error: {\n                    status,\n                    code: status ? `http_${status}` : 'request_failed',\n                    message: 'The dedicated alert credential could not read this source.',\n                  },\n                };\n              }\n            }\n",
              1,
          )
          text = text.replace(
              "              repository: `${owner}/${repo}`,\n              complete: sourceErrors.length === 0,\n",
              "              repository: `${owner}/${repo}`,\n              tokenConfigured: Boolean(alertToken),\n              complete: sourceErrors.length === 0,\n",
              1,
          )
          text = text.replace(
              "              `Complete: ${sanitised.complete ? 'yes' : 'no'}`,\n",
              "              `Complete: ${sanitised.complete ? 'yes' : 'no'}`,\n              `Dedicated alert credential configured: ${sanitised.tokenConfigured ? 'yes' : 'no'}`,\n",
              1,
          )
          text = text.replace(
              "                    ...sourceErrors.map(error => `- ${error.source}: HTTP ${error.status || 'unknown'}`),\n",
              "                    ...sourceErrors.map(\n                      error => `- ${error.source}: ${error.code || `HTTP ${error.status || 'unknown'}`}`\n                    ),\n",
              1,
          )
          text = text.replace(
              "                    'The issue remains open until every source can be read. A missing permission is never interpreted as zero alerts.',\n",
              "                    'The issue remains open until every source can be read. Configure SECURITY_ALERTS_TOKEN with read access to Code scanning alerts, Secret scanning alerts and Dependabot alerts. A missing credential or permission is never interpreted as zero alerts.',\n",
              1,
          )
          workflow.write_text(text, encoding='utf-8')

          replace_required(
              'middleware/security.js',
              "    const parsed = new URL(configured);\n    if (parsed.protocol !== 'https:') return null;\n    return parsed.origin;",
              "    const parsed = new URL(configured);\n    const parsedOrigin = parsed.origin;\n    if (parsed.protocol !== 'https:' || !PRODUCTION_APP_ORIGINS.includes(parsedOrigin)) {\n      return null;\n    }\n    return parsedOrigin;",
              'canonical origin validation',
          )

          tests = Path('tests/unit/canonical-host-redirect.test.js')
          text = tests.read_text(encoding='utf-8')
          marker = "  test('honours an explicitly configured www canonical origin', () => {"
          if "canonical configuration points outside approved production hosts" not in text:
              test_block = """  test('fails open when canonical configuration points outside approved production hosts', () => {
    process.env.CANONICAL_BASE_URL = 'https://attacker.example/redirect';
    process.env.BASE_URL = '';
    const req = requestDouble({ host: 'www.event-flow.co.uk', secure: true });
    const res = responseDouble();
    const next = jest.fn();

    configureHTTPSRedirect(true)(req, res, next);

    expect(next).toHaveBeenCalledTimes(1);
    expect(res.redirect).not.toHaveBeenCalled();
  });

"""
              if marker not in text:
                  raise SystemExit('Unable to locate canonical test insertion point')
              text = text.replace(marker, test_block + marker, 1)
              tests.write_text(text, encoding='utf-8')

          contracts = Path('tests/unit/current-state-hardening.test.js')
          text = contracts.read_text(encoding='utf-8')
          old = """    expect(workflow).toMatch(/security-events: read/);
    expect(workflow).toMatch(/secret_type_display_name/);
    expect(workflow).not.toMatch(/alert\\.secret\\b/);
    expect(workflow).toMatch(/never includes a secret value/);
"""
          new = """    expect(workflow).toMatch(/security-events: read/);
    expect(workflow).toContain(
      'SECURITY_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}'
    );
    expect(workflow).toContain('authorization: `Bearer ${alertToken}`');
    expect(workflow).toMatch(/core\\.setSecret\\(alertToken\\)/);
    expect(workflow).toMatch(/secret_type_display_name/);
    expect(workflow).not.toMatch(/alert\\.secret\\b/);
    expect(workflow).toMatch(/never includes a secret value/);
"""
          if old not in text:
              raise SystemExit('Unable to locate security inventory contract assertions')
          contracts.write_text(text.replace(old, new, 1), encoding='utf-8')

          docs = Path('docs/security/SECURITY_ALERT_TRIAGE.md')
          text = docs.read_text(encoding='utf-8')
          if '## Inventory credential' not in text:
              anchor = "The scheduled `Security Alert Inventory` workflow produces a sanitised metadata report and maintains one issue named `[security] Active GitHub alert inventory`. It never records a secret value.\n\n"
              addition = """## Inventory credential

Create the repository Actions secret `SECURITY_ALERTS_TOKEN` before enabling the scheduled inventory. Prefer a fine-grained personal access token or GitHub App token limited to this repository with **read** access to Code scanning alerts, Secret scanning alerts and Dependabot alerts. The workflow keeps issue creation and closure on the separate default `GITHUB_TOKEN`, so the dedicated alert credential does not need repository contents or issues write access.

If the credential is missing, expired or under-scoped, the inventory is marked incomplete and its tracking issue remains open. An unreadable source is never treated as zero alerts.

"""
              if anchor not in text:
                  raise SystemExit('Unable to locate security documentation insertion point')
              docs.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY

      - name: Format changed files
        run: |
          npx prettier --write \
            .github/workflows/security-alert-inventory.yml \
            docs/security/SECURITY_ALERT_TRIAGE.md \
            middleware/security.js \
            tests/unit/canonical-host-redirect.test.js \
            tests/unit/current-state-hardening.test.js

      - name: Run focused validation
        run: |
          node --check middleware/security.js
          npx jest --runInBand --coverage=false \
            tests/unit/canonical-host-redirect.test.js \
            tests/unit/current-state-hardening.test.js \
            tests/unit/production-startup-contract.test.js

      - name: Commit validated fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No audit changes remain."
            exit 0
          fi
          git config user.name "eventflow-hardening-bot"
          git config user.email "eventflow-hardening-bot@users.noreply.github.com"
          git add \
            .github/workflows/security-alert-inventory.yml \
            docs/security/SECURITY_ALERT_TRIAGE.md \
            middleware/security.js \
            tests/unit/canonical-host-redirect.test.js \
            tests/unit/current-state-hardening.test.js
          git commit -m "Fix security inventory authentication and redirect allowlist"
          git pull --rebase origin agent/current-state-security-monitoring-hardening
          git push origin HEAD:agent/current-state-security-monitoring-hardening
