name: Partner PR diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.js'
      - 'package*.json'
      - 'jest.config.js'
      - '.github/workflows/partner-ci-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: partner-pr-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HUSKY: '0'
      NODE_ENV: test
      JWT_SECRET: partner-diagnostics-secret-for-ci-minimum-32-characters
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run complete Jest suite and capture results
        id: regression
        continue-on-error: true
        run: npm run test:full -- --runInBand --json --outputFile=full-regression-results.json

      - name: Write concise diagnostics
        run: |
          node <<'NODE'
          const fs = require('fs');
          const output = [];
          output.push(`# Partner PR diagnostics`);
          output.push(`Generated: ${new Date().toISOString()}`);
          output.push('');
          if (!fs.existsSync('full-regression-results.json')) {
            output.push('The Jest JSON results file was not created.');
          } else {
            const data = JSON.parse(fs.readFileSync('full-regression-results.json', 'utf8'));
            output.push(`Success: ${data.success}`);
            output.push(`Test suites: ${data.numPassedTestSuites} passed, ${data.numFailedTestSuites} failed, ${data.numPendingTestSuites} pending`);
            output.push(`Tests: ${data.numPassedTests} passed, ${data.numFailedTests} failed, ${data.numPendingTests} pending`);
            output.push('');
            const failed = (data.testResults || []).filter(result => result.status === 'failed' || (result.assertionResults || []).some(test => test.status === 'failed'));
            if (!failed.length) {
              output.push('No failed Jest suites were reported.');
            }
            for (const suite of failed) {
              output.push(`## ${suite.name}`);
              for (const test of suite.assertionResults || []) {
                if (test.status !== 'failed') continue;
                output.push(`- ${[...(test.ancestorTitles || []), test.title].join(' > ')}`);
                for (const message of test.failureMessages || []) {
                  output.push('```');
                  output.push(String(message).slice(0, 6000));
                  output.push('```');
                }
              }
              if (suite.message) {
                output.push('```');
                output.push(String(suite.message).slice(0, 6000));
                output.push('```');
              }
              output.push('');
            }
          }
          fs.writeFileSync('ci-diagnostics.txt', `${output.join('\n')}\n`);
          NODE
          cat ci-diagnostics.txt

      - name: Commit diagnostics to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-diagnostics.txt
          if git diff --cached --quiet; then
            echo 'Diagnostics unchanged.'
            exit 0
          fi
          git commit -m 'chore(ci): capture partner PR diagnostics'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
