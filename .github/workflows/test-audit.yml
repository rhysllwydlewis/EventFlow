name: EventFlow Test Audit

on:
  workflow_dispatch:

jobs:
  test-audit:
    name: Generate test audit report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full test audit
        run: npm run test:audit:full

      - name: Upload test audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventflow-test-audit
          path: test-audit
          retention-days: 14
