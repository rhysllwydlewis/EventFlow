name: EventFlow Test Audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  test-audit:
    name: Generate test audit report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full test audit
        run: npm run test:audit:full

      - name: Upload test audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventflow-test-audit
          path: test-audit
          retention-days: 14
