name: Export PR Source

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/build-availability-aware-marketplace-and-quote-system

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Record head tree
        run: git rev-parse HEAD^{tree} > /tmp/head-tree.txt

      - name: Capture repair commit run list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=080b98844f6d221edc013dc59b015321aad56513&per_page=100" \
            > /tmp/repair-runs.json

      - name: Upload diagnostic metadata
        uses: actions/upload-artifact@v4
        with:
          name: eventflow-repair-diagnostics
          path: |
            /tmp/head-tree.txt
            /tmp/repair-runs.json
          if-no-files-found: error
          retention-days: 1

      - name: Create source archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='playwright-report' \
            --exclude='test-results' \
            -czf /tmp/eventflow-pr-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: eventflow-pr-source
          path: /tmp/eventflow-pr-source.tar.gz
          if-no-files-found: error
          retention-days: 1
