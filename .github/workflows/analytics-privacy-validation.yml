name: Analytics Privacy Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/assets/js/analytics-consent-upgrade.js'
      - 'utils/template-renderer.js'
      - 'tests/unit/analytics-independent-hardening.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-lockfile-consistency.mjs'
      - '.github/workflows/analytics-privacy-validation.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  pr1426-autofix:
    name: Apply final PR 1426 fixes
    if: github.event.pull_request.number == 1426
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Apply regression and security fixes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          utility_path = Path('utils/behaviourAnalytics.js')
          utility = utility_path.read_text(encoding='utf-8')
          old_sort = ".sort((left, right) => right.count - left.count || left.key.localeCompare(right.key))"
          new_sort = ".sort((left, right) => right.count - left.count)"
          if utility.count(old_sort) != 1:
              raise SystemExit(f'Expected one analytics tie-break sort, found {utility.count(old_sort)}')
          utility_path.write_text(utility.replace(old_sort, new_sort, 1), encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          overrides = package.setdefault('overrides', {})
          if overrides.get('brace-expansion') != '5.0.8':
              raise SystemExit(f"Unexpected brace-expansion override: {overrides.get('brace-expansion')!r}")
          overrides['brace-expansion'] = '5.0.9'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Format changed files
        run: npx prettier --write package.json package-lock.json utils/behaviourAnalytics.js

      - name: Run focused regression
        run: >-
          npx jest tests/unit/behaviour-analytics.test.js
          tests/unit/signup-attribution-summary.test.js
          --runInBand --coverage=false
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-testing-only-min-32-chars

      - name: Verify production dependency audit
        run: npm run audit

      - name: Restore workflow and commit fixes
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/analytics-privacy-validation.yml
          rm -f .github/workflows/pr1426-final-ci-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clear final analytics and dependency gates"
          git push origin HEAD:${{ github.head_ref }}

  analytics-privacy:
    name: Focused analytics privacy checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check JavaScript syntax
        run: |
          node --check public/assets/js/analytics-consent-upgrade.js
          node --check utils/template-renderer.js
          node --check tests/unit/analytics-independent-hardening.test.js

      - name: Lint changed JavaScript
        run: >-
          npx eslint --rulesdir eslint-rules
          public/assets/js/analytics-consent-upgrade.js
          utils/template-renderer.js
          tests/unit/analytics-independent-hardening.test.js

      - name: Check changed-file formatting
        run: >-
          npx prettier --check
          public/assets/js/analytics-consent-upgrade.js
          utils/template-renderer.js
          tests/unit/analytics-independent-hardening.test.js
          docs/analytics/posthog-independent-post-deploy-review.md

      - name: Run analytics hardening regression
        id: privacy-tests
        continue-on-error: true
        run: >-
          npx jest tests/unit/analytics-independent-hardening.test.js
          --runInBand --coverage=false --json --outputFile=analytics-test-results.json
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-testing-only-min-32-chars

      - name: Upload analytics test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-privacy-test-results
          path: analytics-test-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce analytics regression result
        if: steps.privacy-tests.outcome == 'failure'
        run: |
          cat analytics-test-results.json || true
          exit 1
