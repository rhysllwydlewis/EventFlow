name: Analytics Privacy Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/assets/js/analytics-consent-upgrade.js'
      - 'utils/template-renderer.js'
      - 'tests/unit/analytics-independent-hardening.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-lockfile-consistency.mjs'
      - '.github/workflows/analytics-privacy-validation.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  analytics-privacy:
    name: Focused analytics privacy checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check JavaScript syntax
        run: |
          node --check public/assets/js/analytics-consent-upgrade.js
          node --check utils/template-renderer.js
          node --check tests/unit/analytics-independent-hardening.test.js

      - name: Lint changed JavaScript
        run: >-
          npx eslint --rulesdir eslint-rules
          public/assets/js/analytics-consent-upgrade.js
          utils/template-renderer.js
          tests/unit/analytics-independent-hardening.test.js

      - name: Check changed-file formatting
        run: >-
          npx prettier --check
          public/assets/js/analytics-consent-upgrade.js
          utils/template-renderer.js
          tests/unit/analytics-independent-hardening.test.js
          docs/analytics/posthog-independent-post-deploy-review.md

      - name: Run analytics hardening regression
        id: privacy-tests
        continue-on-error: true
        run: >-
          npx jest tests/unit/analytics-independent-hardening.test.js
          --runInBand --coverage=false --json --outputFile=analytics-test-results.json
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-testing-only-min-32-chars

      - name: Upload analytics test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analytics-privacy-test-results
          path: analytics-test-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce analytics regression result
        if: steps.privacy-tests.outcome == 'failure'
        run: |
          cat analytics-test-results.json || true
          exit 1
