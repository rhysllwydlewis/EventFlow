name: PR 1417 run DeepSource repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/partner-anti-abuse-pr3-cashout-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr3-cashout-ops
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0

      - name: Execute committed repair script
        run: |
          python <<'RUNNER'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr1417-deepsource-current-diagnostic.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'pr1417-deepsource-repair.py', 'exec'))
          RUNNER

      - name: Format and verify repairs
        run: |
          npx prettier --write \
            services/partnerCashoutAdminEnrichmentRuntime.js \
            services/partnerCashoutLockRuntime.js \
            public/assets/js/pages/admin-cashout-requests-init.js
          npx prettier --check \
            services/partnerCashoutAdminEnrichmentRuntime.js \
            services/partnerCashoutLockRuntime.js \
            public/assets/js/pages/admin-cashout-requests-init.js
          npx eslint \
            services/partnerCashoutAdminEnrichmentRuntime.js \
            services/partnerCashoutLockRuntime.js \
            public/assets/js/pages/admin-cashout-requests-init.js
          npx jest \
            tests/unit/admin-allowlist.test.js \
            tests/unit/partner-cashout-admin-ui.test.js \
            tests/unit/partner-cashout-admin-enrichment-edge-coverage.test.js \
            tests/unit/partner-cashout-lock-runtime-edge-coverage.test.js \
            tests/unit/partner-cashout-runtime-order.test.js \
            --runInBand --coverage=false

      - name: Commit verified repair
        run: |
          rm \
            .github/workflows/pr1417-deepsource-current-diagnostic.yml \
            .github/workflows/pr1417-run-deepsource-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/partnerCashoutAdminEnrichmentRuntime.js \
            services/partnerCashoutLockRuntime.js \
            public/assets/js/pages/admin-cashout-requests-init.js \
            .github/workflows/pr1417-deepsource-current-diagnostic.yml \
            .github/workflows/pr1417-run-deepsource-repair.yml
          git commit -m "refactor(partner): resolve PR 1417 DeepSource findings"
          git push origin HEAD:agent/partner-anti-abuse-pr3-cashout-ops
