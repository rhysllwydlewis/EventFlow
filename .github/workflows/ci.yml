name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  dependency-integrity:
    name: Clean Install & Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: dependency-integrity
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    needs: dependency-integrity
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check formatting
        run: npm run format:check

  smoke:
    name: Smoke Tests (blocking)
    runs-on: ubuntu-latest
    needs: dependency-integrity
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run smoke suites
        run: npm run test:smoke
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-testing-only-min-32-chars

  homepage-typecheck:
    name: Homepage TypeScript
    runs-on: ubuntu-latest
    needs: dependency-integrity
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Type-check homepage sources
        run: npm run typecheck:homepages

      - name: Verify generated homepage assets are current
        run: |
          npm run build:homepages
          git diff --exit-code -- public/assets/js/pages/home-v2.js public/assets/js/pages/home-v3.js public/assets/js/pages/home-v3-video.js

  full-regression:
    name: Full Regression (non-blocking)
    runs-on: ubuntu-latest
    needs: dependency-integrity
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run full test suite
        run: npm run test:full
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-testing-only-min-32-chars

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: dependency-integrity
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run production dependency audit
        run: npm run audit
        continue-on-error: true

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, formatting, smoke, homepage-typecheck, security]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run build command
        run: npm run build

      - name: Verify server starts and health check passes
        run: |
          node server.js > /tmp/eventflow-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server health check passed after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become ready within 15 seconds"
          cat /tmp/eventflow-server.log
          exit 1
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-testing-only-min-32-chars

  go-live-audit:
    name: Go-Live Audit (security headers + health endpoints)
    runs-on: ubuntu-latest
    needs: [lint, formatting, smoke, homepage-typecheck]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run go-live audit (local server)
        run: npm run audit:golive
        env:
          NODE_ENV: development
          JWT_SECRET: ci-golive-audit-test-secret-padding-abcdefghijklm
          BASE_URL: http://localhost:3600
          AUDIT_PORT: '3600'
