name: Apply PR 1351 Repair

on:
  push:
    branches:
      - codex/build-availability-aware-marketplace-and-quote-system
    paths:
      - .github/workflows/apply-pr1351-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/build-availability-aware-marketplace-and-quote-system
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefer-offline --no-audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply validated repair patch
        run: |
          git apply --check .github/pr1351-repair.patch
          git apply .github/pr1351-repair.patch

      - name: Format and lint changed source
        run: |
          npx prettier --write .github/workflows/e2e.yml playwright.config.js scripts/summarize-playwright-results.mjs tests/visual/email-previews-smoke.spec.mjs
          npx prettier --check .github/workflows/e2e.yml playwright.config.js scripts/summarize-playwright-results.mjs tests/visual/email-previews-smoke.spec.mjs
          npx eslint playwright.config.js scripts/summarize-playwright-results.mjs tests/visual/email-previews-smoke.spec.mjs --rulesdir eslint-rules

      - name: Run focused unit suites
        run: |
          npx jest --runInBand --coverage=false --runTestsByPath \
            tests/unit/browser-workflow-gates.test.js \
            tests/unit/availability-service.test.js \
            tests/unit/quote-booking-service.test.js \
            tests/unit/features-middleware.test.js \
            tests/unit/admin-settings.test.js

      - name: Generate reviewed visual baselines
        env:
          CI: 'true'
        run: >-
          npx playwright test
          --config=playwright-visual.config.js
          --grep "visual snapshot matches baseline"
          --update-snapshots
          --reporter=list

      - name: Verify generated baseline inventory
        run: |
          count="$(find tests/visual/__screenshots__/visual-regression.spec.mjs -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          if [ "$count" -ne 10 ]; then
            echo "::error::Expected 10 visual baselines, found $count"
            exit 1
          fi

      - name: Commit source fixes and generated baselines
        run: |
          git checkout -- .github/workflows/e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            playwright.config.js \
            public/auth.html \
            public/index.html \
            public/marketplace.html \
            public/pricing.html \
            scripts/summarize-playwright-results.mjs \
            tests/visual/email-previews-smoke.spec.mjs \
            tests/visual/__screenshots__/visual-regression.spec.mjs
          git diff --cached --stat
          git commit -m "fix: repair accessibility and visual baselines"
          git push origin HEAD:codex/build-availability-aware-marketplace-and-quote-system

# Third run: workflow-file cleanup is handled separately through the GitHub API.
