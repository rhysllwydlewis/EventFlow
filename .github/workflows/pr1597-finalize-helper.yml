name: PR1597 Finalize Helper

on:
  push:
    branches:
      - fix/google-facebook-auth-button-rendering

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr1597-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/google-facebook-auth-button-rendering
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Fix social auth geometry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function read(path) {
            return fs.readFileSync(path, 'utf8');
          }

          function write(path, content) {
            fs.writeFileSync(path, content);
          }

          function replaceSection(source, startMarker, endMarker, replacement, path) {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            if (start === -1 || end === -1) {
              throw new Error(`Expected section not found in ${path}`);
            }
            return source.slice(0, start) + replacement + source.slice(end);
          }

          const facebookPath = 'public/assets/js/pages/auth-facebook-init.js';
          let facebook = read(facebookPath);
          facebook = replaceSection(
            facebook,
            '  function getVisibleWidth(element) {',
            '  function hasControlCharacter(value) {',
            `  function getVisibleWidth(element) {
            if (!element) {
              return 0;
            }

            const rectWidth = Math.round(element.getBoundingClientRect?.().width || 0);
            return rectWidth || Math.round(element.clientWidth || element.offsetWidth || 0);
          }

          function getGoogleRenderedControl(card) {
            const googleButton = card?.querySelector('.auth-google-button');
            return googleButton?.querySelector('iframe') || googleButton?.firstElementChild || null;
          }

          function getRenderedFootprintWidth(control) {
            const renderedWidth = getVisibleWidth(control);
            if (!renderedWidth) {
              return 0;
            }

            if (control.tagName !== 'IFRAME' || typeof window.getComputedStyle !== 'function') {
              return renderedWidth;
            }

            const styles = window.getComputedStyle(control);
            const marginLeft = Number.parseFloat(styles.marginLeft || '0') || 0;
            const marginRight = Number.parseFloat(styles.marginRight || '0') || 0;
            return Math.max(0, Math.round(renderedWidth + marginLeft + marginRight));
          }

          function getFacebookButtonTargetWidth(button) {
            const card = button?.closest('.auth-card');
            const googleButton = card?.querySelector('.auth-google-button');
            const renderedControl = getGoogleRenderedControl(card);
            const measuredWidth =
              getRenderedFootprintWidth(renderedControl) || getVisibleWidth(googleButton);

            return Math.min(SOCIAL_BUTTON_MAX_WIDTH, measuredWidth || SOCIAL_BUTTON_MAX_WIDTH);
          }

          function syncFacebookButtonWidths() {
            document.querySelectorAll('.auth-facebook-button').forEach(button => {
              const targetWidth = getFacebookButtonTargetWidth(button);
              button.style.width = targetWidth + 'px';
              button.style.maxWidth = '100%';
              button.style.marginInline = 'auto';
            });
          }

          function observeGoogleButtonWidths() {
            window.__eventflowFacebookWidthObserver?.disconnect?.();

            if (typeof window.ResizeObserver !== 'function') {
              syncFacebookButtonWidths();
              return;
            }

            const resizeObserver = new window.ResizeObserver(syncFacebookButtonWidths);
            document
              .querySelectorAll('.auth-google-button iframe, .auth-google-button > *')
              .forEach(control => resizeObserver.observe(control));
            window.__eventflowFacebookWidthObserver = resizeObserver;
            syncFacebookButtonWidths();
          }

          `,
            facebookPath
          );
          facebook = facebook.replace(
            /\n\s*scheduleFacebookButtonWidthSync\(\);\n\s*observeGoogleButtonWidths\(\);\n\s*window\.addEventListener\('resize', scheduleFacebookButtonWidthSync, \{ passive: true \}\);/,
            `
              observeGoogleButtonWidths();
              document.addEventListener('eventflow:google-button-rendered', observeGoogleButtonWidths);
              window.addEventListener('resize', syncFacebookButtonWidths, { passive: true });`
          );
          if (facebook.includes('scheduleFacebookButtonWidthSync')) {
            throw new Error('Legacy Facebook width scheduler was not fully removed');
          }
          write(facebookPath, facebook);

          const googlePath = 'public/assets/js/pages/auth-google-init.js';
          let google = read(googlePath);
          google = replaceSection(
            google,
            '  function getVisibleWidth(element) {',
            '  function renderGoogleButton(container, context, baseRenderOptions) {',
            `  function getVisibleWidth(element) {
            if (!element) {
              return 0;
            }

            const rectWidth = Math.floor(element.getBoundingClientRect?.().width || 0);
            return rectWidth || Math.floor(element.clientWidth || element.offsetWidth || 0);
          }

          function getContentWidth(element) {
            const width = getVisibleWidth(element);
            if (!width || typeof window.getComputedStyle !== 'function') {
              return width;
            }

            const styles = window.getComputedStyle(element);
            const horizontalInsets =
              (Number.parseFloat(styles.paddingLeft || '0') || 0) +
              (Number.parseFloat(styles.paddingRight || '0') || 0) +
              (Number.parseFloat(styles.borderLeftWidth || '0') || 0) +
              (Number.parseFloat(styles.borderRightWidth || '0') || 0);
            return Math.max(0, Math.floor(width - horizontalInsets));
          }

          function getGoogleButtonWidth(container) {
            const googleBlock = container.closest('.auth-google');
            const card = container.closest('.auth-card');
            const measuredWidth = [getContentWidth(googleBlock), getContentWidth(card)].find(
              width => width > 0
            );
            const availableWidth = Math.max(
              GOOGLE_BUTTON_MIN_WIDTH,
              measuredWidth || GOOGLE_BUTTON_MAX_WIDTH
            );

            return Math.min(GOOGLE_BUTTON_MAX_WIDTH, availableWidth);
          }

          `,
            googlePath
          );

          const renderStart = google.indexOf(
            '  function renderGoogleButton(container, context, baseRenderOptions) {'
          );
          const readyMarker = "    container.classList.add('is-ready');";
          const readyIndex = google.indexOf(readyMarker, renderStart);
          if (renderStart === -1 || readyIndex === -1) {
            throw new Error('Google render completion marker not found');
          }
          const readyEnd = readyIndex + readyMarker.length;
          google =
            google.slice(0, readyEnd) +
            "\n    document.dispatchEvent(\n      new CustomEvent('eventflow:google-button-rendered', { detail: { context, buttonWidth } })\n    );" +
            google.slice(readyEnd);

          const observerStart = google.lastIndexOf(
            "    if (typeof window.MutationObserver === 'function') {"
          );
          const resizeLine =
            "    window.addEventListener('resize', scheduleGoogleLayoutSync, { passive: true });";
          const resizeIndex = google.indexOf(resizeLine, observerStart);
          if (observerStart === -1 || resizeIndex === -1) {
            throw new Error('Google panel observer block not found');
          }
          google =
            google.slice(0, observerStart) +
            "    document.addEventListener('eventflow:auth-tab-change', scheduleGoogleLayoutSync);\n" +
            google.slice(resizeIndex);
          write(googlePath, google);

          const unitPath = 'tests/unit/auth-signup-layout.test.js';
          let unit = read(unitPath);
          const testStart = unit.indexOf(
            "\n  it('keeps the Facebook control synchronized to the visible Google footprint'"
          );
          const suiteEnd = unit.lastIndexOf('\n});');
          if (testStart === -1 || suiteEnd === -1 || suiteEnd <= testStart) {
            throw new Error('Facebook geometry unit test block not found');
          }
          const replacementTest = `
            
            it('keeps Facebook synchronized to the rendered Google control without DOM mutation polling', () => {
              const googleSignupCss = fs.readFileSync(
                path.join(__dirname, '../../public/assets/css/auth-google-signup.css'),
                'utf8'
              );
              const facebookInit = fs.readFileSync(
                path.join(__dirname, '../../public/assets/js/pages/auth-facebook-init.js'),
                'utf8'
              );
              const googleInit = fs.readFileSync(
                path.join(__dirname, '../../public/assets/js/pages/auth-google-init.js'),
                'utf8'
              );

              expect(googleSignupCss).toMatch(
                /body\\.auth-page \\.auth-facebook-button\\s*\\{[^}]*width: min\\(100%, var\\(--google-button-width, 320px\\)\\);[^}]*margin-inline: auto;/s
              );
              expect(facebookInit).toContain('new window.ResizeObserver(syncFacebookButtonWidths)');
              expect(facebookInit).not.toContain('MutationObserver');
              expect(facebookInit).toContain("'eventflow:google-button-rendered'");
              expect(googleInit).toContain('function getContentWidth(element)');
              expect(googleInit).toContain("new CustomEvent('eventflow:google-button-rendered'");
              expect(googleInit).toContain("'eventflow:auth-tab-change'");
            });`;
          unit = unit.slice(0, testStart) + replacementTest + unit.slice(suiteEnd);
          write(unitPath, unit);
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format touched files
        run: >-
          npx prettier --write
          public/assets/js/pages/auth-google-init.js
          public/assets/js/pages/auth-facebook-init.js
          tests/unit/auth-signup-layout.test.js

      - name: Run focused unit test
        run: npx jest tests/unit/auth-signup-layout.test.js --runInBand --coverage=false

      - name: Lint production auth scripts
        run: npx eslint --rulesdir eslint-rules public/assets/js/pages/auth-google-init.js public/assets/js/pages/auth-facebook-init.js

      - name: Remove helper and push final PR changes
        shell: bash
        run: |
          git rm .github/workflows/pr1597-finalize-helper.yml
          git config user.name "eventflow-ci-helper"
          git config user.email "eventflow-ci-helper@users.noreply.github.com"
          git add public/assets/js/pages/auth-google-init.js public/assets/js/pages/auth-facebook-init.js tests/unit/auth-signup-layout.test.js
          git commit -m "Fix social auth width synchronization [skip pr1597-finalize]"
          git push origin HEAD:fix/google-facebook-auth-button-rendering