name: PR1597 Finalize Helper

on:
  push:
    branches:
      - fix/google-facebook-auth-button-rendering

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr1597-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/google-facebook-auth-button-rendering
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Simplify social button geometry and harden state coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function read(path) {
            return fs.readFileSync(path, 'utf8');
          }
          function write(path, content) {
            fs.writeFileSync(path, content);
          }
          function mustReplace(path, source, search, replacement) {
            if (!search.test(source)) {
              throw new Error(`Expected block not found in ${path}: ${search}`);
            }
            return source.replace(search, replacement);
          }

          // The Facebook control does not need to inspect or resize Google's
          // private iframe. Both EventFlow-owned hosts use the same responsive
          // CSS width; Google receives that same width via renderButton().
          const facebookPath = 'public/assets/js/pages/auth-facebook-init.js';
          let facebook = read(facebookPath);
          facebook = facebook.replace(
            /\n  const SOCIAL_BUTTON_MIN_WIDTH = 220;\n  const SOCIAL_BUTTON_MAX_WIDTH = 320;\n/,
            '\n'
          );
          facebook = mustReplace(
            facebookPath,
            facebook,
            /\n  function getVisibleWidth\(element\) \{[\s\S]*?\n  function hasControlCharacter\(value\) \{/,
            '\n  function hasControlCharacter(value) {'
          );
          facebook = facebook.replace(
            /\n    scheduleFacebookButtonWidthSync\(\);\n    observeGoogleButtonWidths\(\);\n    window\.addEventListener\('resize', scheduleFacebookButtonWidthSync, \{ passive: true \}\);/,
            ''
          );
          write(facebookPath, facebook);

          // Rerender the Google button when EventFlow actually switches auth
          // tabs or the viewport changes. Avoid observing Google's own DOM.
          const googlePath = 'public/assets/js/pages/auth-google-init.js';
          let google = read(googlePath);
          google = google.replace(
            /\n  function isGoogleContainerVisible\(container\) \{/,
            `\n  /** Return whether a Google button's auth panel is currently visible. */\n  function isGoogleContainerVisible(container) {`
          );
          google = google.replace(
            /\n  function rerenderVisibleGoogleButtons\(signInContainer, signUpContainer, renderOptions\) \{/,
            `\n  /** Rerender only the Google controls whose panels can be measured. */\n  function rerenderVisibleGoogleButtons(signInContainer, signUpContainer, renderOptions) {`
          );
          google = mustReplace(
            googlePath,
            google,
            /\n    if \(typeof window\.MutationObserver === 'function'\) \{[\s\S]*?\n    \}\n\n    window\.addEventListener\('resize', scheduleGoogleLayoutSync, \{ passive: true \}\);/,
            `\n    document.addEventListener('eventflow:auth-tab-change', scheduleGoogleLayoutSync);\n    window.addEventListener('resize', scheduleGoogleLayoutSync, { passive: true });`
          );
          write(googlePath, google);

          // Google's documented width is supplied by EventFlow. Personalization
          // changes the content, not our requested outer control width. Keep the
          // simulated GIS iframe gutter because that is the clipping regression.
          const visualPath = 'tests/visual/auth-social-buttons.spec.mjs';
          let visual = read(visualPath);
          visual = visual.replace(/\nconst GOOGLE_DYNAMIC_WIDTH = 260;\n/, '\n');
          visual = visual.replace(
            /name: 'compact-personalized',\n    label: 'Continue as Rhys',\n    sublabel: 'rhys@example\.com',\n    width: 304,/,
            `name: 'compact-personalized',\n    label: 'Continue as Rhys',\n    sublabel: 'rhys@example.com',\n    width: 'requested',`
          );
          visual = visual.replace(
            /'compact-personalized': \{\n                label: 'Continue as Rhys',\n                sublabel: 'rhys@example\.com',\n                width: 304\n              \}/,
            `'compact-personalized': {\n                label: 'Continue as Rhys',\n                sublabel: 'rhys@example.com',\n                width: 'requested'\n              }`
          );
          visual = visual.replace(
            /var resizedWidth = Math\.min\(requestedWidth, \$\{GOOGLE_DYNAMIC_WIDTH\}\);[\s\S]*?resizedWidth,\n                          'personalized-late'/,
            `updateFrame(\n                          frame,\n                          {\n                            label: 'Sign in as Rhys',\n                            sublabel: 'rhys@example.com'\n                          },\n                          requestedWidth,\n                          'personalized-late'`
          );
          // The replacement above intentionally starts with updateFrame; remove
          // the now-duplicated call opener if it was retained by the source.
          visual = visual.replace(/updateFrame\(\n\s*frame,\n\s*updateFrame\(/, 'updateFrame(');
          visual = visual.replace(
            /\n            const initialGeometry = await expectProviderGeometry\(panelRoot\);/,
            '\n            await expectProviderGeometry(panelRoot);'
          );
          visual = visual.replace(
            /\n            const personalizedGeometry = await expectProviderGeometry\(panelRoot\);\n            expect\(personalizedGeometry\.visibleWidth\)\.toBeLessThanOrEqual\(\n              initialGeometry\.visibleWidth\n            \);/,
            '\n            await expectProviderGeometry(panelRoot);'
          );
          write(visualPath, visual);

          // Unit coverage now enforces the simpler contract: EventFlow owns the
          // responsive host width; Google's iframe must remain unconstrained.
          const unitPath = 'tests/unit/auth-signup-layout.test.js';
          let unit = read(unitPath);
          unit = mustReplace(
            unitPath,
            unit,
            /\n  it\('keeps the Facebook control synchronized to the visible Google footprint',[\s\S]*?\n  \}\);\n\}\);$/,
            `\n  it('keeps Facebook on the same responsive width contract without resizing Google internals', () => {\n    const googleSignupCss = fs.readFileSync(\n      path.join(__dirname, '../../public/assets/css/auth-google-signup.css'),\n      'utf8'\n    );\n    const facebookInit = fs.readFileSync(\n      path.join(__dirname, '../../public/assets/js/pages/auth-facebook-init.js'),\n      'utf8'\n    );\n\n    expect(googleSignupCss).toMatch(\n      /body\\.auth-page \\.auth-facebook-button\\s*\\{[^}]*width: min\\(100%, var\\(--google-button-width, 320px\\)\\);[^}]*margin-inline: auto;/s\n    );\n    expect(facebookInit).not.toContain('ResizeObserver');\n    expect(facebookInit).not.toContain('MutationObserver');\n    expect(facebookInit).not.toContain('getGoogleRenderedControl');\n  });\n});`
          );
          write(unitPath, unit);
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format touched files
        run: >-
          npx prettier --write
          public/assets/js/pages/auth-google-init.js
          public/assets/js/pages/auth-facebook-init.js
          tests/unit/auth-signup-layout.test.js
          tests/visual/auth-social-buttons.spec.mjs

      - name: Run focused unit test
        run: npx jest tests/unit/auth-signup-layout.test.js --runInBand

      - name: Lint production auth scripts
        run: npx eslint --rulesdir eslint-rules public/assets/js/pages/auth-google-init.js public/assets/js/pages/auth-facebook-init.js

      - name: Remove helper and push final PR changes
        shell: bash
        run: |
          git rm .github/workflows/pr1597-finalize-helper.yml
          git config user.name "eventflow-ci-helper"
          git config user.email "eventflow-ci-helper@users.noreply.github.com"
          git add public/assets/js/pages/auth-google-init.js public/assets/js/pages/auth-facebook-init.js tests/unit/auth-signup-layout.test.js tests/visual/auth-social-buttons.spec.mjs
          git commit -m "Simplify social auth geometry and state handling [skip pr1597-finalize]"
          git push origin HEAD:fix/google-facebook-auth-button-rendering
