name: Admin Analytics Decision Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'routes/behaviour-analytics.js'
      - 'utils/behaviourAnalyticsDecision.js'
      - 'public/assets/js/pages/admin-analytics-init.js'
      - 'public/assets/js/pages/admin-analytics-decision.js'
      - 'public/assets/css/admin-analytics-decision.css'
      - 'tests/unit/behaviour-analytics-decision.test.js'
      - 'tests/unit/behaviour-analytics-integration.test.js'
      - 'docs/analytics/admin-analytics-decision-dashboard.md'
      - '.github/workflows/admin-analytics-decision-validation.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format and validate analytics changes
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies on cache miss
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Apply repository formatting
        run: >-
          npx prettier --write
          routes/behaviour-analytics.js
          utils/behaviourAnalyticsDecision.js
          public/assets/js/pages/admin-analytics-init.js
          public/assets/js/pages/admin-analytics-decision.js
          public/assets/css/admin-analytics-decision.css
          tests/unit/behaviour-analytics-decision.test.js
          tests/unit/behaviour-analytics-integration.test.js
          docs/analytics/admin-analytics-decision-dashboard.md

      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            routes/behaviour-analytics.js \
            utils/behaviourAnalyticsDecision.js \
            public/assets/js/pages/admin-analytics-init.js \
            public/assets/js/pages/admin-analytics-decision.js \
            public/assets/css/admin-analytics-decision.css \
            tests/unit/behaviour-analytics-decision.test.js \
            tests/unit/behaviour-analytics-integration.test.js \
            docs/analytics/admin-analytics-decision-dashboard.md
          git commit -m "Format final admin analytics changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Check JavaScript syntax
        run: |
          node --check routes/behaviour-analytics.js
          node --check utils/behaviourAnalyticsDecision.js
          node --check public/assets/js/pages/admin-analytics-init.js
          node --check public/assets/js/pages/admin-analytics-decision.js
          node --check tests/unit/behaviour-analytics-decision.test.js
          node --check tests/unit/behaviour-analytics-integration.test.js

      - name: Lint changed JavaScript
        run: >-
          npx eslint --rulesdir eslint-rules
          routes/behaviour-analytics.js
          utils/behaviourAnalyticsDecision.js
          public/assets/js/pages/admin-analytics-init.js
          public/assets/js/pages/admin-analytics-decision.js
          tests/unit/behaviour-analytics-decision.test.js
          tests/unit/behaviour-analytics-integration.test.js

      - name: Run focused unit tests
        run: >-
          npx jest
          tests/unit/behaviour-analytics-decision.test.js
          tests/unit/behaviour-analytics-integration.test.js
          --runInBand --coverage=false
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-testing-only-min-32-chars
