name: Article Freshness Audit

on:
  schedule:
    # Avoid the top-of-hour scheduling congestion window.
    - cron: '17 4 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  audit-articles:
    name: Verify article dates and inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - run: npm ci --ignore-scripts --no-audit

      - name: Verify article inventory and dates
        run: node scripts/audit-article-metadata.js
