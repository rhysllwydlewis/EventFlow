name: Diagnose PR 1378 Jest failure

on:
  push:
    branches:
      - feature/server-rendered-supplier-seo
    paths:
      - .github/workflows/diagnose-pr-1378-tests.yml

permissions:
  contents: read

concurrency:
  group: diagnose-pr-1378-tests
  cancel-in-progress: true

env:
  HUSKY: '0'
  NODE_ENV: test
  JWT_SECRET: diagnostic-secret-for-ci-minimum-32-characters

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Run full Jest suite and preserve diagnostics
        id: jest
        shell: bash
        run: |
          set +e
          npm run test:full -- --runInBand --json --outputFile=jest-results.json \
            >jest-console.txt 2>&1
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build concise failure summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lines = [];
          const exitCode = '${{ steps.jest.outputs.exit_code }}';
          lines.push(`Jest exit code: ${exitCode}`);
          if (fs.existsSync('jest-results.json')) {
            const data = JSON.parse(fs.readFileSync('jest-results.json', 'utf8'));
            lines.push(`Success: ${data.success}`);
            lines.push(`Suites: ${data.numPassedTestSuites} passed, ${data.numFailedTestSuites} failed`);
            lines.push(`Tests: ${data.numPassedTests} passed, ${data.numFailedTests} failed`);
            for (const suite of data.testResults || []) {
              const failed = (suite.assertionResults || []).filter(item => item.status === 'failed');
              if (!failed.length && suite.status !== 'failed') continue;
              lines.push(`\nSUITE: ${suite.name}`);
              for (const item of failed) {
                lines.push(`TEST: ${(item.ancestorTitles || []).concat(item.title || '').join(' > ')}`);
                for (const message of item.failureMessages || []) lines.push(message);
              }
              if (suite.message) lines.push(suite.message);
            }
          }
          fs.writeFileSync('jest-failure-summary.txt', lines.join('\n'));
          NODE
          tail -n 300 jest-console.txt > jest-console-tail.txt || true
          cat jest-failure-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr-1378-jest-diagnostics
          path: |
            jest-failure-summary.txt
            jest-console-tail.txt
            jest-results.json
          if-no-files-found: error
          retention-days: 2
