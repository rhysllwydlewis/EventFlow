name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

permissions:
  contents: read

env:
  HUSKY: '0'

concurrency:
  group: deploy-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  precheck:
    name: Deployment precheck
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.result.outputs.should_deploy }}
      reason: ${{ steps.result.outputs.reason }}
      target_ref: ${{ steps.result.outputs.target_ref }}
    steps:
      - name: Evaluate trigger and docs-only changes
        id: evaluate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          PUSH_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            echo "target_ref=$PUSH_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == v* ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=tag_release" >> "$GITHUB_OUTPUT"
            echo "target_ref=$PUSH_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=unsupported_event" >> "$GITHUB_OUTPUT"
            echo "target_ref=$PUSH_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$CI_CONCLUSION" != "success" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=ci_not_green" >> "$GITHUB_OUTPUT"
            echo "target_ref=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "reason=ci_green" >> "$GITHUB_OUTPUT"
          echo "target_ref=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout target commit
        if: steps.evaluate.outputs.should_deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.evaluate.outputs.target_ref }}
          fetch-depth: 2

      - name: Skip docs-only workflow_run changes
        if: github.event_name == 'workflow_run' && steps.evaluate.outputs.should_deploy == 'true'
        id: docs_only
        shell: bash
        run: |
          set -euo pipefail
          parents="$(git rev-list --parents -n 1 HEAD)"
          base="$(echo "$parents" | awk '{print $2}')"
          if [[ -z "$base" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD | tr '\n' ' ')"
          if [[ -z "$changed" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              docs/*|*.md|.github/*.md|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE/*)
                ;;
              *)
                echo "docs_only=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          echo "docs_only=true" >> "$GITHUB_OUTPUT"

      - name: Finalize precheck result
        id: result
        shell: bash
        run: |
          echo "target_ref=${{ steps.evaluate.outputs.target_ref }}" >> "$GITHUB_OUTPUT"
          should_deploy="${{ steps.evaluate.outputs.should_deploy }}"
          reason="${{ steps.evaluate.outputs.reason }}"
          if [[ "${{ github.event_name }}" == "workflow_run" && "$should_deploy" == "true" && "${{ steps.docs_only.outputs.docs_only }}" == "true" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=docs_only_change" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=${should_deploy}" >> "$GITHUB_OUTPUT"
            echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          fi

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: [precheck]
    if: needs.precheck.outputs.should_deploy == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.precheck.outputs.target_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Verify package-lock metadata
        run: npm run check:lockfile
      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Audit production dependencies
        run: npm run audit

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [precheck, security]
    if: needs.precheck.outputs.should_deploy == 'true'
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    env:
      APP_URL: ${{ secrets.APP_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      EXPECTED_SHA: ${{ needs.precheck.outputs.target_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.precheck.outputs.target_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${APP_URL:-}" ]]; then
            echo "::error::Missing required secret APP_URL"
            missing=1
          fi
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::warning::RAILWAY_TOKEN is unset; this workflow will verify Railway's GitHub auto-deployment rather than trigger one directly."
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Validate production preflight contract
        run: npm run preflight
        env:
          NODE_ENV: production
          JWT_SECRET: ci-preflight-secret-padding-not-for-runtime-use
          MONGODB_URI: mongodb://127.0.0.1:27017/eventflow_preflight
          BASE_URL: https://event-flow.co.uk
          REDIS_URL: redis://127.0.0.1:6379
          COMPANY_NUMBER: '12345678'
          REGISTERED_OFFICE: 123 Preflight Street, London
          BUSINESS_PHONE: +44 20 0000 0000
          BUSINESS_ADDRESS_LINE1: 123 Preflight Street
          BUSINESS_CITY: London
          BUSINESS_POSTCODE: SW1A 1AA

      - name: Wait for the intended commit to reach Railway
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="${APP_URL%/}/deployment.json?expected=${EXPECTED_SHA}&run=${GITHUB_RUN_ID}"
          for attempt in {1..50}; do
            body="$(curl -fsS -H 'Cache-Control: no-cache' "$deployment_url" || true)"
            reported="$(printf '%s' "$body" | node -e "const fs=require('fs');try{const value=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(String(value.commit||''));}catch{}")"
            if [[ "$reported" == "$EXPECTED_SHA" ]]; then
              echo "Railway is serving the intended commit: $reported"
              break
            fi
            if [[ "$attempt" == "50" ]]; then
              echo "::error::Railway did not report expected commit $EXPECTED_SHA. Last reported commit: ${reported:-unavailable}"
              echo "Last deployment metadata response: ${body:-unavailable}"
              exit 1
            fi
            echo "Waiting for Railway deployment ($attempt/50). Reported: ${reported:-unavailable}"
            sleep 6
          done

      - name: Smoke test deployed service
        shell: bash
        run: |
          set -euo pipefail
          health_url="${APP_URL%/}/api/health"
          ready_url="${APP_URL%/}/api/ready"
          config_url="${APP_URL%/}/api/config"
          root_url="${APP_URL%/}/"

          health_code="$(curl -sS -o /dev/null -w '%{http_code}' "$health_url" || true)"
          if [[ "$health_code" != "200" ]]; then
            echo "::error::Health endpoint failed (status=$health_code, url=$health_url)"
            exit 1
          fi

          ready_code=''
          ready_body=''
          for attempt in {1..20}; do
            ready_body="$(curl -sS "$ready_url" || true)"
            ready_code="$(curl -sS -o /dev/null -w '%{http_code}' "$ready_url" || true)"
            if [[ "$ready_code" == "200" ]]; then
              break
            fi
            echo "Waiting for database, Redis producer and worker readiness ($attempt/20; status=$ready_code)"
            sleep 3
          done
          if [[ "$ready_code" != "200" ]]; then
            echo "::error::Readiness endpoint failed (status=$ready_code, url=$ready_url)"
            echo "Readiness response: ${ready_body:-unavailable}"
            exit 1
          fi

          config_code="$(curl -sS -o /dev/null -w '%{http_code}' "$config_url" || true)"
          if [[ "$config_code" != "200" ]]; then
            echo "::error::Config endpoint failed (status=$config_code, url=$config_url)"
            exit 1
          fi

          response_time="$(curl -sS -o /dev/null -w '%{time_total}' "$root_url" || true)"
          echo "Homepage response time: ${response_time}s"

  skipped:
    name: Deployment skipped
    runs-on: ubuntu-latest
    needs: [precheck]
    if: needs.precheck.outputs.should_deploy != 'true'
    steps:
      - run: |
          echo "Deploy skipped: ${{ needs.precheck.outputs.reason }}"
