name: PR 1416 DeepSource issue enumeration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch every issue from the diagnosed DeepSource check
        shell: bash
        env:
          CHECK_ID: Q2hlY2s6eWxtZXJ3YXY=
          REPORT_URL: https://app.deepsource.com/gh/rhysllwydlewis/EventFlow/run/4a6bc5de-70bd-468a-b6dc-bc3e1dc29bfe/javascript/
        run: |
          mkdir -p diagnostic
          python <<'PY'
          import http.cookiejar
          import json
          import os
          import urllib.request
          from collections import Counter, defaultdict
          from pathlib import Path

          cookie_jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookie_jar))
          opener.addheaders = [('User-Agent', 'EventFlow-PR1416-Diagnostic/1.0')]
          opener.open(os.environ['REPORT_URL']).read()

          query = '''
          query EnumerateCheckIssues($id: ID!, $after: String) {
            node(id: $id) {
              ... on Check {
                allIssues(first: 100, after: $after) {
                  pageInfo { hasNextPage endCursor }
                  edges {
                    node {
                      id path text shortcode category severity
                      beginLine beginColumn endLine endColumn
                    }
                  }
                }
              }
            }
          }
          '''

          issues = []
          after = None
          while True:
            body = json.dumps({
              'query': query,
              'variables': {'id': os.environ['CHECK_ID'], 'after': after},
            }).encode()
            request = urllib.request.Request(
              'https://app.deepsource.com/graphql/',
              data=body,
              headers={
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Origin': 'https://app.deepsource.com',
                'Referer': os.environ['REPORT_URL'],
              },
              method='POST',
            )
            response = json.loads(opener.open(request).read())
            if response.get('errors'):
              raise RuntimeError(json.dumps(response['errors'], indent=2))
            connection = response['data']['node']['allIssues']
            issues.extend(edge['node'] for edge in connection['edges'])
            page_info = connection['pageInfo']
            if not page_info['hasNextPage']:
              break
            after = page_info['endCursor']

          Path('diagnostic/issues.json').write_text(json.dumps(issues, indent=2))
          by_code = Counter(issue['shortcode'] for issue in issues)
          by_file = defaultdict(Counter)
          for issue in issues:
            by_file[issue['path']][issue['shortcode']] += 1

          summary = {
            'total': len(issues),
            'by_code': dict(sorted(by_code.items())),
            'by_file': {
              path: dict(sorted(counts.items()))
              for path, counts in sorted(by_file.items())
            },
          }
          Path('diagnostic/summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          print('\nExact findings:')
          for issue in issues:
            print(
              f"{issue['shortcode']} {issue['path']}:{issue['beginLine']} "
              f"[{issue['severity']}] {issue['text']}"
            )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pr1416-deepsource-all-issues
          path: diagnostic
          retention-days: 1
