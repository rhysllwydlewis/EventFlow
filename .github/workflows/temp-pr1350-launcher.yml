name: Temporary PR 1350 review launcher

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-background-job-telemetry
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Apply reviewed fixes
        run: python scripts/temp-pr1350-review-fixes.py

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Format focused changes
        run: npx prettier --write railway.json services/actionPromptScheduler.js routes/admin.js routes/supplier-admin.js services/backgroundJobTelemetryBridge.js services/backgroundJobTelemetry.service.js tests/unit/background-job-trigger-attribution.test.js

      - name: Lint focused changes
        run: npx eslint services/actionPromptScheduler.js routes/admin.js routes/supplier-admin.js services/backgroundJobTelemetryBridge.js services/backgroundJobTelemetry.service.js tests/unit/background-job-trigger-attribution.test.js --rulesdir eslint-rules

      - name: Run focused telemetry tests
        run: npx jest --runInBand --coverage=false tests/unit/background-job-telemetry-bridge.test.js tests/unit/background-job-trigger-attribution.test.js
        env:
          NODE_ENV: test

      - name: Remove temporary audit files
        run: rm -f .github/workflows/temp-pr1350-review-fixes.yml .github/workflows/temp-pr1350-launcher.yml scripts/temp-pr1350-review-fixes.py .pr1350-review-trigger

      - name: Commit reviewed fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Address final telemetry review findings"
          git push origin HEAD:agent/complete-background-job-telemetry
