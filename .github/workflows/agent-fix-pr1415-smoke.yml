name: Agent Fix PR 1415 Smoke Failures

on:
  push:
    branches:
      - agent/partner-anti-abuse-pr1-identity-network
    paths:
      - .github/workflows/agent-fix-pr1415-smoke.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr1-identity-network
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --prefer-offline --no-audit

      - name: Correct smoke-test and company matching defects
        shell: python
        run: |
          from pathlib import Path

          test_path = Path('tests/unit/partner-registration-final-review.test.js')
          test_text = test_path.read_text()
          replacements = {
              'let id = 0;': 'let mockId = 0;',
              '`${prefix}_${++id}`': '`${prefix}_${++mockId}`',
              '  id = 0;': '  mockId = 0;',
          }
          for old, new in replacements.items():
              if old not in test_text:
                  raise SystemExit(f'Missing expected test fragment: {old}')
              test_text = test_text.replace(old, new, 1)
          test_path.write_text(test_text)

          service_path = Path('services/partnerAntiAbuseService.js')
          service_text = service_path.read_text()
          marker = """function trigrams(value) {
            const clean = `  ${normalise(value)}  `;
          """
          replacement = """function normaliseCompanyForSimilarity(value) {
            const legalSuffixes = {
              limited: 'ltd',
              incorporated: 'inc',
              corporation: 'corp',
              company: 'co',
            };
            return String(value || '')
              .trim()
              .toLowerCase()
              .replace(/&/g, ' and ')
              .replace(/[^a-z0-9]+/g, ' ')
              .trim()
              .split(/\\s+/)
              .filter(Boolean)
              .map(token => legalSuffixes[token] || token)
              .join('');
          }

          function trigrams(value) {
            const clean = `  ${normalise(value)}  `;
          """
          if marker not in service_text:
              raise SystemExit('Missing trigrams insertion point')
          service_text = service_text.replace(marker, replacement, 1)

          old_similarity = """  const a = trigrams(left);
            const b = trigrams(right);
          """
          new_similarity = """  const a = trigrams(normaliseCompanyForSimilarity(left));
            const b = trigrams(normaliseCompanyForSimilarity(right));
          """
          if old_similarity not in service_text:
              raise SystemExit('Missing companySimilarity implementation')
          service_text = service_text.replace(old_similarity, new_similarity, 1)
          service_path.write_text(service_text)

      - name: Format corrected files
        run: npx prettier --write services/partnerAntiAbuseService.js tests/unit/partner-registration-final-review.test.js

      - name: Run affected tests
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long
          PARTNER_ABUSE_HASH_SECRET: test-partner-abuse-hash-secret
        run: >-
          npx jest --runInBand --coverage=false
          tests/unit/partner-registration-final-review.test.js
          tests/unit/partner-anti-abuse-identity.test.js

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-fix-pr1415-smoke.yml
          git add services/partnerAntiAbuseService.js tests/unit/partner-registration-final-review.test.js
          git commit -m "fix(partner): correct identity matching smoke failures"
          git push origin HEAD:agent/partner-anti-abuse-pr1-identity-network
