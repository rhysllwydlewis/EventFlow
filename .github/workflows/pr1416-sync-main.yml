name: PR1416 Sync Main

on:
  push:
    branches:
      - agent/partner-anti-abuse-pr2-reward-integrity

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR2 branch with history
        uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr2-reward-integrity
          fetch-depth: 0

      - name: Record merged PR1 as ancestor without changing PR2 files
        run: |
          git config user.name "EventFlow CI Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -s ours 1f1f4bec88125debecc6a7b094d082500f2655d5 \
            -m "chore(partner): align PR2 history with merged PR1"

      - name: Remove sync workflow and push
        run: |
          git rm .github/workflows/pr1416-sync-main.yml
          git commit -m "chore(ci): remove PR1416 sync workflow"
          git push origin HEAD:agent/partner-anti-abuse-pr2-reward-integrity
