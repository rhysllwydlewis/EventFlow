name: Apply Admin Debug mobile HTML cleanup

on:
  push:
    branches:
      - agent/admin-debug-mobile-mop-up

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-debug-mobile-mop-up
          fetch-depth: 0

      - name: Restore original HTML formatting and bump bundle version
        run: |
          git show origin/main:public/admin-debug.html > public/admin-debug.html
          python - <<'PY'
          from pathlib import Path

          path = Path('public/admin-debug.html')
          content = path.read_text()
          old_bundle = '/assets/js/pages/admin-debug-background-jobs.js?v=18.5.0'
          new_bundle = '/assets/js/pages/admin-debug-background-jobs.js?v=18.6.0'
          if content.count(old_bundle) != 1:
              raise SystemExit('Expected one parent bundle reference on main')
          path.write_text(content.replace(old_bundle, new_bundle))
          PY
          git diff --check

      - name: Commit minimal HTML change
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin-debug.html
          git commit -m 'Keep Admin Debug cache bump focused'
          git push origin HEAD:agent/admin-debug-mobile-mop-up
