name: Apply supplier profile loading parity

on:
  push:
    branches: [agent/supplier-profile-loading-parity]

permissions:
  contents: write

jobs:
  apply-loading-parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-loading-parity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply supplier profile loading and loaded-state polish
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          html_path = Path('public/supplier.html')
          html = html_path.read_text()
          html = html.replace(
              '/assets/css/supplier-profile-commercial-polish.css?v=20.2.0',
              '/assets/css/supplier-profile-commercial-polish.css?v=20.3.0',
              1,
          )
          html = html.replace('<body>', '<body class="sp-profile-page sp-profile-loading">', 1)
          html = html.replace(
              '<img id="hero-banner" src="/assets/images/placeholder-banner.svg" alt="Supplier banner" />',
              '<img id="hero-banner" src="/assets/images/placeholders/supplier-profile-loading.svg" alt="" aria-hidden="true" />',
              1,
          )
          html = html.replace(
              '<p class="supplier-tagline" id="hero-tagline"></p>',
              '''<p class="supplier-tagline" id="hero-tagline" aria-hidden="true">
            <span class="skeleton sp-loading-line sp-loading-line--tagline"></span>
            <span class="skeleton sp-loading-line sp-loading-line--tagline-short"></span>
          </p>''',
              1,
          )
          old_meta = '''          <div
            class="supplier-meta"
            id="hero-meta"
            style="display: none"
            aria-label="Supplier details"
          >
            <!-- Meta information will be dynamically inserted here -->
          </div>'''
          new_meta = '''          <div class="supplier-meta" id="hero-meta" aria-label="Supplier details" aria-hidden="true">
            <span class="skeleton sp-loading-chip"></span>
            <span class="skeleton sp-loading-chip sp-loading-chip--wide"></span>
          </div>'''
          if old_meta not in html:
              raise SystemExit('hero meta loading mount not found')
          html = html.replace(old_meta, new_meta, 1)

          about_start = html.index('            <div id="sp-section-about" class="sp-section" aria-label="About this supplier">')
          about_end = html.index('            <!-- Gallery (rendered by supplier-profile.js) -->', about_start)
          about_loading = '''            <div id="sp-section-about" class="sp-section" aria-label="About this supplier">
              <div class="sp-loading-highlights" aria-hidden="true">
                <div class="skeleton sp-loading-eyebrow"></div>
                <div class="sp-loading-highlights__grid">
                  <span class="skeleton sp-loading-highlight"></span>
                  <span class="skeleton sp-loading-highlight"></span>
                  <span class="skeleton sp-loading-highlight"></span>
                  <span class="skeleton sp-loading-highlight"></span>
                  <span class="skeleton sp-loading-highlight"></span>
                </div>
              </div>
              <div class="sp-card sp-section-skeleton sp-loading-about" aria-hidden="true">
                <div class="sp-loading-heading-row">
                  <span class="skeleton sp-loading-heading-icon"></span>
                  <span class="skeleton sp-loading-heading"></span>
                </div>
                <span class="skeleton sp-loading-line sp-loading-line--long"></span>
                <span class="skeleton sp-loading-line sp-loading-line--long"></span>
                <span class="skeleton sp-loading-line sp-loading-line--medium"></span>
                <span class="skeleton sp-loading-line sp-loading-line--long"></span>
                <span class="skeleton sp-loading-line sp-loading-line--short"></span>
                <div class="sp-loading-service-row">
                  <span class="skeleton sp-loading-service"></span>
                  <span class="skeleton sp-loading-service sp-loading-service--wide"></span>
                  <span class="skeleton sp-loading-service"></span>
                </div>
              </div>
            </div>

'''
          html = html[:about_start] + about_loading + html[about_end:]

          html = html.replace(
              '<div id="supplier-package-cards-root" data-renderer="v2"></div>',
              '''<div id="supplier-package-cards-root" data-renderer="v2">
                <div class="sp-card supplier-packages-v2 supplier-packages-v2--loading sp-package-loading-card" aria-hidden="true">
                  <div class="sp-loading-heading-row">
                    <span class="skeleton sp-loading-heading-icon"></span>
                    <span class="skeleton sp-loading-heading"></span>
                  </div>
                  <div class="sp-package-loading-grid">
                    <div class="sp-package-loading-item">
                      <span class="skeleton sp-package-loading-media"></span>
                      <span class="skeleton sp-loading-line sp-loading-line--medium"></span>
                      <span class="skeleton sp-loading-line sp-loading-line--long"></span>
                    </div>
                    <div class="sp-package-loading-item">
                      <span class="skeleton sp-package-loading-media"></span>
                      <span class="skeleton sp-loading-line sp-loading-line--medium"></span>
                      <span class="skeleton sp-loading-line sp-loading-line--long"></span>
                    </div>
                  </div>
                </div>
              </div>''',
              1,
          )
          html = html.replace(
              '<div id="sp-section-reviews" class="sp-section" aria-label="Customer reviews"></div>',
              '''<div id="sp-section-reviews" class="sp-section" aria-label="Customer reviews">
              <div class="sp-card sp-loading-reviews" aria-hidden="true">
                <div class="sp-loading-heading-row">
                  <span class="skeleton sp-loading-heading-icon"></span>
                  <span class="skeleton sp-loading-heading sp-loading-heading--wide"></span>
                </div>
                <div class="sp-loading-review-row">
                  <span class="skeleton sp-loading-review-score"></span>
                  <span class="skeleton sp-loading-line sp-loading-line--long"></span>
                  <span class="skeleton sp-loading-button"></span>
                </div>
              </div>
            </div>''',
              1,
          )
          html = html.replace(
              '<div id="sp-sidebar-enquiry"></div>',
              '''<div id="sp-sidebar-enquiry">
                <div class="sp-loading-sidebar-card sp-loading-sidebar-card--contact" aria-hidden="true">
                  <span class="skeleton sp-loading-eyebrow"></span>
                  <span class="skeleton sp-loading-line sp-loading-line--medium"></span>
                  <span class="skeleton sp-loading-line sp-loading-line--long"></span>
                  <span class="skeleton sp-loading-line sp-loading-line--medium"></span>
                  <span class="skeleton sp-loading-button sp-loading-button--full"></span>
                </div>
              </div>''',
              1,
          )
          html = html.replace(
              '<div id="sp-sidebar-trust"></div>',
              '''<div id="sp-sidebar-trust">
                <div class="sp-loading-sidebar-card" aria-hidden="true">
                  <span class="skeleton sp-loading-eyebrow"></span>
                  <span class="skeleton sp-loading-line sp-loading-line--medium"></span>
                  <span class="skeleton sp-loading-line sp-loading-line--short"></span>
                </div>
              </div>''',
              1,
          )
          html = html.replace(
              '<div id="sp-sidebar-details"></div>',
              '''<div id="sp-sidebar-details">
                <div class="sp-loading-sidebar-card" aria-hidden="true">
                  <span class="skeleton sp-loading-eyebrow"></span>
                  <span class="skeleton sp-loading-line sp-loading-line--long"></span>
                  <span class="skeleton sp-loading-line sp-loading-line--long"></span>
                  <span class="skeleton sp-loading-line sp-loading-line--medium"></span>
                </div>
              </div>''',
              1,
          )
          html_path.write_text(html)

          profile_path = Path('public/assets/js/supplier-profile.js')
          profile = profile_path.read_text()
          profile = profile.replace(
              "      heroMeta.innerHTML = items.join('');\n      heroMeta.style.display = items.length > 0 ? '' : 'none';",
              "      heroMeta.innerHTML = items.join('');\n      heroMeta.removeAttribute('aria-hidden');\n      heroMeta.style.display = items.length > 0 ? '' : 'none';",
              1,
          )
          loading_helper = '''\n  function setPageLoading(isLoading) {\n    document.body?.classList.toggle('sp-profile-loading', isLoading);\n    document.documentElement.dataset.spLoading = isLoading ? 'true' : 'false';\n\n    const main = document.getElementById('main-content');\n    const hero = document.getElementById('supplier-hero');\n    if (isLoading) {\n      main?.setAttribute('aria-busy', 'true');\n      hero?.setAttribute('aria-busy', 'true');\n    } else {\n      main?.removeAttribute('aria-busy');\n      hero?.removeAttribute('aria-busy');\n    }\n  }\n'''
          marker = '  // ─── Data loading ─────────────────────────────────────────────────────────────\n'
          if loading_helper.strip() not in profile:
              profile = profile.replace(marker, marker + loading_helper, 1)
          profile = profile.replace(
              '  async function loadAllData() {\n    if (!supplierId) {',
              '  async function loadAllData() {\n    setPageLoading(true);\n    if (!supplierId) {',
              1,
          )
          profile = profile.replace(
              "      window.dispatchEvent(new CustomEvent('sp:dataReady', { detail: { supplier: supplierData } }));",
              "      window.dispatchEvent(new CustomEvent('sp:dataReady', { detail: { supplier: supplierData } }));\n      setPageLoading(false);",
              1,
          )
          profile = profile.replace(
              "    } catch (error) {\n      console.error('Error loading supplier profile:', error);",
              "    } catch (error) {\n      setPageLoading(false);\n      console.error('Error loading supplier profile:', error);",
              1,
          )
          profile_path.write_text(profile)

          packages_path = Path('public/assets/js/supplier-profile-packages-v2.js')
          packages = packages_path.read_text()
          old_render_state = '''function renderState(root, className, message) {
  clearRoot(root);
  const card = document.createElement('div');
  card.className = `sp-card supplier-packages-v2 supplier-packages-v2--${className}`;
  const title = document.createElement('h2');
  title.className = 'sp-card-title';
  title.textContent = 'Packages & Services';
  const body = document.createElement('p');
  body.className = 'supplier-packages-v2__state';
  body.textContent = message;
  card.append(title, body);
  root.append(card);
  setPackagesSectionVisible(root, true);
}'''
          new_render_state = '''function renderState(root, className, message) {
  clearRoot(root);
  const card = document.createElement('div');
  card.className = `sp-card supplier-packages-v2 supplier-packages-v2--${className}`;

  if (className === 'loading') {
    card.classList.add('sp-package-loading-card');
    card.setAttribute('aria-hidden', 'true');
    card.innerHTML = `
      <div class="sp-loading-heading-row">
        <span class="skeleton sp-loading-heading-icon"></span>
        <span class="skeleton sp-loading-heading"></span>
      </div>
      <div class="sp-package-loading-grid">
        <div class="sp-package-loading-item">
          <span class="skeleton sp-package-loading-media"></span>
          <span class="skeleton sp-loading-line sp-loading-line--medium"></span>
          <span class="skeleton sp-loading-line sp-loading-line--long"></span>
        </div>
        <div class="sp-package-loading-item">
          <span class="skeleton sp-package-loading-media"></span>
          <span class="skeleton sp-loading-line sp-loading-line--medium"></span>
          <span class="skeleton sp-loading-line sp-loading-line--long"></span>
        </div>
      </div>`;
  } else {
    const title = document.createElement('h2');
    title.className = 'sp-card-title';
    title.textContent = 'Packages & Services';
    const body = document.createElement('p');
    body.className = 'supplier-packages-v2__state';
    body.textContent = message;
    card.append(title, body);
  }

  root.append(card);
  setPackagesSectionVisible(root, true);
}'''
          if old_render_state not in packages:
              raise SystemExit('package loading renderer not found')
          packages_path.write_text(packages.replace(old_render_state, new_render_state, 1))

          pwa_path = Path('public/assets/js/pwa-install.js')
          pwa = pwa_path.read_text()
          pwa = pwa.replace(
              "    const hasV3BodyClass = document.body && document.body.classList.contains('home-v3-page');\n\n    return isV3Preview || hasV3BodyClass;",
              "    const hasV3BodyClass = document.body && document.body.classList.contains('home-v3-page');\n    const isSupplierProfile =\n      document.body && document.body.classList.contains('sp-profile-page');\n\n    return isV3Preview || hasV3BodyClass || isSupplierProfile;",
              1,
          )
          pwa_path.write_text(pwa)

          css_path = Path('public/assets/css/supplier-profile-commercial-polish.css')
          css = css_path.read_text().replace('commercial polish v20.2', 'commercial polish v20.3', 1)
          loading_css = r'''

/* ─── Supplier loading parity v20.3 ───────────────────────────────────────── */
html:not([data-sp-theme-ready='true']) {
  --sp-hero-height: 146px !important;
  --sp-hero-height-mobile: 132px !important;
}

body.sp-profile-page .sp-page {
  padding-top: 1rem !important;
}

body.sp-profile-loading {
  overflow-y: scroll;
}

body.sp-profile-loading .hero-media {
  background: linear-gradient(135deg, #14283b 0%, #29445d 58%, #52677b 100%) !important;
  box-shadow: none;
}

body.sp-profile-loading .hero-media img {
  opacity: 0.18;
  filter: grayscale(1);
}

body.sp-profile-loading .hero-avatar {
  overflow: hidden;
  background: #e9eef2 !important;
}

body.sp-profile-loading .hero-avatar-img,
body.sp-profile-loading #hero-avatar-initials {
  opacity: 0;
}

body.sp-profile-loading .hero-avatar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, #e9eef2 0%, #f8fafb 45%, #e9eef2 90%);
  background-size: 220% 100%;
  animation: skeleton-loading 1.5s ease-in-out infinite;
}

body.sp-profile-loading .hero-content {
  min-height: 128px;
  align-items: center;
}

body.sp-profile-loading .supplier-tagline {
  display: grid !important;
  gap: 0.4rem;
  width: min(100%, 540px);
  margin: 0.45rem 0 0.65rem !important;
}

.sp-loading-line {
  display: block;
  height: 0.8rem;
  margin: 0;
}

.sp-loading-line--tagline { width: min(100%, 480px); }
.sp-loading-line--tagline-short { width: min(70%, 330px); }
.sp-loading-line--long { width: 100%; }
.sp-loading-line--medium { width: 72%; }
.sp-loading-line--short { width: 44%; }

body.sp-profile-loading #hero-meta {
  display: flex !important;
  gap: 0.45rem;
}

.sp-loading-chip {
  display: inline-block;
  width: 92px;
  height: 28px;
  border-radius: 999px;
}

.sp-loading-chip--wide { width: 126px; }

body.sp-profile-loading .hero-actions {
  pointer-events: none;
  user-select: none;
}

body.sp-profile-loading #btn-enquiry,
body.sp-profile-loading #btn-save,
body.sp-profile-loading #btn-share {
  color: transparent !important;
  border-color: #e4e9ed !important;
  background: linear-gradient(90deg, #edf1f4 0%, #fafbfc 45%, #edf1f4 90%) !important;
  background-size: 220% 100% !important;
  animation: skeleton-loading 1.5s ease-in-out infinite;
  box-shadow: none !important;
}

body.sp-profile-loading .hero-actions svg {
  opacity: 0;
}

.sp-loading-highlights,
.sp-loading-sidebar-card {
  background: #ffffff;
  border: 1px solid #dfe6eb;
  border-radius: 12px;
}

.sp-loading-highlights {
  padding: 1.15rem 1.35rem;
  border-left: 4px solid #d9e2e7;
}

.sp-loading-eyebrow {
  display: block;
  width: 112px;
  height: 0.65rem;
  margin-bottom: 0.85rem;
}

.sp-loading-highlights__grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.75rem 1.25rem;
}

.sp-loading-highlight {
  display: block;
  width: min(100%, 220px);
  height: 0.85rem;
}

.sp-loading-about,
.sp-loading-reviews,
.sp-package-loading-card {
  min-height: 0;
}

.sp-loading-heading-row {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding-bottom: 0.75rem;
  margin-bottom: 1rem;
  border-bottom: 2px solid #f0f3f5;
}

.sp-loading-heading-icon {
  width: 18px;
  height: 18px;
  border-radius: 5px;
}

.sp-loading-heading {
  width: 86px;
  height: 0.9rem;
}

.sp-loading-heading--wide { width: 170px; }

.sp-loading-about .sp-loading-line {
  margin-bottom: 0.7rem;
}

.sp-loading-service-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-top: 1.1rem;
}

.sp-loading-service {
  width: 100px;
  height: 28px;
  border-radius: 999px;
}

.sp-loading-service--wide { width: 150px; }

.sp-package-loading-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

.sp-package-loading-item {
  display: grid;
  gap: 0.75rem;
  padding: 0.85rem;
  border: 1px solid #edf0f2;
  border-radius: 10px;
}

.sp-package-loading-media {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 8px;
}

.sp-loading-review-row {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr) 120px;
  align-items: center;
  gap: 1rem;
}

.sp-loading-review-score {
  width: 72px;
  height: 54px;
  border-radius: 10px;
}

.sp-loading-button {
  display: block;
  width: 120px;
  height: 40px;
  border-radius: 9px;
}

.sp-loading-button--full { width: 100%; }

.sp-loading-sidebar-card {
  display: grid;
  gap: 0.75rem;
  padding: 1.1rem;
  min-height: 104px;
}

.sp-loading-sidebar-card--contact {
  min-height: 210px;
}

body.sp-profile-page #ef-pwa-install-banner {
  display: none !important;
}

@media (max-width: 900px) {
  .sp-loading-highlights__grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 680px) {
  body.sp-profile-page .sp-page {
    padding-top: 0.85rem !important;
  }

  body.sp-profile-loading .hero-content {
    min-height: 150px;
  }

  .sp-loading-highlights__grid,
  .sp-package-loading-grid,
  .sp-loading-review-row {
    grid-template-columns: 1fr;
  }

  .sp-loading-review-score,
  .sp-loading-button {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  body.sp-profile-loading .hero-avatar::after,
  body.sp-profile-loading #btn-enquiry,
  body.sp-profile-loading #btn-save,
  body.sp-profile-loading #btn-share {
    animation: none;
  }
}
'''
          if 'Supplier loading parity v20.3' not in css:
              css += loading_css
          css_path.write_text(css)

          svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" role="img" aria-label="Loading supplier profile">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#14283b"/>
                <stop offset="0.58" stop-color="#29445d"/>
                <stop offset="1" stop-color="#52677b"/>
              </linearGradient>
              <pattern id="lines" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="skewX(-28)">
                <path d="M0 0v52" stroke="#ffffff" stroke-opacity="0.055"/>
              </pattern>
            </defs>
            <rect width="1600" height="180" fill="url(#bg)"/>
            <rect width="1600" height="180" fill="url(#lines)"/>
          </svg>'''
          Path('public/assets/images/placeholders/supplier-profile-loading.svg').write_text(svg)

          unit_path = Path('tests/unit/supplier-profile-commercial-polish.test.js')
          unit = unit_path.read_text()
          unit = unit.replace('v20.2.0', 'v20.3.0')
          unit = unit.replace(
              "  test('compacts the empty review experience', () => {",
              "  test('keeps the loading shell aligned with the rendered profile', () => {\n    expect(supplierHtml).toContain('sp-profile-page sp-profile-loading');\n    expect(supplierHtml).toContain('sp-loading-highlights');\n    expect(supplierHtml).toContain('sp-loading-sidebar-card--contact');\n    expect(css).toContain('Supplier loading parity v20.3');\n    expect(css).toContain('padding-top: 1rem !important');\n  });\n\n  test('compacts the empty review experience', () => {",
              1,
          )
          unit_path.write_text(unit)

          e2e = r'''import fs from 'node:fs';
          import path from 'node:path';
          import { test, expect } from '@playwright/test';

          const TEST_ID = 'loading-parity-test';
          const supplierHtml = fs.readFileSync(
            path.resolve(process.cwd(), 'public/supplier.html'),
            'utf8'
          );

          const supplier = {
            id: TEST_ID,
            name: 'Loading Parity Supplier',
            tagline: 'A confident supplier profile with a stable loading experience.',
            description_long:
              'This description is deliberately long enough to create a representative about card after the supplier profile has loaded.',
            category: 'Entertainment',
            location: 'Greater London',
            heroPreset: 'midnight',
            highlights: [
              'Experienced event professional',
              'Live and hybrid events',
              'Clear planning support',
              'Responsive communication',
              'Trusted delivery',
            ],
            featuredServices: ['Conference MC', 'Awards Host', 'Corporate Event Host'],
            emailVerified: true,
            license: 'Licensed',
          };

          test('reserves the final profile geometry while supplier data is loading', async ({ page }) => {
            let releaseSupplier;
            const supplierGate = new Promise(resolve => {
              releaseSupplier = resolve;
            });

            await page.route(`**/supplier/${TEST_ID}*`, route =>
              route.fulfill({ status: 200, contentType: 'text/html', body: supplierHtml })
            );
            await page.route(`**/api/suppliers/${TEST_ID}`, async route => {
              await supplierGate;
              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify(supplier),
              });
            });
            await page.route(`**/api/supplier-profile/${TEST_ID}/package-cards**`, async route => {
              await supplierGate;
              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ items: [] }),
              });
            });
            await page.route(`**/api/public/suppliers/${TEST_ID}/avatar`, route =>
              route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ hasPhoto: false, initials: 'LP' }),
              })
            );
            await page.route('**/api/v1/auth/me', route =>
              route.fulfill({ status: 401, contentType: 'application/json', body: '{}' })
            );
            await page.route('**/api/reviews**', route =>
              route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ reviews: [], total: 0, averageRating: 0 }),
              })
            );

            await page.setViewportSize({ width: 1720, height: 1000 });
            await page.goto(`/supplier/${TEST_ID}?id=${TEST_ID}`, { waitUntil: 'domcontentloaded' });

            await expect(page.locator('body')).toHaveClass(/sp-profile-loading/);
            await expect(page.locator('.sp-loading-highlights')).toBeVisible();
            await expect(page.locator('.sp-loading-sidebar-card')).toHaveCount(3);

            const loading = await page.evaluate(() => {
              const hero = document.querySelector('.hero-media').getBoundingClientRect();
              const pageGrid = getComputedStyle(document.querySelector('.sp-page-grid'));
              const aside = document.querySelector('.sp-page-aside').getBoundingClientRect();
              const enquiry = getComputedStyle(document.getElementById('btn-enquiry'));
              return {
                heroHeight: hero.height,
                columns: pageGrid.gridTemplateColumns.split(' ').filter(Boolean).length,
                asideWidth: aside.width,
