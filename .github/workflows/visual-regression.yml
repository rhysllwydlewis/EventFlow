name: Visual Regression & a11y

# Runs Playwright visual regression + axe-core against the static preview
# server on every PR. Visual and accessibility failures are blocking; reports,
# screenshots and traces are still uploaded with `if: always()`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  HUSKY: '0'

jobs:
  visual:
    name: Visual + a11y (Chromium desktop + mobile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run visual regression + axe-core
        id: visual_tests
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/visual-results.json
        run: npm run test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            visual-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/__screenshots__
          if-no-files-found: warn
          retention-days: 14

  visual-verification:
    name: Dedicated Visual Verification
    runs-on: ubuntu-latest
    needs: [visual]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Enforce dedicated visual and axe result
        env:
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: |
          if [[ "$VISUAL_RESULT" != "success" ]]; then
            echo "::error::Dedicated visual/a11y prerequisite did not succeed: ${VISUAL_RESULT}"
            exit 1
          fi
