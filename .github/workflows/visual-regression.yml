name: Visual Regression & a11y

# Runs Playwright visual regression + axe-core against the static preview
# server on every PR. Visual and accessibility failures are blocking; reports,
# screenshots and traces are still uploaded with `if: always()`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

env:
  HUSKY: '0'

jobs:
  visual:
    name: Visual + a11y (Chromium desktop + mobile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run visual regression + axe-core
        id: visual_tests
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/visual-results.json
        run: npm run test:visual

      - name: Create concise visual failure summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const input = 'test-results/visual-results.json';
          const output = 'test-results/visual-summary.txt';
          const lines = [];

          if (!fs.existsSync(input)) {
            lines.push('Playwright JSON results were not produced.');
          } else {
            const report = JSON.parse(fs.readFileSync(input, 'utf8'));
            const stats = report.stats || {};
            lines.push(
              `expected=${stats.expected ?? 0} unexpected=${stats.unexpected ?? 0} ` +
                `flaky=${stats.flaky ?? 0} skipped=${stats.skipped ?? 0}`
            );

            function walk(suite, ancestors = []) {
              const nextAncestors = suite.title ? [...ancestors, suite.title] : ancestors;
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  const failedResults = (test.results || []).filter(result =>
                    ['failed', 'timedOut', 'interrupted'].includes(result.status)
                  );
                  if (!failedResults.length && test.status !== 'unexpected') continue;

                  lines.push('');
                  lines.push(
                    `FAIL: ${[...nextAncestors, spec.title].filter(Boolean).join(' > ')} ` +
                      `[${test.projectName || 'unknown project'}]`
                  );
                  for (const result of failedResults) {
                    for (const error of result.errors || []) {
                      const message = String(error.message || error.value || error.stack || error)
                        .replace(/\u001b\[[0-9;]*m/g, '')
                        .slice(0, 6000);
                      lines.push(message);
                    }
                  }
                }
              }
              for (const child of suite.suites || []) walk(child, nextAncestors);
            }

            for (const suite of report.suites || []) walk(suite);
          }

          fs.mkdirSync('test-results', { recursive: true });
          fs.writeFileSync(output, `${lines.join('\n').slice(0, 50000)}\n`);
          console.log(fs.readFileSync(output, 'utf8'));
          NODE

      - name: Upload concise machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-machine-results
          path: |
            test-results/visual-results.json
            test-results/visual-junit.xml
            test-results/visual-summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            visual-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/__screenshots__
          if-no-files-found: warn
          retention-days: 14

  visual-verification:
    name: Dedicated Visual Verification
    runs-on: ubuntu-latest
    needs: [visual]
    if: ${{ always() }}
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Enforce dedicated visual and axe result
        env:
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: |
          if [[ "$VISUAL_RESULT" != "success" ]]; then
            echo "::error::Dedicated visual/a11y prerequisite did not succeed: ${VISUAL_RESULT}"
            exit 1
          fi
