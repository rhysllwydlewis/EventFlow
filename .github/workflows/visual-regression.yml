name: Visual Regression & a11y (soft-fail)

# Part B4 + B6 of the notification-audit follow-up.
#
# Runs Playwright visual regression + axe-core against the static preview
# server on every PR. The test step is soft-fail only until the configured
# expiry date; after that, this workflow fails early until `continue-on-error`
# is removed or the date is intentionally extended.
#
# Labels:
#   - `visual-regression-soft` — applied when baselines legitimately drift
#     and a reviewer has acknowledged the diff artefact.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  visual:
    name: Visual + a11y (Chromium desktop + mobile)
    runs-on: ubuntu-latest
    env:
      CONTINUE_ON_ERROR_UNTIL: '2026-05-01'
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check soft-fail window
        run: |
          if [ "$(date +%Y-%m-%d)" \> "$CONTINUE_ON_ERROR_UNTIL" ]; then
            echo "Soft-fail window expired on $CONTINUE_ON_ERROR_UNTIL — remove \`continue-on-error\` or extend the date in .github/workflows/visual-regression.yml"
            exit 1
          fi
          echo "Soft-fail window active until $CONTINUE_ON_ERROR_UNTIL. Visual failures remain non-blocking for now."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run visual regression + axe-core
        continue-on-error: true
        env:
          CI: 'true'
        run: npm run test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            visual-report
            test-results
          retention-days: 14

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/__screenshots__
          retention-days: 14
