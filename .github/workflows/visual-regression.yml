name: Visual Regression & a11y (soft-fail)

# Part B4 + B6 of the notification-audit follow-up.
#
# Runs Playwright visual regression + axe-core against the static preview
# server on every PR. The test step is soft-fail only until the configured
# expiry date. Tests and artifacts are always produced before the policy
# gate reports whether the soft-fail window has expired.
#
# Labels:
#   - `visual-regression-soft` — applied when baselines legitimately drift
#     and a reviewer has acknowledged the diff artefact.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  visual:
    name: Visual + a11y (Chromium desktop + mobile)
    runs-on: ubuntu-latest
    env:
      CONTINUE_ON_ERROR_UNTIL: '2026-08-31'
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Record soft-fail policy state
        id: visual_policy
        run: |
          if [ "$(date +%Y-%m-%d)" \> "$CONTINUE_ON_ERROR_UNTIL" ]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "Soft-fail window expired on $CONTINUE_ON_ERROR_UNTIL. Visual/a11y tests will still run and upload artifacts before the policy gate fails."
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
            echo "Soft-fail window active until $CONTINUE_ON_ERROR_UNTIL. Visual failures remain non-blocking for now."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run visual regression + axe-core
        id: visual_tests
        continue-on-error: true
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/visual-results.json
        run: npm run test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            visual-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/__screenshots__
          if-no-files-found: warn
          retention-days: 14

      - name: Report visual/a11y failures
        if: steps.visual_tests.outcome == 'failure'
        run: |
          echo "Visual/a11y tests failed. Review visual-report, test-results, and visual-diffs artifacts to distinguish snapshot/a11y issues from infrastructure problems."

      - name: Enforce expired soft-fail policy
        if: steps.visual_policy.outputs.expired == 'true'
        run: |
          echo "Soft-fail window expired on $CONTINUE_ON_ERROR_UNTIL. Artifacts have been uploaded; remove continue-on-error or intentionally extend the policy date."
          exit 1
