name: Run PostHog health recovery

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/posthog-health-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract and run focused recovery script
        shell: bash
        run: |
          sed -i 's/test_path.write_text("""/test_path.write_text(r"""/' \
            .github/workflows/posthog-health-recovery.yml
          awk '
            /- name: Apply focused PostHog changes/ { found=1; next }
            found && /run: \|/ { capture=1; next }
            capture && /^      - name:/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/posthog-health-recovery.yml > /tmp/apply-posthog-health.sh
          test -s /tmp/apply-posthog-health.sh
          bash /tmp/apply-posthog-health.sh

      - name: Validate JavaScript syntax
        run: |
          node --check public/assets/js/behaviour-analytics.js
          node --check utils/template-renderer.js
          node --check tests/unit/posthog-web-vitals-health.test.js

      - name: Run dependency-free focused assertions
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          const vm = require('vm');

          const analytics = fs.readFileSync('public/assets/js/behaviour-analytics.js', 'utf8');
          const renderer = fs.readFileSync('utils/template-renderer.js', 'utf8');

          assert(analytics.includes('capture_performance: {'));
          assert(analytics.includes('web_vitals: true'));
          assert(analytics.includes('web_vitals_attribution: false'));
          assert(analytics.includes("person_profiles: 'never'"));
          assert(analytics.includes('before_send: sanitizePostHogProviderEvent'));
          assert(!analytics.includes('capture_performance: false'));
          assert(renderer.includes('/assets/js/behaviour-analytics.js?v=2'));
          assert(!renderer.includes('/assets/js/behaviour-analytics.js?v=1'));

          const start = analytics.indexOf('  function sanitizePostHogProviderEvent(event)');
          const end = analytics.indexOf('\n  function startPostHog(config)', start);
          assert(start >= 0 && end > start);
          const context = {};
          vm.createContext(context);
          vm.runInContext(
            `${analytics.slice(start, end)}\nthis.sanitizePostHogProviderEvent = sanitizePostHogProviderEvent;`,
            context
          );

          const event = {
            event: '$web_vitals',
            properties: {
              $process_person_profile: '019f6251-06a8-76c3-abe6-59e81e75cf04',
              $web_vitals_LCP_event: {
                $current_url: 'https://event-flow.co.uk/suppliers?token=secret#results',
              },
            },
          };
          const output = context.sanitizePostHogProviderEvent(event);
          assert.strictEqual(output, event);
          assert.strictEqual(event.properties.$process_person_profile, false);
          assert.strictEqual(
            event.properties.$web_vitals_LCP_event.$current_url,
            'https://event-flow.co.uk/suppliers'
          );
          NODE

      - name: Commit verified recovery and remove temporary runners
        shell: bash
        run: |
          rm .github/workflows/posthog-health-recovery.yml
          rm .github/workflows/posthog-health-pr-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/behaviour-analytics.js utils/template-renderer.js \
            tests/unit/posthog-web-vitals-health.test.js \
            docs/analytics/posthog-web-analytics-recovery.md \
            .github/workflows/posthog-health-recovery.yml \
            .github/workflows/posthog-health-pr-runner.yml
          git commit -m "fix: recover PostHog Web Analytics health"
          git push origin HEAD:agent/posthog-health-recovery
