name: Fix supplier profile geometry

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix-profile-geometry:
    if: github.event.pull_request.head.ref == 'agent/supplier-profile-header-layout-balance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-header-layout-balance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align portrait and restore full uploaded-banner height
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('public/assets/css/supplier-profile-theme.css')
          text = path.read_text()
          text = text.replace(
              ".hero-avatar-wrap {\n  top: calc(var(--sp-hero-height) - 2.25rem) !important;\n}",
              ".hero-avatar-wrap {\n  top: calc(var(--sp-hero-height) - 1.75rem) !important;\n}",
              1,
          )
          image_rule = """html[data-sp-hero-mode='image'] {
            --sp-hero-height: 300px;
            --sp-hero-height-mobile: 200px;
          }

          """
          anchor = "html[data-sp-hero-mode='preset'],\nhtml[data-sp-hero-mode='category'],\nhtml[data-sp-hero-mode='theme'] {"
          if image_rule.strip() not in text:
              if anchor not in text:
                  raise SystemExit('Fallback hero rule anchor was not found')
              text = text.replace(anchor, image_rule + anchor, 1)
          path.write_text(text)
          PY

      - name: Format the corrected stylesheet
        run: |
          npm ci --ignore-scripts
          npx prettier --write public/assets/css/supplier-profile-theme.css

      - name: Commit the geometry correction
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/css/supplier-profile-theme.css
          git commit -m "Align supplier portrait and uploaded banner geometry"
          git push origin HEAD:agent/supplier-profile-header-layout-balance
