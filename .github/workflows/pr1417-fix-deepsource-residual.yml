name: PR 1417 fix DeepSource residual

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/partner-anti-abuse-pr3-cashout-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr3-cashout-ops
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0

      - name: Apply residual DeepSource fixes
        run: |
          python <<'PY'
          from pathlib import Path

          for file_name in (
              'services/partnerCashoutAdminEnrichmentRuntime.js',
              'services/partnerCashoutLockRuntime.js',
          ):
              path = Path(file_name)
              source = path.read_text()
              old = "(() => {\n  'use strict';\n"
              new = "'use strict';\n\n(() => {\n"
              if old not in source:
                  raise RuntimeError(f'Expected strict-mode wrapper was not found in {file_name}')
              path.write_text(source.replace(old, new, 1))

          lock_path = Path('services/partnerCashoutOperationLockService.js')
          lock_source = lock_path.read_text()
          if not lock_source.startswith("'use strict';\n\n(() => {\n"):
              if not lock_source.startswith("'use strict';\n"):
                  raise RuntimeError('Operation lock service strict-mode header was not found')
              lock_source = lock_source.replace("'use strict';\n", "'use strict';\n\n(() => {\n", 1)
              lock_source = lock_source.rstrip() + '\n})();\n'
          lock_source = lock_source.replace("const crypto = require('crypto');", "const nodeCrypto = require('crypto');", 1)
          lock_source = lock_source.replace('crypto.randomUUID()', 'nodeCrypto.randomUUID()')
          lock_path.write_text(lock_source)

          index_path = Path('services/partnerCashoutOperationsIndexService.js')
          index_source = index_path.read_text()
          if not index_source.startswith("'use strict';\n\n(() => {\n"):
              if not index_source.startswith("'use strict';\n"):
                  raise RuntimeError('Operations index service strict-mode header was not found')
              index_source = index_source.replace("'use strict';\n", "'use strict';\n\n(() => {\n", 1)
              index_source = index_source.rstrip() + '\n})();\n'
          index_source = index_source.replace('async function ensureIndexes() {', 'function ensureIndexes() {', 1)
          index_path.write_text(index_source)
          PY

      - name: Format and verify residual fixes
        run: |
          npx prettier --write \
            services/partnerCashoutAdminEnrichmentRuntime.js \
            services/partnerCashoutLockRuntime.js \
            services/partnerCashoutOperationLockService.js \
            services/partnerCashoutOperationsIndexService.js
          npx prettier --check \
            services/partnerCashoutAdminEnrichmentRuntime.js \
            services/partnerCashoutLockRuntime.js \
            services/partnerCashoutOperationLockService.js \
            services/partnerCashoutOperationsIndexService.js
          npx eslint \
            services/partnerCashoutAdminEnrichmentRuntime.js \
            services/partnerCashoutLockRuntime.js \
            services/partnerCashoutOperationLockService.js \
            services/partnerCashoutOperationsIndexService.js
          npx jest \
            tests/unit/partner-cashout-admin-enrichment-edge-coverage.test.js \
            tests/unit/partner-cashout-lock-runtime-edge-coverage.test.js \
            tests/unit/partner-cashout-operation-lock.test.js \
            tests/unit/partner-cashout-operation-lock-edge-coverage.test.js \
            tests/unit/partner-cashout-index-retry-coverage.test.js \
            tests/unit/partner-cashout-runtime-order.test.js \
            --runInBand --coverage=false

      - name: Commit verified residual fixes
        run: |
          rm \
            .github/workflows/pr1417-deepsource-residual.yml \
            .github/workflows/pr1417-fix-deepsource-residual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/partnerCashoutAdminEnrichmentRuntime.js \
            services/partnerCashoutLockRuntime.js \
            services/partnerCashoutOperationLockService.js \
            services/partnerCashoutOperationsIndexService.js \
            .github/workflows/pr1417-deepsource-residual.yml \
            .github/workflows/pr1417-fix-deepsource-residual.yml
          git commit -m "refactor(partner): clear residual DeepSource findings"
          git push origin HEAD:agent/partner-anti-abuse-pr3-cashout-ops
