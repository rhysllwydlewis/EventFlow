name: Bootstrap homepage TypeScript

on:
  push:
    branches:
      - fix/home-v2-v3-typescript-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-v2-v3-typescript-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm install --save-dev typescript

      - name: Create TypeScript source tree
        run: |
          mkdir -p src/homepages
          cp public/assets/js/pages/home-v2.js src/homepages/home-v2.ts
          cp public/assets/js/pages/home-v3.js src/homepages/home-v3.ts
          cp public/assets/js/pages/home-v3-video.js src/homepages/home-v3-video.ts
          cat > src/homepages/globals.d.ts <<'EOF'
          interface Navigator {
            connection?: {
              saveData?: boolean;
              effectiveType?: string;
            };
          }

          interface Window {
            __EF_HOME_V3_PREVIEW__?: boolean;
            __collageWidgetInitialized?: boolean;
            __efHomepageUploadBridgeInstalled?: boolean;
            pexelsClient?: unknown;
          }

          interface HTMLElement {
            _target?: HTMLElement;
            _placeGuide?: () => void;
          }
          EOF
          cat > tsconfig.homepages.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "none",
              "lib": ["DOM", "DOM.Iterable", "ES2020"],
              "rootDir": "src/homepages",
              "outDir": "public/assets/js/pages",
              "strict": false,
              "noImplicitAny": false,
              "skipLibCheck": true,
              "noEmitOnError": true,
              "removeComments": false,
              "sourceMap": false,
              "newLine": "lf"
            },
            "include": ["src/homepages/**/*.ts", "src/homepages/**/*.d.ts"]
          }
          EOF

      - name: Record initial TypeScript diagnostics
        run: |
          set +e
          npx tsc -p tsconfig.homepages.json --noEmit > homepage-typescript-errors.txt 2>&1
          status=$?
          echo "TSC_STATUS=$status" >> "$GITHUB_ENV"
          cat homepage-typescript-errors.txt
          exit 0

      - name: Add package scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['build:homepages'] = 'tsc -p tsconfig.homepages.json';
          pkg.scripts['typecheck:homepages'] = 'tsc -p tsconfig.homepages.json --noEmit';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Commit bootstrap and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-homepage-typescript.yml
          git add package.json package-lock.json tsconfig.homepages.json src/homepages homepage-typescript-errors.txt
          git commit -m "Bootstrap V2 and V3 TypeScript sources"
          git push origin HEAD:fix/home-v2-v3-typescript-migration
