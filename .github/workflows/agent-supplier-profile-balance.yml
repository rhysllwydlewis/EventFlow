name: Agent supplier profile balance patch

on:
  push:
    branches:
      - agent/supplier-profile-header-layout-balance

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-balance-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-header-layout-balance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused supplier profile layout correction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          css_path = Path('public/assets/css/supplier-profile-theme.css')
          css = css_path.read_text()
          marker = '/* Supplier profile layout balance v20.1 */'
          if marker not in css:
              css += r'''

          /* Supplier profile layout balance v20.1 */
          html[data-sp-hero-mode='preset'],
          html[data-sp-hero-mode='category'],
          html[data-sp-hero-mode='theme'] {
            --sp-hero-height: 176px;
            --sp-hero-height-mobile: 148px;
          }

          .hero-avatar-wrap {
            top: calc(var(--sp-hero-height) - 2.25rem) !important;
          }

          .hero-content {
            min-height: calc(var(--sp-avatar-size) + 0.75rem);
            padding-top: 1rem !important;
            padding-bottom: 1.35rem !important;
          }

          .hero-identity .hero-badges,
          .hero-badges.hero-badges--identity {
            position: static !important;
            inset: auto !important;
            display: flex !important;
            flex-wrap: wrap;
            justify-content: flex-start !important;
            gap: 0.45rem !important;
            width: auto !important;
            margin: 0.7rem 0 0 !important;
            padding: 0 !important;
            transform: none !important;
          }

          .hero-identity .hero-badges:empty {
            display: none !important;
          }

          .sp-contact-card {
            color: #0b1220 !important;
            background: #ffffff !important;
            border: 1px solid var(--sp-profile-accent-border) !important;
            box-shadow:
              0 1px 3px rgba(15, 23, 42, 0.06),
              0 10px 28px rgba(15, 23, 42, 0.06) !important;
          }

          .sp-contact-card .sp-cta-card__name {
            color: var(--sp-profile-accent-strong) !important;
          }

          .sp-contact-card .sp-cta-card__title {
            color: #0b1220 !important;
            font-size: 1.125rem !important;
            margin-bottom: 0.8rem !important;
          }

          .sp-contact-summary {
            display: grid;
            gap: 0.65rem;
            margin: 0 0 1rem;
          }

          .sp-contact-summary__row {
            display: grid;
            grid-template-columns: 1.35rem minmax(0, 1fr);
            gap: 0.6rem;
            align-items: start;
            color: #475467;
          }

          .sp-contact-summary__icon {
            display: inline-grid;
            place-items: center;
            width: 1.35rem;
            height: 1.35rem;
            color: var(--sp-profile-accent-strong);
          }

          .sp-contact-summary__icon svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
          }

          .sp-contact-summary__label {
            display: block;
            margin-bottom: 0.08rem;
            color: #667085;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
          }

          .sp-contact-summary__value {
            display: block;
            color: #344054;
            font-size: 0.875rem;
            line-height: 1.45;
          }

          .sp-contact-card .sp-cta-btn--primary {
            color: var(--sp-profile-accent-strong) !important;
            background: var(--sp-profile-accent-soft) !important;
            border: 1px solid var(--sp-profile-accent-border) !important;
            box-shadow: none !important;
          }

          .sp-contact-card .sp-cta-btn--primary:hover {
            color: var(--sp-profile-on-strong) !important;
            background: var(--sp-profile-accent-strong) !important;
            border-color: var(--sp-profile-accent-strong) !important;
          }

          .sp-contact-card .sp-cta-card__note[hidden] {
            display: none !important;
          }

          .sp-about__description,
          .sp-contact-summary__value,
          .sp-detail-row,
          .sp-highlight-item {
            font-size: 0.9375rem !important;
          }

          .sp-card-title {
            font-size: 1rem !important;
          }

          .sp-highlights,
          .sp-stats {
            background: linear-gradient(
              135deg,
              rgba(255, 255, 255, 0.98),
              var(--sp-profile-accent-soft)
            ) !important;
          }

          body.sp-profile-page.ef-pwa-banner-visible .sp-page {
            padding-bottom: calc(7rem + var(--ef-pwa-banner-height, 80px)) !important;
          }

          @media (min-width: 1180px) {
            :root {
              --sp-page-max-width: 1360px;
              --sp-sidebar-width: 300px;
              --sp-grid-gap: 2rem;
              --sp-card-pad: 1.5rem 1.625rem;
            }

            body.sp-profile-page #ef-pwa-install-banner {
              right: 1.25rem !important;
              left: auto !important;
              width: min(420px, calc(100vw - 2.5rem)) !important;
              transform: none !important;
            }
          }

          @media (max-width: 680px) {
            .hero-avatar-wrap {
              top: calc(var(--sp-hero-height-mobile) - 1.75rem) !important;
            }

            .hero-content {
              min-height: calc(var(--sp-avatar-size) + 0.7rem);
              padding-top: 0.85rem !important;
            }

            .hero-identity .hero-badges {
              margin-top: 0.55rem !important;
            }
          }
          '''
              css_path.write_text(css)

          js_path = Path('public/assets/js/supplier-profile-polish.js')
          js = js_path.read_text()
          js = js.replace(
              "const PROFILE_THEME_STYLESHEET_HREF = '/assets/css/supplier-profile-theme.css?v=20.0.0';",
              "const PROFILE_THEME_STYLESHEET_HREF = '/assets/css/supplier-profile-theme.css?v=20.1.0';",
          )

          function_marker = 'function applySupplierProfileTheme(supplier = window.__supplierData) {'
          helpers = r'''
          const CONTACT_ICONS = Object.freeze({
            response:
              '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
            location:
              '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5.5-8 11-8 11S4 15.5 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
            price:
              '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 7.5c0-2-1.7-3.5-4-3.5S8 5.5 8 7.5 9.7 11 12 11s4 1.5 4 3.5S14.3 18 12 18s-4-1.5-4-3.5M12 2v20"/></svg>',
          });

          function moveHeroBadgesIntoIdentity() {
            const badges = document.getElementById('hero-badges');
            const identity = document.querySelector('.hero-identity');
            if (!badges || !identity) {
              return;
            }
            if (badges.parentElement !== identity) {
              identity.appendChild(badges);
            }
            badges.classList.add('hero-badges--identity');
          }

          function formatStartingPrice(supplier = {}) {
            const numericCandidates = [
              supplier.startingPrice,
              supplier.priceFrom,
              supplier.minimumPrice,
              supplier.minPrice,
            ];
            const numeric = numericCandidates
              .map(value => Number(value))
              .find(value => Number.isFinite(value) && value > 0);
            if (numeric) {
              return new Intl.NumberFormat('en-GB', {
                style: 'currency',
                currency: 'GBP',
                maximumFractionDigits: 0,
              }).format(numeric);
            }
            const range = String(supplier.priceRange || '').trim();
            return range || null;
          }

          function createContactSummaryRow(label, value, iconName) {
            const row = document.createElement('div');
            row.className = 'sp-contact-summary__row';

            const icon = document.createElement('span');
            icon.className = 'sp-contact-summary__icon';
            icon.setAttribute('aria-hidden', 'true');
            icon.innerHTML = CONTACT_ICONS[iconName];

            const copy = document.createElement('span');
            const labelNode = document.createElement('span');
            labelNode.className = 'sp-contact-summary__label';
            labelNode.textContent = label;
            const valueNode = document.createElement('span');
            valueNode.className = 'sp-contact-summary__value';
            valueNode.textContent = value;
            copy.append(labelNode, valueNode);
            row.append(icon, copy);
            return row;
          }

          function polishContactHierarchy(supplier = {}) {
            document.body?.classList.add('sp-profile-page');
            moveHeroBadgesIntoIdentity();

            const card = document.querySelector('.sp-cta-card');
            if (!card) {
              return;
            }
            card.classList.add('sp-contact-card');

            const eyebrow = card.querySelector('.sp-cta-card__name');
            if (eyebrow) {
              eyebrow.textContent = 'Contact & availability';
            }

            const title = card.querySelector('.sp-cta-card__title');
            if (title) {
              title.textContent = supplier.name ? `Plan with ${supplier.name}` : 'Plan your enquiry';
            }

            let summary = card.querySelector('.sp-contact-summary');
            if (!summary) {
              summary = document.createElement('div');
              summary.className = 'sp-contact-summary';
              card.querySelector('.sp-cta-card__actions')?.before(summary);
            }
            summary.replaceChildren();
            summary.append(
              createContactSummaryRow(
                'Response',
                formatResponseMessage(supplier.avgResponseTime),
                'response'
              )
            );
            if (supplier.location) {
              summary.append(createContactSummaryRow('Location', String(supplier.location), 'location'));
            }
            const startingPrice = formatStartingPrice(supplier);
            if (startingPrice) {
              summary.append(createContactSummaryRow('Starting from', startingPrice, 'price'));
            }

            const button = card.querySelector('#sidebar-btn-enquiry');
            if (button) {
              button.innerHTML =
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Send a message</span>';
            }

            const note = card.querySelector('.sp-cta-card__note');
            if (note) {
              note.hidden = true;
            }
          }

          '''
          if 'function polishContactHierarchy' not in js:
              if function_marker not in js:
                  raise SystemExit('applySupplierProfileTheme marker not found')
              js = js.replace(function_marker, helpers + function_marker)

          old_calls = '''  updateHeroThemeState(supplier, theme);\n  polishSidebarDetails(supplier);\n  document.documentElement.dataset.spThemeReady = 'true';'''
          new_calls = '''  updateHeroThemeState(supplier, theme);\n  polishSidebarDetails(supplier);\n  polishContactHierarchy(supplier);\n  document.documentElement.dataset.spThemeReady = 'true';'''
          if old_calls in js:
              js = js.replace(old_calls, new_calls)
          elif 'polishContactHierarchy(supplier);' not in js:
              raise SystemExit('theme call site not found')
          js_path.write_text(js)

          unit_path = Path('tests/unit/supplier-profile-layout-balance.test.js')
          unit_path.write_text(r'''\
          'use strict';

          const fs = require('fs');
          const path = require('path');

          const read = relative => fs.readFileSync(path.join(__dirname, '../..', relative), 'utf8');

          const themeJs = read('public/assets/js/supplier-profile-polish.js');
          const themeCss = read('public/assets/css/supplier-profile-theme.css');

          describe('supplier profile layout balance contracts', () => {
            test('compacts fallback heroes while preserving full image heroes', () => {
              expect(themeCss).toContain("html[data-sp-hero-mode='preset']");
              expect(themeCss).toContain('--sp-hero-height: 176px');
              expect(themeCss).toContain('--sp-hero-height-mobile: 148px');
              expect(themeCss).toMatch(/\.hero-avatar-wrap\s*\{[\s\S]*var\(--sp-hero-height\) - 2\.25rem/);
            });

            test('moves badges into the identity and makes sidebar contact secondary', () => {
              expect(themeJs).toContain('function moveHeroBadgesIntoIdentity()');
              expect(themeJs).toContain("identity.appendChild(badges)");
              expect(themeJs).toContain("eyebrow.textContent = 'Contact & availability'");
              expect(themeJs).toContain('function polishContactHierarchy');
              expect(themeCss).toContain('.sp-contact-card .sp-cta-btn--primary');
              expect(themeCss).toContain('background: var(--sp-profile-accent-soft) !important');
            });

            test('widens large desktop profiles and protects content from fixed install UI', () => {
              expect(themeCss).toContain('--sp-page-max-width: 1360px');
              expect(themeCss).toContain('body.sp-profile-page.ef-pwa-banner-visible .sp-page');
              expect(themeCss).toContain('padding-bottom: calc(7rem + var(--ef-pwa-banner-height, 80px))');
              expect(themeJs).toContain("document.body?.classList.add('sp-profile-page')");
            });

            test('cache-busts the corrected theme layer', () => {
              expect(themeJs).toContain('/assets/css/supplier-profile-theme.css?v=20.1.0');
            });
          });
          ''')

          e2e_path = Path('e2e/supplier-profile-visual-overhaul.spec.js')
          e2e = e2e_path.read_text()
          e2e_marker = "test('compacts fallback heroes and makes the contact hierarchy deliberate'"
          if e2e_marker not in e2e:
              insertion = r'''

            test('compacts fallback heroes and makes the contact hierarchy deliberate', async ({ page }) => {
              await page.setViewportSize({ width: 1440, height: 1000 });
              await openProfile(page, makeSupplier({ heroPreset: 'midnight' }));

              const layout = await page.evaluate(() => {
                const hero = document.querySelector('.hero-media').getBoundingClientRect();
                const avatar = document.getElementById('hero-avatar').getBoundingClientRect();
                const heroButton = getComputedStyle(document.getElementById('btn-enquiry'));
                const sidebarCard = getComputedStyle(document.querySelector('.sp-contact-card'));
                const sidebarButton = getComputedStyle(document.getElementById('sidebar-btn-enquiry'));
                return {
                  heroHeight: hero.height,
                  heroBottom: hero.bottom,
                  avatarTop: avatar.top,
                  avatarBottom: avatar.bottom,
                  badgesParent: document.getElementById('hero-badges').parentElement.className,
                  heroButtonImage: heroButton.backgroundImage,
                  sidebarBackground: sidebarCard.backgroundColor,
                  sidebarButtonImage: sidebarButton.backgroundImage,
                };
              });

              expect(layout.heroHeight).toBeLessThanOrEqual(190);
              expect(layout.avatarTop).toBeLessThan(layout.heroBottom);
              expect(layout.avatarBottom).toBeGreaterThan(layout.heroBottom);
              expect(layout.badgesParent).toContain('hero-identity');
              expect(layout.heroButtonImage).not.toBe('none');
              expect(layout.sidebarBackground).toBe('rgb(255, 255, 255)');
              expect(layout.sidebarButtonImage).toBe('none');
              await expect(page.locator('.sp-cta-card__name')).toHaveText('Contact & availability');
              await expect(page.locator('.sp-cta-card__title')).toHaveText('Plan with Alex Example');
              await expect(page.locator('.sp-contact-summary__row')).toHaveCount(2);
            });

            test('keeps uploaded-banner profiles at the full hero height', async ({ page }) => {
              await page.route('**/test-assets/supplier-banner.svg', route =>
                route.fulfill({
                  status: 200,
                  contentType: 'image/svg+xml',
                  body: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400"><rect width="1200" height="400" fill="#0f3460"/></svg>',
                })
              );
              await page.setViewportSize({ width: 1440, height: 1000 });
              await openProfile(
                page,
                makeSupplier({ bannerUrl: '/test-assets/supplier-banner.svg', heroPreset: 'midnight' })
              );

              await expect(page.locator('html')).toHaveAttribute('data-sp-hero-mode', 'image');
              const hero = await page.locator('.hero-media').boundingBox();
              expect(hero.height).toBeGreaterThanOrEqual(280);
            });

            test('uses a readable large-screen content scale and reserves overlay clearance', async ({ page }) => {
              await page.setViewportSize({ width: 1600, height: 1000 });
              await openProfile(page, makeSupplier());

              const result = await page.evaluate(() => {
                document.body.classList.add('ef-pwa-banner-visible');
                const pageShell = document.querySelector('.sp-page');
                const description = document.querySelector('.sp-about__description');
                return {
                  pageWidth: pageShell.getBoundingClientRect().width,
                  bodyCopy: Number.parseFloat(getComputedStyle(description).fontSize),
                  paddingBottom: Number.parseFloat(getComputedStyle(pageShell).paddingBottom),
                };
              });

              expect(result.pageWidth).toBeGreaterThanOrEqual(1300);
              expect(result.bodyCopy).toBeGreaterThanOrEqual(15);
              expect(result.paddingBottom).toBeGreaterThanOrEqual(180);
            });
          '''
              closing = e2e.rfind('\n});')
              if closing == -1:
                  raise SystemExit('E2E describe closing marker not found')
              e2e = e2e[:closing] + insertion + e2e[closing:]
              e2e_path.write_text(e2e)
          PY

      - name: Format changed files with repository tooling
        run: |
          npm ci --ignore-scripts
          npx prettier --write \
            public/assets/css/supplier-profile-theme.css \
            public/assets/js/supplier-profile-polish.js \
            tests/unit/supplier-profile-layout-balance.test.js \
            e2e/supplier-profile-visual-overhaul.spec.js

      - name: Commit corrected supplier profile layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/assets/css/supplier-profile-theme.css \
            public/assets/js/supplier-profile-polish.js \
            tests/unit/supplier-profile-layout-balance.test.js \
            e2e/supplier-profile-visual-overhaul.spec.js
          git commit -m "Refine supplier profile header and contact hierarchy [agent-balance-applied]"
          git push origin HEAD:agent/supplier-profile-header-layout-balance
