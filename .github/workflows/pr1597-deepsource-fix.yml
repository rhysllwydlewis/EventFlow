name: PR1597 DeepSource Fix

on:
  push:
    branches:
      - fix/google-facebook-auth-button-rendering

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip deepsource-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/google-facebook-auth-button-rendering
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply DeepSource fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/assets/js/pages/auth-google-init.js';
          let source = fs.readFileSync(path, 'utf8');
          const before = `      redirect &&\n      redirect.startsWith('/') &&`;
          const after = `      redirect?.startsWith('/') &&`;
          if (!source.includes(before)) {
            throw new Error('Expected Google return-path condition not found');
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format and lint changed auth files
        run: |
          npx prettier --write public/assets/js/pages/auth-google-init.js public/assets/js/pages/auth-facebook-init.js
          npx eslint --rulesdir eslint-rules public/assets/js/pages/auth-google-init.js public/assets/js/pages/auth-facebook-init.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "eventflow-ci-helper"
          git config user.email "eventflow-ci-helper@users.noreply.github.com"
          git add public/assets/js/pages/auth-google-init.js public/assets/js/pages/auth-facebook-init.js
          git commit -m "Resolve remaining DeepSource auth findings [skip deepsource-fix]"
          git push origin HEAD:fix/google-facebook-auth-button-rendering