name: PR Route Prettier Artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-route:
    name: Generate exact route formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Format route
        run: npx prettier --write routes/review-requests.js

      - name: Upload exact formatted route
        uses: actions/upload-artifact@v4
        with:
          name: exact-review-route-prettier-output
          path: routes/review-requests.js
          if-no-files-found: error
          retention-days: 1
