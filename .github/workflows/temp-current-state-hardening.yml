name: Temporary Current-State Hardening

on:
  push:
    branches: [agent/current-state-security-monitoring-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  HUSKY: '0'
  NODE_ENV: test
  JWT_SECRET: temporary-current-state-hardening-secret-minimum-32-characters

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/current-state-security-monitoring-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Verify package lock
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Apply targeted source patches
        run: node scripts/apply-current-state-hardening.mjs

      - name: Format changed source
        run: |
          npx prettier --write \
            middleware/security.js \
            public/assets/js/app.js \
            public/index.html \
            public/marketplace.html \
            tests/helpers/homepage-stabilisation-scenario.js \
            tests/unit/current-state-hardening.test.js

      - name: Validate syntax and focused contracts
        run: |
          node --check middleware/security.js
          node --check scripts/production-synthetic-check.mjs
          node --check scripts/apply-current-state-hardening.mjs
          npx jest --runInBand --coverage=false \
            tests/unit/current-state-hardening.test.js \
            tests/unit/backend-suite-classification.test.js \
            tests/unit/production-startup-contract.test.js

      - name: Commit generated hardening changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes remain."
            exit 0
          fi
          git config user.name "eventflow-hardening-bot"
          git config user.email "eventflow-hardening-bot@users.noreply.github.com"
          git add middleware/security.js public/assets/js/app.js public/index.html public/marketplace.html tests/helpers/homepage-stabilisation-scenario.js tests/unit/current-state-hardening.test.js
          git commit -m "Enforce canonical host and truthful public content"
          git push origin HEAD:agent/current-state-security-monitoring-hardening
