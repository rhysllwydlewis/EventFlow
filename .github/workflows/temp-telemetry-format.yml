name: Temporary telemetry formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Format audited files
        run: npx prettier --write services/backgroundJobTelemetryBridge.js store.js tests/unit/background-job-telemetry-bridge.test.js

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-telemetry-audit
          path: |
            services/backgroundJobTelemetryBridge.js
            store.js
            tests/unit/background-job-telemetry-bridge.test.js
          if-no-files-found: error
          retention-days: 1
