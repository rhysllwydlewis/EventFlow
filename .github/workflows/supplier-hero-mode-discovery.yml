name: Supplier Hero Mode Discovery

on:
  pull_request:
    paths:
      - '.github/workflows/supplier-hero-mode-discovery.yml'
      - 'scripts/supplier-hero-mode-discovery.mjs'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/supplier-hero-mode-discovery.mjs
