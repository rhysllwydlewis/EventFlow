name: Agent Sync PR 1415

on:
  push:
    branches:
      - agent/partner-anti-abuse-pr1-identity-network
    paths:
      - .github/workflows/agent-sync-pr1415.yml

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr1-identity-network
          fetch-depth: 0

      - name: Merge current main and resolve package metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$unresolved" | grep -v '^package.json$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          if printf '%s\n' "$unresolved" | grep -qx 'package.json'; then
            git checkout --ours package.json
            npm pkg set devDependencies.prettier=3.9.6
            git add package.json
          fi

          if [[ "$merge_status" -ne 0 ]] && [[ -n "$(git diff --name-only --diff-filter=U || true)" ]]; then
            echo "Merge conflicts remain unresolved."
            exit 1
          fi

          git rm .github/workflows/agent-sync-pr1415.yml
          git commit -m "chore: merge current main into PR 1415"
          git push origin HEAD:agent/partner-anti-abuse-pr1-identity-network
