name: Finalise supplier SEO integration

on:
  push:
    branches:
      - feature/server-rendered-supplier-seo
    paths:
      - .github/workflows/finalise-supplier-seo.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/server-rendered-supplier-seo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Correct route comment
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('routes/index.js')
          text = path.read_text()
          old = '// Public, crawlable supplier profiles and supplier-only sitemap.'
          new = '// Public, crawlable supplier profiles with server-rendered metadata.'
          if old not in text:
              raise SystemExit('Expected routes/index.js comment not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed JavaScript
        run: npx prettier --write routes/index.js routes/public-supplier-seo.js services/publicSupplierSeo.service.js sitemap.js tests/unit/public-supplier-seo.test.js tests/integration/public-supplier-seo-route.test.js tests/unit/sitemap.test.js

      - name: Run focused tests
        run: npx jest --runInBand --coverage=false tests/unit/public-supplier-seo.test.js tests/integration/public-supplier-seo-route.test.js tests/unit/sitemap.test.js tests/unit/sitemap-guides.test.js

      - name: Remove one-shot workflow
        run: rm .github/workflows/finalise-supplier-seo.yml

      - name: Commit final source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add routes/index.js routes/public-supplier-seo.js services/publicSupplierSeo.service.js sitemap.js tests/unit/public-supplier-seo.test.js tests/integration/public-supplier-seo-route.test.js tests/unit/sitemap.test.js .github/workflows/finalise-supplier-seo.yml
          git commit -m "Integrate canonical supplier URLs into the existing sitemap"
          git push origin HEAD:feature/server-rendered-supplier-seo
