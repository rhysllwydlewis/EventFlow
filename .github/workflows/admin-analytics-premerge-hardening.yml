name: Admin Analytics Pre-Merge Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/admin-analytics-premerge-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies on cache miss
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Apply pre-merge corrections
        run: |
          python scripts/admin-analytics-premerge-part1.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/admin-analytics-premerge-part2.py')
          source = path.read_text()
          old = r"    if (/^\s*[=+\-@]/.test(text) || /^[\t\r\n]/.test(text)) {"
          new = r"    if (/^\\s*[=+\\-@]/.test(text) || /^[\\t\\r\\n]/.test(text)) {"
          if old not in source:
              raise SystemExit('CSV regex generator source was not found')
          path.write_text(source.replace(old, new, 1))
          PY
          python scripts/admin-analytics-premerge-part2.py
          python scripts/admin-analytics-premerge-part3.py

      - name: Format corrected files
        run: |
          npx prettier --write routes/behaviour-analytics.js
          npx prettier --write utils/behaviourAnalyticsDecision.js
          npx prettier --write public/assets/js/behaviour-analytics.js
          npx prettier --write public/assets/js/pages/admin-analytics-decision.js
          npx prettier --write public/assets/css/admin-analytics-decision.css
          npx prettier --write tests/unit/behaviour-analytics-decision.test.js
          npx prettier --write docs/analytics/admin-analytics-decision-dashboard.md
          npx prettier --write .github/workflows/admin-analytics-decision-validation.yml

      - name: Check corrected JavaScript syntax
        run: |
          node --check routes/behaviour-analytics.js
          node --check utils/behaviourAnalyticsDecision.js
          node --check public/assets/js/behaviour-analytics.js
          node --check public/assets/js/pages/admin-analytics-decision.js
          node --check tests/unit/behaviour-analytics-decision.test.js

      - name: Lint analytics route and aggregator
        run: |
          npx eslint --rulesdir eslint-rules routes/behaviour-analytics.js
          npx eslint --rulesdir eslint-rules utils/behaviourAnalyticsDecision.js

      - name: Lint public collector
        run: npx eslint --rulesdir eslint-rules public/assets/js/behaviour-analytics.js

      - name: Lint admin decision UI
        run: npx eslint --rulesdir eslint-rules public/assets/js/pages/admin-analytics-decision.js

      - name: Lint analytics tests
        run: npx eslint --rulesdir eslint-rules tests/unit/behaviour-analytics-decision.test.js

      - name: Run corrected analytics tests
        run: npx jest tests/unit/behaviour-analytics-decision.test.js --runInBand --coverage=false
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-testing-only-min-32-chars

      - name: Commit corrected branch
        run: |
          git rm \
            .github/workflows/admin-analytics-premerge-hardening.yml \
            scripts/admin-analytics-premerge-part1.py \
            scripts/admin-analytics-premerge-part2.py \
            scripts/admin-analytics-premerge-part3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            routes/behaviour-analytics.js \
            utils/behaviourAnalyticsDecision.js \
            public/assets/js/behaviour-analytics.js \
            public/assets/js/pages/admin-analytics-decision.js \
            public/assets/css/admin-analytics-decision.css \
            tests/unit/behaviour-analytics-decision.test.js \
            docs/analytics/admin-analytics-decision-dashboard.md \
            .github/workflows/admin-analytics-decision-validation.yml
          git commit -m "Harden final admin analytics implementation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
