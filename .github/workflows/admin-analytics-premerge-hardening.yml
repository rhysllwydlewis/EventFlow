name: Admin Analytics Pre-Merge Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/admin-analytics-premerge-hardening.yml'

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies on cache miss
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Apply confirmed pre-merge corrections
        run: |
          python scripts/admin-analytics-premerge-part1.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/admin-analytics-premerge-part2.py')
          source = path.read_text()
          old = r"    if (/^\s*[=+\-@]/.test(text) || /^[\t\r\n]/.test(text)) {"
          new = r"    if (/^\\s*[=+\\-@]/.test(text) || /^[\\t\\r\\n]/.test(text)) {"
          if old not in source:
              raise SystemExit('CSV regex generator source was not found')
          path.write_text(source.replace(old, new, 1))
          PY
          python scripts/admin-analytics-premerge-part2.py
          python scripts/admin-analytics-premerge-part3.py

      - name: Format corrected files
        run: |
          npx prettier --write routes/behaviour-analytics.js
          npx prettier --write utils/behaviourAnalyticsDecision.js
          npx prettier --write public/assets/js/behaviour-analytics.js
          npx prettier --write public/assets/js/pages/admin-analytics-decision.js
          npx prettier --write public/assets/css/admin-analytics-decision.css
          npx prettier --write tests/unit/behaviour-analytics-decision.test.js
          npx prettier --write docs/analytics/admin-analytics-decision-dashboard.md
          npx prettier --write .github/workflows/admin-analytics-decision-validation.yml

      - name: Check corrected JavaScript syntax
        run: |
          node --check routes/behaviour-analytics.js
          node --check utils/behaviourAnalyticsDecision.js
          node --check public/assets/js/behaviour-analytics.js
          node --check public/assets/js/pages/admin-analytics-decision.js

      - name: Lint corrected production JavaScript
        run: |
          npx eslint --rulesdir eslint-rules routes/behaviour-analytics.js
          npx eslint --rulesdir eslint-rules utils/behaviourAnalyticsDecision.js
          npx eslint --rulesdir eslint-rules public/assets/js/behaviour-analytics.js
          npx eslint --rulesdir eslint-rules public/assets/js/pages/admin-analytics-decision.js

      - name: Prepare corrected files artifact
        run: |
          mkdir -p corrected-files/routes corrected-files/utils corrected-files/public/assets/js/pages corrected-files/public/assets/js corrected-files/public/assets/css corrected-files/tests/unit corrected-files/docs/analytics corrected-files/.github/workflows
          cp routes/behaviour-analytics.js corrected-files/routes/
          cp utils/behaviourAnalyticsDecision.js corrected-files/utils/
          cp public/assets/js/behaviour-analytics.js corrected-files/public/assets/js/
          cp public/assets/js/pages/admin-analytics-decision.js corrected-files/public/assets/js/pages/
          cp public/assets/css/admin-analytics-decision.css corrected-files/public/assets/css/
          cp tests/unit/behaviour-analytics-decision.test.js corrected-files/tests/unit/
          cp docs/analytics/admin-analytics-decision-dashboard.md corrected-files/docs/analytics/
          cp .github/workflows/admin-analytics-decision-validation.yml corrected-files/.github/workflows/

      - name: Upload corrected files
        uses: actions/upload-artifact@v4
        with:
          name: admin-analytics-corrected-files
          path: corrected-files
          retention-days: 1
          if-no-files-found: error
