name: Phase 2 Final Helper

on:
  push:
    branches:
      - phase2-final/claims-seo-guards

permissions:
  contents: write

jobs:
  patch-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-final/claims-seo-guards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Add Supplier Bot claim indexes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('db-unified.js')
          s = p.read_text()
          marker = "    await suppliersCollection.createIndex({ approved: 1 });\n    const packagesCollection = mongodb.collection('packages');"
          replacement = """    await suppliersCollection.createIndex({ approved: 1 });
    const supplierClaimsCollection = mongodb.collection('supplierClaims');
    await supplierClaimsCollection.createIndex({ id: 1 }, { unique: true });
    await supplierClaimsCollection.createIndex(
      { supplierId: 1, requesterUserId: 1 },
      { unique: true }
    );
    const packagesCollection = mongodb.collection('packages');"""
          if "const supplierClaimsCollection = mongodb.collection('supplierClaims')" not in s:
              if marker not in s:
                  raise SystemExit('claim index insertion marker not found')
              s = s.replace(marker, replacement, 1)
              p.write_text(s)
          PY
      - name: Format final Phase 2 files
        run: >-
          npx prettier --write
          db-unified.js
          routes/supplier-profile-safe.js
          routes/supplier-profile-package-cards.js
          services/supplierBotClaim.service.js
          tests/unit/supplier-bot-review-hardening.test.js
      - name: Run focused Phase 2 tests
        run: >-
          npx jest
          tests/unit/supplier-bot-phase2-completion.test.js
          tests/unit/supplier-bot-claim-route.test.js
          tests/unit/supplier-bot-collision-rollback.test.js
          tests/unit/supplier-bot-review-hardening.test.js
          tests/unit/account-type-conversion.test.js
          --coverage=false --runInBand
      - name: Commit final helper output
        run: |
          if git diff --quiet; then
            echo "No helper changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db-unified.js routes/supplier-profile-safe.js routes/supplier-profile-package-cards.js services/supplierBotClaim.service.js tests/unit/supplier-bot-review-hardening.test.js
          git commit -m "fix: finalise Phase 2 claim safety guards"
          git push origin HEAD:phase2-final/claims-seo-guards
