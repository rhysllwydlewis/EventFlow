name: Apply partner dashboard reliability payload

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-partner-dashboard-reliability
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/partner-dashboard-reliability' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/partner-dashboard-reliability
          fetch-depth: 0

      - name: Detect pending payload
        id: payload
        shell: bash
        run: |
          if [[ -d .partner-payload ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "Partner payload already applied; no installer work required."
          fi

      - name: Verify and apply payload
        if: steps.payload.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .partner-payload/payload.part.* > /tmp/partner-dashboard-payload.b64
          base64 --decode /tmp/partner-dashboard-payload.b64 > /tmp/partner-dashboard-payload.tar.gz
          echo "87b07c1338ea8d21d476697aa0c62bc96b4ce58c0be3afad57db7c5428cbb82e  /tmp/partner-dashboard-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/partner-dashboard-payload.tar.gz -C .
          rm -rf .partner-payload

      - name: Setup Node.js
        if: steps.payload.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        if: steps.payload.outputs.apply == 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Format changed files
        if: steps.payload.outputs.apply == 'true'
        run: >-
          npx prettier --write
          services/partnerService.js
          routes/partner.js
          public/partner/dashboard.html
          public/assets/css/partner-dashboard-v2.css
          public/assets/js/pages/partner-dashboard-init.js
          tests/unit/partner-cashout-requests.test.js
          tests/unit/partner-new-endpoints.test.js
          tests/unit/partner-payout-validation.test.js
          tests/unit/partner-ledger-integrity.test.js
          tests/unit/partner-dashboard-frontend.test.js
          docs/PARTNER_PORTAL.md

      - name: Validate JavaScript syntax
        if: steps.payload.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check services/partnerService.js
          node --check routes/partner.js
          node --check public/assets/js/pages/partner-dashboard-init.js
          node --check tests/unit/partner-cashout-requests.test.js
          node --check tests/unit/partner-new-endpoints.test.js
          node --check tests/unit/partner-payout-validation.test.js
          node --check tests/unit/partner-ledger-integrity.test.js
          node --check tests/unit/partner-dashboard-frontend.test.js

      - name: Run focused partner tests
        if: steps.payload.outputs.apply == 'true'
        id: focused-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx jest --runInBand --coverage=false \
            tests/unit/partner-cashout-requests.test.js \
            tests/unit/partner-new-endpoints.test.js \
            tests/unit/partner-payout-validation.test.js \
            tests/unit/partner-ledger-integrity.test.js \
            tests/unit/partner-dashboard-frontend.test.js \
            tests/unit/partner-points-enhancements.test.js \
            2>&1 | tee focused-partner-tests.log

      - name: Upload focused test diagnostics
        if: steps.payload.outputs.apply == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-dashboard-focused-tests
          path: focused-partner-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce focused partner tests
        if: steps.payload.outputs.apply == 'true' && steps.focused-tests.outcome == 'failure'
        run: exit 1

      - name: Lint changed JavaScript
        if: steps.payload.outputs.apply == 'true'
        run: >-
          npx eslint
          services/partnerService.js
          routes/partner.js
          public/assets/js/pages/partner-dashboard-init.js
          tests/unit/partner-cashout-requests.test.js
          tests/unit/partner-new-endpoints.test.js
          tests/unit/partner-payout-validation.test.js
          tests/unit/partner-ledger-integrity.test.js
          tests/unit/partner-dashboard-frontend.test.js
          --rulesdir eslint-rules

      - name: Commit implementation
        if: steps.payload.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/partnerService.js routes/partner.js public/partner/dashboard.html public/assets/css/partner-dashboard-v2.css public/assets/js/pages/partner-dashboard-init.js tests/unit/partner-cashout-requests.test.js tests/unit/partner-new-endpoints.test.js tests/unit/partner-payout-validation.test.js tests/unit/partner-ledger-integrity.test.js tests/unit/partner-dashboard-frontend.test.js docs/PARTNER_PORTAL.md .partner-payload
          git commit -m "fix(partner): harden reward cashouts and improve dashboard [partner-payload-applied]"
          git push origin HEAD:agent/partner-dashboard-reliability
