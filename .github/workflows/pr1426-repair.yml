name: PR 1426 Repair

on:
  push:
    branches:
      - feat/signup-attribution-session-replay

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/signup-attribution-session-replay
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci --prefer-offline --no-audit

      - name: Restore analytics compatibility and attribution coverage
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('public/assets/js/analytics-consent-upgrade.js')
          source = path.read_text()

          if 'POSTHOG_PAGEVIEW_TIMEOUT_MS' not in source:
              source = source.replace(
                  "  const FETCH_WRAPPED_FLAG = '__efAnalyticsSuccessObserver';\n",
                  "  const FETCH_WRAPPED_FLAG = '__efAnalyticsSuccessObserver';\n"
                  "  const POSTHOG_PAGEVIEW_POLL_MS = 200;\n"
                  "  const POSTHOG_PAGEVIEW_TIMEOUT_MS = 15 * 1000;\n",
              )

          if "let capturedPostHogPage = '';" not in source:
              source = source.replace(
                  "  const SOCIAL_HOSTS = [",
                  "  let capturedPostHogPage = '';\n"
                  "  let capturedPostHogPageleave = false;\n"
                  "  let posthogPageviewStartedAt = 0;\n"
                  "  let posthogPageviewTimer = null;\n\n"
                  "  const SOCIAL_HOSTS = [",
              )

          old_clean = """  function clean(value, max = 160) {
            return String(value || '')
              .replace(/[\\u0000-\\u001f\\u007f]/g, ' ')
              .trim()
              .slice(0, max);
          }
          """
          new_clean = """  function clean(value, max = 160) {
            const sanitized = Array.from(String(value || ''))
              .map(character => {
                const code = character.charCodeAt(0);
                return code >= 32 && code !== 127 ? character : ' ';
              })
              .join('');
            return sanitized.trim().slice(0, max);
          }
          """
          source = source.replace(old_clean, new_clean)

          if 'function queryFreePageUrl()' not in source:
              marker = '  function identify(user, signupMethod) {\n'
              page_functions = """  function queryFreePageUrl() {
            return `${window.location.origin}${currentPath()}`;
          }

          function clearPostHogPageviewTimer() {
            if (posthogPageviewTimer) {
              window.clearTimeout(posthogPageviewTimer);
              posthogPageviewTimer = null;
            }
          }

          function postHogIsInitialised() {
            if (!window.posthog || typeof window.posthog.capture !== 'function') {
              return false;
            }
            return Boolean(
              window.posthog.__loaded ||
                (Array.isArray(window.posthog._i) && window.posthog._i.length)
            );
          }

          function capturePostHogPageview() {
            if (!hasAnalyticsConsent() || pathMatches(SENSITIVE_PATHS) || !postHogIsInitialised()) {
              return false;
            }
            const currentUrl = queryFreePageUrl();
            if (capturedPostHogPage === currentUrl) {
              return true;
            }
            window.posthog.capture('$pageview', {
              $current_url: currentUrl,
              $pathname: currentPath(),
              ...attributionProperties(),
            });
            capturedPostHogPage = currentUrl;
            capturedPostHogPageleave = false;
            return true;
          }

          function tryCapturePostHogPageview() {
            if (capturePostHogPageview()) {
              clearPostHogPageviewTimer();
              return;
            }
            if (Date.now() - posthogPageviewStartedAt >= POSTHOG_PAGEVIEW_TIMEOUT_MS) {
              clearPostHogPageviewTimer();
              return;
            }
            posthogPageviewTimer = window.setTimeout(
              tryCapturePostHogPageview,
              POSTHOG_PAGEVIEW_POLL_MS
            );
          }

          function queuePostHogPageview() {
            clearPostHogPageviewTimer();
            if (!hasAnalyticsConsent() || pathMatches(SENSITIVE_PATHS)) {
              return;
            }
            posthogPageviewStartedAt = Date.now();
            tryCapturePostHogPageview();
          }

          function capturePostHogPageleave() {
            const currentUrl = queryFreePageUrl();
            if (
              capturedPostHogPageleave ||
              !capturedPostHogPage ||
              !hasAnalyticsConsent() ||
              pathMatches(SENSITIVE_PATHS) ||
              !postHogIsInitialised() ||
              capturedPostHogPage !== currentUrl
            ) {
              return;
            }
            window.posthog.capture(
              '$pageleave',
              {
                $current_url: currentUrl,
                $pathname: currentPath(),
              },
              { transport: 'sendBeacon' }
            );
            capturedPostHogPageleave = true;
          }

          function handlePostHogPageShow(event) {
            if (!event || event.persisted !== true) {
              return;
            }
            capturedPostHogPageleave = false;
          }

          """
              source = source.replace(marker, page_functions + marker)

          old_pageview = """      window.posthog.opt_in_capturing?.();
                if (!sensitive && provider.sessionRecordingEnabled) window.posthog.startSessionRecording?.();
                if (!sensitive) {
                  capturePostHog('$pageview', {
                    $current_url: `${window.location.origin}${currentPath()}`,
                    $pathname: currentPath(),
                    ...attributionProperties(),
                  });
                }
                return true;
          """
          new_pageview = """      window.posthog.opt_in_capturing?.();
                if (!sensitive && provider.sessionRecordingEnabled) {
                  window.posthog.startSessionRecording?.();
                }
                if (!sensitive) {
                  queuePostHogPageview();
                }
                return true;
          """
          source = source.replace(old_pageview, new_pageview)

          if 'function successfulEventFor(request)' not in source:
              marker = '  async function handleSuccess(request, response) {\n'
              conversion_function = """  function successfulEventFor(request) {
            if (request.method === 'POST' && /^\\/api\\/(?:v1\\/)?auth\\/register\\/?$/.test(request.url)) {
              return {
                event: 'registration_completed',
                properties: { conversionType: 'registration', source: 'server_response' },
              };
            }
            if (request.method === 'POST' && /^\\/api\\/(?:v1\\/)?quote-requests\\/?$/.test(request.url)) {
              return {
                event: 'quote_request_submitted',
                properties: { conversionType: 'quote_request', source: 'server_response' },
              };
            }
            if (request.method === 'POST' && /^\\/api\\/(?:v1\\/)?me\\/packages\\/?$/.test(request.url)) {
              return {
                event: 'package_created',
                properties: { conversionType: 'package_created', source: 'server_response' },
              };
            }
            return null;
          }

          """
              source = source.replace(marker, conversion_function + marker)

          source = source.replace(
              "  async function handleSuccess(request, response) {\n    if (!response?.ok) return;\n",
              "  async function handleSuccess(request, response) {\n",
          )
          source = source.replace(
              """      window.EFAnalytics?.track?.('registration_completed', {
                conversionType: 'registration',
                source: properties.first_channel || 'unknown',
              });
              window.EFAnalytics?.flush?.();
          """,
              '',
          )

          old_observer = """      return original(input, options).then(response => {
                handleSuccess(request, response).catch(() => {});
                return response;
              });
          """
          new_observer = """      return original(input, options).then(response => {
                const conversion = response.ok ? successfulEventFor(request) : null;
                if (conversion) {
                  if (conversion.event === 'registration_completed') {
                    const attribution = attributionProperties();
                    conversion.properties.source = attribution.first_channel || 'unknown';
                  }
                  window.EFAnalytics?.track?.(conversion.event, conversion.properties);
                  window.EFAnalytics?.flush?.();
                }
                if (response.ok) {
                  handleSuccess(request, response).catch(() => {});
                }
                return response;
              });
          """
          source = source.replace(old_observer, new_observer)

          if "window.addEventListener('pagehide', capturePostHogPageleave);" not in source:
              source = source.replace(
                  '  function upgradeConsentCopy(root) {\n',
                  "  window.addEventListener('pagehide', capturePostHogPageleave);\n"
                  "  window.addEventListener('pageshow', handlePostHogPageShow);\n\n"
                  '  function upgradeConsentCopy(root) {\n',
              )

          old_consent = """  window.addEventListener('cookieConsentChanged', event => {
            if (event.detail?.analytics === true) start();
            else window.posthog?.opt_out_capturing?.();
          });
          """
          new_consent = """  window.addEventListener('cookieConsentChanged', event => {
            if (event.detail?.analytics === true) {
              start();
              queuePostHogPageview();
            } else {
              capturedPostHogPage = '';
              capturedPostHogPageleave = false;
              clearPostHogPageviewTimer();
              window.posthog?.opt_out_capturing?.();
            }
          });
          """
          source = source.replace(old_consent, new_consent)

          path.write_text(source)
          PY

      - name: Format changed files
        run: >-
          npx prettier --write
          public/assets/js/analytics-consent-upgrade.js
          routes/behaviour-analytics.js
          tests/unit/analytics-attribution-session-replay.test.js
          docs/analytics/signup-attribution-and-session-replay.md

      - name: Validate focused analytics changes
        run: |
          node --check public/assets/js/analytics-consent-upgrade.js
          node --check routes/behaviour-analytics.js
          npx eslint --rulesdir eslint-rules public/assets/js/analytics-consent-upgrade.js routes/behaviour-analytics.js tests/unit/analytics-attribution-session-replay.test.js
          npx jest tests/unit/analytics-independent-hardening.test.js tests/unit/behaviour-analytics-integration.test.js tests/unit/analytics-attribution-session-replay.test.js --runInBand --coverage=false
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci-testing-only-min-32-chars

      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/js/analytics-consent-upgrade.js routes/behaviour-analytics.js tests/unit/analytics-attribution-session-replay.test.js docs/analytics/signup-attribution-and-session-replay.md
          git commit -m 'fix: preserve analytics contracts and format attribution changes'
          git push origin HEAD:feat/signup-attribution-session-replay
