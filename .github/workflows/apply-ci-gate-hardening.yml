name: Apply CI Gate Hardening

on:
  push:
    branches: [agent/block-full-regression-ci]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[ci-hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/block-full-regression-ci
          fetch-depth: 0

      - name: Harden regression gates
        run: |
          python - <<'PY'
          from pathlib import Path

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()

          replacements = [
              ('name: Full Regression (non-blocking)', 'name: Full Regression (blocking)'),
              ('    timeout-minutes: 25\n    continue-on-error: true\n\n    steps:', '    timeout-minutes: 25\n\n    steps:'),
              ('      - name: Report non-blocking regression failure\n        if: always() && steps.full-regression.outcome == \'failure\'\n        run: echo "::warning::The full regression suite failed. Download full-regression-results-ci for the exact failing suites and assertions."', '      - name: Report regression failure\n        if: always() && steps.full-regression.outcome == \'failure\'\n        run: echo "::error::The full regression suite failed. Download full-regression-results-ci for the exact failing suites and assertions."'),
              ('    needs: [lint, formatting, smoke, homepage-typecheck, security]', '    needs: [lint, formatting, smoke, homepage-typecheck, full-regression, security]'),
          ]

          for old, new in replacements:
              if old not in ci:
                  raise SystemExit(f'Missing expected ci.yml block: {old!r}')
              ci = ci.replace(old, new, 1)

          ci_path.write_text(ci)

          test_path = Path('.github/workflows/test.yml')
          test = test_path.read_text()
          start_marker = '\n  full-regression:\n'
          end_marker = '\n  mongo-replica-set-transactions:\n'
          start = test.find(start_marker)
          end = test.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate duplicate full-regression job in test.yml')

          test = (
              test[:start]
              + '\n  # The full regression suite runs once in ci.yml and gates Build Verification.\n'
              + test[end:]
          )
          test_path.write_text(test)
          PY

          git diff --check
          git diff -- .github/workflows/ci.yml .github/workflows/test.yml

      - name: Commit hardened workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/test.yml
          git commit -m "[ci-hardening-applied] Make full regression blocking"
          git push origin HEAD:agent/block-full-regression-ci
