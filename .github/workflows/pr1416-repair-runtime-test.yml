name: PR 1416 repair runtime test
on:
  push:
    branches:
      - agent/partner-anti-abuse-pr2-reward-integrity
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr2-reward-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Repair stale test harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/unit/partner-reward-integrity-runtime.test.js')
          text = path.read_text()
          text = text.replace(
          "const mockSupplierEvidence = {\n  methodRewardEvidence: jest.fn(async () => ({ eligible: true })),\n};",
          "const mockCandidateSelection = {\n  selectRewardEvidence: jest.fn(async () => ({\n    eligible: true,\n    packageId: 'pkg_1',\n    invoiceId: 'inv_1',\n  })),\n};\nconst mockSupplierEvidence = {\n  methodRewardEvidence: jest.fn(async () => ({ eligible: true })),\n};"
          )
          text = text.replace(
          "const mockClawback = {\n  revalidatePartnerRewards: jest.fn(async () => ({ checked: 0, clawedBack: 0 })),\n};\nconst mockIndexes = { ensureIndexes: jest.fn(async () => true) };",
          "const mockQualificationEvidence = {\n  buildSnapshot: jest.fn(() => ({ version: 1, packageId: 'pkg_1' })),\n  persistSnapshot: jest.fn(async (transaction, snapshot) => ({\n    ...transaction,\n    qualificationEvidence: snapshot,\n  })),\n};\nconst mockClawback = {\n  clawBackRewardTransaction: jest.fn(async () => null),\n  revalidatePartnerRewards: jest.fn(async () => ({ checked: 0, clawedBack: 0 })),\n};\nconst mockIndexes = { ensureIndexes: jest.fn(async () => true) };\nconst mockAwardLock = {\n  withPartnerAwardLock: jest.fn(async (_partnerId, operation) => operation()),\n};"
          )
          text = text.replace(
          "jest.mock('../../services/partnerRewardIntegrityService', () => mockIntegrity);\njest.mock('../../services/partnerRewardSupplierEvidenceService', () => mockSupplierEvidence);",
          "jest.mock('../../services/partnerRewardIntegrityService', () => mockIntegrity);\njest.mock('../../services/partnerRewardCandidateSelectionService', () => mockCandidateSelection);\njest.mock('../../services/partnerRewardSupplierEvidenceService', () => mockSupplierEvidence);"
          )
          text = text.replace(
          "jest.mock('../../services/partnerRewardStripeEvidenceService', () => mockStripeEvidence);\njest.mock('../../services/partnerRewardIntegrityClawbackService', () => mockClawback);\njest.mock('../../services/partnerRewardIntegrityIndexService', () => mockIndexes);",
          "jest.mock('../../services/partnerRewardStripeEvidenceService', () => mockStripeEvidence);\njest.mock('../../services/partnerRewardQualificationEvidenceService', () => mockQualificationEvidence);\njest.mock('../../services/partnerRewardIntegrityClawbackService', () => mockClawback);\njest.mock('../../services/partnerRewardIntegrityIndexService', () => mockIndexes);\njest.mock('../../services/partnerRewardAwardLockService', () => mockAwardLock);"
          )
          text = text.replace(
          "  mockIntegrity.canAwardCredit.mockResolvedValue({ eligible: true });\n  mockSupplierEvidence.methodRewardEvidence.mockResolvedValue({ eligible: true });",
          "  mockIntegrity.canAwardCredit.mockResolvedValue({ eligible: true });\n  mockCandidateSelection.selectRewardEvidence.mockResolvedValue({\n    eligible: true,\n    packageId: 'pkg_1',\n    invoiceId: 'inv_1',\n  });\n  mockSupplierEvidence.methodRewardEvidence.mockResolvedValue({ eligible: true });"
          )
          text = text.replace(
          "  mockStripeEvidence.subscriptionRewardEvidence.mockResolvedValue({ eligible: true });\n  mockIndexes.ensureIndexes.mockResolvedValue(true);",
          "  mockStripeEvidence.subscriptionRewardEvidence.mockResolvedValue({ eligible: true });\n  mockQualificationEvidence.buildSnapshot.mockReturnValue({ version: 1, packageId: 'pkg_1' });\n  mockQualificationEvidence.persistSnapshot.mockImplementation(async (transaction, snapshot) => ({\n    ...transaction,\n    qualificationEvidence: snapshot,\n  }));\n  mockAwardLock.withPartnerAwardLock.mockImplementation(async (_partnerId, operation) => operation());\n  mockIndexes.ensureIndexes.mockResolvedValue(true);"
          )
          path.write_text(text)
          PY
      - run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: '0'
      - run: npx jest --runInBand --coverage=false tests/unit/partner-reward-integrity-runtime.test.js
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long
      - name: Commit repair and remove workflow
        run: |
          rm .github/workflows/pr1416-repair-runtime-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/partner-reward-integrity-runtime.test.js .github/workflows/pr1416-repair-runtime-test.yml
          git commit -m "test(partner): isolate reward runtime dependencies"
          git push origin HEAD:agent/partner-anti-abuse-pr2-reward-integrity