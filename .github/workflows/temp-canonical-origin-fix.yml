name: Temporary Canonical Origin Fix

on:
  push:
    branches: [agent/current-state-security-monitoring-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  HUSKY: '0'
  NODE_ENV: test
  JWT_SECRET: temporary-canonical-origin-fix-secret-minimum-32-characters

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/current-state-security-monitoring-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci --prefer-offline --no-audit

      - name: Restrict canonical origin configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('middleware/security.js')
          text = path.read_text(encoding='utf-8')
          old = """    const parsed = new URL(configured);
    if (parsed.protocol !== 'https:') return null;
    return parsed.origin;
"""
          new = """    const parsed = new URL(configured);
    const parsedOrigin = parsed.origin;
    if (parsed.protocol !== 'https:' || !PRODUCTION_APP_ORIGINS.includes(parsedOrigin)) {
      return null;
    }
    return parsedOrigin;
"""
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'PRODUCTION_APP_ORIGINS.includes(parsedOrigin)' not in text:
              raise SystemExit('Canonical origin resolver did not match the expected source')
          PY

      - name: Format and validate
        run: |
          npx prettier --write middleware/security.js
          node --check middleware/security.js
          npx jest --runInBand --coverage=false \
            tests/unit/canonical-host-redirect.test.js \
            tests/unit/current-state-hardening.test.js \
            tests/unit/production-startup-contract.test.js

      - name: Commit validated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Canonical origin restriction is already present."
            exit 0
          fi
          git config user.name "eventflow-hardening-bot"
          git config user.email "eventflow-hardening-bot@users.noreply.github.com"
          git add middleware/security.js
          git commit -m "Restrict production canonical redirects to approved hosts"
          git pull --rebase origin agent/current-state-security-monitoring-hardening
          git push origin HEAD:agent/current-state-security-monitoring-hardening
