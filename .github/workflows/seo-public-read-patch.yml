name: SEO public read patch helper

on:
  push:
    branches:
      - feature/invisible-technical-seo-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invisible-technical-seo-hardening
          fetch-depth: 0

      - name: Add crawler-safe public read limiter
        run: |
          python - <<'PY'
          from pathlib import Path

          limits = Path('middleware/rateLimits.js')
          text = limits.read_text(encoding='utf-8')
          anchor = "const baseApiLimiter = rateLimit({\n  windowMs: 15 * 60 * 1000, // 15 minutes\n  max: 100, // 100 requests per window\n  message: 'Too many requests, please try again later.',\n  standardHeaders: true,\n  legacyHeaders: false,\n});\n"
          addition = anchor + "\n/**\n * Higher-volume limiter for anonymous, read-only public catalogue data.\n * Search crawlers and shared networks must not exhaust the strict JSON API bucket\n * while rendering indexable event pages, but the endpoint remains abuse-limited.\n */\nconst publicReadLimiter = rateLimit({\n  windowMs: 15 * 60 * 1000,\n  max: Math.max(100, Number.parseInt(process.env.PUBLIC_READ_RATE_LIMIT_MAX || '3000', 10) || 3000),\n  message: 'Too many public catalogue requests, please try again shortly.',\n  standardHeaders: true,\n  legacyHeaders: false,\n});\n"
          if anchor not in text:
              raise SystemExit('base API limiter anchor missing')
          text = text.replace(anchor, addition, 1)
          export_anchor = "  apiLimiter,\n  photoAssetLimiter,"
          if export_anchor not in text:
              raise SystemExit('rate limiter export anchor missing')
          text = text.replace(export_anchor, "  apiLimiter,\n  publicReadLimiter,\n  photoAssetLimiter,", 1)
          limits.write_text(text, encoding='utf-8')

          calendar = Path('routes/public-calendar.js')
          text = calendar.read_text(encoding='utf-8')
          import_anchor = "const { writeLimiter, apiLimiter } = require('../middleware/rateLimits');"
          if import_anchor not in text:
              raise SystemExit('public calendar limiter import missing')
          text = text.replace(
              import_anchor,
              "const { writeLimiter, apiLimiter, publicReadLimiter } = require('../middleware/rateLimits');",
              1,
          )
          replacements = {
              "router.get('/events', apiLimiter, userExtractionMiddleware, async (req, res) => {":
                  "router.get('/events', publicReadLimiter, userExtractionMiddleware, async (req, res) => {",
              "router.get('/events/:id/ics', apiLimiter, userExtractionMiddleware, async (req, res) => {":
                  "router.get('/events/:id/ics', publicReadLimiter, userExtractionMiddleware, async (req, res) => {",
              "router.get('/events/:id', apiLimiter, userExtractionMiddleware, async (req, res) => {":
                  "router.get('/events/:id', publicReadLimiter, userExtractionMiddleware, async (req, res) => {",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'route anchor missing: {old}')
              text = text.replace(old, new, 1)
          calendar.write_text(text, encoding='utf-8')

          Path('.github/workflows/seo-public-read-patch.yml').unlink()
          PY

      - name: Format and test public calendar routes
        run: |
          npx prettier --write middleware/rateLimits.js routes/public-calendar.js
          npm test -- --runInBand tests/unit/public-calendar-routes.test.js tests/unit/public-calendar-permissions.test.js tests/integration/public-listing-seo-route.test.js

      - name: Commit public read limiter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Protect crawler-safe public event reads [seo-read]"
          git push origin HEAD:feature/invisible-technical-seo-hardening
