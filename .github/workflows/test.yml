name: Test

on:
  push:
    branches: [main, agent/supplier-profile-loading-parity]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  format-loading-parity:
    name: Format supplier loading parity
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/supplier-profile-loading-parity' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-loading-parity
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Format focused files
        run: >-
          npx prettier --write
          e2e/supplier-profile-loading-parity.spec.js
          tests/unit/supplier-profile-loading-parity.test.js

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet -- \
            e2e/supplier-profile-loading-parity.spec.js \
            tests/unit/supplier-profile-loading-parity.test.js; then
            echo 'Files already formatted.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/supplier-profile-loading-parity.spec.js \
            tests/unit/supplier-profile-loading-parity.test.js
          git commit -m "Format supplier loading parity tests"
          git push origin HEAD:agent/supplier-profile-loading-parity

  smoke:
    name: Smoke Tests (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run smoke suites
        run: npm run test:smoke
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long

  # The full regression suite runs once in ci.yml and gates Build Verification.

  mongo-replica-set-transactions:
    name: Mongo Replica Set Transactions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run replica-set transaction test
        run: npx jest --runInBand --coverage=false tests/unit/messenger-v4.test.js
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long
          MONGO_REPLICA_SET: 'true'
          MONGODB_URI: mongodb://127.0.0.1:27017/eventflow?replicaSet=rs0
