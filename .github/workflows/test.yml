name: Test

on:
  push:
    branches: [main, agent/supplier-profile-theme-state]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  final-supplier-theme-hardening:
    name: Final supplier theme hardening
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/supplier-profile-theme-state' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-theme-state
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Apply, verify and commit final hardening
        shell: bash
        run: |
          set +e
          : > /tmp/final-supplier-theme-hardening.txt
          python3 - <<'PY' >> /tmp/final-supplier-theme-hardening.txt 2>&1
          from pathlib import Path

          def replace_once(path, old, new, label):
              content = path.read_text()
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              path.write_text(content.replace(old, new, 1))

          controller = Path('public/supplier/js/profile-customization.js')
          replace_once(
              controller,
              "  let dirty = false;\n  let initialising = false;\n",
              "  let dirty = false;\n  let initialising = false;\n  let themeSelectionChanged = false;\n",
              'legacy theme dirty state',
          )
          replace_once(
              controller,
              "    if (shouldMarkDirty) {\n      markDirty();\n      updateLivePreview();\n    }\n",
              "    if (shouldMarkDirty) {\n      themeSelectionChanged = true;\n      markDirty();\n      updateLivePreview();\n    }\n",
              'legacy explicit theme selection',
          )
          replace_once(
              controller,
              "  function buildSavePayload() {\n"
              "    const bannerInput = document.getElementById('sup-banner');\n"
              "    return {\n"
              "      bannerUrl: bannerInput?.value?.trim() || '',\n"
              "      tagline: $('sup-tagline')?.value?.trim() || '',\n"
              "      themeColor: getThemeColor(),\n"
              "      highlights: readHighlights(),\n"
              "      featuredServices: readFeaturedServices(),\n"
              "      socialLinks: readSocialLinks(),\n"
              "    };\n"
              "  }\n",
              "  function buildSavePayload() {\n"
              "    const bannerInput = document.getElementById('sup-banner');\n"
              "    const payload = {\n"
              "      bannerUrl: bannerInput?.value?.trim() || '',\n"
              "      tagline: $('sup-tagline')?.value?.trim() || '',\n"
              "      highlights: readHighlights(),\n"
              "      featuredServices: readFeaturedServices(),\n"
              "      socialLinks: readSocialLinks(),\n"
              "    };\n"
              "    if (themeSelectionChanged) {\n"
              "      payload.themeMode = 'custom';\n"
              "      payload.themeColor = getThemeColor();\n"
              "    }\n"
              "    return payload;\n"
              "  }\n",
              'legacy save payload',
          )
          replace_once(
              controller,
              "    applyThemeColor(supplier.themeColor || DEFAULT_COLOR, false);\n",
              "    applyThemeColor(supplier.themeColor || DEFAULT_COLOR, false);\n    themeSelectionChanged = false;\n",
              'legacy form reset',
          )

          category_css = Path('public/assets/css/supplier-profile-v2.css')
          replace_once(
              category_css,
              ".supplier-hero[data-category-preset=\"transport\"] .hero-media {\n"
              "  background: linear-gradient(135deg, #1a3a4a 0%, #1a6b8a 50%, #2196c0 100%);\n"
              "}\n",
              ".supplier-hero[data-category-preset=\"transport\"] .hero-media {\n"
              "  background: linear-gradient(135deg, #1a3a4a 0%, #1a6b8a 50%, #2196c0 100%);\n"
              "}\n\n"
              ".supplier-hero[data-category-preset=\"beauty\"] .hero-media {\n"
              "  background: linear-gradient(135deg, #831843 0%, #9d174d 50%, #db2777 100%);\n"
              "}\n",
              'beauty category gradient',
          )

          visual_test = Path('tests/unit/supplier-profile-visual-overhaul.test.js')
          replace_once(
              visual_test,
              "const themeCss = read('public/assets/css/supplier-profile-theme.css');\n",
              "const themeCss = read('public/assets/css/supplier-profile-theme.css');\nconst categoryCss = read('public/assets/css/supplier-profile-v2.css');\n",
              'category stylesheet test fixture',
          )
          replace_once(
              visual_test,
              "    expect(themeJs).toContain(\"cake: 'catering'\");\n  });\n",
              "    expect(themeJs).toContain(\"cake: 'catering'\");\n"
              "    expect(categoryCss).toContain('data-category-preset=\"beauty\"');\n"
              "    expect(categoryCss).toContain('#9d174d');\n"
              "  });\n",
              'beauty gradient contract',
          )

          controller_test = Path('tests/unit/profile-customization-controller.test.js')
          marker = "  it('uses the app CSRF token pattern instead of the removed auth csrf endpoint', () => {\n"
          addition = (
              "  it('only writes an explicit custom theme after the supplier changes the colour', () => {\n"
              "    expect(controller).toContain('let themeSelectionChanged = false');\n"
              "    expect(controller).toContain(\"payload.themeMode = 'custom'\");\n"
              "    expect(controller).toContain('if (themeSelectionChanged)');\n"
              "    expect(controller).not.toContain('themeColor: getThemeColor(),');\n"
              "  });\n\n"
              + marker
          )
          replace_once(controller_test, marker, addition, 'legacy theme payload contract')

          model = Path('models/Supplier.js')
          replace_once(
              model,
              " * @property {string} coverImage - Banner/cover image URL\n"
              " * @property {string[]} images - Gallery image URLs\n",
              " * @property {string} coverImage - Banner/cover image URL\n"
              " * @property {'automatic'|'preset'|'custom'} themeMode - Explicit profile colour mode\n"
              " * @property {string|null} heroPreset - Valid named profile theme preset when themeMode is 'preset'\n"
              " * @property {string|null} themeColor - Six-digit hex colour when themeMode is 'custom'\n"
              " * @property {string[]} images - Gallery image URLs\n",
              'supplier theme schema documentation',
          )
          PY
          status=$?

          js_files=(
            public/supplier/js/profile-customization.js
            tests/unit/profile-customization-controller.test.js
            tests/unit/supplier-profile-visual-overhaul.test.js
            models/Supplier.js
          )

          if (( status == 0 )); then
            npx prettier --write "${js_files[@]}" >> /tmp/final-supplier-theme-hardening.txt 2>&1
            status=$?
          fi
          if (( status == 0 )); then
            npx eslint --rulesdir eslint-rules "${js_files[@]}" >> /tmp/final-supplier-theme-hardening.txt 2>&1
            status=$?
          fi
          if (( status == 0 )); then
            npx jest --runInBand --coverage=false \
              tests/unit/profile-customization-controller.test.js \
              tests/unit/supplier-profile-visual-overhaul.test.js \
              tests/unit/supplier-theme.test.js \
              tests/unit/supplier-profile-photo-lightbox.test.js \
              tests/integration/supplier-theme-route.test.js \
              >> /tmp/final-supplier-theme-hardening.txt 2>&1
            status=$?
          fi
          if (( status == 0 )); then
            npm run format:check >> /tmp/final-supplier-theme-hardening.txt 2>&1
            status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (( status != 0 )); then
            cp /tmp/final-supplier-theme-hardening.txt final-supplier-theme-hardening.txt
            git add -f final-supplier-theme-hardening.txt
            git commit -m "Record final supplier theme hardening failure"
            git push origin HEAD:agent/supplier-profile-theme-state
            exit "$status"
          fi

          rm -f final-supplier-theme-hardening.txt
          git add \
            public/supplier/js/profile-customization.js \
            public/assets/css/supplier-profile-v2.css \
            tests/unit/profile-customization-controller.test.js \
            tests/unit/supplier-profile-visual-overhaul.test.js \
            models/Supplier.js
          if git ls-files --error-unmatch final-supplier-theme-hardening.txt >/dev/null 2>&1; then
            git rm final-supplier-theme-hardening.txt
          fi
          git commit -m "Complete supplier theme legacy and category hardening"
          git push origin HEAD:agent/supplier-profile-theme-state
