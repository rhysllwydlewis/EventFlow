name: Test

on:
  push:
    branches: [main, agent/supplier-profile-theme-state]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  # Temporary branch-only cleanup; restored after the audited files are committed.
  supplier-theme-lint-cleanup:
    name: Supplier theme lint cleanup
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/supplier-profile-theme-state' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-theme-state
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Fix, verify and commit lint-clean files
        shell: bash
        run: |
          set +e
          : > /tmp/supplier-theme-lint-cleanup.txt

          python3 - <<'PY' >> /tmp/supplier-theme-lint-cleanup.txt 2>&1
          from pathlib import Path
          path = Path('tests/unit/supplier-profile-photo-lightbox.test.js')
          content = path.read_text()
          content = content.replace(
              "set: value => element.setAttribute('id', value),",
              "set: value => {\n          element.setAttribute('id', value);\n        },",
          ).replace(
              "set: value => element.setAttribute('src', value),",
              "set: value => {\n          element.setAttribute('src', value);\n        },",
          )
          path.write_text(content)
          PY
          status=$?

          audited_files=(
            public/assets/js/public-supplier-avatar.js
            public/assets/js/supplier-profile-polish.js
            public/assets/js/supplier-profile-theme-owner.js
            tests/unit/supplier-profile-photo-lightbox.test.js
          )

          if (( status == 0 )); then
            npx eslint --fix "${audited_files[@]}" >> /tmp/supplier-theme-lint-cleanup.txt 2>&1
            status=$?
          fi
          if (( status == 0 )); then
            npx prettier --write "${audited_files[@]}" >> /tmp/supplier-theme-lint-cleanup.txt 2>&1
            status=$?
          fi
          if (( status == 0 )); then
            npx eslint --max-warnings=0 "${audited_files[@]}" >> /tmp/supplier-theme-lint-cleanup.txt 2>&1
            status=$?
          fi
          if (( status == 0 )); then
            npx jest --runInBand --coverage=false \
              tests/unit/supplier-theme.test.js \
              tests/unit/supplier-profile-theme-owner.test.js \
              tests/unit/supplier-profile-visual-overhaul.test.js \
              tests/unit/supplier-public-profile.test.js \
              tests/unit/supplier-profile-photo-lightbox.test.js \
              tests/unit/public-supplier-avatar.test.js \
              tests/integration/supplier-theme-route.test.js \
              >> /tmp/supplier-theme-lint-cleanup.txt 2>&1
            status=$?
          fi
          if (( status == 0 )); then
            npm run format:check >> /tmp/supplier-theme-lint-cleanup.txt 2>&1
            status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if (( status != 0 )); then
            cp /tmp/supplier-theme-lint-cleanup.txt supplier-theme-lint-cleanup.txt
            git add -f supplier-theme-lint-cleanup.txt
            git commit -m "Record supplier theme lint cleanup failure"
            git push origin HEAD:agent/supplier-profile-theme-state
            exit "$status"
          fi

          git add "${audited_files[@]}"
          git commit -m "Clean supplier theme lint findings"
          git push origin HEAD:agent/supplier-profile-theme-state
