name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  smoke:
    name: Smoke Tests (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run smoke suites
        run: npm run test:smoke
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long

  pr1418-targeted-verification:
    name: PR 1418 Targeted Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply targeted corrections in workspace
        run: |
          python <<'PY'
          from pathlib import Path

          supplier_test_path = Path('tests/unit/supplier-approval.test.js')
          supplier_test = supplier_test_path.read_text()
          old_supplier = """  it('applies .trim() and .substring() to each field in the PATCH loop', () => {
    const patchSection = content.slice(content.indexOf('PATCH /api/me/suppliers/:id'));
    expect(patchSection.slice(0, 2000)).toContain('.trim()');
    expect(patchSection.slice(0, 2000)).toContain('.substring(0, maxLen)');
  });"""
          new_supplier = """  it('applies .trim() and .substring() to each field in the PATCH loop', () => {
    const patchSection = content.slice(content.indexOf('PATCH /api/me/suppliers/:id'));
    const boundedStringLoop = patchSection.match(
      /for \(const \[k, maxLen\][\s\S]*?supplierPatch\[k\] = b\[k\]\.trim\(\)\.substring\(0, maxLen\);/
    );
    expect(boundedStringLoop).toBeTruthy();
  });"""
          if old_supplier in supplier_test:
              supplier_test_path.write_text(supplier_test.replace(old_supplier, new_supplier, 1))
          elif new_supplier not in supplier_test:
              raise AssertionError('supplier assertion anchor missing')

          css_path = Path('public/assets/css/auth.css')
          css = css_path.read_text()
          old_css = """  /* !important overrides `button { width:100%; margin-top:6px }` from styles.css */
  width: auto !important;
  margin-top: 0 !important;
  /* neutralize `min-height/min-width: 44px` from mobile-optimizations.css */
  min-height: unset !important;
  min-width: unset !important;
  height: auto !important;"""
          new_css = """  /* Keep the visual button box stable when the eye SVG is swapped. The
     separate ::before pseudo-element still provides the 44px touch target. */
  width: 32px !important;
  height: 32px !important;
  margin-top: 0 !important;
  min-height: 32px !important;
  min-width: 32px !important;"""
          if old_css in css:
              css_path.write_text(css.replace(old_css, new_css, 1))
          elif new_css not in css:
              raise AssertionError('password toggle sizing anchor missing')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Format targeted corrections
        run: npx prettier --write tests/unit/supplier-approval.test.js public/assets/css/auth.css

      - name: Run targeted Jest test
        run: npx jest tests/unit/supplier-approval.test.js --runInBand --coverage=false

      - name: Run targeted Playwright test
        run: CI=true npx playwright test e2e/auth.spec.js --project=chromium --grep "password toggle stays vertically centered"

      - name: Upload verified patched files
        uses: actions/upload-artifact@v4
        with:
          name: pr1418-verified-targeted-files
          path: |
            tests/unit/supplier-approval.test.js
            public/assets/css/auth.css
          retention-days: 7

  # The full regression suite runs once in ci.yml and gates Build Verification.

  mongo-replica-set-transactions:
    name: Mongo Replica Set Transactions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run replica-set transaction test
        run: npx jest --runInBand --coverage=false tests/unit/messenger-v4.test.js
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long
          MONGO_REPLICA_SET: 'true'
          MONGODB_URI: mongodb://127.0.0.1:27017/eventflow?replicaSet=rs0
