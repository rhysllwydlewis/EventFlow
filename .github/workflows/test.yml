name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  smoke:
    name: Smoke Tests (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run smoke suites
        run: npm run test:smoke
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long

  full-regression:
    name: Full Regression (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run full tests
        id: full-regression
        run: npm run test:full -- --runInBand --json --outputFile=full-regression-results.json
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long

      - name: Upload full regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-results-test
          path: |
            full-regression-results.json
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report non-blocking regression failure
        if: steps.full-regression.outcome == 'failure'
        run: echo "::warning::The full regression suite failed. Download full-regression-results-test for the exact failing suites and assertions."

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  mongo-replica-set-transactions:
    name: Mongo Replica Set Transactions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run replica-set transaction test
        run: npx jest --runInBand --coverage=false tests/unit/messenger-v4.test.js
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long
          MONGO_REPLICA_SET: 'true'
          MONGODB_URI: mongodb://127.0.0.1:27017/eventflow?replicaSet=rs0
