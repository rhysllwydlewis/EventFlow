name: Test

on:
  push:
    branches: [main, agent/supplier-profile-theme-state]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  harden-supplier-profile-theme:
    name: Harden supplier profile theme
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/supplier-profile-theme-state' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-theme-state
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Apply, verify and commit audited changes
        shell: bash
        run: |
          set +e
          : > /tmp/agent-pr1405-hardening.txt

          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-pr1405-hardening.py')
          content = path.read_text()
          content = content.replace(
              '"  \'wedding planner\': \'wedding\',\\n"',
              '"    \'wedding planner\': \'wedding\',\\n"',
          ).replace(
              '"  \'wedding planner\': \'wedding\',\\n    \'event planner\': \'wedding\',',
              '"    \'wedding planner\': \'wedding\',\\n    \'event planner\': \'wedding\',',
          )
          needle = '''        """    avatarEl.dataset.avatarUrl = avatarUrl;
            }
          """,
                  """    avatarEl.dataset.avatarUrl = avatarUrl;
              enableAvatarLightbox(avatarEl, img, avatarUrl);
            }
          """,
                  'enable loaded avatar lightbox',
          '''
          replacement = '''        """    avatarEl.dataset.avatarStatus = 'loaded';
              avatarEl.dataset.avatarUrl = avatarUrl;
            }
          """,
                  """    avatarEl.dataset.avatarStatus = 'loaded';
              avatarEl.dataset.avatarUrl = avatarUrl;
              enableAvatarLightbox(avatarEl, img, avatarUrl);
            }
          """,
                  'enable loaded avatar lightbox',
          '''
          content = content.replace(needle, replacement)
          path.write_text(content)
          PY

          python3 scripts/agent-pr1405-hardening.py >> /tmp/agent-pr1405-hardening.txt 2>&1
          status=$?

          if (( status == 0 )); then
            cat > tests/unit/supplier-profile-photo-lightbox.test.js <<'JS'
          /**
           * @jest-environment node
           */
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');

          function createClassList(element) {
            const values = new Set();
            return {
              add: (...names) => names.forEach(name => values.add(name)),
              remove: (...names) => names.forEach(name => values.delete(name)),
              contains: name => values.has(name),
              toString: () => [...values].join(' '),
              sync: () => {
                values.clear();
                String(element.className || '')
                  .split(/\s+/)
                  .filter(Boolean)
                  .forEach(name => values.add(name));
              },
            };
          }

          function createFixture() {
            const ids = new Map();
            const documentListeners = new Map();
            const document = {
              readyState: 'loading',
              activeElement: null,
              createElement(tagName) {
                const listeners = new Map();
                const element = {
                  tagName: String(tagName).toUpperCase(),
                  children: [],
                  parentNode: null,
                  attributes: {},
                  dataset: {},
                  style: {},
                  className: '',
                  hidden: false,
                  disabled: false,
                  textContent: '',
                  classList: null,
                  setAttribute(name, value) {
                    this.attributes[name] = String(value);
                    if (name === 'id') ids.set(String(value), this);
                  },
                  getAttribute(name) {
                    return Object.prototype.hasOwnProperty.call(this.attributes, name)
                      ? this.attributes[name]
                      : null;
                  },
                  removeAttribute(name) {
                    delete this.attributes[name];
                  },
                  append(...nodes) {
                    nodes.forEach(node => this.appendChild(node));
                  },
                  appendChild(node) {
                    node.parentNode = this;
                    this.children.push(node);
                    return node;
                  },
                  remove() {
                    if (!this.parentNode) return;
                    this.parentNode.children = this.parentNode.children.filter(child => child !== this);
                    this.parentNode = null;
                  },
                  addEventListener(type, listener) {
                    const current = listeners.get(type) || [];
                    current.push(listener);
                    listeners.set(type, current);
                  },
                  dispatchEvent(event) {
                    event.target = event.target || this;
                    event.currentTarget = this;
                    event.preventDefault = event.preventDefault || (() => {});
                    (listeners.get(event.type) || []).forEach(listener => listener(event));
                  },
                  focus() {
                    document.activeElement = this;
                  },
                  closest(selector) {
                    if (selector === '.hero-avatar' && this.parentNode?.classList?.contains('hero-avatar')) {
                      return this.parentNode;
                    }
                    return this.parentNode?.closest?.(selector) || null;
                  },
                  querySelector(selector) {
                    const match = node =>
                      (selector.startsWith('.') && node.classList?.contains(selector.slice(1))) ||
                      (selector.startsWith('#') && node.getAttribute?.('id') === selector.slice(1)) ||
                      (!selector.startsWith('.') &&
                        !selector.startsWith('#') &&
                        node.tagName === selector.toUpperCase());
                    const queue = [...this.children];
                    while (queue.length > 0) {
                      const node = queue.shift();
                      if (match(node)) return node;
                      queue.push(...(node.children || []));
                    }
                    return null;
                  },
                };
                element.classList = createClassList(element);
                Object.defineProperty(element, 'id', {
                  get: () => element.getAttribute('id') || '',
                  set: value => element.setAttribute('id', value),
                });
                Object.defineProperty(element, 'src', {
                  get: () => element.getAttribute('src') || '',
                  set: value => element.setAttribute('src', value),
                });
                return element;
              },
              getElementById(id) {
                return ids.get(id) || null;
              },
              addEventListener(type, listener) {
                const current = documentListeners.get(type) || [];
                current.push(listener);
                documentListeners.set(type, current);
              },
              removeEventListener(type, listener) {
                documentListeners.set(
                  type,
                  (documentListeners.get(type) || []).filter(item => item !== listener)
                );
              },
              dispatchEvent(event) {
                event.preventDefault = event.preventDefault || (() => {});
                (documentListeners.get(event.type) || []).forEach(listener => listener(event));
              },
            };
            document.head = document.createElement('head');
            document.body = document.createElement('body');
            const avatar = document.createElement('div');
            avatar.id = 'hero-avatar';
            avatar.className = 'hero-avatar';
            avatar.classList.sync();
            const image = document.createElement('img');
            image.id = 'hero-avatar-img';
            const initials = document.createElement('span');
            initials.id = 'hero-avatar-initials';
            initials.textContent = 'ES';
            avatar.append(image, initials);
            document.body.appendChild(avatar);
            const window = {
              location: { search: '?id=sup_1' },
              __supplierData: { id: 'sup_1', name: 'Example Supplier' },
              addEventListener: () => {},
            };
            return { document, window, avatar, image, initials };
          }

          function loadClient(fixture) {
            const code = fs.readFileSync(
              path.join(__dirname, '../../public/assets/js/public-supplier-avatar.js'),
              'utf8'
            );
            const sandbox = {
              window: fixture.window,
              document: fixture.document,
              URLSearchParams,
              fetch: jest.fn(),
              module: { exports: {} },
            };
            vm.runInNewContext(code, sandbox);
            return sandbox.module.exports;
          }

          describe('supplier profile photo lightbox', () => {
            test('opens the loaded avatar on click and closes with Escape', () => {
              const fixture = createFixture();
              const client = loadClient(fixture);
              client.showAvatarImage(fixture.image, fixture.initials, '/uploads/example.jpg');

              expect(fixture.avatar.getAttribute('role')).toBe('button');
              expect(fixture.avatar.getAttribute('tabindex')).toBe('0');
              expect(fixture.avatar.getAttribute('aria-label')).toContain('Example Supplier');

              fixture.avatar.dispatchEvent({ type: 'click' });
              const dialog = fixture.document.body.querySelector('.sp-avatar-lightbox');
              expect(dialog).not.toBeNull();
              expect(dialog.getAttribute('aria-modal')).toBe('true');
              expect(dialog.querySelector('img').getAttribute('src')).toBe('/uploads/example.jpg');
              expect(fixture.document.body.style.overflow).toBe('hidden');

              fixture.document.dispatchEvent({ type: 'keydown', key: 'Escape' });
              expect(fixture.document.body.querySelector('.sp-avatar-lightbox')).toBeNull();
              expect(fixture.document.body.style.overflow).toBe('');
              expect(fixture.document.activeElement).toBe(fixture.avatar);
            });

            test('supports keyboard activation and disables enlargement for placeholders', () => {
              const fixture = createFixture();
              const client = loadClient(fixture);
              client.showAvatarImage(fixture.image, fixture.initials, '/uploads/example.jpg');
              fixture.avatar.dispatchEvent({ type: 'keydown', key: 'Enter' });
              expect(fixture.document.body.querySelector('.sp-avatar-lightbox')).not.toBeNull();
              client.closeAvatarLightbox();

              client.setPlaceholder(fixture.image, fixture.initials, 'ES');
              expect(fixture.avatar.getAttribute('role')).toBeNull();
              expect(fixture.avatar.getAttribute('tabindex')).toBeNull();
              fixture.avatar.dispatchEvent({ type: 'click' });
              expect(fixture.document.body.querySelector('.sp-avatar-lightbox')).toBeNull();
            });
          });
          JS
          fi

          if (( status == 0 )); then
            mapfile -t files < <(
              {
                git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.js'
                git diff --name-only --diff-filter=ACMR -- '*.js'
                git ls-files --others --exclude-standard -- '*.js'
              } | sort -u
            )
            if (( ${#files[@]} > 0 )); then
              npx prettier --write "${files[@]}" >> /tmp/agent-pr1405-hardening.txt 2>&1
              status=$?
            fi
          fi

          if (( status == 0 )); then
            npx jest --runInBand --coverage=false \
              tests/unit/supplier-theme.test.js \
              tests/unit/supplier-profile-theme-owner.test.js \
              tests/unit/supplier-profile-visual-overhaul.test.js \
              tests/unit/supplier-public-profile.test.js \
              tests/unit/supplier-profile-photo-lightbox.test.js \
              tests/unit/public-supplier-avatar.test.js \
              tests/unit/supplier-approval.test.js \
              tests/unit/supplier-duplicate-prevention.test.js \
              tests/integration/supplier-theme-route.test.js \
              >> /tmp/agent-pr1405-hardening.txt 2>&1
            status=$?
          fi

          if (( status == 0 )); then
            npm run format:check >> /tmp/agent-pr1405-hardening.txt 2>&1
            status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if (( status != 0 )); then
            cp /tmp/agent-pr1405-hardening.txt agent-pr1405-hardening.txt
            git add -f agent-pr1405-hardening.txt
            git commit -m "Record supplier theme hardening failure"
            git push origin HEAD:agent/supplier-profile-theme-state
            exit "$status"
          fi

          rm -f agent-pr1405-hardening.txt
          git add \
            public/assets/js/public-supplier-avatar.js \
            public/assets/js/supplier-profile.js \
            public/assets/js/supplier-profile-polish.js \
            public/assets/js/supplier-profile-theme-owner.js \
            routes/supplier-management.js \
            utils/supplierTheme.js \
            tests/integration/supplier-theme-route.test.js \
            tests/unit/public-supplier-avatar.test.js \
            tests/unit/supplier-profile-photo-lightbox.test.js \
            tests/unit/supplier-profile-theme-owner.test.js \
            tests/unit/supplier-profile-visual-overhaul.test.js \
            tests/unit/supplier-theme.test.js
          if git ls-files --error-unmatch agent-pr1405-hardening.txt >/dev/null 2>&1; then
            git rm agent-pr1405-hardening.txt
          fi
          if git diff --cached --quiet; then
            echo "No audited changes to commit"
          else
            git commit -m "Audit supplier themes and add profile photo lightbox"
            git push origin HEAD:agent/supplier-profile-theme-state
          fi

  smoke:
    name: Smoke Tests (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run smoke suites
        run: npm run test:smoke
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long

  # The full regression suite runs once in ci.yml and gates Build Verification.

  mongo-replica-set-transactions:
    name: Mongo Replica Set Transactions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run replica-set transaction test
        run: npx jest --runInBand --coverage=false tests/unit/messenger-v4.test.js
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long
          MONGO_REPLICA_SET: 'true'
          MONGODB_URI: mongodb://127.0.0.1:27017/eventflow?replicaSet=rs0
