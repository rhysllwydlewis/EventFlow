name: Test

on:
  push:
    branches: [main, agent/supplier-profile-theme-state]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  harden-supplier-profile-theme:
    name: Harden supplier profile theme
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/supplier-profile-theme-state' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-theme-state
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Apply guarded hardening changes
        run: python3 scripts/agent-pr1405-hardening.py

      - name: Format changed JavaScript
        shell: bash
        run: |
          mapfile -t files < <(
            {
              git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.js'
              git diff --name-only --diff-filter=ACMR -- '*.js'
              git ls-files --others --exclude-standard -- '*.js'
            } | sort -u
          )
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi

      - name: Run focused regression tests
        run: >-
          npx jest --runInBand --coverage=false
          tests/unit/supplier-theme.test.js
          tests/unit/supplier-profile-theme-owner.test.js
          tests/unit/supplier-profile-visual-overhaul.test.js
          tests/unit/supplier-public-profile.test.js
          tests/unit/supplier-profile-photo-lightbox.test.js
          tests/unit/public-supplier-avatar.test.js
          tests/unit/supplier-approval.test.js
          tests/unit/supplier-duplicate-prevention.test.js
          tests/integration/supplier-theme-route.test.js

      - name: Verify repository formatting
        run: npm run format:check

      - name: Commit audited changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/assets/js/public-supplier-avatar.js \
            public/assets/js/supplier-profile.js \
            public/assets/js/supplier-profile-polish.js \
            public/assets/js/supplier-profile-theme-owner.js \
            routes/supplier-management.js \
            utils/supplierTheme.js \
            tests/integration/supplier-theme-route.test.js \
            tests/unit/public-supplier-avatar.test.js \
            tests/unit/supplier-profile-photo-lightbox.test.js \
            tests/unit/supplier-profile-theme-owner.test.js \
            tests/unit/supplier-profile-visual-overhaul.test.js \
            tests/unit/supplier-theme.test.js
          if git diff --cached --quiet; then
            echo "No audited changes to commit"
          else
            git commit -m "Audit supplier themes and add profile photo lightbox"
            git push origin HEAD:agent/supplier-profile-theme-state
          fi

  smoke:
    name: Smoke Tests (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run smoke suites
        run: npm run test:smoke
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long

  # The full regression suite runs once in ci.yml and gates Build Verification.

  mongo-replica-set-transactions:
    name: Mongo Replica Set Transactions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run replica-set transaction test
        run: npx jest --runInBand --coverage=false tests/unit/messenger-v4.test.js
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-jest-min-32-characters-long
          MONGO_REPLICA_SET: 'true'
          MONGODB_URI: mongodb://127.0.0.1:27017/eventflow?replicaSet=rs0
