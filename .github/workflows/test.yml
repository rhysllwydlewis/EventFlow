name: Test

on:
  push:
    branches: [main, agent/supplier-profile-theme-state]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  final-supplier-theme-hardening:
    name: Final supplier theme hardening
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/supplier-profile-theme-state' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-theme-state
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Apply, verify and commit final hardening
        shell: bash
        run: |
          set +e
          : > /tmp/final-supplier-theme-hardening.txt
          python3 - <<'PY' >> /tmp/final-supplier-theme-hardening.txt 2>&1
          from pathlib import Path

          def replace_once(path, old, new, label):
              content = path.read_text()
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              path.write_text(content.replace(old, new, 1))

          controller = Path('public/supplier/js/profile-customization.js')
          replace_once(
              controller,
              "  let dirty = false;\n  let initialising = false;\n",
              "  let dirty = false;\n  let initialising = false;\n  let themeSelectionChanged = false;\n",
              'legacy theme dirty state',
          )
          replace_once(
              controller,
              """    if (shouldMarkDirty) {
              markDirty();
              updateLivePreview();
            }
          """,
              """    if (shouldMarkDirty) {
              themeSelectionChanged = true;
              markDirty();
              updateLivePreview();
            }
          """,
              'legacy explicit theme selection',
          )
          replace_once(
              controller,
              """  function buildSavePayload() {
              const bannerInput = document.getElementById('sup-banner');
              return {
                bannerUrl: bannerInput?.value?.trim() || '',
                tagline: $('sup-tagline')?.value?.trim() || '',
                themeColor: getThemeColor(),
                highlights: readHighlights(),
                featuredServices: readFeaturedServices(),
                socialLinks: readSocialLinks(),
              };
            }
          """,
              """  function buildSavePayload() {
              const bannerInput = document.getElementById('sup-banner');
              const payload = {
                bannerUrl: bannerInput?.value?.trim() || '',
                tagline: $('sup-tagline')?.value?.trim() || '',
                highlights: readHighlights(),
                featuredServices: readFeaturedServices(),
                socialLinks: readSocialLinks(),
              };
              if (themeSelectionChanged) {
                payload.themeMode = 'custom';
                payload.themeColor = getThemeColor();
              }
              return payload;
            }
          """,
              'legacy save payload',
          )
          replace_once(
              controller,
              "    applyThemeColor(supplier.themeColor || DEFAULT_COLOR, false);\n",
              "    applyThemeColor(supplier.themeColor || DEFAULT_COLOR, false);\n    themeSelectionChanged = false;\n",
              'legacy form reset',
          )

          category_css = Path('public/assets/css/supplier-profile-v2.css')
          replace_once(
              category_css,
              """.supplier-hero[data-category-preset="transport"] .hero-media {
              background: linear-gradient(135deg, #1a3a4a 0%, #1a6b8a 50%, #2196c0 100%);
            }
          """,
              """.supplier-hero[data-category-preset="transport"] .hero-media {
              background: linear-gradient(135deg, #1a3a4a 0%, #1a6b8a 50%, #2196c0 100%);
            }

            .supplier-hero[data-category-preset="beauty"] .hero-media {
              background: linear-gradient(135deg, #831843 0%, #9d174d 50%, #db2777 100%);
            }
          """,
              'beauty category gradient',
          )

          visual_test = Path('tests/unit/supplier-profile-visual-overhaul.test.js')
          replace_once(
              visual_test,
              "const themeCss = read('public/assets/css/supplier-profile-theme.css');\n",
              "const themeCss = read('public/assets/css/supplier-profile-theme.css');\nconst categoryCss = read('public/assets/css/supplier-profile-v2.css');\n",
              'category stylesheet test fixture',
          )
          replace_once(
              visual_test,
              """    expect(themeJs).toContain("cake: 'catering'");
              });
          """,
              """    expect(themeJs).toContain("cake: 'catering'");
                expect(categoryCss).toContain('data-category-preset="beauty"');
                expect(categoryCss).toContain('#9d174d');
              });
          """,
              'beauty gradient contract',
          )

          controller_test = Path('tests/unit/profile-customization-controller.test.js')
          replace_once(
              controller_test,
              """  it('uses the app CSRF token pattern instead of the removed auth csrf endpoint', () => {
          """,
              """  it('only writes an explicit custom theme after the supplier changes the colour', () => {
                expect(controller).toContain('let themeSelectionChanged = false');
                expect(controller).toContain("payload.themeMode = 'custom'");
                expect(controller).toContain('if (themeSelectionChanged)');
                expect(controller).not.toContain('themeColor: getThemeColor(),');
              });

              it('uses the app CSRF token pattern instead of the removed auth csrf endpoint', () => {
          """,
              'legacy theme payload contract',
          )

          model = Path('models/Supplier.js')
          replace_once(
              model,
              """ * @property {string} coverImage - Banner/cover image URL
             * @property {string[]} images - Gallery image URLs
          """,
              """ * @property {string} coverImage - Banner/cover image URL
             * @property {'automatic'|'preset'|'custom'} themeMode - Explicit profile colour mode
             * @property {string|null} heroPreset - Valid named profile theme preset when themeMode is 'preset'
             * @property {string|null} themeColor - Six-digit hex colour when themeMode is 'custom'
             * @property {string[]} images - Gallery image URLs
          """,
              'supplier theme schema documentation',
          )
          PY
          status=$?

          js_files=(
            public/supplier/js/profile-customization.js
            tests/unit/profile-customization-controller.test.js
            tests/unit/supplier-profile-visual-overhaul.test.js
            models/Supplier.js
          )

          if (( status == 0 )); then
            npx prettier --write "${js_files[@]}" >> /tmp/final-supplier-theme-hardening.txt 2>&1
            status=$?
          fi
          if (( status == 0 )); then
            npx eslint --rulesdir eslint-rules "${js_files[@]}" >> /tmp/final-supplier-theme-hardening.txt 2>&1
            status=$?
          fi
          if (( status == 0 )); then
            npx jest --runInBand --coverage=false \
              tests/unit/profile-customization-controller.test.js \
              tests/unit/supplier-profile-visual-overhaul.test.js \
              tests/unit/supplier-theme.test.js \
              tests/unit/supplier-profile-photo-lightbox.test.js \
              tests/integration/supplier-theme-route.test.js \
              >> /tmp/final-supplier-theme-hardening.txt 2>&1
            status=$?
          fi
          if (( status == 0 )); then
            npm run format:check >> /tmp/final-supplier-theme-hardening.txt 2>&1
            status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (( status != 0 )); then
            cp /tmp/final-supplier-theme-hardening.txt final-supplier-theme-hardening.txt
            git add -f final-supplier-theme-hardening.txt
            git commit -m "Record final supplier theme hardening failure"
            git push origin HEAD:agent/supplier-profile-theme-state
            exit "$status"
          fi

          git add \
            public/supplier/js/profile-customization.js \
            public/assets/css/supplier-profile-v2.css \
            tests/unit/profile-customization-controller.test.js \
            tests/unit/supplier-profile-visual-overhaul.test.js \
            models/Supplier.js
          git commit -m "Complete supplier theme legacy and category hardening"
          git push origin HEAD:agent/supplier-profile-theme-state
