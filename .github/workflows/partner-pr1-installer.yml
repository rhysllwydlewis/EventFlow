name: Partner PR1 Installer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: partner-pr1-installer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  install:
    if: github.event.pull_request.head.ref == 'agent/partner-anti-abuse-pr1-identity-network'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply PR1 integrations
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected integration marker not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Registration-risk persistence: count only primary registration attempts for
          # velocity, store real Mongo TTL Date fields, and audit failed allowed attempts.
