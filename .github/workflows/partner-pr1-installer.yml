          # The earlier global middleware prototype is deliberately not part of the final
          # architecture: guards sit directly after CSRF/rate limiting on authoritative routes.
          Path('middleware/partnerRegistrationRiskMiddleware.js').unlink(missing_ok=True)

      - name: Format changed source
        run: |
          npm ci --ignore-scripts
          npx prettier --write \
            services/partnerRegistrationRiskService.js \
            services/partnerAntiAbuseService.js \
            routes/index.js routes/auth.js db-init.js public/privacy.html package.json \
            routes/partner-registration-secure.js routes/partner-abuse-appeals.js \
            routes/admin-partner-abuse.js tests/unit/partner-registration-risk.test.js \
            tests/unit/partner-registration-secure.test.js docs/PARTNER_ANTI_ABUSE_PR1.md

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PR1 integration already applied"
            exit 0
          fi
          git commit -m "feat(partner): integrate identity and network anti-abuse controls"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
