name: PR 1416 DeepSource repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr1416-deepsource-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-anti-abuse-pr2-reward-integrity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0

      - name: Convert changed service declarations
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- 'services/*.js')
          printf 'Changed service files:\n%s\n' "${files[*]}"
          FILES="$(printf '%s\n' "${files[@]}")" python <<'PY'
          import os
          import re
          from pathlib import Path

          files = [Path(value) for value in os.environ['FILES'].splitlines() if value]
          declaration = re.compile(r'^(async\s+)?function\s+([A-Za-z_$][\w$]*)\s*(.*)$')
          converted = []

          for path in files:
            source = path.read_text()
            lines = source.splitlines(keepends=True)
            index = 0
            while index < len(lines):
              match = declaration.match(lines[index])
              if not match:
                index += 1
                continue

              async_prefix, name, remainder = match.groups()
              newline = '\n' if lines[index].endswith('\n') else ''
              lines[index] = f"const {name} = {'async ' if async_prefix else ''}{remainder.rstrip()}" + newline

              signature_end = index
              while signature_end < len(lines):
                body_match = re.search(r'\)\s*\{\s*$', lines[signature_end].rstrip('\n'))
                if body_match:
                  line_newline = '\n' if lines[signature_end].endswith('\n') else ''
                  line = lines[signature_end].rstrip('\n')
                  lines[signature_end] = (
                    line[:body_match.start()] +
                    re.sub(r'\)\s*\{\s*$', ') => {', line[body_match.start():]) +
                    line_newline
                  )
                  break
                signature_end += 1
              else:
                raise RuntimeError(f'Could not find function body for {name} in {path}')

              closing = signature_end + 1
              while closing < len(lines) and lines[closing].rstrip('\n') != '}':
                closing += 1
              if closing >= len(lines):
                raise RuntimeError(f'Could not find top-level closing brace for {name} in {path}')
              lines[closing] = '};\n' if lines[closing].endswith('\n') else '};'
              converted.append(f'{path}:{name}')
              index = closing + 1

            updated = ''.join(lines)
            if path.name == 'partnerRewardIntegrityAdvancedService.js':
              old = """  const a = tokenSet(left);
  const b = tokenSet(right);
  if (!a.size || !b.size) return 0;
  let intersection = 0;
  for (const token of a) if (b.has(token)) intersection += 1;
  return intersection / (a.size + b.size - intersection);"""
              new = """  const leftTokens = tokenSet(left);
  const rightTokens = tokenSet(right);
  if (!leftTokens.size || !rightTokens.size) return 0;
  let intersection = 0;
  for (const token of leftTokens) if (rightTokens.has(token)) intersection += 1;
  return intersection / (leftTokens.size + rightTokens.size - intersection);"""
              if old not in updated:
                raise RuntimeError('Expected jaccard variable block was not found')
              updated = updated.replace(old, new, 1)
            path.write_text(updated)

          if not converted:
            raise RuntimeError('No top-level declarations were converted')
          print(f'Converted {len(converted)} declarations:')
          print('\n'.join(converted))
          PY

          if grep -nHE '^(async[[:space:]]+)?function[[:space:]]+' "${files[@]}"; then
            echo 'Top-level function declaration remains in a changed service file.' >&2
            exit 1
          fi

          npx prettier --write "${files[@]}"
          npx prettier --check "${files[@]}"
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Run partner reward regression suites
        run: |
          npx jest \
            tests/unit/partner-anti-abuse-runtime.test.js \
            tests/unit/partner-cashout-active-reward-risk.test.js \
            tests/unit/partner-reward-award-lock.test.js \
            tests/unit/partner-reward-candidate-selection.test.js \
            tests/unit/partner-reward-exposure-safety.test.js \
            tests/unit/partner-reward-integrity-advanced.test.js \
            tests/unit/partner-reward-integrity-clawback.test.js \
            tests/unit/partner-reward-integrity-indexes.test.js \
            tests/unit/partner-reward-integrity-runtime.test.js \
            tests/unit/partner-reward-integrity.test.js \
            tests/unit/partner-reward-qualification-evidence.test.js \
            tests/unit/partner-reward-snapshot-revalidation.test.js \
            tests/unit/partner-reward-stripe-evidence.test.js \
            tests/unit/partner-reward-supplier-evidence.test.js \
            tests/unit/partner-reward-technical-repair.test.js \
            --runInBand

      - name: Commit verified repair and remove workflow
        shell: bash
        run: |
          rm .github/workflows/pr1416-deepsource-residual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services .github/workflows/pr1416-deepsource-residual.yml
          git commit -m "refactor(partner): resolve DeepSource service findings"
          git push origin HEAD:agent/partner-anti-abuse-pr2-reward-integrity
