name: PR 1416 DeepSource residual diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/partner-anti-abuse-pr2-reward-integrity

permissions:
  contents: read
  statuses: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Capture residual findings
        shell: bash
        run: |
          mkdir -p diagnostic
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status" > diagnostic/status.json
            state=$(jq -r '.statuses[] | select(.context == "DeepSource: JavaScript") | .state' diagnostic/status.json | head -1)
            target=$(jq -r '.statuses[] | select(.context == "DeepSource: JavaScript") | .target_url' diagnostic/status.json | head -1)
            echo "attempt=$attempt state=$state target=$target"
            if [[ -n "$target" && "$target" != "null" && "$state" != "pending" && -n "$state" ]]; then break; fi
            sleep 10
          done
          curl --fail-with-body --silent --show-error --location "$target" --output diagnostic/report.html
          python <<'PY'
          import html
          import re
          from pathlib import Path

          raw = Path('diagnostic/report.html').read_text(errors='replace')
          text = html.unescape(re.sub(r'<[^>]+>', ' ', raw))
          text = re.sub(r'\s+', ' ', text)

          codes = sorted(set(re.findall(r'JS-(?:R|C)?\d{4}|JS-\d{4}', raw)))
          print('ISSUE_CODES', ','.join(codes))

          for code in codes:
            positions = [m.start() for m in re.finditer(re.escape(code), raw)]
            snippets = []
            for pos in positions[:8]:
              fragment = html.unescape(re.sub(r'<[^>]+>', ' ', raw[max(0, pos-900):pos+1800]))
              fragment = re.sub(r'\s+', ' ', fragment).strip()
              files = re.findall(r'(?:services|tests)/[A-Za-z0-9._/-]+\.js', fragment)
              if files or 'complexity' in fragment.lower() or 'global' in fragment.lower() or 'built-in' in fragment.lower():
                snippets.append(fragment)
            print(f'\n=== {code} ===')
            for snippet in snippets[:4]:
              print(snippet[:1800])

          for pattern in [
            r'cyclomatic[^<]{0,500}',
            r'Unexpected function declaration[^<]{0,500}',
            r'already defined as a built-in global variable[^<]{0,500}',
            r'critical[^<]{0,500}',
          ]:
            matches = re.findall(pattern, text, flags=re.I)
            for match in matches[:20]:
              print('DETAIL', match[:800])
          PY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pr1416-deepsource-residual
          path: diagnostic
          retention-days: 1
