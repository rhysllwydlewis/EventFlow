name: Production Dependency Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - 'scripts/audit-production-dependencies.mjs'
      - 'scripts/check-lockfile-consistency.mjs'
      - '.github/workflows/production-dependency-audit.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  audit:
    name: Production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Verify package-lock metadata
        run: npm run check:lockfile

      - name: Clean install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Audit production dependencies
        id: production-audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run audit 2>&1 | tee production-audit-report.txt

      - name: Upload production audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit-report
          path: production-audit-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce production audit result
        if: steps.production-audit.outcome == 'failure'
        run: exit 1

  temporary-media-confirm-repair:
    name: Temporary media confirmation repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/clean-install-ci-baseline
          fetch-depth: 0

      - name: Replace the native confirmation fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/assets/js/pages/admin-media-upload-library.js')
          source = path.read_text()
          before = """    const message = 'Delete this uploaded media file?';
    const confirmed = window.AdminShared?.showConfirmModal
      ? await window.AdminShared.showConfirmModal({
          title: 'Delete uploaded media',
          message,
          confirmText: 'Delete',
        })
      : window.confirm(message);"""
          after = """    if (!window.AdminShared?.showConfirmModal) {
      setStatus('Confirmation dialog is unavailable. Refresh the page and try again.', 'error');
      return;
    }

    const confirmed = await window.AdminShared.showConfirmModal({
      title: 'Delete uploaded media',
      message: 'Delete this uploaded media file?',
      confirmText: 'Delete',
      cancelText: 'Cancel',
      type: 'danger',
    });"""
          count = source.count(before)
          if count != 1:
              raise SystemExit(f'Expected one native confirmation fallback, found {count}')
          path.write_text(source.replace(before, after, 1))
          PY

      - name: Verify JavaScript syntax
        run: node --check public/assets/js/pages/admin-media-upload-library.js

      - name: Commit the media confirmation repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/pages/admin-media-upload-library.js
          git commit -m "Use the shared admin confirmation modal for media deletion"
          git push origin HEAD:agent/clean-install-ci-baseline
