name: Capture partner full regression diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: capture-partner-full-regression
  cancel-in-progress: true

env:
  HUSKY: '0'
  NODE_ENV: test
  JWT_SECRET: partner-diagnostics-secret-minimum-32-characters

jobs:
  capture:
    if: ${{ github.head_ref == 'agent/partner-dashboard-reliability' && !contains(github.event.head_commit.message, '[full-regression-diagnostics]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-dashboard-reliability
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Capture full Jest output
        shell: bash
        run: |
          set +e
          npm run test:full -- --runInBand > .partner-full-regression.log 2>&1
          status=$?
          echo "FULL_REGRESSION_EXIT_CODE=${status}" >> .partner-full-regression.log
          tail -n 800 .partner-full-regression.log > .partner-full-regression-tail.log
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .partner-full-regression-tail.log
          git commit -m "chore(partner): capture full regression diagnostics [full-regression-diagnostics]"
          git push origin HEAD:agent/partner-dashboard-reliability
