name: Apply Review Request Operations

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Download reviewed partial implementation
        uses: actions/download-artifact@v4
        with:
          name: review-request-operations-changes
          path: /tmp/review-request-operations
          repository: rhysllwydlewis/EventFlow
          run-id: 29534191347
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore reviewed files and apply corrections
        env:
          CORRECTIONS_GZIP_BASE64: 
        run: |
          cp -R /tmp/review-request-operations/utils .
          cp -R /tmp/review-request-operations/routes .
          cp -R /tmp/review-request-operations/public .
          cp -R /tmp/review-request-operations/tests .
          printf '%s' "$CORRECTIONS_GZIP_BASE64" | base64 -d | gzip -d > /tmp/review-request-corrections.patch
          patch -p1 < /tmp/review-request-corrections.patch
          git diff --check

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Format changed JavaScript
        run: |
          npx prettier --write \
            utils/reviewRequestOperations.js \
            routes/review-requests.js \
            routes/admin-email-centre.js \
            public/assets/js/dashboard-supplier-overhaul.js \
            public/assets/js/pages/admin-emails-init.js \
            tests/integration/supplier-review-request-delivery.test.js \
            tests/unit/review-request-operations.test.js \
            tests/unit/admin-review-request-operations-route.test.js \
            tests/unit/supplier-review-request-client.test.js \
            tests/unit/admin-review-request-client.test.js

      - name: Run focused tests
        run: |
          npm test -- --runInBand --coverage=false \
            tests/integration/supplier-review-request-delivery.test.js \
            tests/unit/review-request-operations.test.js \
            tests/unit/admin-review-request-operations-route.test.js \
            tests/unit/supplier-review-request-client.test.js \
            tests/unit/admin-review-request-client.test.js
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-review-request-operations-min-32-chars

      - name: Lint changed JavaScript
        run: |
          npx eslint \
            utils/reviewRequestOperations.js \
            routes/review-requests.js \
            routes/admin-email-centre.js \
            public/assets/js/dashboard-supplier-overhaul.js \
            public/assets/js/pages/admin-emails-init.js \
            tests/integration/supplier-review-request-delivery.test.js \
            tests/unit/review-request-operations.test.js \
            tests/unit/admin-review-request-operations-route.test.js \
            tests/unit/supplier-review-request-client.test.js \
            tests/unit/admin-review-request-client.test.js \
            --rulesdir eslint-rules

      - name: Commit reviewed implementation
        run: |
          git config user.name "EventFlow CI"
          git config user.email "ci@event-flow.co.uk"
          git add \
            utils/reviewRequestOperations.js \
            routes/review-requests.js \
            routes/admin-email-centre.js \
            public/assets/js/dashboard-supplier-overhaul.js \
            public/assets/css/dashboard-overhaul.css \
            public/dashboard-supplier.html \
            public/admin-emails.html \
            public/assets/js/pages/admin-emails-init.js \
            public/assets/css/admin-emails.css \
            tests/integration/supplier-review-request-delivery.test.js \
            tests/unit/review-request-operations.test.js \
            tests/unit/admin-review-request-operations-route.test.js \
            tests/unit/supplier-review-request-client.test.js \
            tests/unit/admin-review-request-client.test.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Reviewed implementation is already current."
            exit 0
          fi
          git commit -m "Add review request operations and safe recovery"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
