name: Format One Profile Pilot

on:
  push:
    branches:
      - supplier-bot/one-profile-pilot-visibility

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: supplier-bot/one-profile-pilot-visibility
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Format pilot hardening
        run: >-
          npx prettier --write
          routes/supplier-profile-package-cards.js
          services/supplierBotIngestion.service.js
          services/supplierBotPilotSlot.service.js
          tests/integration/supplier-bot-pilot-ingestion-route.test.js
          tests/integration/supplier-profile-package-cards-v2-route.test.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routes/supplier-profile-package-cards.js services/supplierBotIngestion.service.js services/supplierBotPilotSlot.service.js tests/integration/supplier-bot-pilot-ingestion-route.test.js tests/integration/supplier-profile-package-cards-v2-route.test.js
          git commit -m 'Format one-profile pilot hardening'
          git push origin HEAD:supplier-bot/one-profile-pilot-visibility
