name: Fix supplier profile E2E title contract

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix-e2e-contract:
    if: github.event.pull_request.head.ref == 'agent/supplier-profile-header-layout-balance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-profile-header-layout-balance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align shared profile helper with the new contact panel title
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('e2e/supplier-profile-visual-overhaul.spec.js')
          text = path.read_text()
          old = "await expect(page.locator('.sp-cta-card__title')).toHaveText(supplier.name);"
          new = "await expect(page.locator('.sp-cta-card__title')).toHaveText(`Plan with ${supplier.name}`);"
          if old not in text:
              raise SystemExit('Expected shared profile title assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format the corrected browser test
        run: |
          npm ci --ignore-scripts
          npx prettier --write e2e/supplier-profile-visual-overhaul.spec.js

      - name: Commit the E2E contract correction
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/supplier-profile-visual-overhaul.spec.js
          git commit -m "Align supplier profile E2E with contact panel title"
          git push origin HEAD:agent/supplier-profile-header-layout-balance
