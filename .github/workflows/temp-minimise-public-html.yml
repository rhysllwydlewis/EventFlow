name: Temporary Minimise Public HTML Diff

on:
  push:
    branches: [agent/current-state-security-monitoring-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  minimise:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/current-state-security-monitoring-hardening
          fetch-depth: 0

      - name: Restore public HTML and apply exact copy replacements
        shell: bash
        run: |
          git checkout origin/main -- public/index.html public/marketplace.html
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'Join over 500+ verified suppliers already on EventFlow': 'Early supplier access is open now',
              "We're currently building the marketplace platform. Sign up for a free account to be notified when listings go live.": 'Marketplace listings are opening in stages. Create a free account to list an item, save favourites or message sellers.',
          }

          for name in ('public/index.html', 'public/marketplace.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit minimal HTML diff
        shell: bash
        run: |
          git config user.name "eventflow-hardening-bot"
          git config user.email "eventflow-hardening-bot@users.noreply.github.com"
          git add public/index.html public/marketplace.html
          if git diff --cached --quiet; then
            echo "The public HTML matches main after exact replacements."
            exit 0
          fi
          git commit -m "Minimise public copy hardening diff"
          git pull --rebase origin agent/current-state-security-monitoring-hardening
          git push origin HEAD:agent/current-state-security-monitoring-hardening
