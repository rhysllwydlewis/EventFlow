name: Align Admin Debug parent cache key

on:
  push:
    branches:
      - agent/admin-debug-mobile-mop-up

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-debug-mobile-mop-up
          fetch-depth: 0

      - name: Bump the parent bundle and remove this helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/admin-debug.html')
          content = path.read_text()
          old = '/assets/js/pages/admin-debug-background-jobs.js?v=18.6.0'
          new = '/assets/js/pages/admin-debug-background-jobs.js?v=18.6.1'
          if content.count(old) != 1:
              raise SystemExit('Expected one 18.6.0 parent bundle reference')
          path.write_text(content.replace(old, new))
          PY
          rm .github/workflows/temp-bump-admin-debug-parent-cache.yml
          git diff --check

      - name: Commit the cache alignment and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin-debug.html .github/workflows/temp-bump-admin-debug-parent-cache.yml
          git commit -m 'Align Admin Debug parent cache version'
          git push origin HEAD:agent/admin-debug-mobile-mop-up
