name: Capture partner changed-coverage gap

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: capture-partner-coverage-gap
  cancel-in-progress: true

env:
  HUSKY: '0'
  NODE_ENV: test
  JWT_SECRET: partner-coverage-secret-minimum-32-characters

jobs:
  capture:
    if: ${{ github.head_ref == 'agent/partner-dashboard-reliability' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/partner-dashboard-reliability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Generate coverage and capture changed-line report
        shell: bash
        run: |
          set +e
          npm run test:full -- --runInBand > /tmp/partner-full-coverage.log 2>&1
          node scripts/check-changed-coverage.mjs > .partner-coverage-gap.log 2>&1
          status=$?
          echo "CHANGED_COVERAGE_EXIT_CODE=${status}" >> .partner-coverage-gap.log
          cat .partner-coverage-gap.log
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .partner-coverage-gap.log
          git commit -m "chore(partner): capture changed-coverage gap [coverage-diagnostics]"
          git push origin HEAD:agent/partner-dashboard-reliability
