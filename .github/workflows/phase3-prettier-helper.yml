name: Phase 3 Prettier Helper

on:
  push:
    branches:
      - phase3/supplier-media-provenance

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0
      - name: Format Phase 3 receiver files
        run: npx prettier --write routes/supplier-profile-safe.js services/supplierBotIngestion.service.js tests/unit/supplier-bot-media-provenance.test.js
      - name: Upload formatted files
        uses: actions/upload-artifact@v7
        with:
          name: phase3-prettier-output
          path: |
            routes/supplier-profile-safe.js
            services/supplierBotIngestion.service.js
            tests/unit/supplier-bot-media-provenance.test.js
          retention-days: 1
