name: Phase 3 Prettier Helper

on:
  push:
    branches:
      - phase3/supplier-media-provenance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: phase3/supplier-media-provenance
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: 0
      - name: Format Phase 3 receiver files
        run: npx prettier --write routes/supplier-profile-safe.js services/supplierBotIngestion.service.js tests/unit/supplier-bot-media-provenance.test.js
      - name: Commit formatted files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/supplier-profile-safe.js services/supplierBotIngestion.service.js tests/unit/supplier-bot-media-provenance.test.js
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git commit -m "Format Phase 3 supplier media receiver"
          git push origin HEAD:phase3/supplier-media-provenance
