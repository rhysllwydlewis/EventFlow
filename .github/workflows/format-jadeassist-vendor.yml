name: Format JadeAssist vendor bundle

on:
  pull_request:
    branches:
      - main
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/jadeassist-launcher-assets-final
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          HUSKY: '0'

      - name: Format the verified vendor bundle
        run: npx prettier --write public/assets/js/vendor/jade-widget.js

      - name: Commit formatted bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/vendor/jade-widget.js
          if ! git diff --cached --quiet; then
            git commit -m "style: format verified JadeAssist vendor bundle"
            git push origin HEAD:feature/jadeassist-launcher-assets-final
          fi
