name: Fix Review Request Type Scale

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Snap review request labels to the documented type scale
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/assets/css/dashboard-overhaul.css')
          text = path.read_text()
          selectors = [
              '.review-request-summary-card span',
              '.review-request-status',
          ]
          for selector in selectors:
              start = text.find(selector + '{')
              if start < 0:
                  raise SystemExit(f'Missing selector: {selector}')
              end = text.find('}', start)
              rule = text[start:end]
              if rule.count('font-size:10px') != 1:
                  raise SystemExit(f'Expected one off-scale size in {selector}')
              updated = rule.replace('font-size:10px', 'font-size:11px')
              text = text[:start] + updated + text[end:]
          path.write_text(text)
          PY
          git diff --check

      - name: Validate the type-scale guard
        run: |
          npm ci --prefer-offline --no-audit
          npm test -- --runInBand --coverage=false tests/unit/type-scale.test.js

      - name: Commit correction
        run: |
          git config user.name "EventFlow CI"
          git config user.email "ci@event-flow.co.uk"
          git add public/assets/css/dashboard-overhaul.css
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Align review request UI with the type scale"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
