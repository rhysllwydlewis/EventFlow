name: Format PR 1382 enquiry spec

on:
  push:
    branches:
      - test/repair-all-backend-playwright-quarantine
    paths:
      - '.github/workflows/format-pr-1382.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: test/repair-all-backend-playwright-quarantine

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Format and commit enquiry specification
        run: |
          npx prettier --write e2e/customer-enquiry-flow.spec.js
          if git diff --quiet -- e2e/customer-enquiry-flow.spec.js; then
            echo "File already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/customer-enquiry-flow.spec.js
          git commit -m "style: format customer enquiry E2E spec"
          git push origin HEAD:test/repair-all-backend-playwright-quarantine
