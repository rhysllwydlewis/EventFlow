name: Decode latest PR 1426 DeepSource issue

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-1426-deepsource-inspect-v2.yml'

permissions:
  contents: write

concurrency:
  group: pr-1426-deepsource-inspect-v2
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event.pull_request.number == 1426
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/signup-attribution-session-replay
          fetch-depth: 1

      - name: Fetch and decode DeepSource payload
        shell: bash
        run: |
          set -euo pipefail
          URL='https://app.deepsource.com/gh/rhysllwydlewis/EventFlow/run/e56dbbae-b9a4-4fa4-b65e-4f7fb42970c1/javascript/'
          curl -sS -L \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml' \
            "$URL" -o deepsource-page.html
          echo "page bytes: $(wc -c < deepsource-page.html)"

          python - <<'PY'
          import html
          import json
          import re
          from pathlib import Path

          page = Path('deepsource-page.html').read_text(errors='replace')
          decoded = html.unescape(page).replace('\\u002F', '/').replace('\\u003A', ':')

          for token in (
              'JS-',
              'Unexpected function',
              'analytics-consent-upgrade.js',
              'Documentation Coverage',
              'External Dependencies',
              'thresholdStatus',
          ):
              positions = [m.start() for m in re.finditer(re.escape(token), decoded)]
              print(f'\nTOKEN {token!r}: {len(positions)} match(es)')
              for position in positions[:12]:
                  print(decoded[max(0, position - 350):position + 750])
                  print('---')

          script_match = re.search(
              r'<script(?=[^>]*id="__NUXT_DATA__")[^>]*>(.*?)</script>',
              page,
              flags=re.DOTALL,
          )
          if not script_match:
              print('Nuxt payload not found')
              raise SystemExit(0)

          payload = json.loads(html.unescape(script_match.group(1)))
          print('\nPAYLOAD LENGTH', len(payload))

          interesting_strings = {}
          tokens = (
              'JS-',
              'Unexpected function',
              'analytics-consent-upgrade.js',
              'Documentation Coverage',
              'External Dependencies',
          )
          for index, value in enumerate(payload):
              if isinstance(value, str) and any(token in value for token in tokens):
                  interesting_strings[index] = value
                  print(f'STRING[{index}]={value!r}')

          target_indexes = set(interesting_strings)

          def direct_refs(value):
              refs = set()
              if isinstance(value, int):
                  refs.add(value)
              elif isinstance(value, list):
                  for item in value:
                      refs.update(direct_refs(item))
              elif isinstance(value, dict):
                  for item in value.values():
                      refs.update(direct_refs(item))
              return refs

          def resolve_ref(index, depth=0, seen=None):
              if seen is None:
                  seen = set()
              if depth > 6 or index in seen or not (0 <= index < len(payload)):
                  return f'<ref:{index}>'
              next_seen = seen | {index}
              return resolve(payload[index], depth + 1, next_seen)

          def resolve(value, depth=0, seen=None):
              if seen is None:
                  seen = set()
              if depth > 6:
                  return '<max-depth>'
              if isinstance(value, int):
                  return resolve_ref(value, depth, seen)
              if isinstance(value, list):
                  return [resolve(item, depth + 1, seen) for item in value]
              if isinstance(value, dict):
                  return {key: resolve(item, depth + 1, seen) for key, item in value.items()}
              return value

          print('\nDIRECT PARENT OBJECTS')
          for index, value in enumerate(payload):
              if isinstance(value, (dict, list)) and direct_refs(value) & target_indexes:
                  print(f'PARENT[{index}] RAW={value!r}')
                  print(json.dumps(resolve(value), indent=2, default=str)[:16000])
                  print('---')
          PY

      - name: Remove inspection workflow
        if: always()
        run: |
          rm .github/workflows/pr-1426-deepsource-inspect-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr-1426-deepsource-inspect-v2.yml
          git commit -m 'ci: remove latest DeepSource inspection workflow'
          git push origin HEAD:feat/signup-attribution-session-replay
