name: Prettier Helper

on:
  push:
    branches:
      - phase2/supplier-bot-ingestion

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Format Supplier Bot service
        run: npx prettier --write services/supplierBotIngestion.service.js
      - name: Upload formatted service
        uses: actions/upload-artifact@v7
        with:
          name: supplier-bot-prettier
          path: services/supplierBotIngestion.service.js
          retention-days: 1
