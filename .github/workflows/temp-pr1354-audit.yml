name: Temporary PR1354 Audit

on:
  push:
    branches: [agent/pr1354-final-audit]
  pull_request:

permissions:
  contents: read

env:
  HUSKY: '0'
  NODE_ENV: test
  JWT_SECRET: temporary-pr1354-audit-secret-minimum-32-characters

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm run check:lockfile
      - run: npm ci --prefer-offline --no-audit
      - name: Validate backend classification
        run: node scripts/run-backend-e2e.mjs --validate-only
      - name: Check new script syntax
        run: |
          node --check scripts/run-backend-e2e.mjs
          node --check scripts/summarize-lighthouse-results.mjs
          node --check scripts/production-synthetic-check.mjs
      - name: Run focused regression contracts
        run: >-
          npx jest --runInBand --coverage=false
          tests/unit/autonomy-workflow-gates.test.js
          tests/unit/backend-suite-classification.test.js
          tests/unit/property-fuzz.test.js
          tests/unit/external-service-failure-contracts.test.js
          tests/unit/migration-idempotency.test.js
      - name: Generate exact Prettier patch
        run: |
          npx prettier --write \
            docs/github-autonomy-hardening.md \
            docs/test-debt/backend-playwright-quarantine.md \
            playwright.config.js \
            scripts/summarize-lighthouse-results.mjs \
            scripts/production-synthetic-check.mjs \
            scripts/run-backend-e2e.mjs \
            stryker.config.mjs \
            tests/unit/autonomy-workflow-gates.test.js \
            tests/unit/backend-suite-classification.test.js \
            e2e/admin-consolidation.spec.js \
            e2e/auth-navbar-logout.spec.js \
            e2e/security-headers.spec.js \
            e2e/websocket-v2.spec.js \
            e2e/backend-suite-classification.json \
            package.json
          git diff --binary > pr1354-format.patch
      - name: Upload exact formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: pr1354-format-patch
          path: pr1354-format.patch
          if-no-files-found: error
          retention-days: 1
      - name: Enforce formatting parity
        run: git diff --exit-code
      - name: Run ESLint
        run: npm run lint

  backend:
    name: Real Mongo-backed blocking suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      E2E_MODE: full
      MONGODB_URI: mongodb://127.0.0.1:27017/eventflow_pr1354_audit?replicaSet=rs0
      PLAYWRIGHT_VIDEO: 'off'
      PLAYWRIGHT_TRACE: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@90004df786821b6308fb02299e5835d0dae05d0d
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0
      - run: npm run check:lockfile
      - run: npm ci --prefer-offline --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Run blocking backend journeys
        timeout-minutes: 35
        run: npm run test:e2e:backend -- --project=chromium
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/pr1354-backend-results.json
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/pr1354-backend-junit.xml
      - name: Summarise backend results
        if: always()
        run: >-
          node scripts/summarize-playwright-results.mjs
          test-results/pr1354-backend-results.json
          test-results/pr1354-backend-summary.txt
      - name: Upload bounded backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1354-backend-evidence
          path: |
            test-results/pr1354-backend-results.json
            test-results/pr1354-backend-junit.xml
            test-results/pr1354-backend-summary.txt
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 2
