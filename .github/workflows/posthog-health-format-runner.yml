name: Finalise PostHog health recovery

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.head_ref == 'agent/posthog-health-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply final formatting pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/assets/js/behaviour-analytics.js')
          source = path.read_text(encoding='utf-8')
          old = """  function sanitizePostHogProviderEvent(event) {
          if (!event || typeof event !== 'object') {
            return event;
          }

          const properties = event.properties;
          if (!properties || typeof properties !== 'object' || Array.isArray(properties)) {
            return event;
          }

          // This integration is deliberately personless, so the provider flag must remain boolean false.
          properties.$process_person_profile = false;

          Object.keys(properties).forEach(function (key) {
            if (!key.startsWith('$web_vitals_') || !key.endsWith('_event')) {
              return;
            }
            const metric = properties[key];
            if (!metric || typeof metric !== 'object' || Array.isArray(metric)) {
              return;
            }
            if (typeof metric.$current_url === 'string') {
              metric.$current_url = metric.$current_url.split(/[?#]/, 1)[0];
            }
          });

          return event;
        }
          """
          new = """  function sanitizePostHogProviderEvent(event) {
            if (!event || typeof event !== 'object') {
              return event;
            }

            const properties = event.properties;
            if (!properties || typeof properties !== 'object' || Array.isArray(properties)) {
              return event;
            }

            // This integration is deliberately personless, so the provider flag must remain boolean false.
            properties.$process_person_profile = false;

            Object.keys(properties).forEach(function (key) {
              if (!key.startsWith('$web_vitals_') || !key.endsWith('_event')) {
                return;
              }
              const metric = properties[key];
              if (!metric || typeof metric !== 'object' || Array.isArray(metric)) {
                return;
              }
              if (typeof metric.$current_url === 'string') {
                metric.$current_url = metric.$current_url.split(/[?#]/, 1)[0];
              }
            });

            return event;
          }
          """
          if source.count(old) != 1:
              raise SystemExit('Expected one unformatted PostHog sanitizer block')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate final changes
        shell: bash
        run: |
          node --check public/assets/js/behaviour-analytics.js
          node --check tests/unit/posthog-web-vitals-health.test.js
          git diff --check

      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/posthog-health-format-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/behaviour-analytics.js \
            .github/workflows/posthog-health-format-runner.yml
          git commit -m "style: tidy PostHog event sanitiser"
          git push origin HEAD:agent/posthog-health-recovery
