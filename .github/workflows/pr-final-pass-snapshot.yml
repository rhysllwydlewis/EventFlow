name: PR Final Pass Snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: pr1344-final-pass-files
          path: |
            routes/review-requests.js
            routes/postmark-webhook.js
            tests/integration/supplier-review-request-delivery.test.js
            tests/unit/postmark-webhook-route.test.js
            tests/unit/supplier-dashboard-fixes.test.js
            public/assets/js/utils/global-error-handler.js
            public/assets/css/styles.css
            public/assets/css/supplier-dashboard-improvements.css
            public/settings.html
          if-no-files-found: error
          retention-days: 1
