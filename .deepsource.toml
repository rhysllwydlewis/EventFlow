version = 1

# Coverage notes for anything DeepSource cannot analyse itself:
#   CSS  — DeepSource ships no CSS analyzer, so stylesheets are gated by
#          tests/unit/stylesheet-lint.test.js (stylelint, bug-class rules)
#          inside the blocking Jest suite.
#   Test coverage — already enforced by .github/workflows/coverage-gate.yml
#          ("Changed executable lines (80%)"), so DeepSource's coverage
#          feature would duplicate it and needs a DEEPSOURCE_DSN secret.
#   Secrets — covered by GitGuardian, which already runs on every PR.

exclude_patterns = [
  "tests/**",
  "node_modules/**",
  "coverage/**",
  "test-audit/**",
  "playwright-report/**",
  "test-results/**",
  "public/assets/vendor/**",
  # Compiled TypeScript output. The .ts sources under src/ are analysed
  # instead, so leaving these in reports every finding twice.
  "public/assets/js/pages/home-v2.js",
  "public/assets/js/pages/home-v3.js",
  "public/assets/js/pages/home-v3-video.js",
  "public/assets/js/pages/guide-premium.js"
]

test_patterns = [
  "tests/**",
  "e2e/**",
  "**/*.test.js",
  "**/*.spec.js"
]

# Covers .js, .mjs, .cjs and .ts — `dialect = "typescript"` is what pulls the
# TypeScript sources under src/ into analysis.
[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["nodejs", "browser", "jest", "mongo"]
  # This repo genuinely mixes both module systems: ~1,000 files use require(),
  # and ~59 first-party files are ES modules (every scripts/*.mjs, the
  # Playwright configs, and the browser modules under public/assets/js).
  # DeepSource takes one global value with no "auto" and no per-path override,
  # so the choice is which parser reads more of the repo — and the two are not
  # symmetric. `module_system` sets the parser's sourceType:
  #   es-modules (sourceType: module) parses BOTH — `require()` and
  #     `module.exports` are an ordinary call and member expression, valid in a
  #     module, so CommonJS files still parse and analyse.
  #   commonjs (sourceType: script) cannot parse `import`/`export` at all.
  # #1611 set this to "commonjs" reasoning from the repo's majority style. That
  # was the wrong axis: it made all 59 ES module files unparseable, so they got
  # no analysis at all and reported JS-0833 instead. Back to the default.
  module_system = "es-modules"
  dialect = "typescript"
  cyclomatic_complexity_threshold = "high"

[[analyzers]]
name = "python"
enabled = true

[[analyzers]]
name = "docker"
enabled = true

  [analyzers.meta]
  dockerfile_paths = ["Dockerfile"]

[[analyzers]]
name = "shell"
enabled = true

  [analyzers.meta]
  dialect = "bash"
