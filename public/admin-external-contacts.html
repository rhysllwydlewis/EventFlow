<!DOCTYPE html>
<html lang='en-GB'>
<head>

  <meta charset='utf-8'>

  <link rel="stylesheet" href="/assets/css/admin.css?v=18.3.0">
  <link rel="stylesheet" href="/assets/css/admin-enhanced.css?v=18.3.1">
  <link rel="stylesheet" href="/assets/css/admin-navbar.css?v=18.3.0">
  <link rel="stylesheet" href="/assets/css/admin-cards.css?v=18.3.0">
  <link rel="stylesheet" href="/assets/css/mobile-optimizations.css?v=18.4.4">
  <link rel="stylesheet" href="/assets/css/ui-ux-fixes.css?v=18.4.0">
  <link rel="stylesheet" href="/assets/css/admin-ui-improvements.css?v=18.3.2">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144x144.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">

    <link rel="manifest" href="/site.webmanifest">
    <meta name="msapplication-config" content="/browserconfig.xml">
  <script src="/assets/js/components.js?v=18.3.0" defer></script>
  <script src="/assets/js/admin-navbar.js?v=18.3.0" defer></script>
  <style>
    .ec-contact-row { cursor: pointer; }
    .ec-contact-row:hover { background: #f8fafc; }
    .ec-contact-row:focus-visible { outline: 2px solid #0B8073; outline-offset: -2px; }
  </style>
</head>
<body class="has-admin-navbar admin">
<div id="adminNavbarMount"></div>

<main id="main-content" class="section">
  <div class="container">

    <!-- ── Page header ───────────────────────────────────────────────── -->
    <div class="ec-page-header">
      <div>
        <h1 class="page-title" style="display:flex;align-items:center;gap:10px;">
          <span style="width:34px;height:34px;background:linear-gradient(135deg,#0B8073,#13B6A2);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="10" x2="15" y2="10"/></svg>
          </span>
          External Contacts
        </h1>
        <p class="page-subtitle">Enquiries from VEXI, Chlo and other integrated sites.</p>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="ecRefreshBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.43"/></svg>
        Refresh
      </button>
    </div>

    <!-- ── Summary cards ────────────────────────────────────────────── -->
    <div class="ec-summary-grid" id="ecSummaryGrid" aria-live="polite" aria-label="Contact overview">
      <div class="uc-summary-card uc-summary-card--red skeleton" style="height:88px;border-radius:12px;"></div>
      <div class="uc-summary-card uc-summary-card--blue skeleton" style="height:88px;border-radius:12px;"></div>
      <div class="uc-summary-card uc-summary-card--purple skeleton" style="height:88px;border-radius:12px;"></div>
      <div class="uc-summary-card uc-summary-card--grey skeleton" style="height:88px;border-radius:12px;"></div>
    </div>

    <!-- ── Filters ───────────────────────────────────────────────────── -->
    <div class="card uc-filters-card">
      <div class="uc-filters-row">
        <div class="uc-search-wrap">
          <svg class="uc-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" id="ecSearch" placeholder="Search name, email, message…" class="uc-search-input" aria-label="Search external contacts">
        </div>
        <select id="ecSourceFilter" class="uc-filter-select" aria-label="Filter by source">
          <option value="">All sources</option>
          <option value="vexi">VEXI</option>
          <option value="chlo">Chlo</option>
        </select>
        <select id="ecStatusFilter" class="uc-filter-select" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="new">New</option>
          <option value="in_review">In review</option>
          <option value="replied">Replied</option>
          <option value="archived">Archived</option>
        </select>
        <button type="button" id="ecClearFilters" class="btn btn-ghost btn-sm">Clear</button>
      </div>
      <div class="uc-filter-status" id="ecFilterStatus" aria-live="polite" role="status"></div>
    </div>

    <!-- ── Contacts table ────────────────────────────────────────────── -->
    <div class="card uc-table-card">
      <div class="uc-table-header">
        <span class="uc-table-title" id="ecTableTitle">All enquiries</span>
      </div>
      <div class="table-wrapper">
        <table class="table uc-table" aria-label="External contacts list">
          <thead>
            <tr>
              <th>Source</th>
              <th>Name / Email</th>
              <th>Subject</th>
              <th>Status</th>
              <th>Received</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ecTableBody">
            <tr><td colspan="6" class="uc-loading-cell">
              <div class="skeleton" style="height:42px;border-radius:6px;margin:6px 0;"></div>
              <div class="skeleton" style="height:42px;border-radius:6px;margin:6px 0;"></div>
              <div class="skeleton" style="height:42px;border-radius:6px;"></div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<!-- ── Contact detail modal ────────────────────────────────────────── -->
<div id="ecDetailModal" class="admin-modal" hidden aria-modal="true" role="dialog" aria-labelledby="ecDetailTitle">
  <div class="admin-modal__backdrop" id="ecModalBackdrop"></div>
  <div class="admin-modal__box admin-modal__box--wide">
    <div class="admin-modal__header">
      <h2 id="ecDetailTitle">Enquiry Detail</h2>
      <button type="button" class="admin-modal__close" id="ecCloseModal" aria-label="Close">×</button>
    </div>
    <div class="admin-modal__body" id="ecDetailBody">
      <div class="skeleton" style="height:200px;border-radius:8px;"></div>
    </div>
  </div>
</div>

<footer class="footer" role="contentinfo">
  <div class="container flex-between">
    <div><strong>EventFlow</strong><br><span class="small">Admin Panel</span></div>
    <div class="small">
      <a href="/admin">Dashboard</a> ·
      <a href="/admin-tickets">Tickets</a> ·
      <a href="/admin-external-contacts">External Contacts</a> ·
      <a href="/legal">Legal Hub</a> ·
      <button type="button" data-cookie-prefs>Cookie preferences</button>
    </div>
    <div class="small" style="width:100%;margin-top:8px;text-align:center;">Operated by <a href="https://vexi.co.uk" target="_blank" rel="noopener noreferrer">VEXI</a></div>
  </div>
</footer>

<script src="/assets/js/admin-shared.js?v=18.3.0"></script>
<script src="/assets/js/pages/admin-external-contacts-init.js?v=1.0.0" defer></script>
<script src="/assets/js/cookie-consent.js?v=3.0.0" defer></script>
</body>
</html>
