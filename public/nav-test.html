<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nav Test</title>
<link rel="stylesheet" href="http://localhost:9876/assets/css/design-tokens.css">
<link rel="stylesheet" href="http://localhost:9876/assets/css/styles.css">
<link rel="stylesheet" href="http://localhost:9876/assets/css/supplier-dashboard-improvements.css">
<link rel="stylesheet" href="http://localhost:9876/assets/css/liquid-glass.css">
<link rel="stylesheet" href="http://localhost:9876/assets/css/liquid-glass-mobile.css">
</head>
<body class="supplier-dashboard-page" style="background:#f3f4f6; margin:0; padding:0;">

<!-- Simulated header height bar -->
<div style="height:64px; background:#0b8073; display:flex; align-items:center; padding:0 20px;">
  <span style="color:white; font-weight:600; font-size:1.1rem;">EventFlow</span>
</div>

<!-- Mobile Section Navigation (copied from dashboard-supplier.html) -->
<nav class="dashboard-mobile-nav" aria-label="Dashboard sections" data-test="supplier-mobile-nav">
  <div class="mobile-nav-pills" data-test="mobile-nav-pills">
    <button type="button" class="mobile-nav-pill active" data-section="welcome-section" data-test="nav-overview" title="Overview">
      <span class="pill-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </span>
      <span class="pill-text">Overview</span>
    </button>
    <button type="button" class="mobile-nav-pill" data-section="my-suppliers" data-test="nav-profiles" title="Profile">
      <span class="pill-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/>
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/>
          <path d="M2 7h20"/>
        </svg>
      </span>
      <span class="pill-text">Profile</span>
    </button>
    <button type="button" class="mobile-nav-pill" data-section="my-packages" data-test="nav-packages" title="Packages">
      <span class="pill-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7.5 4.27 9 5.15"/>
          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
          <path d="M12 22V12"/>
        </svg>
      </span>
      <span class="pill-text">Packages</span>
    </button>
    <button type="button" class="mobile-nav-pill" data-section="threads-sup" data-test="nav-messages" title="Messages">
      <span class="pill-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </span>
      <span class="pill-text">Messages</span>
      <span class="pill-badge" id="mobile-msg-badge" style="display: none"></span>
    </button>
    <button type="button" class="mobile-nav-pill" data-section="supplier-stats-grid" data-test="nav-stats" title="Stats">
      <span class="pill-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
        </svg>
      </span>
      <span class="pill-text">Stats</span>
    </button>
    <button type="button" class="mobile-nav-pill" data-section="tickets-sup" data-test="nav-tickets" title="Tickets">
      <span class="pill-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>
        </svg>
      </span>
      <span class="pill-text">Tickets</span>
    </button>
    <button type="button" class="mobile-nav-pill" data-test="nav-settings" title="Settings" data-href="/settings">
      <span class="pill-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </span>
      <span class="pill-text">Settings</span>
    </button>
  </div>
</nav>

<main id="main-content" style="padding: 20px;">
  <div style="max-width:1200px; margin:0 auto;">
    <div style="background:#e8f5e9; padding:20px; border-radius:8px; margin-bottom:20px;">
      <h2>Welcome Section - Hero</h2>
      <p>This is the welcome/hero section.</p>
    </div>
    <div id="supplier-stats-grid" style="background:#e3f2fd; padding:20px; border-radius:8px; margin-bottom:20px;">
      <h2>Stats Grid</h2>
      <p>Statistics widgets here.</p>
    </div>
    <div id="my-suppliers" style="background:#fff3e0; padding:20px; border-radius:8px; margin-bottom:20px;">
      <h2>Profile Section</h2>
      <p>Supplier profiles here.</p>
    </div>
    <div id="my-packages" style="background:#fce4ec; padding:20px; border-radius:8px; margin-bottom:20px;">
      <h2>Packages Section</h2>
      <p>Packages here.</p>
    </div>
    <div id="threads-sup" style="background:#f3e5f5; padding:20px; border-radius:8px; margin-bottom:20px;">
      <h2>Messages Section</h2>
      <p>Messages here.</p>
    </div>
    <div id="tickets-sup" style="background:#e8eaf6; padding:20px; border-radius:8px; margin-bottom:20px; height:600px;">
      <h2>Tickets Section</h2>
      <p>Tickets here.</p>
    </div>
  </div>
</main>

<script src="http://localhost:9876/assets/js/supplier-dashboard-enhancements.js"></script>
</body>
</html>
