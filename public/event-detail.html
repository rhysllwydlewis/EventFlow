    .event-detail-hero{background:linear-gradient(135deg,#0b8073,#0f9f91 58%,#14b8a6);color:#fff;padding:3.5rem 1rem 4rem;position:relative;overflow:hidden}.event-detail-hero:before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.18),transparent 22rem),linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:auto,28px 28px,28px 28px}.event-detail-hero .container{position:relative}.event-detail{max-width:980px;margin:-2.5rem auto 3rem;padding:0 1rem}.event-panel{background:rgba(255,255,255,.92);border:1px solid rgba(11,128,115,.14);border-radius:1.25rem;box-shadow:0 18px 55px rgba(15,23,42,.12);overflow:hidden;backdrop-filter:blur(18px)}.event-image{width:100%;height:320px;object-fit:cover;background:linear-gradient(135deg,#ccfbf1,#f0fdfa);display:flex;align-items:center;justify-content:center;font-size:4rem}.event-body{padding:1.5rem}.event-badges{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}.event-badge{border-radius:999px;background:#eef2ff;color:#3730a3;padding:.25rem .65rem;font-weight:800;font-size:.8rem}.event-cancelled{background:#fee2e2;color:#991b1b;border-radius:.75rem;padding:.85rem 1rem;margin-bottom:1rem;font-weight:800}.event-grid{display:grid;grid-template-columns:2fr 1fr;gap:1.25rem}.event-actions{display:flex;gap:.65rem;flex-wrap:wrap;margin-top:1rem}.event-side{background:#f8fafc;border-radius:1rem;padding:1rem}.event-side p{margin:.35rem 0;color:#4b5563}.event-report-modal{position:fixed;inset:0;background:rgba(15,23,42,.62);z-index:9000;display:flex;align-items:center;justify-content:center;padding:1rem}.event-report-card{width:min(520px,100%);background:#fff;border-radius:1.25rem;padding:1.25rem;box-shadow:0 24px 70px rgba(15,23,42,.25)}.event-report-card h2{margin:0 0 .35rem}.event-report-field{display:flex;flex-direction:column;gap:.35rem;margin-top:.9rem}.event-report-field label{font-weight:800;color:#334155}.event-report-field select,.event-report-field textarea{border:1px solid #cbd5e1;border-radius:.75rem;padding:.7rem .8rem;font:inherit}.event-report-actions{display:flex;gap:.65rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}@media(max-width:760px){.event-grid{grid-template-columns:1fr}.event-image{height:220px}.event-actions .ef-btn{width:100%;justify-content:center}}
  </style>
