<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event details | EventFlow</title>
    <meta name="description" content="View public event details on EventFlow." />
    <link rel="canonical" href="https://event-flow.co.uk/events/" />
    <link rel="stylesheet" href="/assets/css/tokens.css?v=18.3.0" />
    <link rel="stylesheet" href="/assets/css/styles.css?v=18.3.0" />
    <link rel="stylesheet" href="/assets/css/eventflow-17.0.0.css?v=18.3.0" />
    <link rel="stylesheet" href="/assets/css/navbar.css?v=18.3.0" />
    <style>
      body {
        background: linear-gradient(180deg, #f0fdfa 0, #fff 34rem);
        color: #111827;
      }
      .event-detail-hero {
        background:
          radial-gradient(circle at 12% 0, rgba(255, 255, 255, 0.24), transparent 28%),
          linear-gradient(135deg, #075e57, #0b8073 56%, #14b8a6);
        color: #fff;
        padding: 4rem 1rem 5rem;
        position: relative;
        overflow: hidden;
      }
      .event-detail-hero:after {
        content: '';
        position: absolute;
        inset: auto -10% -45% -10%;
        height: 70%;
        background: rgba(255, 255, 255, 0.13);
        filter: blur(50px);
        border-radius: 50%;
        pointer-events: none;
      }
      .event-detail-hero .container {
        position: relative;
        z-index: 1;
        max-width: 980px;
      }
      .event-detail-hero p {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0 0 0.75rem;
        padding: 0.3rem 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.78rem;
      }
      .event-detail-hero h1 {
        font-size: clamp(2rem, 5vw, 3.8rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        text-wrap: balance;
      }
      .event-detail {
        max-width: 1020px;
        margin: -3.2rem auto 3rem;
        padding: 0 1rem;
        position: relative;
        z-index: 2;
      }
      .event-panel {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(13, 148, 136, 0.18);
        border-radius: 1.5rem;
        box-shadow: 0 22px 70px rgba(15, 23, 42, 0.16);
        overflow: hidden;
        backdrop-filter: blur(18px);
      }
      .event-image {
        width: 100%;
        height: 340px;
        object-fit: cover;
        background: linear-gradient(135deg, #ccfbf1, #ecfeff);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4.25rem;
      }
      .event-body {
        padding: clamp(1.25rem, 3vw, 2rem);
      }
      .event-body h2 {
        margin: 0.2rem 0 1rem;
        font-size: clamp(1.55rem, 3vw, 2.4rem);
        letter-spacing: -0.03em;
      }
      .event-body p {
        color: #475569;
        line-height: 1.65;
      }
      .event-badges {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .event-badge {
        border-radius: 999px;
        background: #eef2ff;
        color: #3730a3;
        padding: 0.3rem 0.7rem;
        font-weight: 800;
        font-size: 0.8rem;
      }
      .event-cancelled {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
        border-radius: 0.9rem;
        padding: 0.9rem 1rem;
        margin-bottom: 1rem;
        font-weight: 800;
      }
      .event-grid {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(250px, 0.85fr);
        gap: 1.5rem;
      }
      .event-actions {
        display: flex;
        gap: 0.65rem;
        flex-wrap: wrap;
        margin-top: 1.25rem;
      }
      .event-side {
        background: linear-gradient(180deg, #f8fafc, #fff);
        border: 1px solid #e2e8f0;
        border-radius: 1.1rem;
        padding: 1.1rem;
        height: max-content;
      }
      .event-side p {
        margin: 0.35rem 0;
        color: #4b5563;
      }
      .event-report-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.54);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 10000;
        backdrop-filter: blur(8px);
      }
      .event-report-modal {
        width: min(560px, 100%);
        background: #fff;
        border-radius: 1.25rem;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
        padding: 1.25rem;
        border: 1px solid rgba(13, 148, 136, 0.18);
      }
      .event-report-modal__header {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: flex-start;
        margin-bottom: 1rem;
      }
      .event-report-modal__eyebrow {
        margin: 0 0 0.25rem;
        color: #0b8073;
        font-weight: 900;
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .event-report-modal h2 {
        margin: 0;
        color: #111827;
      }
      .event-report-modal__close {
        border: 0;
        background: #f1f5f9;
        border-radius: 999px;
        width: 2.25rem;
        height: 2.25rem;
        font-size: 1.35rem;
        cursor: pointer;
      }
      .event-report-modal__label {
        display: block;
        margin: 0.8rem 0 0.35rem;
        font-weight: 800;
        color: #334155;
      }
      .event-report-modal__control {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 0.75rem;
        padding: 0.75rem 0.85rem;
        font: inherit;
      }
      .event-report-modal__control:focus {
        outline: 3px solid rgba(20, 184, 166, 0.22);
        border-color: #0d9488;
      }
      .event-report-modal__error {
        display: none;
        margin-top: 0.85rem;
        color: #b91c1c;
        font-weight: 800;
      }
      .event-report-modal__actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.65rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      @media (max-width: 760px) {
        .event-grid {
          grid-template-columns: 1fr;
        }
        .event-image {
          height: 220px;
        }
        .event-detail {
          margin-top: -2.25rem;
        }
        .event-detail-hero {
          padding-bottom: 3.5rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="ef-header">
      <div class="ef-container">
        <div class="ef-header-content">
          <a href="/" class="ef-brand"
            ><div class="ef-logo"><div class="ef-logo-inner"></div></div>
            <span class="ef-brand-text">EventFlow</span></a
          >
          <nav class="ef-nav-desktop">
            <a href="/public-calendar" class="ef-nav-link ef-nav-link--active">Events</a
            ><a href="/suppliers" class="ef-nav-link">Suppliers</a>
          </nav>
          <a href="/auth" class="ef-btn ef-btn-primary">Log in</a>
        </div>
      </div>
    </header>
    <section class="event-detail-hero">
      <div class="container">
        <p style="margin: 0 0 0.5rem; opacity: 0.85">Public event</p>
        <h1 id="event-title" style="margin: 0">Loading event…</h1>
      </div>
    </section>
    <main class="event-detail">
      <article class="event-panel" id="event-panel"><div class="event-body">Loading…</div></article>
    </main>
    <script src="/assets/js/pages/event-detail-init.js?v=18.3.0" defer></script>
  </body>
</html>
